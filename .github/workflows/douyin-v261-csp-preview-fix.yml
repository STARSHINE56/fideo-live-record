name: Douyin V2.6.1 CSP Preview Fix

on:
  workflow_dispatch:
    inputs:
      version:
        description: "测试版本号，例如 1.1.6"
        required: true
        default: "1.1.6"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Fix CSP And HLS Worker
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout V2.6 tested source
        uses: actions/checkout@v4
        with:
          ref: douyin-v2.6-test
          fetch-depth: 0

      - name: Create V2.6.1 test branch
        run: |
          git switch -C douyin-v2.6.1-test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      - name: Create V2.6.1 patch
        run: |
          cat > "$RUNNER_TEMP/patch-v261.cjs" <<'NODE'
          const fs = require('fs')

          function read(path) {
            return fs.readFileSync(
              path,
              'utf8'
            )
          }

          function write(
            path,
            content
          ) {
            fs.writeFileSync(
              path,
              content,
              'utf8'
            )
          }

          function mustReplace(
            source,
            pattern,
            replacement,
            label
          ) {
            if (
              !pattern.test(
                source
              )
            ) {
              throw new Error(
                `Patch target not found: ${label}`
              )
            }

            return source.replace(
              pattern,
              replacement
            )
          }

          // ==========================================
          // 1. Fix renderer CSP
          // ==========================================

          const htmlPath =
            'src/renderer/index.html'

          let html =
            read(htmlPath)

          const oldCspPattern =
            /content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:\/\/api\.xunhupay\.com; connect-src 'self' https:\/\/xizhi\.qqoq\.net \*;"/

          const newCsp =
            `content="default-src 'self'; ` +
            `script-src 'self'; ` +
            `style-src 'self' 'unsafe-inline'; ` +
            `img-src 'self' data: https://api.xunhupay.com; ` +
            `connect-src 'self' http://127.0.0.1:* http://localhost:* https://xizhi.qqoq.net https:; ` +
            `media-src 'self' blob: data: http://127.0.0.1:* http://localhost:*; ` +
            `worker-src 'self' blob:;"`

          if (
            !html.includes(
              'media-src'
            )
          ) {
            html =
              mustReplace(
                html,
                oldCspPattern,
                newCsp,
                'renderer CSP'
              )
          }

          write(
            htmlPath,
            html
          )

          // ==========================================
          // 2. Disable HLS Web Worker temporarily
          // ==========================================

          const previewPath =
            'src/renderer/src/components/StreamPreviewDialog.tsx'

          let preview =
            read(previewPath)

          preview =
            preview.replace(
              /enableWorker:\s*true/g,
              'enableWorker: false'
            )

          write(
            previewPath,
            preview
          )

          // ==========================================
          // 3. Add useful player diagnostics
          // ==========================================

          preview =
            read(previewPath)

          if (
            !preview.includes(
              'video.addEventListener'
            )
          ) {
            const marker =
              `setError(false)`

            if (
              !preview.includes(
                marker
              )
            ) {
              throw new Error(
                'Preview diagnostics marker missing'
              )
            }

            const diagnostics =
              `setError(false)

              const handleVideoError = () => {
                setError(true)
              }

              video.addEventListener(
                'error',
                handleVideoError
              )`

            preview =
              preview.replace(
                marker,
                diagnostics
              )

            preview =
              preview.replace(
                `const cleanup = () => {`,
                `const cleanup = () => {
                video.removeEventListener(
                  'error',
                  handleVideoError
                )`
              )
          }

          write(
            previewPath,
            preview
          )

          // ==========================================
          // Final checks
          // ==========================================

          const finalHtml =
            read(htmlPath)

          const finalPreview =
            read(previewPath)

          if (
            !finalHtml.includes(
              `media-src 'self' blob: data: http://127.0.0.1:* http://localhost:*`
            )
          ) {
            throw new Error(
              'media-src CSP fix missing'
            )
          }

          if (
            !finalHtml.includes(
              `worker-src 'self' blob:`
            )
          ) {
            throw new Error(
              'worker-src CSP fix missing'
            )
          }

          if (
            !finalHtml.includes(
              `http://127.0.0.1:*`
            )
          ) {
            throw new Error(
              'localhost CSP permission missing'
            )
          }

          if (
            !finalPreview.includes(
              'enableWorker: false'
            )
          ) {
            throw new Error(
              'HLS worker was not disabled'
            )
          }

          if (
            !finalPreview.includes(
              'handleVideoError'
            )
          ) {
            throw new Error(
              'Video error diagnostics missing'
            )
          }

          console.log(
            'V2.6.1 CSP preview patch completed.'
          )
          NODE

      - name: Validate patch syntax
        run: |
          node --check \
            "$RUNNER_TEMP/patch-v261.cjs"

      - name: Apply V2.6.1 patch
        run: |
          node \
            "$RUNNER_TEMP/patch-v261.cjs"

      - name: Update version
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          npm version \
            "$APP_VERSION" \
            --no-git-tag-version

      - name: Verify CSP preview fix
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          echo "Checking CSP..."

          grep -q \
            "media-src 'self' blob: data: http://127.0.0.1:" \
            src/renderer/index.html

          grep -q \
            "worker-src 'self' blob:" \
            src/renderer/index.html

          grep -q \
            "connect-src 'self' http://127.0.0.1:" \
            src/renderer/index.html

          echo "Checking HLS worker..."

          grep -q \
            "enableWorker: false" \
            src/renderer/src/components/StreamPreviewDialog.tsx

          echo "Checking FFmpeg preview remains..."

          grep -q \
            "libx264" \
            src/main/preview-transcoder.ts

          grep -q \
            "aac" \
            src/main/preview-transcoder.ts

          grep -q \
            "preview.m3u8" \
            src/main/preview-transcoder.ts

          grep -q \
            "127.0.0.1" \
            src/main/preview-transcoder.ts

          echo "Checking monitor-only mode remains..."

          grep -q \
            "autoRecord: boolean" \
            type.d.ts

          grep -q \
            "handleMonitorOnly" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          echo "Checking original recording remains stream-copy..."

          grep -q \
            "videoCodec('copy')" \
            src/main/ffmpeg/record.ts

          grep -q \
            "audioCodec('copy')" \
            src/main/ffmpeg/record.ts

          echo "Checking version..."

          node -e "
          const p =
            require('./package.json');

          if (
            p.version !==
            process.env.APP_VERSION
          ) {
            console.error(
              'Version mismatch:',
              p.version
            );

            process.exit(1);
          }

          console.log(
            'Version:',
            p.version
          );
          "

          echo \
            "V2.6.1 validation passed."

      - name: TypeScript check
        run: |
          npm run typecheck

      - name: Build Electron app
        run: |
          npm run build

      - name: Package Windows x64
        run: |
          npx electron-builder \
            --win \
            nsis \
            --x64 \
            --publish never

      - name: Verify Windows installer
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $package = Get-Content package.json | ConvertFrom-Json

          if ($package.version -ne $env:EXPECTED_VERSION) {
            throw "Version mismatch. Expected $env:EXPECTED_VERSION, got $($package.version)"
          }

          $installers = Get-ChildItem -Path dist -Filter "*-x64.exe"

          if (-not $installers -or $installers.Count -eq 0) {
            throw "Windows x64 installer not generated."
          }

          Write-Host "Generated installer:"
          $installers |
            Select-Object Name, Length, FullName |
            Format-Table -AutoSize

      - name: Commit V2.6.1 tested source
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            package.json \
            package-lock.json \
            src/renderer/index.html \
            src/renderer/src/components/StreamPreviewDialog.tsx

          if git diff --cached --quiet
          then
            echo \
              "No source changes to commit."
          else
            git commit \
              -m "Fix CSP for localhost HLS preview"
          fi

          git push \
            --force \
            origin \
            douyin-v2.6.1-test

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-${{ inputs.version }}-douyin-v2.6.1-windows-x64
          path: dist/*-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          {
            echo "# Fideo Douyin V2.6.1"
            echo
            echo "Version: \`$APP_VERSION\`"
            echo
            echo "Branch: \`douyin-v2.6.1-test\`"
            echo
            echo "Fixes:"
            echo
            echo "- Allow localhost preview through CSP"
            echo "- Add media-src for local HLS"
            echo "- Add worker-src blob permission"
            echo "- Disable HLS Web Worker for troubleshooting"
            echo "- Add video playback error handling"
            echo "- Keep FFmpeg H264 + AAC preview"
            echo "- Keep highest-quality recording"
            echo "- Keep auto-record switch"
            echo "- Keep monitor-only notification mode"
          } >> "$GITHUB_STEP_SUMMARY"
