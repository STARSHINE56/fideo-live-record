name: Prepare V2.10

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-v210
  cancel-in-progress: false

env:
  SOURCE_BRANCH: douyin-v2.8-anchor-monitor-test
  FEATURE_BRANCH: douyin-v2.10-webdav-douyin-fix

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create safety backup
        shell: bash
        run: |
          set -euo pipefail

          BACKUP_BRANCH="backup-v210-${GITHUB_RUN_ID}"

          git branch "$BACKUP_BRANCH"
          git push origin "$BACKUP_BRANCH"

          echo "Backup created: $BACKUP_BRANCH"

      - name: Create feature branch
        shell: bash
        run: |
          set -euo pipefail

          git checkout -B "$FEATURE_BRANCH" "$SOURCE_BRANCH"

      - name: Load V2.10 patch script from main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          mkdir -p scripts

          git show \
            origin/main:scripts/v210_patch.py \
            > scripts/v210_patch.py

          test -s scripts/v210_patch.py

          echo "Patch script loaded."

      - name: Install dependencies
        run: npm ci

      - name: Validate patch script
        shell: bash
        run: |
          set -euo pipefail

          python3 -m py_compile scripts/v210_patch.py

          echo "Python syntax check passed."

      - name: Apply V2.10 patch
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/v210_patch.py

      - name: Fix StreamConfigSheet form typing
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "src/renderer/src/components/StreamConfigSheet.tsx"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          schema_marker = """})

          const defaultStreamConfig"""

          schema_replacement = """})

          type StreamFormField =
            keyof z.infer<typeof formSchema>

          const defaultStreamConfig"""

          if (
              "type StreamFormField" not in text
          ):
              if (
                  schema_marker not in text
              ):
                  raise RuntimeError(
                      "formSchema marker not found"
                  )

              text = text.replace(
                  schema_marker,
                  schema_replacement,
                  1
              )

          text = text.replace(
              """validFields = Object.keys(streamConfigData) as (keyof IStreamConfig)[]""",
              """validFields =
              Object.keys(
                streamConfigData
              ) as StreamFormField[]"""
          )

          text = text.replace(
              """[true] | [false, keyof IStreamConfig, string]""",
              """[true] | [false, StreamFormField, string]"""
          )

          text = text.replace(
              """(Object.keys(defaultStreamConfig) as (keyof IStreamConfig)[])""",
              """(
                Object.keys(
                  defaultStreamConfig
                ) as StreamFormField[]
              )"""
          )

          if (
              "keyof IStreamConfig)[]"
              in text
          ):
              raise RuntimeError(
                  "Old form key typing still exists"
              )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "StreamConfigSheet form typing fixed."
          )
          PY

      - name: Verify V2.10 files
        shell: bash
        run: |
          set -euo pipefail

          test -f src/main/webdav.ts
          test -f src/renderer/src/components/NavBar/components/CloudStorageSettings.tsx

          grep -q "webdavEnabled" type.d.ts
          grep -q "cloudUploadStatus" type.d.ts

          grep -q "TEST_WEBDAV" src/const.ts
          grep -q "UPLOAD_WEBDAV" src/const.ts

          grep -q "testWebdav" src/preload/index.ts
          grep -q "uploadWebdav" src/preload/index.ts

          grep -q "testWebdav" src/main/index.ts
          grep -q "uploadWebdav" src/main/index.ts

          grep -q "YYYY-MM-DD_HH-mm-ss" \
            src/main/ffmpeg/record.ts

          grep -q "DOUYIN_PROFILE_CACHE_MS" \
            src/main/crawler/plugins/douyin.js

          grep -q "effectiveMonitorInterval" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          grep -q "recordedFiles" \
            src/renderer/src/components/StreamConfigList/StreamConfigList.tsx

          grep -q "正在上传云盘" \
            src/renderer/src/components/StreamConfigList/components/StreamConfigCard.tsx

          grep -q "type StreamFormField" \
            src/renderer/src/components/StreamConfigSheet.tsx

          if grep -q \
            "const isHide = document.hidden" \
            src/renderer/src/lib/utils.ts
          then
            echo "ERROR: Xizhi foreground restriction still exists."
            exit 1
          fi

          echo "V2.10 static verification passed."

      - name: TypeScript check
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Check diff
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "===== Changed files ====="
          git status --short

      - name: Remove helper script before commit
        shell: bash
        run: |
          set -euo pipefail

          rm -f scripts/v210_patch.py

          if [ -d scripts ] && [ -z "$(ls -A scripts)" ]
          then
            rmdir scripts
          fi

      - name: Commit tested changes
        shell: bash
        run: |
          set -euo pipefail

          git add \
            type.d.ts \
            src/const.ts \
            src/main/index.ts \
            src/main/webdav.ts \
            src/main/ffmpeg/record.ts \
            src/main/crawler/plugins/douyin.js \
            src/preload/index.ts \
            src/preload/index.d.ts \
            src/renderer/src/lib/utils.ts \
            src/renderer/src/store/useDefaultSettingsStore.ts \
            src/renderer/src/components/NavBar/components/DefaultSettingSheet.tsx \
            src/renderer/src/components/NavBar/components/CloudStorageSettings.tsx \
            src/renderer/src/components/StreamConfigSheet.tsx \
            src/renderer/src/components/StreamConfigList/StreamConfigList.tsx \
            src/renderer/src/components/StreamConfigList/components/StreamConfigCard.tsx \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          if git diff --cached --quiet
          then
            echo "No changes to commit."
          else
            git commit \
              -m "feat: add WebDAV upload and improve Douyin monitoring"
          fi

      - name: Push feature branch
        shell: bash
        run: |
          set -euo pipefail

          git push \
            --force \
            origin \
            "$FEATURE_BRANCH"

      - name: Promote after all checks pass
        shell: bash
        run: |
          set -euo pipefail

          git push \
            origin \
            "HEAD:${SOURCE_BRANCH}"

      - name: Summary
        shell: bash
        run: |
          {
            echo "# V2.10"
            echo ""
            echo "✅ Python patch"
            echo "✅ StreamConfigSheet typing fix"
            echo "✅ WebDAV upload"
            echo "✅ Douyin profile monitoring optimization"
            echo "✅ Xizhi notification fix"
            echo "✅ TypeScript check"
            echo "✅ Application build"
            echo "✅ git diff check"
            echo ""
            echo "release.yml 未修改"
          } >> "$GITHUB_STEP_SUMMARY"
