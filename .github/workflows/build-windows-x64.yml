name: Build Windows x64 Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout V2.10 source
        uses: actions/checkout@v4
        with:
          ref: douyin-v2.8-anchor-monitor-test

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: "npm"

      - name: Show environment
        shell: pwsh
        run: |
          node --version
          npm --version
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          git log -1 --oneline

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Package Windows x64 installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Package unpacked Windows x64
        run: npx electron-builder --win --x64 --dir --publish never

      - name: Compress unpacked app
        shell: pwsh
        run: |
          if (Test-Path "dist/win-unpacked") {
            Compress-Archive `
              -Path "dist/win-unpacked/*" `
              -DestinationPath "dist/fideo-v2.10-win-unpacked.zip" `
              -Force
          } else {
            throw "dist/win-unpacked not found"
          }

      - name: Show build outputs
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Recurse |
            Select-Object FullName, Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-v2.10-windows-x64-installer
          path: dist/*-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload unpacked app
        uses: actions/upload-artifact@v4
        with:
          name: fideo-v2.10-win-unpacked
          path: dist/fideo-v2.10-win-unpacked.zip
          if-no-files-found: error
          retention-days: 7
