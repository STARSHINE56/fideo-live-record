name: Prepare V2.10 WebDAV and Douyin Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-v210-webdav-douyin-fix
  cancel-in-progress: false

env:
  SOURCE_BRANCH: douyin-v2.8-anchor-monitor-test
  FEATURE_BRANCH: douyin-v2.10-webdav-douyin-fix

jobs:
  prepare:
    name: Prepare V2.10
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout current tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create safety backup
        shell: bash
        run: |
          set -euo pipefail

          BACKUP_BRANCH="backup-v210-before-cloud-${GITHUB_RUN_NUMBER}"

          git branch "$BACKUP_BRANCH"
          git push origin "$BACKUP_BRANCH"

          echo "Backup branch: $BACKUP_BRANCH"

      - name: Create feature branch
        shell: bash
        run: |
          set -euo pipefail

          git checkout -B \
            "$FEATURE_BRANCH" \
            "$SOURCE_BRANCH"

      - name: Install dependencies
        run: npm ci

      - name: Apply V2.10 patch
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v210_patch.py <<'PY'
          from pathlib import Path
          from textwrap import dedent


          def read_file(path: str) -> str:
              return Path(path).read_text(
                  encoding="utf-8"
              )


          def write_file(
              path: str,
              content: str
          ) -> None:
              file_path = Path(path)

              file_path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              file_path.write_text(
                  dedent(content).lstrip(),
                  encoding="utf-8"
              )


          def replace_once(
              path: str,
              old: str,
              new: str
          ) -> None:
              content = read_file(path)

              old = dedent(old)
              new = dedent(new)

              if new in content:
                  print(
                      f"Already patched: {path}"
                  )
                  return

              if old not in content:
                  raise RuntimeError(
                      f"Patch marker not found: "
                      f"{path}\n\n{old[:500]}"
                  )

              content = content.replace(
                  old,
                  new,
                  1
              )

              Path(path).write_text(
                  content,
                  encoding="utf-8"
              )

              print(
                  f"Patched: {path}"
              )


          # ============================================================
          # WebDAV main process
          # ============================================================

          write_file(
              "src/main/webdav.ts",
              r"""
              import fs from 'node:fs'
              import path from 'node:path'

              import axios from 'axios'

              export interface IWebdavConfig {
                url: string
                username: string
                password: string
                remoteRoot?: string
              }

              export interface IWebdavFile {
                path: string
                cloudName: string
              }

              export interface IWebdavUploadRequest
                extends IWebdavConfig {
                streamerName: string
                files: IWebdavFile[]
                deleteAfterUpload?: boolean
                retryTimes?: number
              }

              const normalizeBaseUrl = (
                value: string
              ) =>
                value
                  .trim()
                  .replace(/\/+$/, '')

              const getAuthorization = (
                username: string,
                password: string
              ) =>
                `Basic ${Buffer.from(
                  `${username}:${password}`,
                  'utf8'
                ).toString('base64')}`

              const splitRemotePath = (
                value?: string
              ) =>
                (value || '/')
                  .split('/')
                  .map(
                    (item) =>
                      item.trim()
                  )
                  .filter(Boolean)

              const sanitizeFolderName = (
                value: string
              ) => {
                const result = String(
                  value || ''
                )
                  .replace(
                    /[<>:"/\\|?*\u0000-\u001f]/g,
                    '_'
                  )
                  .replace(
                    /[. ]+$/g,
                    ''
                  )
                  .trim()

                return (
                  result ||
                  '主播'
                )
              }

              const buildRemoteUrl = (
                baseUrl: string,
                segments: string[]
              ) => {
                const base =
                  normalizeBaseUrl(
                    baseUrl
                  )

                if (
                  segments.length === 0
                ) {
                  return `${base}/`
                }

                return (
                  `${base}/` +
                  segments
                    .map(
                      (segment) =>
                        encodeURIComponent(
                          segment
                        )
                    )
                    .join('/')
                )
              }

              const isSuccessStatus = (
                status: number
              ) =>
                status >= 200 &&
                status < 300

              async function ensureDirectory(
                config: IWebdavConfig,
                segments: string[]
              ) {
                const current: string[] =
                  []

                for (
                  const segment of
                  segments
                ) {
                  current.push(
                    segment
                  )

                  const response =
                    await axios.request({
                      method: 'MKCOL',

                      url:
                        buildRemoteUrl(
                          config.url,
                          current
                        ),

                      headers: {
                        Authorization:
                          getAuthorization(
                            config.username,
                            config.password
                          )
                      },

                      validateStatus:
                        () => true
                    })

                  if (
                    ![
                      200,
                      201,
                      204,
                      301,
                      405
                    ].includes(
                      response.status
                    )
                  ) {
                    throw new Error(
                      `创建云端目录失败，HTTP ${response.status}`
                    )
                  }
                }
              }

              async function getRemoteSize(
                config: IWebdavConfig,
                segments: string[]
              ): Promise<number> {
                const url =
                  buildRemoteUrl(
                    config.url,
                    segments
                  )

                const authorization =
                  getAuthorization(
                    config.username,
                    config.password
                  )

                const head =
                  await axios.head(
                    url,
                    {
                      headers: {
                        Authorization:
                          authorization
                      },

                      validateStatus:
                        () => true
                    }
                  )

                if (
                  isSuccessStatus(
                    head.status
                  )
                ) {
                  const value =
                    head.headers[
                      'content-length'
                    ]

                  const size =
                    Number(value)

                  if (
                    Number.isFinite(
                      size
                    ) &&
                    size >= 0
                  ) {
                    return size
                  }
                }

                const propfind =
                  await axios.request({
                    method:
                      'PROPFIND',

                    url,

                    headers: {
                      Authorization:
                        authorization,

                      Depth:
                        '0'
                    },

                    responseType:
                      'text',

                    validateStatus:
                      () => true
                  })

                if (
                  propfind.status !==
                    207 &&
                  !isSuccessStatus(
                    propfind.status
                  )
                ) {
                  return -1
                }

                const body =
                  String(
                    propfind.data ||
                    ''
                  )

                const match =
                  body.match(
                    /<[^>]*getcontentlength[^>]*>(\d+)<\/[^>]*getcontentlength>/i
                  )

                return match
                  ? Number(
                      match[1]
                    )
                  : -1
              }

              async function putBuffer(
                config: IWebdavConfig,
                segments: string[],
                data: Buffer
              ) {
                const response =
                  await axios.put(
                    buildRemoteUrl(
                      config.url,
                      segments
                    ),

                    data,

                    {
                      headers: {
                        Authorization:
                          getAuthorization(
                            config.username,
                            config.password
                          ),

                        'Content-Type':
                          'application/octet-stream',

                        'Content-Length':
                          data.length
                      },

                      maxBodyLength:
                        Infinity,

                      maxContentLength:
                        Infinity,

                      validateStatus:
                        () => true
                    }
                  )

                if (
                  !isSuccessStatus(
                    response.status
                  )
                ) {
                  throw new Error(
                    `上传失败，HTTP ${response.status}`
                  )
                }
              }

              async function putFile(
                config: IWebdavConfig,
                localPath: string,
                segments: string[]
              ) {
                const stat =
                  await fs.promises.stat(
                    localPath
                  )

                if (
                  !stat.isFile()
                ) {
                  throw new Error(
                    `录像文件不存在：${localPath}`
                  )
                }

                const response =
                  await axios.put(
                    buildRemoteUrl(
                      config.url,
                      segments
                    ),

                    fs.createReadStream(
                      localPath
                    ),

                    {
                      headers: {
                        Authorization:
                          getAuthorization(
                            config.username,
                            config.password
                          ),

                        'Content-Type':
                          'application/octet-stream',

                        'Content-Length':
                          stat.size
                      },

                      maxBodyLength:
                        Infinity,

                      maxContentLength:
                        Infinity,

                      validateStatus:
                        () => true
                    }
                  )

                if (
                  !isSuccessStatus(
                    response.status
                  )
                ) {
                  throw new Error(
                    `上传失败，HTTP ${response.status}`
                  )
                }

                const remoteSize =
                  await getRemoteSize(
                    config,
                    segments
                  )

                if (
                  remoteSize !==
                  stat.size
                ) {
                  throw new Error(
                    `云端文件校验失败，本地 ${stat.size} 字节，云端 ${remoteSize} 字节`
                  )
                }
              }

              export async function testWebdav(
                config: IWebdavConfig
              ) {
                try {
                  if (
                    !config.url?.trim() ||
                    !config.username
                      ?.trim() ||
                    !config.password
                  ) {
                    return {
                      success: false,
                      message:
                        'WebDAV 地址、用户名和密码不能为空'
                    }
                  }

                  const rootSegments =
                    splitRemotePath(
                      config.remoteRoot
                    )

                  await ensureDirectory(
                    config,
                    rootSegments
                  )

                  const fileName =
                    `.fideo-test-${Date.now()}.txt`

                  const remoteSegments =
                    [
                      ...rootSegments,
                      fileName
                    ]

                  const data =
                    Buffer.from(
                      'Fideo WebDAV Test',
                      'utf8'
                    )

                  await putBuffer(
                    config,
                    remoteSegments,
                    data
                  )

                  const remoteSize =
                    await getRemoteSize(
                      config,
                      remoteSegments
                    )

                  if (
                    remoteSize !==
                    data.length
                  ) {
                    throw new Error(
                      `测试文件大小校验失败，云端 ${remoteSize} 字节`
                    )
                  }

                  const deleteResponse =
                    await axios.delete(
                      buildRemoteUrl(
                        config.url,
                        remoteSegments
                      ),

                      {
                        headers: {
                          Authorization:
                            getAuthorization(
                              config.username,
                              config.password
                            )
                        },

                        validateStatus:
                          () => true
                      }
                    )

                  if (
                    !isSuccessStatus(
                      deleteResponse.status
                    ) &&
                    deleteResponse.status !==
                      404
                  ) {
                    throw new Error(
                      `测试文件删除失败，HTTP ${deleteResponse.status}`
                    )
                  }

                  return {
                    success: true,
                    message:
                      '连接、创建、上传、校验和删除测试均正常'
                  }
                } catch (
                  error
                ) {
                  return {
                    success: false,

                    message:
                      error instanceof
                        Error
                        ? error.message
                        : String(
                            error
                          )
                  }
                }
              }

              export async function uploadWebdav(
                request:
                  IWebdavUploadRequest
              ) {
                const config:
                  IWebdavConfig = {
                  url:
                    request.url,

                  username:
                    request.username,

                  password:
                    request.password,

                  remoteRoot:
                    request.remoteRoot
                }

                const rootSegments =
                  splitRemotePath(
                    request.remoteRoot
                  )

                const streamerFolder =
                  sanitizeFolderName(
                    request.streamerName
                  )

                const directorySegments =
                  [
                    ...rootSegments,
                    streamerFolder
                  ]

                await ensureDirectory(
                  config,
                  directorySegments
                )

                const retryTimes =
                  Math.max(
                    1,
                    Math.min(
                      10,
                      Number(
                        request.retryTimes ||
                        3
                      )
                    )
                  )

                const results:
                  Array<{
                    path: string
                    cloudName: string
                    success: boolean
                    deleted: boolean
                    message?: string
                  }> = []

                for (
                  const file of
                  request.files
                ) {
                  let success = false
                  let lastError = ''

                  for (
                    let attempt = 1;
                    attempt <=
                    retryTimes;
                    attempt += 1
                  ) {
                    try {
                      if (
                        !file.path
                      ) {
                        throw new Error(
                          '本地录像路径为空'
                        )
                      }

                      const extension =
                        path.extname(
                          file.path
                        )

                      const cloudName =
                        path.extname(
                          file.cloudName
                        )
                          ? file.cloudName
                          : `${file.cloudName}${extension}`

                      await putFile(
                        config,
                        file.path,
                        [
                          ...directorySegments,
                          cloudName
                        ]
                      )

                      let deleted =
                        false

                      if (
                        request
                          .deleteAfterUpload
                      ) {
                        await fs.promises.unlink(
                          file.path
                        )

                        deleted = true
                      }

                      results.push({
                        path:
                          file.path,

                        cloudName,

                        success:
                          true,

                        deleted
                      })

                      success = true
                      break
                    } catch (
                      error
                    ) {
                      lastError =
                        error instanceof
                          Error
                          ? error.message
                          : String(
                              error
                            )

                      if (
                        attempt <
                        retryTimes
                      ) {
                        await new Promise(
                          (
                            resolve
                          ) =>
                            setTimeout(
                              resolve,
                              attempt *
                                2000
                            )
                        )
                      }
                    }
                  }

                  if (
                    !success
                  ) {
                    results.push({
                      path:
                        file.path,

                      cloudName:
                        file.cloudName,

                      success:
                        false,

                      deleted:
                        false,

                      message:
                        lastError
                    })
                  }
                }

                return {
                  success:
                    results.length >
                      0 &&
                    results.every(
                      (item) =>
                        item.success
                    ),

                  results
                }
              }
              """
          )


          # ============================================================
          # Constants
          # ============================================================

          const_path = "src/const.ts"
          const_text = read_file(
              const_path
          )

          if (
              "TEST_WEBDAV" not in
              const_text
          ):
              const_text += dedent(
                  """

                  export const TEST_WEBDAV = 'TEST_WEBDAV'
                  export const UPLOAD_WEBDAV = 'UPLOAD_WEBDAV'
                  """
              )

              Path(
                  const_path
              ).write_text(
                  const_text,
                  encoding="utf-8"
              )


          # ============================================================
          # Global types
          # ============================================================

          replace_once(
              "type.d.ts",
              """
              interface IStreamConfig {
                id: string
                title: string
                roomUrl: string
                filename: string
                directory: string
                proxy?: string
                cookie?: string
                interval: number
                liveUrls?: string[]
                segmentTime?: string | ''
                line: string // '0' '1' eg
                status: number
                convertToMP4: boolean
                detectResolution: boolean
                autoRecord: boolean
              }
              """,
              """
              interface IRecordedFile {
                path: string
                cloudName: string
              }

              type CloudUploadStatus =
                | 'uploading'
                | 'success'
                | 'error'

              interface IStreamConfig {
                id: string
                title: string
                roomUrl: string
                filename: string
                directory: string
                proxy?: string
                cookie?: string
                interval: number
                liveUrls?: string[]
                segmentTime?: string | ''
                line: string // '0' '1' eg
                status: number
                convertToMP4: boolean
                detectResolution: boolean
                autoRecord: boolean
                cloudUploadStatus?: CloudUploadStatus
              }
              """
          )

          replace_once(
              "type.d.ts",
              """
              interface IDefaultDefaultSettingsConfig {
                directory: string
                lang: Lang
                xizhiKey?: string
              }
              """,
              """
              interface IDefaultDefaultSettingsConfig {
                directory: string
                lang: Lang
                xizhiKey?: string

                webdavEnabled?: boolean
                webdavUrl?: string
                webdavUsername?: string
                webdavPassword?: string
                webdavRemoteRoot?: string
                webdavDeleteAfterUpload?: boolean
                webdavRetryTimes?: number
              }
              """
          )


          # ============================================================
          # Default settings store
          # ============================================================

          write_file(
              "src/renderer/src/store/useDefaultSettingsStore.ts",
              """
              import { create } from 'zustand'
              import localForage from 'localforage'

              interface IDefaultSettingsStore {
                defaultSettingsConfig: IDefaultDefaultSettingsConfig
                setDefaultSettingsConfig: (
                  config: IDefaultDefaultSettingsConfig
                ) => void
                initData: () => void
              }

              const DEFAULT_SETTINGS:
                IDefaultDefaultSettingsConfig = {
                directory: '',
                lang: 'cn',
                xizhiKey: '',

                webdavEnabled:
                  false,

                webdavUrl:
                  'https://pan.lansod.cn/dav',

                webdavUsername:
                  '',

                webdavPassword:
                  '',

                webdavRemoteRoot:
                  '/',

                webdavDeleteAfterUpload:
                  false,

                webdavRetryTimes:
                  3
              }

              export const useDefaultSettingsStore =
                create<IDefaultSettingsStore>(
                  (set) => ({
                    defaultSettingsConfig:
                      DEFAULT_SETTINGS,

                    initData:
                      async () => {
                        const stored =
                          await localForage.getItem<IDefaultDefaultSettingsConfig>(
                            'defaultSettingsConfig'
                          )

                        set(() => ({
                          defaultSettingsConfig:
                            {
                              ...DEFAULT_SETTINGS,
                              ...(stored ||
                                {})
                            }
                        }))
                      },

                    setDefaultSettingsConfig:
                      (
                        config:
                          IDefaultDefaultSettingsConfig
                      ) =>
                        set(() => {
                          const next = {
                            ...DEFAULT_SETTINGS,
                            ...config
                          }

                          void localForage.setItem(
                            'defaultSettingsConfig',
                            next
                          )

                          return {
                            defaultSettingsConfig:
                              next
                          }
                        })
                  })
                )
              """
          )


          # ============================================================
          # Cloud settings UI
          # ============================================================

          write_file(
              "src/renderer/src/components/NavBar/components/CloudStorageSettings.tsx",
              """
              import {
                useState
              } from 'react'

              import {
                Button
              } from '@/shadcn/ui/button'

              import {
                FormLabel
              } from '@/shadcn/ui/form'

              import {
                Input
              } from '@/shadcn/ui/input'

              import {
                Switch
              } from '@/shadcn/ui/switch'

              import {
                useToast
              } from '@renderer/hooks/useToast'

              interface Props {
                form: {
                  watch:
                    (
                      name: string
                    ) => unknown

                  getValues:
                    (
                      name: string
                    ) => unknown

                  setValue:
                    (
                      name: string,
                      value: unknown,
                      options?: {
                        shouldDirty?:
                          boolean
                      }
                    ) => void
                }
              }

              export default function CloudStorageSettings({
                form
              }: Props) {
                const {
                  toast
                } = useToast()

                const [
                  testing,
                  setTesting
                ] = useState(
                  false
                )

                const enabled =
                  Boolean(
                    form.watch(
                      'webdavEnabled'
                    )
                  )

                const deleteAfterUpload =
                  Boolean(
                    form.watch(
                      'webdavDeleteAfterUpload'
                    )
                  )

                const handleTest =
                  async () => {
                    const url =
                      String(
                        form.getValues(
                          'webdavUrl'
                        ) ||
                        ''
                      ).trim()

                    const username =
                      String(
                        form.getValues(
                          'webdavUsername'
                        ) ||
                        ''
                      ).trim()

                    const password =
                      String(
                        form.getValues(
                          'webdavPassword'
                        ) ||
                        ''
                      )

                    const remoteRoot =
                      String(
                        form.getValues(
                          'webdavRemoteRoot'
                        ) ||
                        '/'
                      ).trim() ||
                      '/'

                    if (
                      !url ||
                      !username ||
                      !password
                    ) {
                      toast({
                        title:
                          'WebDAV 测试失败',

                        description:
                          '请先填写 WebDAV 地址、用户名和密码',

                        variant:
                          'destructive'
                      })

                      return
                    }

                    setTesting(
                      true
                    )

                    try {
                      const result =
                        await window.api
                          .testWebdav({
                            url,
                            username,
                            password,
                            remoteRoot
                          })

                      toast({
                        title:
                          result.success
                            ? 'WebDAV 测试成功'
                            : 'WebDAV 测试失败',

                        description:
                          result.message,

                        variant:
                          result.success
                            ? undefined
                            : 'destructive'
                      })
                    } catch (
                      error
                    ) {
                      toast({
                        title:
                          'WebDAV 测试失败',

                        description:
                          error instanceof
                            Error
                            ? error.message
                            : String(
                                error
                              ),

                        variant:
                          'destructive'
                      })
                    } finally {
                      setTesting(
                        false
                      )
                    }
                  }

                return (
                  <div className="space-y-4 rounded-lg border p-4">
                    <div className="flex items-center justify-between gap-4">
                      <div>
                        <FormLabel>
                          云端存储 / 自动上传
                        </FormLabel>

                        <div className="mt-1 text-xs text-muted-foreground">
                          录像完成后自动按主播名称分类上传
                        </div>
                      </div>

                      <Switch
                        checked={
                          enabled
                        }
                        onCheckedChange={(
                          value
                        ) => {
                          form.setValue(
                            'webdavEnabled',
                            value,
                            {
                              shouldDirty:
                                true
                            }
                          )
                        }}
                      />
                    </div>

                    {enabled && (
                      <div className="space-y-4">
                        <div className="space-y-1">
                          <FormLabel>
                            WebDAV 地址
                          </FormLabel>

                          <Input
                            value={String(
                              form.watch(
                                'webdavUrl'
                              ) ||
                              ''
                            )}
                            onChange={(
                              event
                            ) => {
                              form.setValue(
                                'webdavUrl',
                                event.target
                                  .value,
                                {
                                  shouldDirty:
                                    true
                                }
                              )
                            }}
                            placeholder="https://pan.lansod.cn/dav"
                          />
                        </div>

                        <div className="space-y-1">
                          <FormLabel>
                            用户名
                          </FormLabel>

                          <Input
                            value={String(
                              form.watch(
                                'webdavUsername'
                              ) ||
                              ''
                            )}
                            onChange={(
                              event
                            ) => {
                              form.setValue(
                                'webdavUsername',
                                event.target
                                  .value,
                                {
                                  shouldDirty:
                                    true
                                }
                              )
                            }}
                            autoComplete="off"
                          />
                        </div>

                        <div className="space-y-1">
                          <FormLabel>
                            密码
                          </FormLabel>

                          <Input
                            type="password"
                            value={String(
                              form.watch(
                                'webdavPassword'
                              ) ||
                              ''
                            )}
                            onChange={(
                              event
                            ) => {
                              form.setValue(
                                'webdavPassword',
                                event.target
                                  .value,
                                {
                                  shouldDirty:
                                    true
                                }
                              )
                            }}
                            autoComplete="new-password"
                          />
                        </div>

                        <div className="space-y-1">
                          <FormLabel>
