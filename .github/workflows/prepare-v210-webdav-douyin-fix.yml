          grep -q \
            "webdavEnabled" \
            type.d.ts

          grep -q \
            "cloudUploadStatus" \
            type.d.ts

          grep -q \
            "TEST_WEBDAV" \
            src/const.ts

          grep -q \
            "UPLOAD_WEBDAV" \
            src/const.ts

          grep -q \
            "https://pan.lansod.cn/dav" \
            src/renderer/src/store/useDefaultSettingsStore.ts

          grep -q \
            "YYYY-MM-DD_HH-mm-ss" \
            src/main/ffmpeg/record.ts

          grep -q \
            "DOUYIN_PROFILE_CACHE_MS" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "effectiveMonitorInterval" \
