name: Prepare V2.10 WebDAV and Douyin Fix V2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-v210-webdav-douyin-fix-v2
  cancel-in-progress: false

env:
  SOURCE_BRANCH: douyin-v2.8-anchor-monitor-test
  FEATURE_BRANCH: douyin-v2.10-webdav-douyin-fix-v2

jobs:
  prepare:
    name: Prepare V2.10 V2
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create safety backup
        shell: bash
        run: |
          set -euo pipefail

          BACKUP_BRANCH="backup-v210-v2-${GITHUB_RUN_NUMBER}"

          git branch "$BACKUP_BRANCH"
          git push origin "$BACKUP_BRANCH"

          echo "Backup branch: $BACKUP_BRANCH"

      - name: Create feature branch
        shell: bash
        run: |
          set -euo pipefail

          git checkout -B \
            "$FEATURE_BRANCH" \
            "$SOURCE_BRANCH"

      - name: Install dependencies
        run: npm ci

      - name: Apply V2.10 changes
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v210_fix.py <<'PY'
          from pathlib import Path
          import re


          def read(path):
              return Path(path).read_text(
                  encoding="utf-8"
              )


          def write(path, content):
              p = Path(path)
              p.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )
              p.write_text(
                  content,
                  encoding="utf-8"
              )


          def replace_required(
              path,
              old,
              new
          ):
              text = read(path)

              if new in text:
                  print(
                      f"Already patched: {path}"
                  )
                  return

              if old not in text:
                  raise RuntimeError(
                      f"Marker not found: {path}"
                  )

              write(
                  path,
                  text.replace(
                      old,
                      new,
                      1
                  )
              )

              print(
                  f"Patched: {path}"
              )


          def regex_replace_required(
              path,
              pattern,
              replacement
          ):
              text = read(path)

              new_text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=re.S
              )

              if count != 1:
                  raise RuntimeError(
                      f"Regex marker not found: {path}"
                  )

              write(
                  path,
                  new_text
              )

              print(
                  f"Patched: {path}"
              )


          # ============================================================
          # 1. Rewrite type.d.ts completely
          # ============================================================

          write(
              "type.d.ts",
              """interface IRecordedFile {
            path: string
            cloudName: string
          }

          type CloudUploadStatus =
            | 'uploading'
            | 'success'
            | 'error'

          interface IStreamConfig {
            id: string
            title: string
            roomUrl: string
            filename: string
            directory: string
            proxy?: string
            cookie?: string
            interval: number
            liveUrls?: string[]
            segmentTime?: string | ''
            line: string
            status: number
            convertToMP4: boolean
            detectResolution: boolean
            autoRecord: boolean
            cloudUploadStatus?: CloudUploadStatus
          }

          type Lang = 'en' | 'cn'

          interface IDefaultDefaultSettingsConfig {
            directory: string
            lang: Lang
            xizhiKey?: string

            webdavEnabled?: boolean
            webdavUrl?: string
            webdavUsername?: string
            webdavPassword?: string
            webdavRemoteRoot?: string
            webdavDeleteAfterUpload?: boolean
            webdavRetryTimes?: number
          }

          type IFfmpegProgressInfo = Record<
            string,
            {
              targetSize: number
              timemark: string
            }
          >

          interface IDownloadDepProgressInfo {
            title: string
            showRetry: boolean
            downloading: boolean
            progress: number
          }

          interface IWebControlSetting {
            webControlPath: string
            enableWebControl: boolean
            email: string
          }
          """
          )

          # remove indentation from generated file
          type_path = Path(
              "type.d.ts"
          )

          lines = type_path.read_text(
              encoding="utf-8"
          ).splitlines()

          type_path.write_text(
              "\n".join(
                  line[10:]
                  if line.startswith(
                      "          "
                  )
                  else line
                  for line in lines
              ) + "\n",
              encoding="utf-8"
          )

          # ============================================================
          # 2. Main WebDAV implementation
          # ============================================================

          write(
              "src/main/webdav.ts",
              """import fs from 'node:fs'
          import path from 'node:path'

          import axios from 'axios'

          export interface IWebdavConfig {
            url: string
            username: string
            password: string
            remoteRoot?: string
          }

          export interface IWebdavFile {
            path: string
            cloudName: string
          }

          export interface IWebdavUploadRequest
            extends IWebdavConfig {
            streamerName: string
            files: IWebdavFile[]
            deleteAfterUpload?: boolean
            retryTimes?: number
          }

          const authHeader = (
            username: string,
            password: string
          ) =>
            `Basic ${Buffer.from(
              `${username}:${password}`
            ).toString('base64')}`

          const cleanBase = (
            value: string
          ) =>
            value
              .trim()
              .replace(/\\/+$/, '')

          const pathParts = (
            value?: string
          ) =>
            (value || '/')
              .split('/')
              .map(
                item =>
                  item.trim()
              )
              .filter(Boolean)

          const safeFolderName = (
            value: string
          ) => {
            const result =
              String(
                value || ''
              )
                .replace(
                  /[<>:"/\\\\|?*\\u0000-\\u001f]/g,
                  '_'
                )
                .replace(
                  /[. ]+$/g,
                  ''
                )
                .trim()

            return (
              result ||
              '主播'
            )
          }

          const remoteUrl = (
            base: string,
            segments: string[]
          ) => {
            const root =
              cleanBase(base)

            if (
              segments.length ===
              0
            ) {
              return `${root}/`
            }

            return (
              `${root}/` +
              segments
                .map(
                  item =>
                    encodeURIComponent(
                      item
                    )
                )
                .join('/')
            )
          }

          const ok = (
            status: number
          ) =>
            status >= 200 &&
            status < 300

          async function ensureFolder(
            config: IWebdavConfig,
            segments: string[]
          ) {
            const current:
              string[] = []

            for (
              const part of
              segments
            ) {
              current.push(
                part
              )

              const response =
                await axios.request({
                  method:
                    'MKCOL',

                  url:
                    remoteUrl(
                      config.url,
                      current
                    ),

                  headers: {
                    Authorization:
                      authHeader(
                        config.username,
                        config.password
                      )
                  },

                  validateStatus:
                    () => true
                })

              if (
                ![
                  200,
                  201,
                  204,
                  301,
                  405
                ].includes(
                  response.status
                )
              ) {
                throw new Error(
                  `创建云端目录失败 HTTP ${response.status}`
                )
              }
            }
          }

          async function remoteSize(
            config: IWebdavConfig,
            segments: string[]
          ) {
            const url =
              remoteUrl(
                config.url,
                segments
              )

            const authorization =
              authHeader(
                config.username,
                config.password
              )

            const head =
              await axios.head(
                url,
                {
                  headers: {
                    Authorization:
                      authorization
                  },

                  validateStatus:
                    () => true
                }
              )

            if (
              ok(
                head.status
              )
            ) {
              const size =
                Number(
                  head.headers[
                    'content-length'
                  ]
                )

              if (
                Number.isFinite(
                  size
                )
              ) {
                return size
              }
            }

            const result =
              await axios.request({
                method:
                  'PROPFIND',

                url,

                headers: {
                  Authorization:
                    authorization,

                  Depth:
                    '0'
                },

                responseType:
                  'text',

                validateStatus:
                  () => true
              })

            if (
              result.status !==
                207 &&
              !ok(
                result.status
              )
            ) {
              return -1
            }

            const body =
              String(
                result.data ||
                ''
              )

            const match =
              body.match(
                /getcontentlength[^>]*>(\\d+)</i
              )

            return match
              ? Number(
                  match[1]
                )
              : -1
          }

          async function uploadBuffer(
            config: IWebdavConfig,
            segments: string[],
            data: Buffer
          ) {
            const response =
              await axios.put(
                remoteUrl(
                  config.url,
                  segments
                ),

                data,

                {
                  headers: {
                    Authorization:
                      authHeader(
                        config.username,
                        config.password
                      ),

                    'Content-Type':
                      'application/octet-stream',

                    'Content-Length':
                      data.length
                  },

                  maxBodyLength:
                    Infinity,

                  maxContentLength:
                    Infinity,

                  validateStatus:
                    () => true
                }
              )

            if (
              !ok(
                response.status
              )
            ) {
              throw new Error(
                `上传失败 HTTP ${response.status}`
              )
            }
          }

          async function uploadFile(
            config: IWebdavConfig,
            localPath: string,
            segments: string[]
          ) {
            const stat =
              await fs.promises
                .stat(
                  localPath
                )

            if (
              !stat.isFile()
            ) {
              throw new Error(
                '录像文件无效'
              )
            }

            const response =
              await axios.put(
                remoteUrl(
                  config.url,
                  segments
                ),

                fs.createReadStream(
                  localPath
                ),

                {
                  headers: {
                    Authorization:
                      authHeader(
                        config.username,
                        config.password
                      ),

                    'Content-Type':
                      'application/octet-stream',

                    'Content-Length':
                      stat.size
                  },

                  maxBodyLength:
                    Infinity,

                  maxContentLength:
                    Infinity,

                  validateStatus:
                    () => true
                }
              )

            if (
              !ok(
                response.status
              )
            ) {
              throw new Error(
                `上传失败 HTTP ${response.status}`
              )
            }

            const size =
              await remoteSize(
                config,
                segments
              )

            if (
              size !==
              stat.size
            ) {
              throw new Error(
                `云端校验失败 本地 ${stat.size} 云端 ${size}`
              )
            }
          }

          export async function testWebdav(
            config: IWebdavConfig
          ) {
            try {
              if (
                !config.url?.trim() ||
                !config.username?.trim() ||
                !config.password
              ) {
                return {
                  success:
                    false,

                  message:
                    '请填写 WebDAV 地址、用户名和密码'
                }
              }

              const root =
                pathParts(
                  config.remoteRoot
                )

              await ensureFolder(
                config,
                root
              )

              const filename =
                `.fideo-test-${Date.now()}.txt`

              const parts = [
                ...root,
                filename
              ]

              const data =
                Buffer.from(
                  'Fideo WebDAV Test'
                )

              await uploadBuffer(
                config,
                parts,
                data
              )

              const size =
                await remoteSize(
                  config,
                  parts
                )

              if (
                size !==
                data.length
              ) {
                throw new Error(
                  '测试文件大小校验失败'
                )
              }

              const deleteResult =
                await axios.delete(
                  remoteUrl(
                    config.url,
                    parts
                  ),

                  {
                    headers: {
                      Authorization:
                        authHeader(
                          config.username,
                          config.password
                        )
                    },

                    validateStatus:
                      () => true
                  }
                )

              if (
                !ok(
                  deleteResult.status
                ) &&
                deleteResult.status !==
                  404
              ) {
                throw new Error(
                  `测试文件删除失败 HTTP ${deleteResult.status}`
                )
              }

              return {
                success:
                  true,

                message:
                  'WebDAV 上传测试成功'
              }
            } catch (
              error
            ) {
              return {
                success:
                  false,

                message:
                  error instanceof Error
                    ? error.message
                    : String(
                        error
                      )
              }
            }
          }

          export async function uploadWebdav(
            request:
              IWebdavUploadRequest
          ) {
            const config:
              IWebdavConfig = {
              url:
                request.url,

              username:
                request.username,

              password:
                request.password,

              remoteRoot:
                request.remoteRoot
            }

            const folder = [
              ...pathParts(
                request.remoteRoot
              ),

              safeFolderName(
                request.streamerName
              )
            ]

            await ensureFolder(
              config,
              folder
            )

            const retries =
              Math.max(
                1,
                Math.min(
                  10,
                  Number(
                    request.retryTimes ||
                    3
                  )
                )
              )

            const results = []

            for (
              const file of
              request.files
            ) {
              let uploaded =
                false

              let lastError =
                ''

              for (
                let attempt = 1;
                attempt <= retries;
                attempt += 1
              ) {
                try {
                  const ext =
                    path.extname(
                      file.path
                    )

                  const cloudName =
                    path.extname(
                      file.cloudName
                    )
                      ? file.cloudName
                      : `${file.cloudName}${ext}`

                  await uploadFile(
                    config,
                    file.path,
                    [
                      ...folder,
                      cloudName
                    ]
                  )

                  let deleted =
                    false

                  if (
                    request
                      .deleteAfterUpload
                  ) {
                    await fs.promises
                      .unlink(
                        file.path
                      )

                    deleted =
                      true
                  }

                  results.push({
                    path:
                      file.path,

                    cloudName,

                    success:
                      true,

                    deleted
                  })

                  uploaded =
                    true

                  break
                } catch (
                  error
                ) {
                  lastError =
                    error instanceof Error
                      ? error.message
                      : String(
                          error
                        )

                  if (
                    attempt <
                    retries
                  ) {
                    await new Promise(
                      resolve =>
                        setTimeout(
                          resolve,
                          attempt *
                            2000
                        )
                    )
                  }
                }
              }

              if (
                !uploaded
              ) {
                results.push({
                  path:
                    file.path,

                  cloudName:
                    file.cloudName,

                  success:
                    false,

                  deleted:
                    false,

                  message:
                    lastError
                })
              }
            }

            return {
              success:
                results.length >
                  0 &&
                results.every(
                  item =>
                    item.success
                ),

              results
            }
          }
          """
          )

          webdav_path = Path(
              "src/main/webdav.ts"
          )

          lines = webdav_path.read_text(
              encoding="utf-8"
          ).splitlines()

          webdav_path.write_text(
              "\n".join(
                  line[10:]
                  if line.startswith(
                      "          "
                  )
                  else line
                  for line in lines
              ) + "\n",
              encoding="utf-8"
          )

          # ============================================================
          # 3. Constants
          # ============================================================

          const_path = (
              "src/const.ts"
          )

          const_text =
              read(
                const_path
              )

          if (
              "TEST_WEBDAV"
              not in
              const_text
          ):
              const_text += (
                  "\n"
                  "export const TEST_WEBDAV = 'TEST_WEBDAV'\n"
                  "export const UPLOAD_WEBDAV = 'UPLOAD_WEBDAV'\n"
              )

              write(
                  const_path,
                  const_text
              )

          # ============================================================
          # 4. Default settings store
          # ============================================================

          write(
              "src/renderer/src/store/useDefaultSettingsStore.ts",
              """import { create } from 'zustand'
          import localForage from 'localforage'

          interface IDefaultSettingsStore {
            defaultSettingsConfig: IDefaultDefaultSettingsConfig
            setDefaultSettingsConfig: (
              config: IDefaultDefaultSettingsConfig
            ) => void
            initData: () => void
          }

          const DEFAULT_SETTINGS:
            IDefaultDefaultSettingsConfig = {
            directory: '',
            lang: 'cn',
            xizhiKey: '',

            webdavEnabled:
              false,

            webdavUrl:
              'https://pan.lansod.cn/dav',

            webdavUsername:
              '',

            webdavPassword:
              '',

            webdavRemoteRoot:
              '/',

            webdavDeleteAfterUpload:
              false,

            webdavRetryTimes:
              3
          }

          export const useDefaultSettingsStore =
            create<IDefaultSettingsStore>(
              set => ({
                defaultSettingsConfig:
                  DEFAULT_SETTINGS,

                initData:
                  async () => {
                    const saved =
                      await localForage
                        .getItem<IDefaultDefaultSettingsConfig>(
                          'defaultSettingsConfig'
                        )

                    set(() => ({
                      defaultSettingsConfig: {
                        ...DEFAULT_SETTINGS,
                        ...(saved || {})
                      }
                    }))
                  },

                setDefaultSettingsConfig:
                  config =>
                    set(() => {
                      const next = {
                        ...DEFAULT_SETTINGS,
                        ...config
                      }

                      void localForage
                        .setItem(
                          'defaultSettingsConfig',
                          next
                        )

                      return {
                        defaultSettingsConfig:
                          next
                      }
                    })
              })
            )
          """
          )

          store_path = Path(
              "src/renderer/src/store/useDefaultSettingsStore.ts"
          )

          lines = store_path.read_text(
              encoding="utf-8"
          ).splitlines()

          store_path.write_text(
              "\n".join(
                  line[10:]
                  if line.startswith(
                      "          "
                  )
                  else line
                  for line in lines
              ) + "\n",
              encoding="utf-8"
          )

          # ============================================================
          # 5. Cloud UI
          # ============================================================

          write(
              "src/renderer/src/components/NavBar/components/CloudStorageSettings.tsx",
              """import { useState } from 'react'

          import { Button } from '@/shadcn/ui/button'
          import { FormLabel } from '@/shadcn/ui/form'
          import { Input } from '@/shadcn/ui/input'
          import { Switch } from '@/shadcn/ui/switch'
          import { useToast } from '@renderer/hooks/useToast'

          interface Props {
            form: any
          }

          export default function CloudStorageSettings({
            form
          }: Props) {
            const {
              toast
            } = useToast()

            const [
              testing,
              setTesting
            ] = useState(false)

            const enabled =
              Boolean(
                form.watch(
                  'webdavEnabled'
                )
              )

            const deleteAfterUpload =
              Boolean(
                form.watch(
                  'webdavDeleteAfterUpload'
                )
              )

            const handleTest =
              async () => {
                const url =
                  String(
                    form.getValues(
                      'webdavUrl'
                    ) ||
                    ''
                  ).trim()

                const username =
                  String(
                    form.getValues(
                      'webdavUsername'
                    ) ||
                    ''
                  ).trim()

                const password =
                  String(
                    form.getValues(
                      'webdavPassword'
                    ) ||
                    ''
                  )

                const remoteRoot =
                  String(
                    form.getValues(
                      'webdavRemoteRoot'
                    ) ||
                    '/'
                  ).trim() ||
                  '/'

                if (
                  !url ||
                  !username ||
                  !password
                ) {
                  toast({
                    title:
                      'WebDAV 测试失败',

                    description:
                      '请先填写 WebDAV 地址、用户名和密码',

                    variant:
                      'destructive'
                  })

                  return
                }

                setTesting(
                  true
                )

                try {
                  const result =
                    await window.api
                      .testWebdav({
                        url,
                        username,
                        password,
                        remoteRoot
                      })

                  toast({
                    title:
                      result.success
                        ? 'WebDAV 测试成功'
                        : 'WebDAV 测试失败',

                    description:
                      result.message,

                    variant:
                      result.success
                        ? undefined
                        : 'destructive'
                  })
                } finally {
                  setTesting(
                    false
                  )
                }
              }

            return (
              <div className="space-y-4 rounded-lg border p-4">
                <div className="flex items-center justify-between gap-4">
                  <div>
                    <FormLabel>
                      云端存储 / 自动上传
                    </FormLabel>

                    <div className="mt-1 text-xs text-muted-foreground">
                      按主播名称自动创建文件夹
                    </div>
                  </div>

                  <Switch
                    checked={
                      enabled
                    }
                    onCheckedChange={(
                      value
                    ) =>
                      form.setValue(
                        'webdavEnabled',
                        value
                      )
                    }
                  />
                </div>

                {enabled && (
                  <div className="space-y-4">
                    <div className="space-y-1">
                      <FormLabel>
                        WebDAV 地址
                      </FormLabel>

                      <Input
                        value={String(
                          form.watch(
                            'webdavUrl'
                          ) ||
                          ''
                        )}
                        onChange={(
                          event
                        ) =>
                          form.setValue(
                            'webdavUrl',
                            event.target
                              .value
                          )
                        }
                        placeholder="https://pan.lansod.cn/dav"
                      />
                    </div>

                    <div className="space-y-1">
                      <FormLabel>
                        用户名
                      </FormLabel>

                      <Input
                        value={String(
                          form.watch(
                            'webdavUsername'
                          ) ||
                          ''
                        )}
                        onChange={(
                          event
                        ) =>
                          form.setValue(
                            'webdavUsername',
                            event.target
                              .value
                          )
                        }
                      />
                    </div>

                    <div className="space-y-1">
                      <FormLabel>
                        密码
                      </FormLabel>

                      <Input
                        type="password"
                        value={String(
                          form.watch(
                            'webdavPassword'
                          ) ||
                          ''
                        )}
                        onChange={(
                          event
                        ) =>
                          form.setValue(
                            'webdavPassword',
                            event.target
                              .value
                          )
                        }
                      />
                    </div>

                    <div className="space-y-1">
                      <FormLabel>
                        上传根目录
                      </FormLabel>

                      <Input
                        value={String(
                          form.watch(
                            'webdavRemoteRoot'
                          ) ||
                          '/'
                        )}
                        onChange={(
                          event
                        ) =>
                          form.setValue(
                            'webdavRemoteRoot',
                            event.target
                              .value
                          )
                        }
                        placeholder="/"
                      />
                    </div>

                    <div className="flex items-center justify-between gap-4">
                      <div>
                        <FormLabel>
                          上传成功后删除本地录像
                        </FormLabel>

                        <div className="mt-1 text-xs text-muted-foreground">
                          云端文件大小确认一致后才删除
                        </div>
                      </div>

                      <Switch
                        checked={
                          deleteAfterUpload
                        }
                        onCheckedChange={(
                          value
                        ) =>
                          form.setValue(
                            'webdavDeleteAfterUpload',
                            value
                          )
                        }
                      />
                    </div>

                    <div className="space-y-1">
                      <FormLabel>
                        失败重试次数
                      </FormLabel>

                      <Input
                        type="number"
                        min={1}
