name: Prepare V2.10 WebDAV Douyin Fix V7

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-v210-webdav-douyin-fix-v7
  cancel-in-progress: false

env:
  SOURCE_BRANCH: douyin-v2.8-anchor-monitor-test
  FEATURE_BRANCH: douyin-v2.10-webdav-douyin-fix-v7

jobs:
  prepare:
    name: Prepare V2.10 V7
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create safety backup
        shell: bash
        run: |
          set -euo pipefail

          BACKUP_BRANCH="backup-v210-v7-${GITHUB_RUN_ID}"

          git branch "$BACKUP_BRANCH"
          git push origin "$BACKUP_BRANCH"

          echo "Backup: $BACKUP_BRANCH"

      - name: Create feature branch
        shell: bash
        run: |
          set -euo pipefail

          git checkout -B "$FEATURE_BRANCH" "$SOURCE_BRANCH"

      - name: Install dependencies
        run: npm ci

      - name: Apply V2.10 V7 patch
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/v210_v7.py <<'PY'
          from pathlib import Path
          import re


          def read(path):
              return Path(path).read_text(encoding="utf-8")


          def write(path, text):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding="utf-8")


          def replace_once(path, old, new):
              text = read(path)

              if new in text:
                  print("Already patched:", path)
                  return

              if old not in text:
                  raise RuntimeError(
                      "Marker not found in: " + path
                  )

              write(
                  path,
                  text.replace(old, new, 1)
              )

              print("Patched:", path)


          # ============================================================
          # type.d.ts
          # ============================================================

          write(
              "type.d.ts",
              """interface IRecordedFile {
            path: string
            cloudName: string
          }

          type CloudUploadStatus =
            | 'uploading'
            | 'success'
            | 'error'

          interface IStreamConfig {
            id: string
            title: string
            roomUrl: string
            filename: string
            directory: string
            proxy?: string
            cookie?: string
            interval: number
            liveUrls?: string[]
            segmentTime?: string | ''
            line: string
            status: number
            convertToMP4: boolean
            detectResolution: boolean
            autoRecord: boolean
            cloudUploadStatus?: CloudUploadStatus
          }

          type Lang = 'en' | 'cn'

          interface IDefaultDefaultSettingsConfig {
            directory: string
            lang: Lang
            xizhiKey?: string

            webdavEnabled?: boolean
            webdavUrl?: string
            webdavUsername?: string
            webdavPassword?: string
            webdavRemoteRoot?: string
            webdavDeleteAfterUpload?: boolean
            webdavRetryTimes?: number
          }

          type IFfmpegProgressInfo = Record<
            string,
            {
              targetSize: number
              timemark: string
            }
          >

          interface IDownloadDepProgressInfo {
            title: string
            showRetry: boolean
            downloading: boolean
            progress: number
          }

          interface IWebControlSetting {
            webControlPath: string
            enableWebControl: boolean
            email: string
          }
          """
          )

          p = Path("type.d.ts")

          p.write_text(
              "\n".join(
                  line[10:]
                  if line.startswith("          ")
                  else line
                  for line in p.read_text(
                      encoding="utf-8"
                  ).splitlines()
              ) + "\n",
              encoding="utf-8"
          )


          # ============================================================
          # WebDAV implementation
          # ============================================================

          write(
              "src/main/webdav.ts",
              """import fs from 'node:fs'
          import path from 'node:path'

          import axios from 'axios'

          export interface IWebdavConfig {
            url: string
            username: string
            password: string
            remoteRoot?: string
          }

          export interface IWebdavFile {
            path: string
            cloudName: string
          }

          export interface IWebdavUploadRequest
            extends IWebdavConfig {
            streamerName: string
            files: IWebdavFile[]
            deleteAfterUpload?: boolean
            retryTimes?: number
          }

          const authorization = (
            username: string,
            password: string
          ) =>
            `Basic ${Buffer.from(
              `${username}:${password}`,
              'utf8'
            ).toString('base64')}`

          const cleanBaseUrl = (
            value: string
          ) =>
            value
              .trim()
              .replace(/\\/+$/, '')

          const splitRemotePath = (
            value?: string
          ) =>
            (value || '/')
              .split('/')
              .map(
                item =>
                  item.trim()
              )
              .filter(Boolean)

          const safeFolderName = (
            value: string
          ) => {
            const result =
              String(
                value || ''
              )
                .replace(
                  /[<>:"/\\\\|?*\\u0000-\\u001f]/g,
                  '_'
                )
                .replace(
                  /[. ]+$/g,
                  ''
                )
                .trim()

            return result || '主播'
          }

          const makeRemoteUrl = (
            base: string,
            segments: string[]
          ) => {
            const root =
              cleanBaseUrl(base)

            if (
              segments.length === 0
            ) {
              return `${root}/`
            }

            return (
              `${root}/` +
              segments
                .map(
                  item =>
                    encodeURIComponent(
                      item
                    )
                )
                .join('/')
            )
          }

          const successStatus = (
            value: number
          ) =>
            value >= 200 &&
            value < 300

          async function ensureFolders(
            config: IWebdavConfig,
            segments: string[]
          ) {
            const current:
              string[] = []

            for (
              const segment of
              segments
            ) {
              current.push(
                segment
              )

              const response =
                await axios.request({
                  method:
                    'MKCOL',

                  url:
                    makeRemoteUrl(
                      config.url,
                      current
                    ),

                  headers: {
                    Authorization:
                      authorization(
                        config.username,
                        config.password
                      )
                  },

                  validateStatus:
                    () => true
                })

              if (
                ![
                  200,
                  201,
                  204,
                  301,
                  405
                ].includes(
                  response.status
                )
              ) {
                throw new Error(
                  `创建云端目录失败 HTTP ${response.status}`
                )
              }
            }
          }

          async function getRemoteSize(
            config: IWebdavConfig,
            segments: string[]
          ): Promise<number> {
            const url =
              makeRemoteUrl(
                config.url,
                segments
              )

            const auth =
              authorization(
                config.username,
                config.password
              )

            const head =
              await axios.head(
                url,
                {
                  headers: {
                    Authorization:
                      auth
                  },

                  validateStatus:
                    () => true
                }
              )

            if (
              successStatus(
                head.status
              )
            ) {
              const value =
                Number(
                  head.headers[
                    'content-length'
                  ]
                )

              if (
                Number.isFinite(
                  value
                ) &&
                value >= 0
              ) {
                return value
              }
            }

            const response =
              await axios.request({
                method:
                  'PROPFIND',

                url,

                headers: {
                  Authorization:
                    auth,

                  Depth:
                    '0'
                },

                responseType:
                  'text',

                validateStatus:
                  () => true
              })

            if (
              response.status !==
                207 &&
              !successStatus(
                response.status
              )
            ) {
              return -1
            }

            const body =
              String(
                response.data ||
                ''
              )

            const match =
              body.match(
                /getcontentlength[^>]*>(\\d+)</i
              )

            return match
              ? Number(
                  match[1]
                )
              : -1
          }

          async function uploadBuffer(
            config: IWebdavConfig,
            segments: string[],
            data: Buffer
          ) {
            const response =
              await axios.put(
                makeRemoteUrl(
                  config.url,
                  segments
                ),

                data,

                {
                  headers: {
                    Authorization:
                      authorization(
                        config.username,
                        config.password
                      ),

                    'Content-Type':
                      'application/octet-stream',

                    'Content-Length':
                      data.length
                  },

                  maxBodyLength:
                    Infinity,

                  maxContentLength:
                    Infinity,

                  validateStatus:
                    () => true
                }
              )

            if (
              !successStatus(
                response.status
              )
            ) {
              throw new Error(
                `上传失败 HTTP ${response.status}`
              )
            }
          }

          async function uploadFile(
            config: IWebdavConfig,
            localPath: string,
            segments: string[]
          ) {
            const stat =
              await fs.promises.stat(
                localPath
              )

            if (
              !stat.isFile()
            ) {
              throw new Error(
                '录像文件不存在或无效'
              )
            }

            const response =
              await axios.put(
                makeRemoteUrl(
                  config.url,
                  segments
                ),

                fs.createReadStream(
                  localPath
                ),

                {
                  headers: {
                    Authorization:
                      authorization(
                        config.username,
                        config.password
                      ),

                    'Content-Type':
                      'application/octet-stream',

                    'Content-Length':
                      stat.size
                  },

                  maxBodyLength:
                    Infinity,

                  maxContentLength:
                    Infinity,

                  validateStatus:
                    () => true
                }
              )

            if (
              !successStatus(
                response.status
              )
            ) {
              throw new Error(
                `上传失败 HTTP ${response.status}`
              )
            }

            const remoteSize =
              await getRemoteSize(
                config,
                segments
              )

            if (
              remoteSize !==
              stat.size
            ) {
              throw new Error(
                `云端文件大小校验失败，本地 ${stat.size}，云端 ${remoteSize}`
              )
            }
          }

          export async function testWebdav(
            config: IWebdavConfig
          ) {
            try {
              if (
                !config.url?.trim() ||
                !config.username?.trim() ||
                !config.password
              ) {
                return {
                  success:
                    false,

                  message:
                    'WebDAV 地址、用户名和密码不能为空'
                }
              }

              const root =
                splitRemotePath(
                  config.remoteRoot
                )

              await ensureFolders(
                config,
                root
              )

              const name =
                `.fideo-test-${Date.now()}.txt`

              const remote = [
                ...root,
                name
              ]

              const data =
                Buffer.from(
                  'Fideo WebDAV Test',
                  'utf8'
                )

              await uploadBuffer(
                config,
                remote,
                data
              )

              const size =
                await getRemoteSize(
                  config,
                  remote
                )

              if (
                size !==
                data.length
              ) {
                throw new Error(
                  '测试文件大小校验失败'
                )
              }

              const response =
                await axios.delete(
                  makeRemoteUrl(
                    config.url,
                    remote
                  ),

                  {
                    headers: {
                      Authorization:
                        authorization(
                          config.username,
                          config.password
                        )
                    },

                    validateStatus:
                      () => true
                  }
                )

              if (
                !successStatus(
                  response.status
                ) &&
                response.status !==
                  404
              ) {
                throw new Error(
                  `测试文件删除失败 HTTP ${response.status}`
                )
              }

              return {
                success:
                  true,

                message:
                  '连接、上传、校验和删除测试成功'
              }
            } catch (
              error
            ) {
              return {
                success:
                  false,

                message:
                  error instanceof Error
                    ? error.message
                    : String(
                        error
                      )
              }
            }
          }

          export async function uploadWebdav(
            request:
              IWebdavUploadRequest
          ) {
            const config:
              IWebdavConfig = {
              url:
                request.url,

              username:
                request.username,

              password:
                request.password,

              remoteRoot:
                request.remoteRoot
            }

            const folder = [
              ...splitRemotePath(
                request.remoteRoot
              ),

              safeFolderName(
                request.streamerName
              )
            ]

            await ensureFolders(
              config,
              folder
            )

            const retryTimes =
              Math.max(
                1,
                Math.min(
                  10,
                  Number(
                    request.retryTimes ||
                    3
                  )
                )
              )

            const results:
              Array<{
                path: string
                cloudName: string
                success: boolean
                deleted: boolean
                message?: string
              }> = []

            for (
              const file of
              request.files
            ) {
              let uploaded =
                false

              let lastError =
                ''

              for (
                let attempt = 1;
                attempt <= retryTimes;
                attempt += 1
              ) {
                try {
                  const extension =
                    path.extname(
                      file.path
                    )

                  const cloudName =
                    path.extname(
                      file.cloudName
                    )
                      ? file.cloudName
                      : `${file.cloudName}${extension}`

                  await uploadFile(
                    config,
                    file.path,
                    [
                      ...folder,
                      cloudName
                    ]
                  )

                  let deleted =
                    false

                  if (
                    request
                      .deleteAfterUpload
                  ) {
                    await fs.promises.unlink(
                      file.path
                    )

                    deleted =
                      true
                  }

                  results.push({
                    path:
                      file.path,

                    cloudName,

                    success:
                      true,

                    deleted
                  })

                  uploaded =
                    true

                  break
                } catch (
                  error
                ) {
                  lastError =
                    error instanceof Error
                      ? error.message
                      : String(
                          error
                        )

                  if (
                    attempt <
                    retryTimes
                  ) {
                    await new Promise(
                      resolve =>
                        setTimeout(
                          resolve,
                          attempt *
                            2000
                        )
                    )
                  }
                }
              }

              if (
                !uploaded
              ) {
                results.push({
                  path:
                    file.path,

                  cloudName:
                    file.cloudName,

                  success:
                    false,

                  deleted:
                    false,

                  message:
                    lastError
                })
              }
            }

            return {
              success:
                results.length >
                  0 &&
                results.every(
                  item =>
                    item.success
                ),

              results
            }
          }
          """
          )

          p = Path(
              "src/main/webdav.ts"
          )

          p.write_text(
              "\n".join(
                  line[10:]
                  if line.startswith("          ")
                  else line
                  for line in p.read_text(
                      encoding="utf-8"
                  ).splitlines()
              ) + "\n",
              encoding="utf-8"
          )


          # ============================================================
          # Constants
          # ============================================================

          const_path = "src/const.ts"
          const_text = read(
              const_path
          )

          if (
              "TEST_WEBDAV"
              not in const_text
          ):
              const_text += (
                  "\n"
                  "export const TEST_WEBDAV = 'TEST_WEBDAV'\n"
                  "export const UPLOAD_WEBDAV = 'UPLOAD_WEBDAV'\n"
              )

              write(
                  const_path,
                  const_text
              )


          # ============================================================
          # Default settings store
          # ============================================================

          write(
              "src/renderer/src/store/useDefaultSettingsStore.ts",
              """import { create } from 'zustand'
          import localForage from 'localforage'

          interface IDefaultSettingsStore {
            defaultSettingsConfig: IDefaultDefaultSettingsConfig
            setDefaultSettingsConfig: (
              config: IDefaultDefaultSettingsConfig
            ) => void
            initData: () => void
          }

          const DEFAULT_SETTINGS:
            IDefaultDefaultSettingsConfig = {
            directory: '',
            lang: 'cn',
            xizhiKey: '',

            webdavEnabled:
              false,

            webdavUrl:
              'https://pan.lansod.cn/dav',

            webdavUsername:
              '',

            webdavPassword:
              '',

            webdavRemoteRoot:
              '/',

            webdavDeleteAfterUpload:
              false,

            webdavRetryTimes:
              3
          }

          export const useDefaultSettingsStore =
            create<IDefaultSettingsStore>(
              set => ({
                defaultSettingsConfig:
                  DEFAULT_SETTINGS,

                initData:
                  async () => {
                    const saved =
                      await localForage
                        .getItem<IDefaultDefaultSettingsConfig>(
                          'defaultSettingsConfig'
                        )

                    if (
                      saved
                    ) {
                      set(() => ({
                        defaultSettingsConfig: {
                          ...DEFAULT_SETTINGS,
                          ...saved
                        }
                      }))
                    }
                  },

                setDefaultSettingsConfig:
                  config =>
                    set(() => {
                      const next = {
                        ...DEFAULT_SETTINGS,
                        ...config
                      }

                      void localForage.setItem(
                        'defaultSettingsConfig',
                        next
                      )

                      return {
                        defaultSettingsConfig:
                          next
                      }
                    })
              })
            )
          """
          )

          p = Path(
              "src/renderer/src/store/useDefaultSettingsStore.ts"
          )

          p.write_text(
              "\n".join(
                  line[10:]
                  if line.startswith("          ")
                  else line
                  for line in p.read_text(
                      encoding="utf-8"
                  ).splitlines()
              ) + "\n",
              encoding="utf-8"
          )


          # ============================================================
          # Cloud settings component
          # ============================================================

          write(
              "src/renderer/src/components/NavBar/components/CloudStorageSettings.tsx",
              """import { useState } from 'react'

          import { Button } from '@/shadcn/ui/button'
          import { FormLabel } from '@/shadcn/ui/form'
          import { Input } from '@/shadcn/ui/input'
          import { Switch } from '@/shadcn/ui/switch'
          import { useToast } from '@renderer/hooks/useToast'

          interface Props {
            form: any
          }

          export default function CloudStorageSettings({
            form
          }: Props) {
            const {
              toast
            } = useToast()

            const [
              testing,
              setTesting
            ] = useState(false)

            const enabled =
              Boolean(
                form.watch(
                  'webdavEnabled'
                )
              )

            const deleteLocal =
              Boolean(
                form.watch(
                  'webdavDeleteAfterUpload'
                )
              )

            const testConnection =
              async () => {
                const url =
                  String(
                    form.getValues(
                      'webdavUrl'
                    ) ||
                    ''
                  ).trim()

                const username =
                  String(
                    form.getValues(
                      'webdavUsername'
                    ) ||
                    ''
                  ).trim()

                const password =
                  String(
                    form.getValues(
                      'webdavPassword'
                    ) ||
                    ''
                  )

                const remoteRoot =
                  String(
                    form.getValues(
                      'webdavRemoteRoot'
                    ) ||
                    '/'
                  ).trim() ||
                  '/'

                if (
                  !url ||
                  !username ||
                  !password
                ) {
                  toast({
                    title:
                      'WebDAV 测试失败',

                    description:
                      '请填写地址、用户名和密码',

                    variant:
                      'destructive'
                  })

                  return
                }

                setTesting(
                  true
                )

                try {
                  const result =
                    await window.api
                      .testWebdav({
                        url,
                        username,
                        password,
                        remoteRoot
                      })

                  toast({
                    title:
                      result.success
                        ? 'WebDAV 测试成功'
                        : 'WebDAV 测试失败',

                    description:
                      result.message,

                    variant:
                      result.success
                        ? undefined
                        : 'destructive'
                  })
                } catch (
                  error
                ) {
                  toast({
                    title:
                      'WebDAV 测试失败',

                    description:
                      error instanceof Error
                        ? error.message
                        : String(
                            error
                          ),

                    variant:
                      'destructive'
                  })
                } finally {
                  setTesting(
                    false
                  )
                }
              }

            return (
              <div className="space-y-4 rounded-lg border p-4">
                <div className="flex items-center justify-between gap-4">
                  <div>
                    <FormLabel>
                      云端存储 / 自动上传
                    </FormLabel>

                    <div className="mt-1 text-xs text-muted-foreground">
                      录像结束后按主播名称自动分类上传
                    </div>
                  </div>

                  <Switch
                    checked={
                      enabled
                    }
                    onCheckedChange={(
                      value
                    ) =>
                      form.setValue(
                        'webdavEnabled',
                        value
                      )
                    }
                  />
                </div>

                {enabled && (
                  <div className="space-y-4">
                    <div className="space-y-1">
                      <FormLabel>
                        WebDAV 地址
                      </FormLabel>

                      <Input
                        value={String(
                          form.watch(
                            'webdavUrl'
                          ) ||
                          ''
                        )}
                        onChange={(
                          event
                        ) =>
                          form.setValue(
                            'webdavUrl',
                            event.target
                              .value
                          )
                        }
                        placeholder="https://pan.lansod.cn/dav"
                      />
                    </div>

                    <div className="space-y-1">
                      <FormLabel>
                        用户名
                      </FormLabel>

                      <Input
                        value={String(
                          form.watch(
                            'webdavUsername'
                          ) ||
                          ''
                        )}
                        onChange={(
                          event
                        ) =>
                          form.setValue(
                            'webdavUsername',
                            event.target
                              .value
                          )
                        }
                      />
                    </div>

                    <div className="space-y-1">
                      <FormLabel>
                        密码
                      </FormLabel>

                      <Input
                        type="password"
                        value={String(
                          form.watch(
                            'webdavPassword'
                          ) ||
                          ''
                        )}
                        onChange={(
                          event
                        ) =>
                          form.setValue(
                            'webdavPassword',
                            event.target
                              .value
                          )
                        }
                      />
                    </div>

                    <div className="space-y-1">
                      <FormLabel>
                        上传根目录
                      </FormLabel>

                      <Input
                        value={String(
                          form.watch(
                            'webdavRemoteRoot'
                          ) ||
                          '/'
                        )}
                        onChange={(
                          event
                        ) =>
                          form.setValue(
                            'webdavRemoteRoot',
                            event.target
                              .value
                          )
                        }
                        placeholder="/"
                      />

                      <div className="text-xs text-muted-foreground">
                        小蓝云盘已经绑定“抖音直播录制”目录时保持 / 即可
                      </div>
                    </div>

                    <div className="flex items-center justify-between gap-4">
                      <div>
                        <FormLabel>
                          上传成功后删除本地录像
                        </FormLabel>

                        <div className="mt-1 text-xs text-muted-foreground">
                          只有云端文件大小验证正确以后才删除
                        </div>
                      </div>

                      <Switch
                        checked={
                          deleteLocal
                        }
                        onCheckedChange={(
                          value
                        ) =>
                          form.setValue(
                            'webdavDeleteAfterUpload',
                            value
                          )
                        }
                      />
                    </div>

                    <div className="space-y-1">
                      <FormLabel>
                        上传失败重试次数
                      </FormLabel>

                      <Input
                        type="number"
                        min={1}
                        max={10}
                        value={Number(
                          form.watch(
                            'webdavRetryTimes'
                          ) ||
                          3
                        )}
                        onChange={(
                          event
                        ) => {
                          const value =
                            Number(
                              event.target
