                        variant:
                          'destructive'
                      })
                    }
                  })()
                }

                unknownErrorRetryTimesMap[id] = unknownErrorRetryTimesMap[id] || 0"""

              if (
                  marker not in
                  stream_list
              ):
                  raise RuntimeError(
                      "StreamConfigList upload marker missing"
                  )

              write(
                  list_path,
                  stream_list.replace(
                      marker,
                      block,
                      1
                  )
              )


          # ============================================================
          # Upload status badge
          # ============================================================

          card_path = (
              "src/renderer/src/components/"
              "StreamConfigList/components/"
              "StreamConfigCard.tsx"
          )

          card = read(
              card_path
          )

          if (
              "正在上传云盘"
              not in card
          ):
              marker = (
                  "            {streamConfig.status !== StreamStatus.NOT_STARTED && (\n"
                  "              <Badge variant=\"outline\">"
                  "{t(streamStatusToLocaleMap[streamConfig.status])}</Badge>\n"
                  "            )}"
              )

              replacement = """            {streamConfig.status !== StreamStatus.NOT_STARTED && (
                <Badge variant="outline">{t(streamStatusToLocaleMap[streamConfig.status])}</Badge>
              )}

              {streamConfig.cloudUploadStatus === 'uploading' && (
                <Badge variant="outline">
                  正在上传云盘
                </Badge>
              )}

              {streamConfig.cloudUploadStatus === 'success' && (
                <Badge variant="outline">
                  已上传
                </Badge>
              )}

              {streamConfig.cloudUploadStatus === 'error' && (
                <Badge variant="outline">
                  上传失败
                </Badge>
              )}"""

              if (
                  marker not in
                  card
              ):
                  raise RuntimeError(
                      "StreamConfigCard status marker missing"
                  )

              write(
                  card_path,
                  card.replace(
                      marker,
                      replacement,
                      1
                  )
              )


          print(
              "V2.10 V7 patch finished."
          )
          PY

          python3 -m py_compile /tmp/v210_v7.py
          python3 /tmp/v210_v7.py

      - name: Verify modifications
        shell: bash
        run: |
          set -euo pipefail

          test -f \
