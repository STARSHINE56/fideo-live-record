                  ) &&
                  Boolean(
                    recordedFiles
                      ?.length
                  )

                if (
                  shouldUpload
                ) {
                  const current =
                    useStreamConfigStore
                      .getState()
                      .streamConfigList
                      .find(
                        item =>
                          item.id ===
                          streamConfig.id
                      )

                  if (
                    current
                  ) {
                    await updateStreamConfig(
                      {
                        ...current,

                        cloudUploadStatus:
                          'uploading'
                      },

                      current.id
                    )
                  }

                  void (async () => {
                    try {
                      const result =
                        await window.api
                          .uploadWebdav({
                            url:
                              webdavConfig
                                .webdavUrl!
                                .trim(),

                            username:
                              webdavConfig
                                .webdavUsername!
                                .trim(),

                            password:
                              webdavConfig
                                .webdavPassword!,

                            remoteRoot:
                              webdavConfig
                                .webdavRemoteRoot ||
                              '/',

                            streamerName:
                              streamConfig.title,

                            files:
                              recordedFiles!,

                            deleteAfterUpload:
                              Boolean(
                                webdavConfig
                                  .webdavDeleteAfterUpload
                              ),

                            retryTimes:
                              webdavConfig
                                .webdavRetryTimes ||
                              3
                          })

                      const latest =
                        useStreamConfigStore
                          .getState()
                          .streamConfigList
                          .find(
                            item =>
                              item.id ===
                              streamConfig.id
                          )

                      if (
                        latest
                      ) {
                        await useStreamConfigStore
                          .getState()
                          .updateStreamConfig(
                            {
                              ...latest,

                              cloudUploadStatus:
                                result.success
                                  ? 'success'
                                  : 'error'
                            },

                            latest.id
                          )
                      }

                      toast({
                        title:
                          streamConfig.title,

                        description:
                          result.success
                            ? '云端录像上传成功'
                            : '云端录像上传失败，本地文件已保留',

                        variant:
                          result.success
                            ? undefined
                            : 'destructive'
                      })
                    } catch (
                      error
                    ) {
                      const latest =
                        useStreamConfigStore
                          .getState()
                          .streamConfigList
                          .find(
                            item =>
                              item.id ===
                              streamConfig.id
                          )

                      if (
                        latest
                      ) {
                        await useStreamConfigStore
                          .getState()
                          .updateStreamConfig(
                            {
                              ...latest,

                              cloudUploadStatus:
                                'error'
                            },

                            latest.id
                          )
                      }
                    }
                  })()
                }

                unknownErrorRetryTimesMap[id] = unknownErrorRetryTimesMap[id] || 0"""

              if (
                  marker not in
                  stream_list
              ):
                  raise RuntimeError(
                      "StreamConfigList marker not found"
                  )

              stream_list = stream_list.replace(
                  marker,
                  upload_block,
                  1
              )

          write(
              list_file,
              stream_list
          )

          # ============================================================
          # 15. Upload status badge
          # ============================================================

          card_file = (
              "src/renderer/src/components/StreamConfigList/components/"
              "StreamConfigCard.tsx"
          )

          card = read(
              card_file
          )

          if (
              "正在上传云盘"
              not in
              card
          ):
              marker = """            {streamConfig.status !== StreamStatus.NOT_STARTED && (
                <Badge variant="outline">{t(streamStatusToLocaleMap[streamConfig.status])}</Badge>
              )}"""

              replacement = """            {streamConfig.status !== StreamStatus.NOT_STARTED && (
                <Badge variant="outline">{t(streamStatusToLocaleMap[streamConfig.status])}</Badge>
              )}

              {streamConfig.cloudUploadStatus === 'uploading' && (
                <Badge variant="outline">
                  正在上传云盘
                </Badge>
              )}

              {streamConfig.cloudUploadStatus === 'success' && (
                <Badge variant="outline">
                  已上传
                </Badge>
              )}

              {streamConfig.cloudUploadStatus === 'error' && (
                <Badge variant="outline">
                  上传失败
                </Badge>
              )}"""

              if (
                  marker not in
                  card
              ):
                  raise RuntimeError(
                      "StreamConfigCard marker not found"
                  )

              card = card.replace(
                  marker,
                  replacement,
                  1
              )

          write(
              card_file,
              card
          )

          print(
              "V2.10 V2 patch complete"
          )
          PY

          python3 -m py_compile \
            /tmp/v210_fix.py

          python3 \
            /tmp/v210_fix.py

