name: Douyin Parser V2.1 Fix Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-patch-build:
    name: Fix V2 Patch and Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract and repair V2 patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          import os
          import re
          import textwrap

          workflow_path = Path(
              ".github/workflows/douyin-parser-v2.yml"
          )

          if not workflow_path.exists():
              raise RuntimeError(
                  "旧的 douyin-parser-v2.yml 不存在，"
                  "请先保留上一版工作流。"
              )

          content = workflow_path.read_text(
              encoding="utf-8"
          )

          lines = content.splitlines()

          start = None
          end = None

          for index, line in enumerate(lines):
              if "python - <<'PY'" in line:
                  start = index + 1
                  break

          if start is None:
              raise RuntimeError(
                  "没有找到上一版工作流里的 Python 补丁脚本。"
              )

          for index in range(start, len(lines)):
              if lines[index].strip() == "PY":
                  end = index
                  break

          if end is None:
              raise RuntimeError(
                  "没有找到 Python 补丁脚本结束标记。"
              )

          script = "\n".join(
              lines[start:end]
          )

          script = textwrap.dedent(script)

          # ------------------------------------------------
          # 修复上一版工作流里的 Python 换行赋值错误
          # ------------------------------------------------

          script = re.sub(
              r'''(?m)^locales_path\s*=\s*\n\s*("src/renderer/src/locales/locales\.js")''',
              r'locales_path = \1',
              script
          )

          script = re.sub(
              r'''(?m)^locales\s*=\s*\n\s*(read\(locales_path\))''',
              r'locales = \1',
              script
          )

          script = re.sub(
              r'''(?m)^locales\s*=\s*\n\s*(locales\.replace\()''',
              r'locales = \1',
              script
          )

          script = re.sub(
              r'''(?ms)^parser\s*=\s*\n\s*read\(\s*"src/main/crawler/plugins/douyin\.js"\s*\)''',
              'parser = read("src/main/crawler/plugins/douyin.js")',
              script
          )

          script = re.sub(
              r'''(?ms)^signer\s*=\s*\n\s*read\(\s*"src/main/crawler/plugins/douyin-abogus\.js"\s*\)''',
              'signer = read("src/main/crawler/plugins/douyin-abogus.js")',
              script
          )

          # ------------------------------------------------
          # Python 语法预检查
          # ------------------------------------------------

          try:
              ast.parse(script)
          except SyntaxError as error:
              print("")
              print("Python patch syntax check failed:")
              print(
                  f"Line {error.lineno}: "
                  f"{error.msg}"
              )

              script_lines = script.splitlines()

              if error.lineno:
                  start_line = max(
                      0,
                      error.lineno - 4
                  )

                  end_line = min(
                      len(script_lines),
                      error.lineno + 3
                  )

                  print("")
                  print("Nearby source:")

                  for number in range(
                      start_line,
                      end_line
                  ):
                      print(
                          f"{number + 1}: "
                          f"{script_lines[number]}"
                      )

              raise

          temp_dir = Path(
              os.environ["RUNNER_TEMP"]
          )

          output_path = (
              temp_dir /
              "douyin_parser_v2_fixed.py"
          )

          output_path.write_text(
              script,
              encoding="utf-8"
          )

          print("")
          print(
              "[OK] V2 Python patch syntax is valid."
          )
          print(
              f"[OK] Fixed patch saved to: "
              f"{output_path}"
          )
          PY

      - name: Create parser V2 test branch
        shell: bash
        run: |
          git fetch origin douyin-login-test

          git switch -C \
            douyin-parser-v2-test \
            origin/douyin-login-test

      - name: Run repaired Douyin V2 patch
        shell: bash
        run: |
          python \
            "$RUNNER_TEMP/douyin_parser_v2_fixed.py"

      - name: Verify patched source files
        shell: bash
        run: |
          test -f \
            src/main/crawler/plugins/douyin-abogus.js

          test -f \
            src/main/crawler/plugins/douyin.js

          test -f \
            src/main/crawler/capture-error.js

          grep -q \
            "generateABogus" \
            src/main/crawler/plugins/douyin-abogus.js

          grep -q \
            "a_bogus" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "pull_datas" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "DOUYIN_RISK_CONTROL" \
            src/main/crawler/plugins/douyin.js

          echo \
            "Douyin V2 source verification passed."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: "npm"

      - name: Show environment
        shell: pwsh
        run: |
          node --version
          npm --version

          Write-Host `
            "Architecture: $env:PROCESSOR_ARCHITECTURE"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Package Windows x64
        run: npx electron-builder --win nsis --x64

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $files = Get-ChildItem `
            -Path "dist" `
            -Filter "*-x64.exe"

          if ($files.Count -eq 0) {
            throw `
              "Windows x64 installer was not generated."
          }

          Write-Host `
            "Generated installer:"

          $files |
            Select-Object `
              Name,
              Length,
              FullName

      - name: Commit tested parser to test branch
        shell: bash
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/main/crawler/plugins/douyin.js \
            src/main/crawler/plugins/douyin-abogus.js \
            src/main/crawler/capture-error.js \
            src/renderer/src/locales/locales.js

          if git diff --cached --quiet; then
            echo \
              "No source changes to commit."
          else
            git commit \
              -m "Fix and upgrade Douyin live parser V2"
          fi

          git push \
            --force \
            origin \
            douyin-parser-v2-test

      - name: Upload Windows x64 test installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-douyin-parser-v2.1-windows-x64
          path: dist/*-x64.exe
          if-no-files-found: error
          retention-days: 7
