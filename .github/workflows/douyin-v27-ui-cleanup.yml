name: Douyin V2.7 Cleanup

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true
        default: "1.1.8"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: douyin-v2.6.2-test
          fetch-depth: 0

      - name: Create test branch
        shell: bash
        run: |
          git switch -C douyin-v2.7-ui-test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Remove preview feature
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')

          function read(path) {
            return fs.readFileSync(path, 'utf8')
          }

          function write(path, text) {
            fs.writeFileSync(path, text, 'utf8')
          }

          // ==================================================
          // main/index.ts
          // ==================================================

          {
            const path = 'src/main/index.ts'
            let text = read(path)

            const nav = text.indexOf(
              'ipcMain.handle(NAV_BY_DEFAULT_BROWSER'
            )

            const previewMarker = text.indexOf(
              'START_STREAM_PREVIEW',
              nav
            )

            const recordMarker = text.indexOf(
              'START_STREAM_RECORD',
              previewMarker
            )

            const previewStart = text.lastIndexOf(
              'ipcMain.handle',
              previewMarker
            )

            const recordStart = text.lastIndexOf(
              'ipcMain.handle',
              recordMarker
            )

            if (
              nav < 0 ||
              previewMarker < 0 ||
              recordMarker < 0 ||
              previewStart < 0 ||
              recordStart <= previewStart
            ) {
              throw new Error(
                'Unable to locate preview IPC block'
              )
            }

            text =
              text.slice(0, previewStart) +
              text.slice(recordStart)

            const lines = text.split(/\r?\n/)
            const result = []

            let skippingPreviewImport = false

            for (let i = 0; i < lines.length; i++) {
              const line = lines[i]

              if (
                !skippingPreviewImport &&
                line.trim() === 'import {'
              ) {
                const next =
                  lines
                    .slice(i, i + 6)
                    .join('\n')

                if (
                  next.includes('startPreviewTranscoder') &&
                  next.includes('preview-transcoder')
                ) {
                  skippingPreviewImport = true
                  continue
                }
              }

              if (skippingPreviewImport) {
                if (
                  line.includes(
                    "from './preview-transcoder'"
                  )
                ) {
                  skippingPreviewImport = false
                }

                continue
              }

              const trimmed = line.trim()

              if (
                trimmed === 'START_STREAM_PREVIEW,' ||
                trimmed === 'STOP_STREAM_PREVIEW,'
              ) {
                continue
              }

              if (
                line.includes(
                  'stopPreviewTranscoder()'
                )
              ) {
                continue
              }

              result.push(line)
            }

            write(
              path,
              result.join('\n')
            )
          }

          // ==================================================
          // const.ts
          // ==================================================

          {
            const path = 'src/const.ts'

            const text =
              read(path)
                .split(/\r?\n/)
                .filter(
                  line =>
                    !line.includes(
                      'START_STREAM_PREVIEW'
                    ) &&
                    !line.includes(
                      'STOP_STREAM_PREVIEW'
                    )
                )
                .join('\n')

            write(path, text)
          }

          // ==================================================
          // preload/index.ts
          // ==================================================

          {
            const path = 'src/preload/index.ts'
            let text = read(path)

            const start =
              text.indexOf(
                'startStreamPreview:'
              )

            if (start >= 0) {
              const end =
                text.indexOf(
                  'navByDefaultBrowser:',
                  start
                )

              if (end < 0) {
                throw new Error(
                  'Unable to remove preload preview'
                )
              }

              const lineStart =
                text.lastIndexOf(
                  '\n',
                  start
                ) + 1

              text =
                text.slice(0, lineStart) +
                text.slice(end)
            }

            text =
              text
                .split(/\r?\n/)
                .filter(
                  line =>
                    !line.includes(
                      'START_STREAM_PREVIEW'
                    ) &&
                    !line.includes(
                      'STOP_STREAM_PREVIEW'
                    )
                )
                .join('\n')

            write(path, text)
          }

          // ==================================================
          // preload/index.d.ts
          // ==================================================

          {
            const path = 'src/preload/index.d.ts'
            let text = read(path)

            const start =
              text.indexOf(
                'startStreamPreview:'
              )

            if (start >= 0) {
              const end =
                text.indexOf(
                  'startStreamRecord:',
                  start
                )

              if (end < 0) {
                throw new Error(
                  'Unable to remove preview types'
                )
              }

              const lineStart =
                text.lastIndexOf(
                  '\n',
                  start
                ) + 1

              text =
                text.slice(0, lineStart) +
                text.slice(end)
            }

            write(path, text)
          }

          // ==================================================
          // OperationBar.tsx
          // ==================================================

          {
            const path =
              'src/renderer/src/components/StreamConfigList/components/OperationBar.tsx'

            let text = read(path)

            text =
              text
                .split(/\r?\n/)
                .filter(line => {
                  return (
                    !line.includes(
                      'StreamPreviewDialog'
                    ) &&
                    !line.includes(
                      'darkPreviewIcon'
                    ) &&
                    !line.includes(
                      'lightPreviewIcon'
                    ) &&
                    !line.includes(
                      '[isLoadingPreview'
                    ) &&
                    !line.includes(
                      '[previewOpen'
                    ) &&
                    !line.includes(
                      '[previewUrl'
                    ) &&
                    !line.includes(
                      '[previewType'
                    )
                  )
                })
                .join('\n')

            text = text.replace(
              /\s*errorCodeToI18nMessage,?/,
              ''
            )

            const previewFunctions =
              text.indexOf(
                '  const handlePreviewOpenChange'
              )

            if (previewFunctions >= 0) {
              const nextEffect =
                text.indexOf(
                  '  useEffect(() => {',
                  previewFunctions
                )

              if (nextEffect < 0) {
                throw new Error(
                  'Preview function end not found'
                )
              }

              text =
                text.slice(
                  0,
                  previewFunctions
                ) +
                text.slice(nextEffect)
            }

            const previewButton =
              text.indexOf(
                '        {!isLoadingPreview && ('
              )

            if (previewButton >= 0) {
              const statusButton =
                text.indexOf(
                  '        {streamConfig.status === StreamStatus.NOT_STARTED ? (',
                  previewButton
                )

              if (statusButton < 0) {
                throw new Error(
                  'Status button not found'
                )
              }

              text =
                text.slice(
                  0,
                  previewButton
                ) +
                text.slice(
                  statusButton
                )
            }

            const previewDialog =
              text.indexOf(
                '      <StreamPreviewDialog'
              )

            if (previewDialog >= 0) {
              const configSheet =
                text.indexOf(
                  '<StreamConfigSheet',
                  previewDialog
                )

              if (configSheet < 0) {
                throw new Error(
                  'Config sheet not found'
                )
              }

              text =
                text.slice(
                  0,
                  previewDialog
                ) +
                '      ' +
                text.slice(
                  configSheet
                )
            }

            text =
              text.replace(
                'className="flex absolute right-0 gap-2"',
                'className="flex shrink-0 items-center gap-2 rounded-lg border bg-background p-1.5 shadow-sm"'
              )

            write(path, text)
          }

          console.log(
            'Preview removal finished.'
          )
          NODE

      - name: Remove preview files
        shell: bash
        run: |
          rm -f src/main/preview-transcoder.ts
          rm -f src/main/preview-proxy.ts
          rm -f src/renderer/src/components/StreamPreviewDialog.tsx
          rm -f src/renderer/src/assets/images/dark/preview.svg
          rm -f src/renderer/src/assets/images/light/preview.svg

      - name: Remove preview dependencies
        shell: bash
        run: |
          npm uninstall hls.js mpegts.js

      - name: Optimize layout
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')

          function replace(path, before, after) {
            let text =
              fs.readFileSync(
                path,
                'utf8'
              )

            text =
              text.replace(
                before,
                after
              )

            fs.writeFileSync(
              path,
              text,
              'utf8'
            )
          }

          replace(
            'src/renderer/src/components/StreamConfigList/StreamConfigList.tsx',

            'show-scrollbar flex flex-col gap-[12px] p-[24px] overflow-y-auto h-[calc(100vh-80px)]',

            'show-scrollbar mx-auto flex h-[calc(100vh-80px)] w-full max-w-[1100px] flex-col gap-3 overflow-y-auto px-5 py-4'
          )

          replace(
            'src/renderer/src/components/StreamConfigSheet.tsx',

            'form className="space-y-8"',

            'form className="space-y-5"'
          )

          replace(
            'src/renderer/src/components/NavBar/components/DefaultSettingSheet.tsx',

            'form className="space-y-8"',

            'form className="space-y-5"'
          )

          console.log(
            'Layout optimization finished.'
          )
          NODE

      - name: Update version
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          npm version "$APP_VERSION" --no-git-tag-version

      - name: Verify removal
        shell: bash
        run: |
          LEFTOVERS="$(grep -R -n -E \
          'START_STREAM_PREVIEW|STOP_STREAM_PREVIEW|startStreamPreview|stopStreamPreview|startPreviewTranscoder|stopPreviewTranscoder|StreamPreviewDialog|darkPreviewIcon|lightPreviewIcon|preview-transcoder|preview-proxy' \
          src || true)"

          if [ -n "$LEFTOVERS" ]; then
            echo "$LEFTOVERS"
            exit 1
          fi

          echo "Preview removed."

      - name: Verify core files
        shell: bash
        run: |
          grep -q "ipcMain" src/main/index.ts
          grep -q "BrowserWindow" src/main/index.ts
          grep -q "START_STREAM_RECORD" src/main/index.ts
          grep -q "recordStreamFfmpegProcessMap" src/main/index.ts
          grep -q "downloadReq" src/main/index.ts
          grep -q "videoCodec('copy')" src/main/ffmpeg/record.ts
          grep -q "audioCodec('copy')" src/main/ffmpeg/record.ts
          grep -q "getQualityRank" src/main/crawler/plugins/douyin.js
          grep -q "autoRecord: boolean" type.d.ts

      - name: TypeScript check
        shell: bash
        run: npm run typecheck

      - name: Build
        shell: bash
        run: npm run build

      - name: Package Windows
        shell: bash
        run: |
          npx electron-builder \
            --win \
            nsis \
            --x64 \
            --publish never

      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -Filter "*-x64.exe"

          if (-not $files) {
            throw "Installer not found"
          }

          $files |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Commit test branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit \
            -m "Remove preview and clean V2.7 UI" \
            || true

          git push \
            --force \
            origin \
            douyin-v2.7-ui-test

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-${{ inputs.version }}-v2.7-windows-x64
          path: dist/*-x64.exe
          if-no-files-found: error
          retention-days: 7
