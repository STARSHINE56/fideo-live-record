name: Douyin V2.7 UI Cleanup

on:
  workflow_dispatch:
    inputs:
      version:
        description: "测试版本号，例如 1.1.8"
        required: true
        default: "1.1.8"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Remove Preview And Optimize UI
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout V2.6.2 source
        uses: actions/checkout@v4
        with:
          ref: douyin-v2.6.2-test
          fetch-depth: 0

      - name: Create V2.7 test branch
        run: |
          git switch -C douyin-v2.7-ui-test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      - name: Remove preview feature
        run: |
          cat > "$RUNNER_TEMP/remove-preview.cjs" <<'NODE'
          const fs = require('fs')

          const read = (p) =>
            fs.readFileSync(p, 'utf8')

          const write = (p, s) =>
            fs.writeFileSync(p, s, 'utf8')

          // const.ts
          {
            const p = 'src/const.ts'
            let s = read(p)

            s = s
              .replace(
                /^\s*export const START_STREAM_PREVIEW = 'START_STREAM_PREVIEW'\s*$/gm,
                ''
              )
              .replace(
                /^\s*export const STOP_STREAM_PREVIEW = 'STOP_STREAM_PREVIEW'\s*$/gm,
                ''
              )

            write(p, s)
          }

          // main/index.ts
          {
            const p = 'src/main/index.ts'
            let s = read(p)

            s = s
              .replace(
                /^\s*START_STREAM_PREVIEW,\s*$/gm,
                ''
              )
              .replace(
                /^\s*STOP_STREAM_PREVIEW,\s*$/gm,
                ''
              )
              .replace(
                /\s*import\s*\{\s*startPreviewTranscoder,\s*stopPreviewTranscoder\s*\}\s*from\s*['"]\.\/preview-transcoder['"]\s*/m,
                '\n'
              )

            s = s.replace(
              /\s*ipcMain\.handle\(\s*START_STREAM_PREVIEW,[\s\S]*?ipcMain\.handle\(\s*STOP_STREAM_PREVIEW,[\s\S]*?\n\s*\)\s*\n(?=\s*ipcMain\.handle\(START_STREAM_RECORD)/m,
              '\n'
            )

            s = s
              .replace(
                /^\s*void stopPreviewTranscoder\(\)\s*$/gm,
                ''
              )
              .replace(
                /^\s*await stopPreviewTranscoder\(\)\s*$/gm,
                ''
              )

            write(p, s)
          }

          // preload/index.ts
          {
            const p = 'src/preload/index.ts'
            let s = read(p)

            s = s
              .replace(
                /^\s*START_STREAM_PREVIEW,\s*$/gm,
                ''
              )
              .replace(
                /^\s*STOP_STREAM_PREVIEW,\s*$/gm,
                ''
              )

            const start =
              s.indexOf(
                'startStreamPreview:'
              )

            const end =
              s.indexOf(
                'navByDefaultBrowser:',
                start
              )

            if (
              start >= 0 &&
              end > start
            ) {
              const lineStart =
                s.lastIndexOf(
                  '\n',
                  start
                ) + 1

              s =
                s.slice(
                  0,
                  lineStart
                ) +
                s.slice(
                  end
                )
            }

            write(p, s)
          }

          // preload/index.d.ts
          {
            const p =
              'src/preload/index.d.ts'

            let s =
              read(p)

            const start =
              s.indexOf(
                'startStreamPreview:'
              )

            const end =
              s.indexOf(
                'startStreamRecord:',
                start
              )

            if (
              start >= 0 &&
              end > start
            ) {
              const lineStart =
                s.lastIndexOf(
                  '\n',
                  start
                ) + 1

              s =
                s.slice(
                  0,
                  lineStart
                ) +
                s.slice(
                  end
                )
            }

            write(p, s)
          }

          // OperationBar
          {
            const p =
              'src/renderer/src/components/StreamConfigList/components/OperationBar.tsx'

            let s =
              read(p)

            s = s
              .replace(
                /^import StreamPreviewDialog.*\n/gm,
                ''
              )
              .replace(
                /^import darkPreviewIcon.*\n/gm,
                ''
              )
              .replace(
                /^import lightPreviewIcon.*\n/gm,
                ''
              )
              .replace(
                /^\s*const \[isLoadingPreview, setIsLoadingPreview\].*\n/gm,
                ''
              )
              .replace(
                /^\s*const \[previewOpen, setPreviewOpen\].*\n/gm,
                ''
              )
              .replace(
                /^\s*const \[previewUrl, setPreviewUrl\].*\n/gm,
                ''
              )
              .replace(
                /^\s*const \[previewType, setPreviewType\].*\n/gm,
                ''
              )

            const previewStart =
              s.indexOf(
                '  const handlePreviewOpenChange = ('
              )

            const previewEnd =
              s.indexOf(
                '  useEffect(() => {',
                previewStart
              )

            if (
              previewStart >= 0 &&
              previewEnd > previewStart
            ) {
              s =
                s.slice(
                  0,
                  previewStart
                ) +
                s.slice(
                  previewEnd
                )
            }

            s = s.replace(
              /\s*\{!isLoadingPreview && \([\s\S]*?\{isLoadingPreview && \([\s\S]*?\)\}\s*/m,
              '\n'
            )

            s = s.replace(
              /\s*<StreamPreviewDialog[\s\S]*?\/>\s*/m,
              '\n'
            )

            s = s.replace(
              'className="flex absolute right-0 gap-2"',
              'className="flex shrink-0 items-center gap-1 rounded-lg border bg-background/80 p-1 shadow-sm"'
            )

            // UNKNOWN_CODE 不再重置开播提醒状态
            s = s.replace(
              /if \(\s*result\.code ===\s*CRAWLER_ERROR_CODE\.NOT_URLS \|\|\s*result\.code ===\s*UNKNOWN_CODE\s*\) \{\s*liveNotifiedRef\.current =\s*false\s*scheduleMonitorOnly\(\)\s*return\s*\}/m,
              `if (
                result.code ===
                CRAWLER_ERROR_CODE.NOT_URLS
              ) {
                liveNotifiedRef.current =
                  false

                scheduleMonitorOnly()

                return
              }

              if (
                result.code ===
                UNKNOWN_CODE
              ) {
                scheduleMonitorOnly()

                return
              }`
            )

            write(p, s)
          }

          console.log(
            'Preview feature removed.'
          )
          NODE

          node "$RUNNER_TEMP/remove-preview.cjs"

      - name: Rewrite status progress
        run: |
          cat > src/renderer/src/components/StreamConfigList/components/Progress.tsx <<'TS'
          import {
            StreamStatus
          } from '@renderer/lib/utils'

          export default function Progress(
            {
              status
            }: {
              status: number
            }
          ) {
            if (
              status ===
              StreamStatus.NOT_STARTED
            ) {
              return (
                <div className="h-1.5 w-full rounded-full bg-muted" />
              )
            }

            if (
              status ===
              StreamStatus.MONITORING
            ) {
              return (
                <div className="relative h-1.5 w-full overflow-hidden rounded-full bg-blue-500/15">
                  <div className="absolute left-[2px] top-0 h-full w-[48px] rounded-full bg-blue-500 animate-progress" />
                </div>
              )
            }

            if (
              status ===
              StreamStatus.PREPARING_TO_RECORD
            ) {
              return (
                <div className="h-1.5 w-full overflow-hidden rounded-full bg-amber-500/15">
                  <div className="h-full w-1/3 animate-pulse rounded-full bg-amber-500" />
                </div>
              )
            }

            if (
              status ===
              StreamStatus.RECORDING
            ) {
              return (
                <div className="h-1.5 w-full overflow-hidden rounded-full bg-red-500/15">
                  <div className="h-full w-full animate-pulse rounded-full bg-red-500" />
                </div>
              )
            }

            return (
              <div className="h-1.5 w-full overflow-hidden rounded-full bg-purple-500/15">
                <div className="h-full w-3/4 animate-pulse rounded-full bg-purple-500" />
              </div>
            )
          }
          TS

      - name: Rewrite stream card
        run: |
          cat > src/renderer/src/components/StreamConfigList/components/StreamConfigCard.tsx <<'TS'
          import {
            useTranslation
          } from 'react-i18next'

          import {
            Card,
            CardContent,
            CardDescription,
            CardTitle,
            CardHeader
          } from '@/shadcn/ui/card'

          import {
            Badge
          } from '@/shadcn/ui/badge'

          import {
            MoveCardDropdownMenu
          } from './MoveCardDropDownMenu'

          import Progress from './Progress'
          import OperationBar from './OperationBar'

          import {
            useFfmpegProgressInfoStore
          } from '@renderer/store/useFfmpegProgressInfoStore'

          import {
            useNavSelectedStatusStore
          } from '@renderer/store/useNavSelectedStatusStore'

          interface StreamConfigCardProps {
            streamConfig: IStreamConfig
          }

          const statusLocale:
            Record<number, string> = {
              0:
                'stream_config.not_started',

              1:
                'stream_config.preparing_to_record',

              2:
                'stream_config.monitoring',

              3:
                'stream_config.recording',

              4:
                'stream_config.video_format_conversion'
            }

          const statusStyle:
            Record<number, string> = {
              0:
                'border-border bg-muted/50 text-muted-foreground',

              1:
                'border-amber-300 bg-amber-50 text-amber-700 dark:border-amber-800 dark:bg-amber-950/40 dark:text-amber-300',

              2:
                'border-blue-300 bg-blue-50 text-blue-700 dark:border-blue-800 dark:bg-blue-950/40 dark:text-blue-300',

              3:
                'border-red-300 bg-red-50 text-red-700 dark:border-red-800 dark:bg-red-950/40 dark:text-red-300',

              4:
                'border-purple-300 bg-purple-50 text-purple-700 dark:border-purple-800 dark:bg-purple-950/40 dark:text-purple-300'
            }

          function formatSize(
            targetSize?: number
          ) {
            if (!targetSize) {
              return '--'
            }

            return (
              (
                targetSize /
                1024
              ).toFixed(1) +
              ' MB'
            )
          }

          export default function StreamConfigCard(
            {
              streamConfig
            }: StreamConfigCardProps
          ) {
            const {
              t
            } =
              useTranslation()

            const ffmpegProgressInfo =
              useFfmpegProgressInfoStore(
                (
                  state
                ) =>
                  state.ffmpegProgressInfo
              )

            const navSelectedStatus =
              useNavSelectedStatusStore(
                (
                  state
                ) =>
                  state.navSelectedStatus
              )

            const progress =
              ffmpegProgressInfo[
                streamConfig.id
              ]

            return (
              <Card className="stream-card overflow-hidden border bg-card/95 shadow-sm">
                <CardHeader className="space-y-3 pb-4">
                  <div className="flex min-w-0 items-start justify-between gap-4">
                    <div className="min-w-0 flex-1">
                      <div className="flex min-w-0 flex-wrap items-center gap-2">
                        <CardTitle
                          id={
                            streamConfig.id
                          }
                          className="max-w-full truncate text-base font-semibold leading-6"
                        >
                          {
                            streamConfig.title
                          }
                        </CardTitle>

                        <Badge
                          variant="outline"
                          className={
                            statusStyle[
                              streamConfig.status
                            ] ||
                            statusStyle[
                              0
                            ]
                          }
                        >
                          {t(
                            statusLocale[
                              streamConfig.status
                            ] ||
                              statusLocale[
                                0
                              ]
                          )}
                        </Badge>

                        <Badge
                          variant="outline"
                          className={
                            streamConfig.autoRecord
                              ? 'border-emerald-300 bg-emerald-50 text-emerald-700 dark:border-emerald-800 dark:bg-emerald-950/40 dark:text-emerald-300'
                              : 'border-sky-300 bg-sky-50 text-sky-700 dark:border-sky-800 dark:bg-sky-950/40 dark:text-sky-300'
                          }
                        >
                          {streamConfig.autoRecord
                            ? t(
                                'stream_config.auto_record'
                              )
                            : t(
                                'stream_config.notify_only'
                              )}
                        </Badge>
                      </div>

                      <CardDescription className="mt-2 flex min-w-0 items-center gap-1 text-xs">
                        <span className="shrink-0">
                          {t(
                            'stream_config.room_url'
                          )}
                          :
                        </span>

                        <button
                          type="button"
                          onClick={
                            () =>
                              window.api.navByDefaultBrowser(
                                streamConfig.roomUrl
                              )
                          }
                          className="min-w-0 truncate text-left underline underline-offset-2 hover:text-foreground"
                        >
                          {
                            streamConfig.roomUrl
                          }
                        </button>
                      </CardDescription>
                    </div>

                    <OperationBar
                      streamConfig={
                        streamConfig
                      }
                    />
                  </div>
                </CardHeader>

                <CardContent className="space-y-3 pt-0">
                  <Progress
                    status={
                      streamConfig.status
                    }
                  />

                  <div className="flex min-h-[28px] flex-wrap items-center justify-between gap-x-5 gap-y-2 text-xs text-muted-foreground">
                    <div className="flex flex-wrap items-center gap-5">
                      <span>
                        ⏱{' '}
                        {
                          progress?.timemark ||
                          '--:--:--'
                        }
                      </span>

                      {(streamConfig.segmentTime ===
                        '0' ||
                        streamConfig.segmentTime ===
                          '') && (
                        <span>
                          ◫{' '}
                          {formatSize(
                            progress?.targetSize
                          )}
                        </span>
                      )}

                      <span>
                        ⟳{' '}
                        {
                          streamConfig.interval
                        }
                        s
                      </span>
                    </div>

                    {navSelectedStatus ===
                      '-1' && (
                      <MoveCardDropdownMenu
                        streamConfig={
                          streamConfig
                        }
                      />
                    )}
                  </div>
                </CardContent>
              </Card>
            )
          }
          TS

      - name: Rewrite navigation bar
        run: |
          cat > src/renderer/src/components/NavBar/NavBar.tsx <<'TS'
          import {
            useState
          } from 'react'

          import {
            useTranslation
          } from 'react-i18next'

          import Theme from '@/components/NavBar/components/Theme'
          import UseThemeIcon from '@/components/UseThemeIcon'
          import StreamConfigSheet from '@/components/StreamConfigSheet'
          import DefaultSettingSheet from './components/DefaultSettingSheet'

          import darkAddIcon from '@/assets/images/dark/add.svg'
          import lightAddIcon from '@/assets/images/light/add.svg'

          import darkSettingIcon from '@/assets/images/dark/setting.svg'
          import lightSettingIcon from '@/assets/images/light/setting.svg'

          import darkLogo from '@/assets/images/dark/logo.png'
          import lightLogo from '@/assets/images/light/logo.png'

          import darkQQIcon from '@/assets/images/dark/qq.svg'
          import lightQQIcon from '@/assets/images/light/qq.svg'

          import darkDiscordIcon from '@/assets/images/dark/discord.svg'
          import lightDiscordIcon from '@/assets/images/light/discord.svg'

          import {
