      - name: Rewrite stream list layout
        run: |
          cat > src/renderer/src/components/StreamConfigList/StreamConfigList.tsx <<'TS'
          import {
            useMemo
          } from 'react'

          import {
            useMount
          } from 'react-use'

          import {
            useTranslation
          } from 'react-i18next'

          import StreamConfigCard from './components/StreamConfigCard'

          import {
            SUCCESS_CODE,
            FFMPEG_ERROR_CODE,
            errorCodeToI18nMessage,
            UNKNOWN_CODE
          } from '../../../../code'

          import emitter from '@/lib/bus'

          import {
            RECORD_END_NOT_USER_STOP
          } from '../../../../const'

          import {
            useStreamConfigStore
          } from '@/store/useStreamConfigStore'

          import {
            useDefaultSettingsStore
          } from '@renderer/store/useDefaultSettingsStore'

          import {
            useNavSelectedStatusStore
          } from '@renderer/store/useNavSelectedStatusStore'

          import {
            useFfmpegProgressInfoStore
          } from '@/store/useFfmpegProgressInfoStore'

          import {
            StreamStatus,
            useXizhiToPushNotification
          } from '@renderer/lib/utils'

          import {
            useToast
          } from '@renderer/hooks/useToast'

          const unknownErrorRetryTimesMap:
            Record<string, number> = {}

          const maxRetryTimes =
            3

          const alreadyCallbackOneTimeSet =
            new Set<string>()

          export default function StreamConfigList() {
            const {
              t
            } =
              useTranslation()

            const {
              toast
            } =
              useToast()

            const navSelectedStatus =
              useNavSelectedStatusStore(
                (
                  state
                ) =>
                  state.navSelectedStatus
              )

            const streamConfigList =
              useStreamConfigStore(
                (
                  state
                ) =>
                  state.streamConfigList
              )

            const {
              updateFfmpegProgressInfo
            } =
              useFfmpegProgressInfoStore(
                (
                  state
                ) =>
                  state
              )

            const filteredList =
              useMemo(
                () => {
                  if (
                    navSelectedStatus ===
                    '-1'
                  ) {
                    return streamConfigList
                  }

                  return streamConfigList.filter(
                    (
                      item
                    ) =>
                      item.status ===
                      Number(
                        navSelectedStatus
                      )
                  )
                },

                [
                  streamConfigList,
                  navSelectedStatus
                ]
              )

            const monitoringCount =
              streamConfigList.filter(
                (
                  item
                ) =>
                  item.status ===
                  StreamStatus.MONITORING
              ).length

            const recordingCount =
              streamConfigList.filter(
                (
                  item
                ) =>
                  item.status ===
                  StreamStatus.RECORDING
              ).length

            useMount(
              () => {
                window.api.onFFmpegProgressInfo(
                  (
                    progressInfo
                  ) => {
                    updateFfmpegProgressInfo(
                      progressInfo
                    )
                  }
                )

                window.api.onStreamRecordEnd(
                  async (
                    id,
                    code,
                    errMsg
                  ) => {
                    const {
                      streamConfigList,
                      updateStreamConfig
                    } =
                      useStreamConfigStore
                        .getState()

                    const xiZhiKey =
                      useDefaultSettingsStore
                        .getState()
                        .defaultSettingsConfig
                        .xizhiKey

                    const index =
                      streamConfigList
                        .findIndex(
                          (
                            streamConfig
                          ) =>
                            streamConfig.id ===
                            id
                        )

                    if (
                      index ===
                      -1
                    ) {
                      return
                    }

                    const streamConfig =
                      streamConfigList[
                        index
                      ]

                    const isStopByUser =
                      code ===
                      FFMPEG_ERROR_CODE.USER_KILL_PROCESS

                    const isStopByStreamEnd =
                      code ===
                      SUCCESS_CODE

                    const isStopByResolutionChange =
                      code ===
                      FFMPEG_ERROR_CODE.RESOLUTION_CHANGE

                    let message =
                      ''

                    if (
                      isStopByUser
                    ) {
                      message =
                        'user_stop_record'
                    }

                    if (
                      isStopByStreamEnd
                    ) {
                      message =
                        'stream_end_stop_record'
                    }

                    if (
                      isStopByUser &&
                      (
                        streamConfig.status ===
                          StreamStatus.PREPARING_TO_RECORD ||
                        streamConfig.status ===
                          StreamStatus.MONITORING
                      )
                    ) {
                      await updateStreamConfig(
                        {
                          ...streamConfig,

                          status:
                            StreamStatus.NOT_STARTED
                        },

                        streamConfig.id
                      )

                      toast({
                        title:
                          streamConfig.title,

                        description:
                          code ===
                          UNKNOWN_CODE
                            ? t(
                                message
                              ) +
                              String(
                                errMsg ||
                                  ''
                              )
                            : t(
                                message
                              )
                      })

                      return
                    }

                    if (
                      !alreadyCallbackOneTimeSet.has(
                        id
                      )
                    ) {
                      alreadyCallbackOneTimeSet.add(
                        id
                      )

                      if (
                        streamConfig.status ===
                          StreamStatus.RECORDING &&
                        streamConfig.convertToMP4
                      ) {
                        await updateStreamConfig(
                          {
                            ...streamConfig,

                            status:
                              StreamStatus.VIDEO_FORMAT_CONVERSION
                          },

                          streamConfig.id
                        )
                      }

                      return
                    }

                    alreadyCallbackOneTimeSet.delete(
                      id
                    )

                    unknownErrorRetryTimesMap[
                      id
                    ] =
                      unknownErrorRetryTimesMap[
                        id
                      ] ||
                      0

                    unknownErrorRetryTimesMap[
                      id
                    ] +=
                      1

                    if (
                      !message
                    ) {
                      message =
                        errorCodeToI18nMessage(
                          code,
                          'error.stop_record.'
                        )
                    }

                    const description =
                      code ===
                      UNKNOWN_CODE
                        ? t(
                            message
                          ) +
                          String(
                            errMsg ||
                              ''
                          )
                        : t(
                            message
                          )

                    toast({
                      title:
                        streamConfig.title,

                      description
                    })

                    if (
                      !isStopByUser &&
                      xiZhiKey
                    ) {
                      useXizhiToPushNotification({
                        key:
                          xiZhiKey,

                        title:
                          streamConfig.title,

                        content:
                          description
                      })
                    }

                    await updateStreamConfig(
                      {
                        ...streamConfig,

                        status:
                          StreamStatus.NOT_STARTED
                      },

                      streamConfig.id
                    )

                    if (
                      isStopByUser ||
                      unknownErrorRetryTimesMap[
                        id
                      ] >=
                        maxRetryTimes
                    ) {
                      unknownErrorRetryTimesMap[
                        id
                      ] =
                        0

                      return
                    }

                    if (
                      isStopByResolutionChange ||
                      isStopByStreamEnd
                    ) {
                      unknownErrorRetryTimesMap[
                        id
                      ] =
                        0
                    }

                    emitter.emit(
                      RECORD_END_NOT_USER_STOP,

                      streamConfig.id
                    )
                  }
                )
              }
            )

            return (
              <main className="show-scrollbar h-full overflow-y-auto px-5 pb-6 pt-4">
                <div className="mx-auto w-full max-w-[1100px]">
                  <div className="mb-4 flex flex-wrap items-center justify-between gap-3">
                    <div className="flex flex-wrap items-center gap-2 text-xs text-muted-foreground">
                      <div className="rounded-full border bg-background px-3 py-1.5">
                        {t(
                          'stream_config.all'
                        )}
                        {' '}
                        <strong className="text-foreground">
                          {
                            streamConfigList.length
                          }
                        </strong>
                      </div>

                      <div className="rounded-full border border-blue-200 bg-blue-50 px-3 py-1.5 text-blue-700 dark:border-blue-900 dark:bg-blue-950/30 dark:text-blue-300">
                        {t(
                          'stream_config.monitoring'
                        )}
                        {' '}
                        <strong>
                          {
                            monitoringCount
                          }
                        </strong>
                      </div>

                      <div className="rounded-full border border-red-200 bg-red-50 px-3 py-1.5 text-red-700 dark:border-red-900 dark:bg-red-950/30 dark:text-red-300">
                        {t(
                          'stream_config.recording'
                        )}
                        {' '}
                        <strong>
                          {
                            recordingCount
                          }
                        </strong>
                      </div>
                    </div>
                  </div>

                  {filteredList.length >
                  0 ? (
                    <div className="flex flex-col gap-3">
                      {filteredList.map(
                        (
                          streamConfig
                        ) => (
                          <StreamConfigCard
                            key={
                              streamConfig.id
                            }
                            streamConfig={
                              streamConfig
                            }
                          />
                        )
                      )}
                    </div>
                  ) : (
                    <div className="flex min-h-[280px] flex-col items-center justify-center rounded-xl border border-dashed bg-background/60 px-6 text-center">
                      <div className="mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-muted text-xl">
                        ●
                      </div>

                      <div className="font-medium">
                        {t(
                          'stream_config.no_tasks'
                        )}
                      </div>

                      <div className="mt-1 text-sm text-muted-foreground">
                        {t(
                          'nav_bar.create'
                        )}
                      </div>
                    </div>
                  )}
                </div>
              </main>
            )
          }
          TS

