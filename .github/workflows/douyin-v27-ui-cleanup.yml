          TS

      - name: Apply robust global UI cleanup
        run: |
          cat > "$RUNNER_TEMP/ui-cleanup.cjs" <<'NODE'
          const fs =
            require('fs')

          const read =
            (
              p
            ) =>
              fs.readFileSync(
                p,
                'utf8'
              )

          const write =
            (
              p,
              s
            ) =>
              fs.writeFileSync(
                p,
                s,
                'utf8'
              )

          // App.tsx
          {
            const p =
              'src/renderer/src/App.tsx'

            let s =
              read(p)

            const layoutPattern =
              /<TitleBar\s*\/>\s*<NavBar\s*\/>\s*<StreamConfigList\s*\/>\s*<Toaster\s*\/>/m

            if (
              !layoutPattern.test(
                s
              )
            ) {
              throw new Error(
                'App layout target not found after regex scan'
              )
            }

            s =
              s.replace(
                layoutPattern,

                `<div className="flex h-screen flex-col overflow-hidden bg-muted/20">
                  <div className="shrink-0 bg-background">
                    <TitleBar />
                  </div>

                  <div className="shrink-0 border-b bg-background/95">
                    <NavBar />
                  </div>

                  <div className="min-h-0 flex-1">
                    <StreamConfigList />
                  </div>
                </div>

                <Toaster />`
              )

            write(
              p,
              s
            )
          }

          // StreamConfigList 主滚动区
          {
            const p =
              'src/renderer/src/components/StreamConfigList/StreamConfigList.tsx'

            let s =
              read(p)

            s =
              s.replace(
                'show-scrollbar flex flex-col gap-[12px] p-[24px] overflow-y-auto h-[calc(100vh-80px)]',

                'show-scrollbar mx-auto flex h-full w-full max-w-[1100px] flex-col gap-3 overflow-y-auto px-5 pb-6 pt-4'
              )

            write(
              p,
              s
            )
          }

          // 两个 Sheet
          for (
            const p of [
              'src/renderer/src/components/StreamConfigSheet.tsx',

              'src/renderer/src/components/NavBar/components/DefaultSettingSheet.tsx'
            ]
          ) {
            let s =
              read(p)

            s =
              s
                .replace(
                  'SheetContent className="flex flex-col"',

                  'SheetContent className="flex w-[440px] flex-col sm:max-w-[440px]"'
                )
                .replace(
                  'form className="space-y-8"',

                  'form className="space-y-5"'
                )
                .replace(
                  'className="show-scrollbar overflow-y-auto mr-[-14px]"',

                  'className="show-scrollbar min-h-0 flex-1 overflow-y-auto pr-1"'
                )
                .replace(
                  'className=" pl-1 pr-4 pb-2"',

                  'className="px-1 pb-3 pr-3"'
                )

            write(
              p,
              s
            )
          }

          // locales
          {
            const p =
              'src/renderer/src/locales/locales.js'

            let s =
              read(p)

            if (
              !s.includes(
                "notify_only: 'Notify only'"
              )
            ) {
              s =
                s.replace(
                  /all:\s*'All',/,

                  "all: 'All',\n      notify_only: 'Notify only',"
                )
            }

            if (
              !s.includes(
                "notify_only: '仅通知'"
              )
            ) {
              s =
                s.replace(
                  /all:\s*'全部',/,

                  "all: '全部',\n      notify_only: '仅通知',"
                )
            }

            s =
              s
                .replace(
                  /^\s*preview:\s*'.*?',\s*$/gm,
                  ''
                )
                .replace(
                  /^\s*preview_failed:\s*'.*?',\s*$/gm,
                  ''
                )
                .replace(
                  /^\s*preview_hls_unavailable:\s*'.*?',\s*$/gm,
                  ''
                )
                .replace(
                  /^\s*preview_stream_unavailable:\s*'.*?',\s*$/gm,
                  ''
                )

            write(
              p,
              s
            )
          }

          // CSP 恢复，无需 localhost 预览权限
          {
            const p =
              'src/renderer/index.html'

            let s =
              read(p)

            s =
              s.replace(
                /content="default-src[^"]+"/,

                `content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.xunhupay.com; connect-src 'self' https://xizhi.qqoq.net https:;"`
              )

            write(
              p,
              s
            )
          }

          console.log(
            'Robust UI cleanup complete.'
          )
          NODE

          node "$RUNNER_TEMP/ui-cleanup.cjs"

      - name: Improve global CSS
        run: |
          cat >> src/renderer/src/assets/css/globals.css <<'CSS'

          body {
            overflow: hidden;
          }

          .stream-card {
            transition:
              border-color 160ms ease,
              box-shadow 160ms ease;
          }

          .stream-card:hover {
            box-shadow:
              0 6px 22px
              rgba(0, 0, 0, 0.06);
          }

          .dark .stream-card:hover {
            box-shadow:
              0 6px 22px
              rgba(0, 0, 0, 0.22);
          }
          CSS

      - name: Remove preview dependencies
        run: |
          npm uninstall \
            hls.js \
            mpegts.js

      - name: Remove preview source files
        run: |
          rm -f \
            src/main/preview-transcoder.ts \
            src/main/preview-proxy.ts \
            src/renderer/src/components/StreamPreviewDialog.tsx \
            src/renderer/src/assets/images/dark/preview.svg \
            src/renderer/src/assets/images/light/preview.svg

      - name: Update version
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          npm version \
            "$APP_VERSION" \
            --no-git-tag-version

      - name: Verify preview removed
        run: |
          if grep -R \
            -E \
            "START_STREAM_PREVIEW|STOP_STREAM_PREVIEW|startStreamPreview|stopStreamPreview|StreamPreviewDialog|preview-transcoder|preview-proxy" \
            src
          then
            echo "ERROR: Preview code still exists."
            exit 1
          fi

          node - <<'NODE'
          const pkg =
            require('./package.json')

          if (
            pkg.dependencies?.['hls.js']
          ) {
            throw new Error(
              'hls.js still exists'
            )
          }

          if (
            pkg.dependencies?.['mpegts.js']
          ) {
            throw new Error(
              'mpegts.js still exists'
            )
          }

          console.log(
            'Preview dependencies removed.'
          )
          NODE

      - name: Verify UI and core functions
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          grep -q \
            "notify_only" \
            src/renderer/src/locales/locales.js

          grep -q \
            "stream-card" \
            src/renderer/src/components/StreamConfigList/components/StreamConfigCard.tsx

          grep -q \
            'SelectItem value="0"' \
            src/renderer/src/components/NavBar/NavBar.tsx

          grep -q \
            'SelectItem value="4"' \
            src/renderer/src/components/NavBar/NavBar.tsx

          grep -q \
            "handleMonitorOnly" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          grep -q \
            "autoRecord: boolean" \
            type.d.ts

          grep -q \
            "getQualityRank" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "candidate_resolution" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "videoCodec('copy')" \
            src/main/ffmpeg/record.ts

          grep -q \
            "audioCodec('copy')" \
            src/main/ffmpeg/record.ts

          node -e "
          const p =
            require('./package.json');

          if (
            p.version !==
            process.env.APP_VERSION
          ) {
            console.error(
              'Version mismatch:',
              p.version
            );

            process.exit(1);
          }

          console.log(
            'Version:',
            p.version
          );
          "

      - name: TypeScript check
        run: |
          npm run typecheck

      - name: Build Electron app
        run: |
          npm run build

      - name: Package Windows x64
        run: |
          npx electron-builder \
            --win \
            nsis \
            --x64 \
            --publish never

      - name: Verify Windows installer
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $package =
            Get-Content package.json |
            ConvertFrom-Json

          if (
            $package.version -ne
            $env:EXPECTED_VERSION
          ) {
            throw "Version mismatch. Expected $env:EXPECTED_VERSION, got $($package.version)"
          }

          $installers =
            Get-ChildItem \
              -Path dist \
              -Filter "*-x64.exe"

          if (
            -not $installers -or
            $installers.Count -eq 0
          ) {
            throw "Windows x64 installer not generated."
          }

          Write-Host "Generated installer:"

          $installers |
            Select-Object Name, Length, FullName |
            Format-Table -AutoSize

      - name: Commit V2.7 source
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet
          then
            echo \
              "No source changes to commit."
          else
            git commit \
              -m "Remove preview and redesign status UI"
          fi

          git push \
            --force \
            origin \
            douyin-v2.7-ui-test

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-${{ inputs.version }}-douyin-v2.7-ui-windows-x64
          path: dist/*-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          {
            echo "# Fideo Douyin V2.7 UI Cleanup"
            echo
            echo "Version: \`$APP_VERSION\`"
            echo
            echo "Branch: \`douyin-v2.7-ui-test\`"
            echo
            echo "- Removed broken preview"
            echo "- Removed HLS/MPEGTS dependencies"
            echo "- Redesigned task cards"
            echo "- Improved status display"
            echo "- Added all status filters"
            echo "- Improved toolbar"
            echo "- Improved settings layout"
            echo "- Kept monitor-only mode"
            echo "- Kept Windows/Xizhi notifications"
            echo "- Kept Douyin recording quality logic"
          } >> "$GITHUB_STEP_SUMMARY"
