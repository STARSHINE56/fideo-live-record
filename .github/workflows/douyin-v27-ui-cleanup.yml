name: Douyin V2.7 UI Cleanup

on:
  workflow_dispatch:
    inputs:
      version:
        description: "测试版本号，例如 1.1.8"
        required: true
        default: "1.1.8"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Remove Preview And Optimize UI
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout V2.6.2 source
        uses: actions/checkout@v4
        with:
          ref: douyin-v2.6.2-test
          fetch-depth: 0

      - name: Create V2.7 test branch
        run: |
          git switch -C douyin-v2.7-ui-test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      # ============================================================
      # 删除预览功能
      # ============================================================

      - name: Remove preview backend and IPC
        run: |
          cat > "$RUNNER_TEMP/remove-preview.cjs" <<'NODE'
          const fs = require('fs')

          function read(path) {
            return fs.readFileSync(path, 'utf8')
          }

          function write(path, text) {
            fs.writeFileSync(path, text, 'utf8')
          }

          // --------------------------------------------------------
          // const.ts
          // --------------------------------------------------------

          {
            const path = 'src/const.ts'
            let text = read(path)

            text = text
              .replace(
                /^\s*export const START_STREAM_PREVIEW = 'START_STREAM_PREVIEW'\s*$/gm,
                ''
              )
              .replace(
                /^\s*export const STOP_STREAM_PREVIEW = 'STOP_STREAM_PREVIEW'\s*$/gm,
                ''
              )

            write(path, text)
          }

          // --------------------------------------------------------
          // main/index.ts
          // --------------------------------------------------------

          {
            const path = 'src/main/index.ts'
            let text = read(path)

            text = text
              .replace(
                /^\s*START_STREAM_PREVIEW,\s*$/gm,
                ''
              )
              .replace(
                /^\s*STOP_STREAM_PREVIEW,\s*$/gm,
                ''
              )

            text = text.replace(
              /\s*import\s*\{\s*startPreviewTranscoder,\s*stopPreviewTranscoder\s*\}\s*from\s*['"]\.\/preview-transcoder['"]\s*/m,
              '\n'
            )

            const marker =
              text.indexOf(
                'START_STREAM_PREVIEW,'
              )

            if (marker >= 0) {
              const start =
                text.lastIndexOf(
                  'ipcMain.handle(',
                  marker
                )

              const end =
                text.indexOf(
                  'ipcMain.handle(START_STREAM_RECORD',
                  marker
                )

              if (
                start >= 0 &&
                end > start
              ) {
                text =
                  text.slice(0, start) +
                  text.slice(end)
              }
            }

            text = text
              .replace(
                /^\s*void stopPreviewTranscoder\(\)\s*$/gm,
                ''
              )
              .replace(
                /^\s*await stopPreviewTranscoder\(\)\s*$/gm,
                ''
              )

            write(path, text)
          }

          // --------------------------------------------------------
          // preload/index.ts
          // --------------------------------------------------------

          {
            const path = 'src/preload/index.ts'
            let text = read(path)

            text = text
              .replace(
                /^\s*START_STREAM_PREVIEW,\s*$/gm,
                ''
              )
              .replace(
                /^\s*STOP_STREAM_PREVIEW,\s*$/gm,
                ''
              )

            const start =
              text.indexOf(
                'startStreamPreview:'
              )

            const end =
              text.indexOf(
                'navByDefaultBrowser:',
                start
              )

            if (
              start >= 0 &&
              end > start
            ) {
              const lineStart =
                text.lastIndexOf(
                  '\n',
                  start
                ) + 1

              text =
                text.slice(
                  0,
                  lineStart
                ) +
                text.slice(
                  end
                )
            }

            write(path, text)
          }

          // --------------------------------------------------------
          // preload/index.d.ts
          // --------------------------------------------------------

          {
            const path =
              'src/preload/index.d.ts'

            let text =
              read(path)

            const start =
              text.indexOf(
                'startStreamPreview:'
              )

            const end =
              text.indexOf(
                'startStreamRecord:',
                start
              )

            if (
              start >= 0 &&
              end > start
            ) {
              const lineStart =
                text.lastIndexOf(
                  '\n',
                  start
                ) + 1

              text =
                text.slice(
                  0,
                  lineStart
                ) +
                text.slice(
                  end
                )
            }

            write(
              path,
              text
            )
          }

          console.log(
            'Preview IPC removed.'
          )
          NODE

          node "$RUNNER_TEMP/remove-preview.cjs"

      # ============================================================
      # OperationBar：删除预览按钮并整理操作区
      # ============================================================

      - name: Rewrite operation bar
        run: |
          cat > src/renderer/src/components/StreamConfigList/components/OperationBar.tsx <<'TS'
          import {
            useEffect,
            useRef,
            useState
          } from 'react'

          import {
            useTranslation
          } from 'react-i18next'

          import UseThemeIcon from '@/components/UseThemeIcon'
          import Dialog from '@/components/Dialog'

          import {
            useStreamConfigStore
          } from '@/store/useStreamConfigStore'

          import darkPlayIcon from '@/assets/images/dark/play.svg'
          import lightPlayIcon from '@/assets/images/light/play.svg'

          import darkPauseIcon from '@/assets/images/dark/pause.svg'
          import lightPauseIcon from '@/assets/images/light/pause.svg'

          import darkSettingIcon from '@/assets/images/dark/setting.svg'
          import lightSettingIcon from '@/assets/images/light/setting.svg'

          import darkDeleteIcon from '@/assets/images/dark/close.svg'
          import lightDeleteIcon from '@/assets/images/light/close.svg'

          import {
            StreamStatus,
            useXizhiToPushNotification
          } from '@renderer/lib/utils'

          import StreamConfigSheet from '@renderer/components/StreamConfigSheet'

          import {
            useToast
          } from '@renderer/hooks/useToast'

          import {
            CRAWLER_ERROR_CODE,
            SUCCESS_CODE,
            UNKNOWN_CODE,
            crawlerErrorCodeToI18nMessage,
            FFMPEG_ERROR_CODE
          } from '../../../../../code'

          import {
            RECORD_END_NOT_USER_STOP
          } from '../../../../../const'

          import emitter from '@/lib/bus'

          import {
            useDefaultSettingsStore
          } from '../../../store/useDefaultSettingsStore'

          interface OperationBarProps {
            streamConfig: IStreamConfig
          }

          export default function OperationBar(
            props: OperationBarProps
          ) {
            const {
              streamConfig
            } = props

            const {
              t
            } = useTranslation()

            const {
              toast
            } = useToast()

            const timer =
              useRef<NodeJS.Timeout>()

            const liveNotifiedRef =
              useRef(false)

            const [
              sheetOpen,
              setSheetOpen
            ] =
              useState(false)

            const [
              deleteDialogOpen,
              setDeleteDialogOpen
            ] =
              useState(false)

            const defaultSettingsConfig =
              useDefaultSettingsStore(
                (
                  state
                ) =>
                  state.defaultSettingsConfig
              )

            const {
              removeStreamConfig,
              updateStreamConfig
            } =
              useStreamConfigStore(
                (
                  state
                ) => ({
                  removeStreamConfig:
                    state.removeStreamConfig,

                  updateStreamConfig:
                    state.updateStreamConfig
                })
              )

            const handleConfirmDelete =
              async () => {
                await removeStreamConfig(
                  streamConfig.id
                )

                setDeleteDialogOpen(
                  false
                )
              }

            const scheduleMonitorOnly =
              () => {
                if (
                  timer.current
                ) {
                  clearTimeout(
                    timer.current
                  )
                }

                timer.current =
                  setTimeout(
                    () => {
                      void handleMonitorOnly(
                        false
                      )
                    },

                    1000 *
                      streamConfig.interval
                  )
              }

            const handleMonitorOnly =
              async (
                isFirst =
                  true
              ) => {
                if (isFirst) {
                  liveNotifiedRef.current =
                    false

                  await updateStreamConfig(
                    {
                      ...streamConfig,

                      status:
                        StreamStatus.MONITORING
                    },

                    streamConfig.id
                  )
                }

                const result =
                  await window.api
                    .getLiveUrls({
                      roomUrl:
                        streamConfig.roomUrl,

                      cookie:
                        streamConfig.cookie,

                      proxy:
                        streamConfig.proxy,

                      title:
                        streamConfig.title
                    })
                    .catch(
                      () => ({
                        code:
                          UNKNOWN_CODE,

                        liveUrls:
                          [] as string[]
                      })
                    )

                const latest =
                  useStreamConfigStore
                    .getState()
                    .streamConfigList
                    .find(
                      (
                        item
                      ) =>
                        item.id ===
                        streamConfig.id
                    )

                if (
                  !latest ||
                  latest.status ===
                    StreamStatus.NOT_STARTED
                ) {
                  return
                }

                if (
                  result.code ===
                    SUCCESS_CODE &&
                  Array.isArray(
                    result.liveUrls
                  ) &&
                  result.liveUrls.length >
                    0
                ) {
                  if (
                    !liveNotifiedRef.current
                  ) {
                    liveNotifiedRef.current =
                      true

                    const message =
                      t(
                        'stream_config.live_detected_notify',
                        {
                          title:
                            streamConfig.title
                        }
                      )

                    window.api.showNotification(
                      t(
                        'stream_config.live_detected'
                      ),

                      message
                    )

                    toast({
                      title:
                        streamConfig.title,

                      description:
                        t(
                          'stream_config.live_detected'
                        )
                    })

                    if (
                      defaultSettingsConfig
                        .xizhiKey
                    ) {
                      useXizhiToPushNotification({
                        key:
                          defaultSettingsConfig
                            .xizhiKey,

                        title:
                          streamConfig.title,

                        content:
                          t(
                            'stream_config.live_detected'
                          )
                      })
                    }
                  }

                  scheduleMonitorOnly()

                  return
                }

                if (
                  result.code ===
                  CRAWLER_ERROR_CODE.NOT_URLS
                ) {
                  liveNotifiedRef.current =
                    false

                  scheduleMonitorOnly()

                  return
                }

                if (
                  result.code ===
                  UNKNOWN_CODE
                ) {
                  scheduleMonitorOnly()

                  return
                }

                if (isFirst) {
                  const errMessage =
                    crawlerErrorCodeToI18nMessage(
                      result.code,
                      'error.get_line.'
                    )

                  toast({
                    title:
                      streamConfig.title,

                    description:
                      t(
                        errMessage
                      ),

                    variant:
                      'destructive'
                  })
                }

                scheduleMonitorOnly()
              }

            const handleStartRecord =
              async (
                isFirst =
                  true
              ) => {
                if (isFirst) {
                  await updateStreamConfig(
                    {
                      ...streamConfig,

                      status:
                        StreamStatus.PREPARING_TO_RECORD
                    },

                    streamConfig.id
                  )
                }

                const {
                  code
                } =
                  await window.api
                    .startStreamRecord(
                      JSON.stringify(
                        streamConfig
                      )
                    )
                    .catch(
                      () => ({
                        code:
                          UNKNOWN_CODE
                      })
                    )

                const currentStatus =
                  useStreamConfigStore
                    .getState()
                    .streamConfigList
                    .find(
                      (
                        item
                      ) =>
                        item.id ===
                        streamConfig.id
                    )
                    ?.status

                if (
                  currentStatus ===
                  StreamStatus.NOT_STARTED
                ) {
                  return
                }

                if (
                  code ===
                  SUCCESS_CODE
                ) {
                  await updateStreamConfig(
                    {
                      ...streamConfig,

                      status:
                        StreamStatus.RECORDING
                    },

                    streamConfig.id
                  )

                  toast({
                    title:
                      streamConfig.title,

                    description:
                      t(
                        'start_record'
                      )
                  })

                  if (
                    defaultSettingsConfig
                      .xizhiKey
                  ) {
                    useXizhiToPushNotification({
                      key:
                        defaultSettingsConfig
                          .xizhiKey,

                      title:
                        streamConfig.title,

                      content:
                        t(
                          'start_record'
                        )
                    })
                  }

                  return
                }

                if (
                  code ===
                    CRAWLER_ERROR_CODE.NOT_URLS ||
                  code ===
                    UNKNOWN_CODE
                ) {
                  if (
                    timer.current
                  ) {
                    clearTimeout(
                      timer.current
                    )
                  }

                  timer.current =
                    setTimeout(
                      () => {
                        void handleStartRecord(
                          false
                        )
                      },

                      1000 *
                        streamConfig.interval
                    )

                  if (isFirst) {
                    toast({
                      title:
                        streamConfig.title,

                      description:
                        t(
                          'error.start_record.not_urls'
                        )
                    })

                    if (
                      defaultSettingsConfig
                        .xizhiKey
                    ) {
                      useXizhiToPushNotification({
                        key:
                          defaultSettingsConfig
                            .xizhiKey,

                        title:
                          streamConfig.title,

                        content:
                          t(
                            'error.start_record.not_urls'
                          )
                      })
                    }
                  }

                  await updateStreamConfig(
                    {
                      ...streamConfig,

                      status:
                        StreamStatus.MONITORING
                    },

                    streamConfig.id
                  )

                  return
                }

                if (
                  Object.values(
                    FFMPEG_ERROR_CODE
                  ).includes(
                    code
                  )
                ) {
                  return
                }

                const errMessage =
                  crawlerErrorCodeToI18nMessage(
                    code,
                    'error.start_record.'
                  )

                await updateStreamConfig(
                  {
                    ...streamConfig,

                    status:
                      StreamStatus.NOT_STARTED
                  },

                  streamConfig.id
                )

                toast({
                  title:
                    streamConfig.title,

                  description:
                    t(
                      errMessage
                    ),

                  variant:
                    'destructive'
                })
              }

            const handlePlayClick =
              () => {
                if (
                  streamConfig.autoRecord ===
                  false
                ) {
                  void handleMonitorOnly(
                    true
                  )

                  return
                }

                void handleStartRecord(
                  true
                )
              }

            const handlePauseClick =
              async () => {
                if (
                  timer.current
                ) {
                  clearTimeout(
                    timer.current
                  )
                }

                liveNotifiedRef.current =
                  false

                if (
                  streamConfig.autoRecord ===
                  false
                ) {
                  await updateStreamConfig(
                    {
                      ...streamConfig,

                      status:
                        StreamStatus.NOT_STARTED
                    },

                    streamConfig.id
                  )

                  return
                }

                await window.api
                  .stopStreamRecord(
                    streamConfig.id
                  )
              }

            useEffect(
              () => {
                const handleRecordEndNotUserStop =
                  async (
                    id: string
                  ) => {
                    if (
                      id !==
                      streamConfig.id
                    ) {
                      return
                    }

                    if (
                      timer.current
                    ) {
                      clearTimeout(
                        timer.current
                      )
                    }

                    timer.current =
                      setTimeout(
                        () => {
                          handlePlayClick()
                        },

                        2000
                      )
                  }

                emitter.on(
                  RECORD_END_NOT_USER_STOP,

                  handleRecordEndNotUserStop as any
                )

                return () => {
                  emitter.off(
                    RECORD_END_NOT_USER_STOP,

                    handleRecordEndNotUserStop as any
                  )
                }
              },

              [
                streamConfig
              ]
            )

            useEffect(
              () => {
                return () => {
                  if (
                    timer.current
                  ) {
                    clearTimeout(
                      timer.current
                    )
                  }
                }
              },

              []
            )

            const isStopped =
              streamConfig.status ===
              StreamStatus.NOT_STARTED

            return (
              <>
                <div className="flex shrink-0 items-center gap-1 rounded-lg border bg-background/80 p-1 shadow-sm">
                  {isStopped ? (
                    <UseThemeIcon
                      className="h-[19px] w-[19px] cursor-pointer select-none"
                      dark={
                        darkPlayIcon
                      }
                      light={
                        lightPlayIcon
                      }
                      handleClick={
                        handlePlayClick
                      }
                      id={
                        streamConfig.id +
                        '_play'
                      }
                    />
                  ) : (
                    <UseThemeIcon
                      className="h-[19px] w-[19px] cursor-pointer select-none"
                      dark={
                        darkPauseIcon
                      }
                      light={
                        lightPauseIcon
                      }
                      handleClick={
                        handlePauseClick
                      }
                      id={
                        streamConfig.id +
                        '_pause'
                      }
                    />
                  )}

                  <UseThemeIcon
                    className="h-[19px] w-[19px] cursor-pointer select-none"
                    dark={
                      darkSettingIcon
                    }
                    light={
                      lightSettingIcon
                    }
                    handleClick={
                      () =>
                        setSheetOpen(
                          true
                        )
                    }
                    tooltipContent={
                      t(
                        'stream_config.edit'
                      )
                    }
                  />

                  <UseThemeIcon
                    className="h-[19px] w-[19px] cursor-pointer select-none"
                    dark={
                      darkDeleteIcon
                    }
                    light={
                      lightDeleteIcon
                    }
                    handleClick={
                      () =>
                        setDeleteDialogOpen(
                          true
                        )
                    }
                  />
                </div>

                <StreamConfigSheet
                  streamConfig={
                    streamConfig
                  }
                  setSheetOpen={
                    setSheetOpen
                  }
                  sheetOpen={
                    sheetOpen
                  }
                  type="edit"
                />

                <Dialog
                  title={
                    t(
                      'stream_config.confirm_delete',
                      {
                        title:
                          streamConfig.title
                      }
                    )
                  }
                  btnText={
                    t(
                      'stream_config.delete'
                    )
                  }
                  dialogOpen={
                    deleteDialogOpen
                  }
                  onOpenChange={
                    setDeleteDialogOpen
                  }
                  handleBtnClick={
                    handleConfirmDelete
                  }
                  variant="destructive"
                />
              </>
            )
          }
          TS

      # ============================================================
      # 状态进度组件
      # ============================================================

      - name: Rewrite status progress
        run: |
          cat > src/renderer/src/components/StreamConfigList/components/Progress.tsx <<'TS'
          import {
            StreamStatus
          } from '@renderer/lib/utils'

          interface ProgressProps {
            status: number
          }

          export default function Progress(
            {
              status
            }: ProgressProps
          ) {
            if (
              status ===
              StreamStatus.NOT_STARTED
            ) {
              return (
                <div className="h-1.5 w-full overflow-hidden rounded-full bg-muted" />
              )
            }

            if (
              status ===
              StreamStatus.MONITORING
            ) {
              return (
                <div className="relative h-1.5 w-full overflow-hidden rounded-full bg-muted">
                  <div className="absolute left-[2px] top-0 h-full w-[48px] rounded-full bg-blue-500 animate-progress" />
                </div>
              )
            }

            if (
              status ===
              StreamStatus.PREPARING_TO_RECORD
            ) {
              return (
                <div className="h-1.5 w-full overflow-hidden rounded-full bg-muted">
                  <div className="h-full w-1/3 animate-pulse rounded-full bg-amber-500" />
                </div>
              )
            }

            if (
              status ===
              StreamStatus.RECORDING
            ) {
              return (
                <div className="h-1.5 w-full overflow-hidden rounded-full bg-red-500/20">
                  <div className="h-full w-full animate-pulse rounded-full bg-red-500" />
                </div>
              )
            }

            return (
              <div className="h-1.5 w-full overflow-hidden rounded-full bg-purple-500/20">
                <div className="h-full w-3/4 animate-pulse rounded-full bg-purple-500" />
              </div>
            )
          }
          TS

      # ============================================================
      # 重新设计录制卡片
      # ============================================================

      - name: Rewrite stream cards
        run: |
          cat > src/renderer/src/components/StreamConfigList/components/StreamConfigCard.tsx <<'TS'
          import {
            useTranslation
          } from 'react-i18next'

          import {
            Card,
            CardContent,
            CardDescription,
            CardTitle,
            CardHeader
          } from '@/shadcn/ui/card'

          import {
            Badge
          } from '@/shadcn/ui/badge'

          import {
            MoveCardDropdownMenu
          } from './MoveCardDropDownMenu'

          import Progress from '@/components/StreamConfigList/components/Progress'
          import OperationBar from '@/components/StreamConfigList/components/OperationBar'

          import {
            StreamStatus
          } from '@renderer/lib/utils'

          import {
            useFfmpegProgressInfoStore
          } from '@renderer/store/useFfmpegProgressInfoStore'

          import {
            useNavSelectedStatusStore
          } from '@renderer/store/useNavSelectedStatusStore'

          interface StreamConfigCardProps {
            streamConfig: IStreamConfig
          }

          const statusLocale:
            Record<number, string> = {
              0:
                'stream_config.not_started',

              1:
                'stream_config.preparing_to_record',

              2:
                'stream_config.monitoring',

              3:
                'stream_config.recording',

              4:
                'stream_config.video_format_conversion'
            }

          const statusStyle:
            Record<number, string> = {
              0:
                'border-border bg-muted/50 text-muted-foreground',

              1:
                'border-amber-300 bg-amber-50 text-amber-700 dark:border-amber-800 dark:bg-amber-950/40 dark:text-amber-300',

              2:
                'border-blue-300 bg-blue-50 text-blue-700 dark:border-blue-800 dark:bg-blue-950/40 dark:text-blue-300',

              3:
                'border-red-300 bg-red-50 text-red-700 dark:border-red-800 dark:bg-red-950/40 dark:text-red-300',

              4:
                'border-purple-300 bg-purple-50 text-purple-700 dark:border-purple-800 dark:bg-purple-950/40 dark:text-purple-300'
            }

          function formatSize(
            targetSize?: number
          ) {
            if (
              !targetSize
            ) {
              return '--'
            }

            return (
              (
                targetSize /
                1024
              ).toFixed(
                1
              ) + ' MB'
            )
          }

          export default function StreamConfigCard(
            {
              streamConfig
            }: StreamConfigCardProps
          ) {
            const {
              t
            } =
              useTranslation()

            const ffmpegProgressInfo =
              useFfmpegProgressInfoStore(
                (
                  state
                ) =>
                  state.ffmpegProgressInfo
              )

            const navSelectedStatus =
              useNavSelectedStatusStore(
                (
                  state
                ) =>
                  state.navSelectedStatus
              )

            const progress =
              ffmpegProgressInfo[
                streamConfig.id
              ]

            const handleRoomUrlClick =
              () => {
                window.api
                  .navByDefaultBrowser(
                    streamConfig.roomUrl
                  )
              }

            const showSize =
              streamConfig.segmentTime ===
                '0' ||
              streamConfig.segmentTime ===
                ''

            return (
              <Card className="stream-card overflow-hidden border bg-card/95 shadow-sm">
                <CardHeader className="space-y-3 pb-4">
                  <div className="flex min-w-0 items-start justify-between gap-4">
                    <div className="min-w-0 flex-1">
                      <div className="flex min-w-0 flex-wrap items-center gap-2">
                        <CardTitle
                          id={
                            streamConfig.id
                          }
                          className="max-w-full truncate text-base font-semibold leading-6"
                        >
                          {
                            streamConfig.title
                          }
                        </CardTitle>

                        <Badge
                          variant="outline"
                          className={
                            statusStyle[
                              streamConfig.status
                            ] ||
                            statusStyle[
                              StreamStatus.NOT_STARTED
                            ]
                          }
                        >
                          {t(
                            statusLocale[
                              streamConfig.status
                            ] ||
                              statusLocale[
                                StreamStatus.NOT_STARTED
                              ]
                          )}
                        </Badge>

                        <Badge
                          variant="outline"
                          className={
                            streamConfig.autoRecord
                              ? 'border-emerald-300 bg-emerald-50 text-emerald-700 dark:border-emerald-800 dark:bg-emerald-950/40 dark:text-emerald-300'
                              : 'border-sky-300 bg-sky-50 text-sky-700 dark:border-sky-800 dark:bg-sky-950/40 dark:text-sky-300'
                          }
                        >
                          {streamConfig.autoRecord
                            ? t(
                                'stream_config.auto_record'
                              )
                            : t(
                                'stream_config.notify_only'
                              )}
