name: Douyin V2.7 Cleanup Stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true
        default: "1.1.8"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout V2.6.2
        uses: actions/checkout@v4
        with:
          ref: douyin-v2.6.2-test
          fetch-depth: 0

      - name: Create V2.7 test branch
        shell: bash
        run: |
          git switch -C douyin-v2.7-ui-test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          npm ci

      # ============================================================
      # 删除 Main / preload 预览代码
      # ============================================================

      - name: Remove preview backend
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')

          function read(path) {
            return fs.readFileSync(path, 'utf8')
          }

          function write(path, text) {
            fs.writeFileSync(path, text, 'utf8')
          }

          // ==================================================
          // main/index.ts
          // ==================================================

          {
            const path = 'src/main/index.ts'
            let text = read(path)

            const nav =
              text.indexOf(
                'ipcMain.handle(NAV_BY_DEFAULT_BROWSER'
              )

            const preview =
              text.indexOf(
                'START_STREAM_PREVIEW',
                nav
              )

            const previewStart =
              text.lastIndexOf(
                'ipcMain.handle',
                preview
              )

            const record =
              text.indexOf(
                'START_STREAM_RECORD',
                preview
              )

            const recordStart =
              text.lastIndexOf(
                'ipcMain.handle',
                record
              )

            if (
              nav < 0 ||
              preview < 0 ||
              previewStart < 0 ||
              record < 0 ||
              recordStart <= previewStart
            ) {
              throw new Error(
                'Preview IPC block not found'
              )
            }

            text =
              text.slice(
                0,
                previewStart
              ) +
              text.slice(
                recordStart
              )

            // 安全删除 preview-transcoder import
            const lines =
              text.split(/\r?\n/)

            const output = []

            let skipPreviewImport =
              false

            for (
              let i = 0;
              i < lines.length;
              i++
            ) {
              const line =
                lines[i]

              if (
                !skipPreviewImport &&
                line.trim() ===
                  'import {'
              ) {
                const next =
                  lines
                    .slice(
                      i,
                      Math.min(
                        i + 6,
                        lines.length
                      )
                    )
                    .join('\n')

                if (
                  next.includes(
                    'startPreviewTranscoder'
                  ) &&
                  next.includes(
                    'preview-transcoder'
                  )
                ) {
                  skipPreviewImport =
                    true

                  continue
                }
              }

              if (
                skipPreviewImport
              ) {
                if (
                  line.includes(
                    "from './preview-transcoder'"
                  )
                ) {
                  skipPreviewImport =
                    false
                }

                continue
              }

              const trimmed =
                line.trim()

              if (
                trimmed ===
                  'START_STREAM_PREVIEW,' ||
                trimmed ===
                  'STOP_STREAM_PREVIEW,'
              ) {
                continue
              }

              if (
                line.includes(
                  'stopPreviewTranscoder()'
                )
              ) {
                continue
              }

              output.push(
                line
              )
            }

            write(
              path,
              output.join('\n')
            )
          }

          // ==================================================
          // const.ts
          // ==================================================

          {
            const path =
              'src/const.ts'

            const text =
              read(path)
                .split(/\r?\n/)
                .filter(
                  line =>
                    !line.includes(
                      'START_STREAM_PREVIEW'
                    ) &&
                    !line.includes(
                      'STOP_STREAM_PREVIEW'
                    )
                )
                .join('\n')

            write(
              path,
              text
            )
          }

          // ==================================================
          // preload/index.ts
          // ==================================================

          {
            const path =
              'src/preload/index.ts'

            let text =
              read(path)

            const start =
              text.indexOf(
                'startStreamPreview:'
              )

            if (
              start >= 0
            ) {
              const end =
                text.indexOf(
                  'navByDefaultBrowser:',
                  start
                )

              if (
                end < 0
              ) {
                throw new Error(
                  'Preload preview boundary missing'
                )
              }

              const lineStart =
                text.lastIndexOf(
                  '\n',
                  start
                ) + 1

              text =
                text.slice(
                  0,
                  lineStart
                ) +
                text.slice(
                  end
                )
            }

            text =
              text
                .split(/\r?\n/)
                .filter(
                  line =>
                    !line.includes(
                      'START_STREAM_PREVIEW'
                    ) &&
                    !line.includes(
                      'STOP_STREAM_PREVIEW'
                    )
                )
                .join('\n')

            write(
              path,
              text
            )
          }

          // ==================================================
          // preload/index.d.ts
          // ==================================================

          {
            const path =
              'src/preload/index.d.ts'

            let text =
              read(path)

            const start =
              text.indexOf(
                'startStreamPreview:'
              )

            if (
              start >= 0
            ) {
              const end =
                text.indexOf(
                  'startStreamRecord:',
                  start
                )

              if (
                end < 0
              ) {
                throw new Error(
                  'Preview type boundary missing'
                )
              }

              const lineStart =
                text.lastIndexOf(
                  '\n',
                  start
                ) + 1

              text =
                text.slice(
                  0,
                  lineStart
                ) +
                text.slice(
                  end
                )
            }

            write(
              path,
              text
            )
          }

          console.log(
            'Backend preview cleanup complete.'
          )
          NODE

      # ============================================================
      # 直接完整生成 OperationBar
      # 不再使用正则删除 JSX
      # ============================================================

      - name: Replace OperationBar
        shell: bash
        run: |
          cat > src/renderer/src/components/StreamConfigList/components/OperationBar.tsx <<'TS'
          import {
            useEffect,
            useRef,
            useState
          } from 'react'

          import {
            useTranslation
          } from 'react-i18next'

          import UseThemeIcon from '@/components/UseThemeIcon'
          import Dialog from '@/components/Dialog'

          import {
            useStreamConfigStore
          } from '@/store/useStreamConfigStore'

          import darkPlayIcon from '@/assets/images/dark/play.svg'
          import lightPlayIcon from '@/assets/images/light/play.svg'

          import darkPauseIcon from '@/assets/images/dark/pause.svg'
          import lightPauseIcon from '@/assets/images/light/pause.svg'

          import darkSettingIcon from '@/assets/images/dark/setting.svg'
          import lightSettingIcon from '@/assets/images/light/setting.svg'

          import darkDeleteIcon from '@/assets/images/dark/close.svg'
          import lightDeleteIcon from '@/assets/images/light/close.svg'

          import {
            StreamStatus,
            useXizhiToPushNotification
          } from '@renderer/lib/utils'

          import StreamConfigSheet from '@renderer/components/StreamConfigSheet'

          import {
            useToast
          } from '@renderer/hooks/useToast'

          import {
            CRAWLER_ERROR_CODE,
            SUCCESS_CODE,
            UNKNOWN_CODE,
            crawlerErrorCodeToI18nMessage,
            FFMPEG_ERROR_CODE
          } from '../../../../../code'

          import {
            RECORD_END_NOT_USER_STOP
          } from '../../../../../const'

          import emitter from '@/lib/bus'

          import {
            useDefaultSettingsStore
          } from '../../../store/useDefaultSettingsStore'

          interface OperationBarProps {
            streamConfig: IStreamConfig
          }

          export default function OperationBar(
            props: OperationBarProps
          ) {
            const timer =
              useRef<NodeJS.Timeout>()

            const liveNotifiedRef =
              useRef(false)

            const {
              streamConfig
            } =
              props

            const {
              t
            } =
              useTranslation()

            const defaultSettingsConfig =
              useDefaultSettingsStore(
                (
                  state
                ) =>
                  state.defaultSettingsConfig
              )

            const {
              toast
            } =
              useToast()

            const [
              sheetOpen,
              setSheetOpen
            ] =
              useState(false)

            const [
              deleteDialogOpen,
              setDeleteDialogOpen
            ] =
              useState(false)

            const {
              removeStreamConfig,
              updateStreamConfig
            } =
              useStreamConfigStore(
                (
                  state
                ) => ({
                  removeStreamConfig:
                    state.removeStreamConfig,

                  updateStreamConfig:
                    state.updateStreamConfig
                })
              )

            const handleConfirmDelete =
              async () => {
                await removeStreamConfig(
                  streamConfig.id
                )

                setDeleteDialogOpen(
                  false
                )
              }

            const scheduleMonitorOnly =
              () => {
                if (
                  timer.current
                ) {
                  clearTimeout(
                    timer.current
                  )
                }

                timer.current =
                  setTimeout(
                    () => {
                      void handleMonitorOnly(
                        false
                      )
                    },

                    1000 *
                      streamConfig.interval
                  )
              }

            const handleMonitorOnly =
              async (
                isFirst =
                  true
              ) => {
                if (isFirst) {
                  liveNotifiedRef.current =
                    false

                  await updateStreamConfig(
                    {
                      ...streamConfig,

                      status:
                        StreamStatus.MONITORING
                    },

                    streamConfig.id
                  )
                }

                const result =
                  await window.api
                    .getLiveUrls({
                      roomUrl:
                        streamConfig.roomUrl,

                      cookie:
                        streamConfig.cookie,

                      proxy:
                        streamConfig.proxy,

                      title:
                        streamConfig.title
                    })
                    .catch(
                      () => ({
                        code:
                          UNKNOWN_CODE,

                        liveUrls:
                          [] as string[]
                      })
                    )

                const latest =
                  useStreamConfigStore
                    .getState()
                    .streamConfigList
                    .find(
                      item =>
                        item.id ===
                        streamConfig.id
                    )

                if (
                  !latest ||
                  latest.status ===
                    StreamStatus.NOT_STARTED
                ) {
                  return
                }

                if (
                  result.code ===
                    SUCCESS_CODE &&
                  Array.isArray(
                    result.liveUrls
                  ) &&
                  result.liveUrls.length >
                    0
                ) {
                  if (
                    !liveNotifiedRef.current
                  ) {
                    liveNotifiedRef.current =
                      true

                    const message =
                      t(
                        'stream_config.live_detected_notify',
                        {
                          title:
                            streamConfig.title
                        }
                      )

                    window.api
                      .showNotification(
                        t(
                          'stream_config.live_detected'
                        ),

                        message
                      )

                    toast({
                      title:
                        streamConfig.title,

                      description:
                        t(
                          'stream_config.live_detected'
                        )
                    })

                    if (
                      defaultSettingsConfig
                        .xizhiKey
                    ) {
                      useXizhiToPushNotification({
                        key:
                          defaultSettingsConfig
                            .xizhiKey,

                        title:
                          streamConfig.title,

                        content:
                          t(
                            'stream_config.live_detected'
                          )
                      })
                    }
                  }

                  scheduleMonitorOnly()

                  return
                }

                if (
                  result.code ===
                    CRAWLER_ERROR_CODE.NOT_URLS
                ) {
                  liveNotifiedRef.current =
                    false

                  scheduleMonitorOnly()

                  return
                }

                if (
                  result.code ===
                  UNKNOWN_CODE
                ) {
                  scheduleMonitorOnly()

                  return
                }

                if (isFirst) {
                  const errMessage =
                    crawlerErrorCodeToI18nMessage(
                      result.code,

                      'error.get_line.'
                    )

                  toast({
                    title:
                      streamConfig.title,

                    description:
                      t(
                        errMessage
                      ),

                    variant:
                      'destructive'
                  })
                }

                scheduleMonitorOnly()
              }

            const handleStartRecord =
              async (
                isFirst =
                  true
              ) => {
                if (isFirst) {
                  await updateStreamConfig(
                    {
                      ...streamConfig,

                      status:
                        StreamStatus.PREPARING_TO_RECORD
                    },

                    streamConfig.id
                  )
                }

                const {
                  code
                } =
                  await window.api
                    .startStreamRecord(
                      JSON.stringify(
                        streamConfig
                      )
                    )
                    .catch(
                      () => ({
                        code:
                          UNKNOWN_CODE
                      })
                    )

                const currentStatus =
                  useStreamConfigStore
                    .getState()
                    .streamConfigList
                    .find(
                      item =>
                        item.id ===
                        streamConfig.id
                    )
                    ?.status

                if (
                  currentStatus ===
                  StreamStatus.NOT_STARTED
                ) {
                  return
                }

                if (
                  code ===
                  SUCCESS_CODE
                ) {
                  await updateStreamConfig(
                    {
                      ...streamConfig,

                      status:
                        StreamStatus.RECORDING
                    },

                    streamConfig.id
                  )

                  toast({
                    title:
                      streamConfig.title,

                    description:
                      t(
                        'start_record'
                      )
                  })

                  if (
                    defaultSettingsConfig
                      .xizhiKey
                  ) {
                    useXizhiToPushNotification({
                      key:
                        defaultSettingsConfig
                          .xizhiKey,

                      title:
                        streamConfig.title,

                      content:
                        t(
                          'start_record'
                        )
                    })
                  }

                  return
                }

                if (
                  code ===
                    CRAWLER_ERROR_CODE.NOT_URLS ||
                  code ===
                    UNKNOWN_CODE
                ) {
                  if (
                    timer.current
                  ) {
                    clearTimeout(
                      timer.current
                    )
                  }

                  timer.current =
                    setTimeout(
                      () => {
                        void handleStartRecord(
                          false
                        )
                      },

                      1000 *
                        streamConfig.interval
                    )

                  if (isFirst) {
                    toast({
                      title:
                        streamConfig.title,

                      description:
                        t(
                          'error.start_record.not_urls'
                        )
                    })

                    if (
                      defaultSettingsConfig
                        .xizhiKey
                    ) {
                      useXizhiToPushNotification({
                        key:
                          defaultSettingsConfig
                            .xizhiKey,

                        title:
                          streamConfig.title,

                        content:
                          t(
                            'error.start_record.not_urls'
                          )
                      })
                    }
                  }

                  await updateStreamConfig(
                    {
                      ...streamConfig,

                      status:
                        StreamStatus.MONITORING
                    },

                    streamConfig.id
                  )

                  return
                }

                if (
                  Object.values(
                    FFMPEG_ERROR_CODE
                  ).includes(
                    code
                  )
                ) {
                  return
                }

                const errMessage =
                  crawlerErrorCodeToI18nMessage(
                    code,

                    'error.start_record.'
                  )

                await updateStreamConfig(
                  {
                    ...streamConfig,

                    status:
                      StreamStatus.NOT_STARTED
                  },

                  streamConfig.id
                )

                toast({
                  title:
                    streamConfig.title,

                  description:
                    t(
                      errMessage
                    ),

                  variant:
                    'destructive'
                })

                if (
                  defaultSettingsConfig
                    .xizhiKey
                ) {
                  useXizhiToPushNotification({
                    key:
                      defaultSettingsConfig
                        .xizhiKey,

                    title:
                      streamConfig.title,

                    content:
                      t(
                        errMessage
                      )
                  })
                }
              }

            const handlePlayClick =
              () => {
                if (
                  streamConfig.autoRecord ===
                  false
                ) {
                  void handleMonitorOnly(
                    true
                  )

                  return
                }

                void handleStartRecord(
                  true
                )
              }

            const handlePauseClick =
              async () => {
                if (
                  timer.current
                ) {
                  clearTimeout(
                    timer.current
                  )
                }

                liveNotifiedRef.current =
                  false

                if (
                  streamConfig.autoRecord ===
                  false
                ) {
                  await updateStreamConfig(
                    {
                      ...streamConfig,

                      status:
                        StreamStatus.NOT_STARTED
                    },

                    streamConfig.id
                  )

                  return
                }

                await window.api
                  .stopStreamRecord(
                    streamConfig.id
                  )
              }

            useEffect(
              () => {
                const handleRecordEndNotUserStop =
                  async (
                    id: string
                  ) => {
                    if (
                      id !==
                      streamConfig.id
                    ) {
                      return
                    }

                    if (
                      timer.current
                    ) {
                      clearTimeout(
                        timer.current
                      )
                    }

                    timer.current =
                      setTimeout(
                        () => {
                          handlePlayClick()
                        },

                        2000
                      )
                  }

                emitter.on(
                  RECORD_END_NOT_USER_STOP,

                  handleRecordEndNotUserStop as any
                )

                return () => {
                  emitter.off(
                    RECORD_END_NOT_USER_STOP,

                    handleRecordEndNotUserStop as any
                  )
                }
              },

              [
                streamConfig,
                timer
              ]
            )

            useEffect(
              () => {
                return () => {
                  if (
                    timer.current
                  ) {
                    clearTimeout(
                      timer.current
                    )
                  }
                }
              },

              []
            )

            return (
              <>
                <div className="flex shrink-0 items-center gap-2 rounded-lg border bg-background p-1.5 shadow-sm">
                  {streamConfig.status ===
                  StreamStatus.NOT_STARTED ? (
                    <UseThemeIcon
                      className="w-[18px] cursor-pointer select-none"
                      dark={
                        darkPlayIcon
                      }
                      light={
                        lightPlayIcon
                      }
                      handleClick={
                        handlePlayClick
                      }
                      id={
                        streamConfig.id +
                        '_play'
                      }
                    />
                  ) : (
                    <UseThemeIcon
                      className="w-[20px] cursor-pointer select-none"
                      dark={
                        darkPauseIcon
                      }
                      light={
                        lightPauseIcon
                      }
                      handleClick={
                        handlePauseClick
                      }
                      id={
                        streamConfig.id +
                        '_pause'
                      }
                    />
                  )}

                  <UseThemeIcon
                    className="w-[20px] cursor-pointer select-none"
                    dark={
                      darkSettingIcon
                    }
                    light={
                      lightSettingIcon
                    }
                    handleClick={
                      () =>
                        setSheetOpen(
                          true
                        )
                    }
                    tooltipContent={
                      t(
                        'stream_config.edit'
                      )
                    }
                  />

                  <UseThemeIcon
                    className="w-[20px] cursor-pointer select-none"
                    dark={
                      darkDeleteIcon
                    }
                    light={
                      lightDeleteIcon
                    }
                    handleClick={
                      () =>
                        setDeleteDialogOpen(
                          true
                        )
                    }
                  />
                </div>

                <StreamConfigSheet
                  streamConfig={
                    streamConfig
                  }
                  setSheetOpen={
                    setSheetOpen
                  }
                  sheetOpen={
                    sheetOpen
                  }
                  type="edit"
                />

                <Dialog
                  title={
                    t(
                      'stream_config.confirm_delete',

                      {
                        title:
                          streamConfig.title
                      }
                    )
                  }
                  btnText={
                    t(
                      'stream_config.delete'
                    )
                  }
                  dialogOpen={
                    deleteDialogOpen
                  }
                  onOpenChange={
                    setDeleteDialogOpen
                  }
                  handleBtnClick={
                    handleConfirmDelete
                  }
                  variant="destructive"
                />
              </>
            )
          }
          TS

      # ============================================================
      # 删除预览文件
      # ============================================================

      - name: Remove preview files
        shell: bash
        run: |
          rm -f \
            src/main/preview-transcoder.ts \
            src/main/preview-proxy.ts \
            src/renderer/src/components/StreamPreviewDialog.tsx \
            src/renderer/src/assets/images/dark/preview.svg \
            src/renderer/src/assets/images/light/preview.svg

      # ============================================================
      # 删除预览依赖
      # ============================================================

      - name: Remove preview dependencies
        shell: bash
        run: |
          npm uninstall \
            hls.js \
            mpegts.js

      # ============================================================
      # 安全 UI 优化
      # ============================================================

      - name: Optimize layout
        shell: bash
        run: |
          node <<'NODE'
          const fs =
            require('fs')

          function replace(
            path,
            from,
            to
          ) {
            let text =
              fs.readFileSync(
                path,
                'utf8'
              )

            text =
              text.replace(
                from,
                to
              )

            fs.writeFileSync(
              path,
              text,
              'utf8'
            )
          }

          replace(
            'src/renderer/src/components/StreamConfigList/StreamConfigList.tsx',

            'show-scrollbar flex flex-col gap-[12px] p-[24px] overflow-y-auto h-[calc(100vh-80px)]',

            'show-scrollbar mx-auto flex h-[calc(100vh-80px)] w-full max-w-[1100px] flex-col gap-3 overflow-y-auto px-5 py-4'
          )

          replace(
            'src/renderer/src/components/StreamConfigSheet.tsx',

            'form className="space-y-8"',

            'form className="space-y-5"'
          )

          replace(
            'src/renderer/src/components/NavBar/components/DefaultSettingSheet.tsx',

            'form className="space-y-8"',

            'form className="space-y-5"'
          )

          console.log(
            'UI optimization complete.'
          )
          NODE

      # ============================================================
      # 版本
      # ============================================================

      - name: Update version
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          npm version \
            "$APP_VERSION" \
            --no-git-tag-version

      # ============================================================
      # 检查
      # ============================================================

      - name: Verify preview removed
        shell: bash
        run: |
          LEFTOVERS="$(
            grep -R \
              -n \
              -E \
              'START_STREAM_PREVIEW|STOP_STREAM_PREVIEW|startStreamPreview|stopStreamPreview|startPreviewTranscoder|stopPreviewTranscoder|StreamPreviewDialog|darkPreviewIcon|lightPreviewIcon|preview-transcoder|preview-proxy' \
              src \
              || true
          )"

          if [ -n "$LEFTOVERS" ]
          then
            echo "$LEFTOVERS"

            exit 1
          fi

          echo \
            "Preview fully removed."

      - name: Verify core functions
        shell: bash
        run: |
          grep -q \
            "ipcMain" \
            src/main/index.ts

          grep -q \
            "BrowserWindow" \
            src/main/index.ts

          grep -q \
            "START_STREAM_RECORD" \
            src/main/index.ts

          grep -q \
            "recordStreamFfmpegProcessMap" \
            src/main/index.ts

          grep -q \
            "downloadReq" \
            src/main/index.ts

          grep -q \
            "handleMonitorOnly" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          grep -q \
            "videoCodec('copy')" \
            src/main/ffmpeg/record.ts

          grep -q \
            "audioCodec('copy')" \
            src/main/ffmpeg/record.ts

          grep -q \
            "getQualityRank" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "autoRecord: boolean" \
            type.d.ts

      # ============================================================
      # TypeScript
      # ============================================================

      - name: TypeScript check
        shell: bash
        run: |
          npm run typecheck

      # ============================================================
      # Build
      # ============================================================

      - name: Build
        shell: bash
        run: |
          npm run build

      # ============================================================
      # Windows
      # ============================================================

      - name: Package Windows
        shell: bash
        run: |
          npx electron-builder \
            --win \
            nsis \
            --x64 \
            --publish never

      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -Filter "*-x64.exe"

          if (-not $files) {
            throw "Installer not found"
          }

          $files |
            Select-Object Name, Length, FullName |
            Format-Table -AutoSize

      # ============================================================
      # 成功以后才提交
      # ============================================================

      - name: Commit V2.7
        shell: bash
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet
          then
            echo \
              "No changes."
          else
            git commit \
              -m "Remove preview and stabilize V2.7"
          fi

          git push \
            --force \
            origin \
            douyin-v2.7-ui-test

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-${{ inputs.version }}-v2.7-windows-x64
          path: dist/*-x64.exe
          if-no-files-found: error
          retention-days: 7
