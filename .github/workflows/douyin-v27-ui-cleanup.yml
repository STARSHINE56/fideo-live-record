      # 全面检查
      # ============================================================

      - name: Verify preview removed
        run: |
          echo "Checking preview feature removal..."

          if grep -R \
            -E \
            "START_STREAM_PREVIEW|STOP_STREAM_PREVIEW|startStreamPreview|stopStreamPreview|StreamPreviewDialog|preview-transcoder|preview-proxy" \
            src
          then
            echo "ERROR: Preview code still exists."
            exit 1
          fi

          node - <<'NODE'
          const pkg =
            require('./package.json')

          if (
            pkg.dependencies?.['hls.js']
          ) {
            throw new Error(
              'hls.js still exists'
            )
          }

          if (
            pkg.dependencies?.['mpegts.js']
          ) {
            throw new Error(
              'mpegts.js still exists'
            )
          }

          console.log(
            'Preview dependencies removed.'
          )
          NODE

      - name: Verify UI and core functions
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          echo "Checking UI..."

          grep -q \
            "notify_only" \
            src/renderer/src/locales/locales.js

          grep -q \
            "no_tasks" \
            src/renderer/src/locales/locales.js

          grep -q \
            "stream-card" \
            src/renderer/src/components/StreamConfigList/components/StreamConfigCard.tsx

          grep -q \
            "monitoringCount" \
            src/renderer/src/components/StreamConfigList/StreamConfigList.tsx

          grep -q \
            'SelectItem value="0"' \
            src/renderer/src/components/NavBar/NavBar.tsx

          grep -q \
            'SelectItem value="4"' \
            src/renderer/src/components/NavBar/NavBar.tsx

          echo "Checking monitor-only mode..."

          grep -q \
            "autoRecord: boolean" \
            type.d.ts

          grep -q \
            "handleMonitorOnly" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          echo "Checking Douyin quality selection..."

          grep -q \
            "getQualityRank" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "candidate_resolution" \
            src/main/crawler/plugins/douyin.js

          echo "Checking original recording stream-copy..."

          grep -q \
            "videoCodec('copy')" \
            src/main/ffmpeg/record.ts

          grep -q \
            "audioCodec('copy')" \
            src/main/ffmpeg/record.ts

          echo "Checking version..."

          node -e "
          const p =
            require('./package.json');

          if (
            p.version !==
            process.env.APP_VERSION
          ) {
            console.error(
              'Version mismatch:',
              p.version
            );

            process.exit(1);
          }

          console.log(
            'Version:',
            p.version
          );
          "

      - name: TypeScript check
        run: |
          npm run typecheck

      - name: Build Electron app
        run: |
          npm run build

      # ============================================================
      # Windows x64
      # ============================================================

      - name: Package Windows x64
        run: |
          npx electron-builder \
            --win \
            nsis \
            --x64 \
            --publish never

      - name: Verify Windows installer
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $package =
            Get-Content package.json |
            ConvertFrom-Json

          if (
            $package.version -ne
            $env:EXPECTED_VERSION
          ) {
            throw "Version mismatch. Expected $env:EXPECTED_VERSION, got $($package.version)"
          }

          $installers =
            Get-ChildItem `
              -Path dist `
              -Filter "*-x64.exe"

          if (
            -not $installers -or
            $installers.Count -eq 0
          ) {
            throw "Windows x64 installer not generated."
          }

          Write-Host "Generated installer:"

          $installers |
            Select-Object Name, Length, FullName |
            Format-Table -AutoSize

      # ============================================================
      # 提交测试分支
      # ============================================================

      - name: Commit V2.7 source
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet
          then
            echo \
              "No source changes to commit."
          else
            git commit \
              -m "Remove preview and redesign status UI"
          fi

          git push \
            --force \
            origin \
            douyin-v2.7-ui-test

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-${{ inputs.version }}-douyin-v2.7-ui-windows-x64
          path: dist/*-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          {
            echo "# Fideo Douyin V2.7 UI Cleanup"
            echo
            echo "Version: \`$APP_VERSION\`"
            echo
            echo "Branch: \`douyin-v2.7-ui-test\`"
            echo
            echo "Changes:"
            echo
            echo "- Removed broken live preview feature"
            echo "- Removed HLS and MPEG-TS preview dependencies"
            echo "- Removed preview IPC and local preview server"
            echo "- Redesigned stream cards"
            echo "- Improved status badges"
            echo "- Added Auto Record / Notify Only badges"
            echo "- Added all status filters"
            echo "- Added task count summary"
            echo "- Added empty-state layout"
            echo "- Improved monitoring and recording progress"
            echo "- Improved toolbar spacing"
            echo "- Improved settings sheet spacing"
            echo "- Fixed duplicate notify latch on temporary UNKNOWN_CODE"
            echo "- Highest-quality Douyin recording retained"
            echo "- Monitor-only mode retained"
            echo "- Xizhi/Windows notifications retained"
          } >> "$GITHUB_STEP_SUMMARY"
