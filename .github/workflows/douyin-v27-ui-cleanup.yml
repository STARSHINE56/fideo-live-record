name: Douyin V2.7 UI Cleanup Stable

on:
  workflow_dispatch:
    inputs:
      version:
        description: "测试版本号"
        required: true
        default: "1.1.8"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Remove Preview And Build Stable V2.7
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout V2.6.2
        uses: actions/checkout@v4
        with:
          ref: douyin-v2.6.2-test
          fetch-depth: 0

      - name: Create V2.7 branch
        run: |
          git switch -C douyin-v2.7-ui-test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      # ============================================================
      # 安全删除预览：不使用跨整个文件的大正则
      # ============================================================

      - name: Remove preview safely
        run: |
          cat > "$RUNNER_TEMP/remove-preview.cjs" <<'NODE'
          const fs = require('fs')

          function read(path) {
            return fs.readFileSync(
              path,
              'utf8'
            )
          }

          function write(
            path,
            content
          ) {
            fs.writeFileSync(
              path,
              content,
              'utf8'
            )
          }

          // ======================================================
          // 1. src/main/index.ts
          // ======================================================

          {
            const path =
              'src/main/index.ts'

            let text =
              read(path)

            // ----------------------------------
            // 删除 preview-transcoder import
            // 使用逐行方式，只删这一组 import
            // ----------------------------------

            const lines =
              text.split(/\r?\n/)

            const output = []

            let skippingPreviewImport =
              false

            for (
              let i = 0;
              i < lines.length;
              i++
            ) {
              const line =
                lines[i]

              if (
                !skippingPreviewImport &&
                line.includes(
                  'import {'
                )
              ) {
                const lookAhead =
                  lines
                    .slice(
                      i,
                      Math.min(
                        i + 8,
                        lines.length
                      )
                    )
                    .join(
                      '\n'
                    )

                if (
                  lookAhead.includes(
                    'startPreviewTranscoder'
                  ) &&
                  lookAhead.includes(
                    "'./preview-transcoder'"
                  )
                ) {
                  skippingPreviewImport =
                    true
                }
              }

              if (
                skippingPreviewImport
              ) {
                if (
                  line.includes(
                    "'./preview-transcoder'"
                  )
                ) {
                  skippingPreviewImport =
                    false
                }

                continue
              }

              output.push(
                line
              )
            }

            text =
              output.join(
                '\n'
              )

            // ----------------------------------
            // 删除常量 import 两行
            // ----------------------------------

            text =
              text
                .split(
                  /\r?\n/
                )
                .filter(
                  (
                    line
                  ) => {
                    const trimmed =
                      line.trim()

                    return (
                      trimmed !==
                        'START_STREAM_PREVIEW,' &&
                      trimmed !==
                        'STOP_STREAM_PREVIEW,'
                    )
                  }
                )
                .join(
                  '\n'
                )

            // ----------------------------------
            // 删除两个预览 IPC
            //
            // 范围：
            // NAV_BY_DEFAULT_BROWSER 后
            // START_STREAM_PREVIEW
            // ↓
            // START_STREAM_RECORD 前
            // ----------------------------------

            const navIndex =
              text.indexOf(
                'ipcMain.handle(NAV_BY_DEFAULT_BROWSER'
              )

            if (
              navIndex < 0
            ) {
              throw new Error(
                'NAV handler missing'
              )
            }

            const previewMarker =
              text.indexOf(
                'START_STREAM_PREVIEW',
                navIndex
              )

            const recordMarker =
              text.indexOf(
                'START_STREAM_RECORD',
                navIndex
              )

            if (
              previewMarker < 0
            ) {
              throw new Error(
                'Preview handler missing before cleanup'
              )
            }

            if (
              recordMarker < 0
            ) {
              throw new Error(
                'Record handler missing'
              )
            }

            const previewStart =
              text.lastIndexOf(
                'ipcMain.handle',
                previewMarker
              )

            const recordStart =
              text.lastIndexOf(
                'ipcMain.handle',
                recordMarker
              )

            if (
              previewStart < 0 ||
              recordStart <=
                previewStart
            ) {
              throw new Error(
                'Preview IPC boundary invalid'
              )
            }

            text =
              text.slice(
                0,
                previewStart
              ) +
              text.slice(
                recordStart
              )

            // ----------------------------------
            // 删除可能存在的关闭清理调用
            // ----------------------------------

            text =
              text
                .split(
                  /\r?\n/
                )
                .filter(
                  (
                    line
                  ) => {
                    return (
                      !line.includes(
                        'stopPreviewTranscoder()'
                      )
                    )
                  }
                )
                .join(
                  '\n'
                )

            write(
              path,
              text
            )
          }

          // ======================================================
          // 2. src/const.ts
          // ======================================================

          {
            const path =
              'src/const.ts'

            const text =
              read(path)
                .split(
                  /\r?\n/
                )
                .filter(
                  (
                    line
                  ) =>
                    !line.includes(
                      'START_STREAM_PREVIEW'
                    ) &&
                    !line.includes(
                      'STOP_STREAM_PREVIEW'
                    )
                )
                .join(
                  '\n'
                )

            write(
              path,
              text
            )
          }

          // ======================================================
          // 3. preload/index.ts
          // ======================================================

          {
            const path =
              'src/preload/index.ts'

            let text =
              read(path)

            text =
              text
                .split(
                  /\r?\n/
                )
                .filter(
                  (
                    line
                  ) =>
                    !line.includes(
                      'START_STREAM_PREVIEW'
                    ) &&
                    !line.includes(
                      'STOP_STREAM_PREVIEW'
                    )
                )
                .join(
                  '\n'
                )

            const start =
              text.indexOf(
                'startStreamPreview:'
              )

            if (
              start >= 0
            ) {
              const end =
                text.indexOf(
                  'navByDefaultBrowser:',
                  start
                )

              if (
                end < 0
              ) {
                throw new Error(
                  'Preload preview API boundary invalid'
                )
              }

              const lineStart =
                text.lastIndexOf(
                  '\n',
                  start
                ) + 1

              text =
                text.slice(
                  0,
                  lineStart
                ) +
                text.slice(
                  end
                )
            }

            write(
              path,
              text
            )
          }

          // ======================================================
          // 4. preload/index.d.ts
          // ======================================================

          {
            const path =
              'src/preload/index.d.ts'

            let text =
              read(path)

            const start =
              text.indexOf(
                'startStreamPreview:'
              )

            if (
              start >= 0
            ) {
              const end =
                text.indexOf(
                  'startStreamRecord:',
                  start
                )

              if (
                end < 0
              ) {
                throw new Error(
                  'Preload type preview boundary invalid'
                )
              }

              const lineStart =
                text.lastIndexOf(
                  '\n',
                  start
                ) + 1

              text =
                text.slice(
                  0,
                  lineStart
                ) +
                text.slice(
                  end
                )
            }

            write(
              path,
              text
            )
          }

          console.log(
            'Safe preview cleanup completed.'
          )
          NODE

          node "$RUNNER_TEMP/remove-preview.cjs"

      # ============================================================
      # 删除前端预览按钮及逻辑
      # ============================================================

      - name: Remove renderer preview code
        run: |
          cat > "$RUNNER_TEMP/remove-renderer-preview.cjs" <<'NODE'
          const fs = require('fs')

          const path =
            'src/renderer/src/components/StreamConfigList/components/OperationBar.tsx'

          let text =
            fs.readFileSync(
              path,
              'utf8'
            )

          // imports
          text =
            text
              .split(/\r?\n/)
              .filter(
                (
                  line
                ) =>
                  !line.includes(
                    'StreamPreviewDialog'
                  ) &&
                  !line.includes(
                    'darkPreviewIcon'
                  ) &&
                  !line.includes(
                    'lightPreviewIcon'
                  )
              )
              .join(
                '\n'
              )

          // state
          text =
            text
              .replace(
                /^\s*const\s+\[isLoadingPreview[\s\S]*?\]\s*=\s*useState[\s\S]*?\n/gm,
                ''
              )
              .replace(
                /^\s*const\s+\[previewOpen[\s\S]*?\]\s*=\s*useState[\s\S]*?\n/gm,
                ''
              )
              .replace(
                /^\s*const\s+\[previewUrl[\s\S]*?\]\s*=\s*useState[\s\S]*?\n/gm,
                ''
              )
              .replace(
                /^\s*const\s+\[previewType[\s\S]*?\]\s*=\s*useState[\s\S]*?\n/gm,
                ''
              )

          // preview functions
          const previewFunctionStart =
            text.indexOf(
              '  const handlePreviewOpenChange'
            )

          if (
            previewFunctionStart >= 0
          ) {
            const nextEffect =
              text.indexOf(
                '  useEffect(() => {',
                previewFunctionStart
              )

            if (
              nextEffect >
              previewFunctionStart
            ) {
              text =
                text.slice(
                  0,
                  previewFunctionStart
                ) +
                text.slice(
                  nextEffect
                )
            }
          }

          // dialog JSX
          text =
            text.replace(
              /\s*<StreamPreviewDialog[\s\S]*?\/>\s*/m,
              '\n'
            )

          fs.writeFileSync(
            path,
            text,
            'utf8'
          )
          NODE

          node "$RUNNER_TEMP/remove-renderer-preview.cjs"

      # ============================================================
      # 删除文件和依赖
      # ============================================================

      - name: Remove preview files
        run: |
          rm -f \
            src/main/preview-transcoder.ts \
            src/main/preview-proxy.ts \
            src/renderer/src/components/StreamPreviewDialog.tsx \
            src/renderer/src/assets/images/dark/preview.svg \
            src/renderer/src/assets/images/light/preview.svg

      - name: Remove preview dependencies
        run: |
          npm uninstall \
            hls.js \
            mpegts.js

      # ============================================================
      # 轻量 UI 优化
      # 先不再大面积重写业务代码
      # ============================================================

      - name: Apply stable UI polish
        run: |
          cat > "$RUNNER_TEMP/ui.cjs" <<'NODE'
          const fs = require('fs')

          function patch(
            path,
            callback
          ) {
            let text =
              fs.readFileSync(
                path,
                'utf8'
              )

            text =
              callback(
                text
              )

            fs.writeFileSync(
              path,
              text,
              'utf8'
            )
          }

          // 主列表更合理的宽度和间距
          patch(
            'src/renderer/src/components/StreamConfigList/StreamConfigList.tsx',
            (
              text
            ) =>
              text.replace(
                'show-scrollbar flex flex-col gap-[12px] p-[24px] overflow-y-auto h-[calc(100vh-80px)]',

                'show-scrollbar mx-auto flex h-[calc(100vh-80px)] w-full max-w-[1100px] flex-col gap-3 overflow-y-auto px-5 py-4'
              )
          )

          // 操作按钮不绝对定位，避免标题重叠
          patch(
            'src/renderer/src/components/StreamConfigList/components/OperationBar.tsx',
            (
              text
            ) =>
              text.replace(
                'className="flex absolute right-0 gap-2"',

                'className="flex shrink-0 items-center gap-2 rounded-lg border bg-background/80 p-1.5 shadow-sm"'
              )
          )

          // 卡片间距
          patch(
            'src/renderer/src/components/StreamConfigList/components/StreamConfigCard.tsx',
            (
              text
            ) =>
              text
                .replace(
                  'className="relative"',
                  'className="relative overflow-hidden shadow-sm transition-shadow hover:shadow-md"'
                )
                .replace(
                  'truncate',
                  'truncate'
                )
          )

          // 设置页缩短垂直间距
          for (
            const path of [
              'src/renderer/src/components/StreamConfigSheet.tsx',

              'src/renderer/src/components/NavBar/components/DefaultSettingSheet.tsx'
            ]
          ) {
            patch(
              path,
              (
                text
              ) =>
                text
                  .replace(
                    'form className="space-y-8"',
                    'form className="space-y-5"'
                  )
                  .replace(
                    'SheetContent className="flex flex-col"',
                    'SheetContent className="flex w-[440px] flex-col sm:max-w-[440px]"'
                  )
            )
          }

          console.log(
            'Stable UI polish complete.'
          )
          NODE

          node "$RUNNER_TEMP/ui.cjs"

      # ============================================================
      # 版本
      # ============================================================

      - name: Update version
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          npm version \
            "$APP_VERSION" \
            --no-git-tag-version

      # ============================================================
      # 删除完整性检查
      # ============================================================

      - name: Verify preview removal
        run: |
          echo "Checking preview leftovers..."

          result="$(
            grep -R \
              -n \
              -E \
              "START_STREAM_PREVIEW|STOP_STREAM_PREVIEW|startStreamPreview|stopStreamPreview|startPreviewTranscoder|stopPreviewTranscoder|StreamPreviewDialog|preview-transcoder|preview-proxy" \
              src \
              || true
          )"

          if [ -n "$result" ]
          then
            echo "$result"
            exit 1
          fi

          node - <<'NODE'
          const pkg =
            require('./package.json')

          if (
            pkg.dependencies?.['hls.js']
          ) {
            throw new Error(
              'hls.js still exists'
            )
          }

          if (
            pkg.dependencies?.['mpegts.js']
          ) {
            throw new Error(
              'mpegts.js still exists'
            )
          }

          console.log(
            'Preview completely removed.'
          )
          NODE

      # ============================================================
      # 防止再误删正常 imports
      # ============================================================

      - name: Verify main imports intact
        run: |
          node - <<'NODE'
          const fs = require('fs')

          const text =
            fs.readFileSync(
              'src/main/index.ts',
              'utf8'
            )

          const required = [
            "from 'electron'",
            'ipcMain',
            'BrowserWindow',
            'RETRY_DOWNLOAD_DEP',
            'recordStreamFfmpegProcessMap',
            'downloadReq',
            'startFrpcProcess',
            'START_STREAM_RECORD'
          ]

          for (
            const token of required
          ) {
            if (
              !text.includes(
                token
              )
            ) {
              throw new Error(
                'Required main import/code missing: ' +
                token
              )
            }
          }

          console.log(
            'Main imports are intact.'
          )
          NODE

      - name: Verify recording core retained
        run: |
          grep -q \
            "getQualityRank" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "candidate_resolution" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "videoCodec('copy')" \
            src/main/ffmpeg/record.ts

          grep -q \
            "audioCodec('copy')" \
            src/main/ffmpeg/record.ts

          grep -q \
            "autoRecord: boolean" \
            type.d.ts

      # ============================================================
      # 关键：编译检查
      # ============================================================

      - name: TypeScript check
        run: |
          npm run typecheck

      - name: Build Electron app
        run: |
          npm run build

      - name: Package Windows x64
        run: |
          npx electron-builder \
            --win \
            nsis \
            --x64 \
            --publish never

      - name: Verify installer
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $package = Get-Content package.json | ConvertFrom-Json

          if ($package.version -ne $env:EXPECTED_VERSION) {
            throw "Version mismatch"
          }

          $installers = Get-ChildItem -Path dist -Filter "*-x64.exe"

          if (-not $installers -or $installers.Count -eq 0) {
            throw "Installer not generated"
          }

          $installers |
            Select-Object Name, Length, FullName |
            Format-Table -AutoSize

      # ============================================================
      # 成功后才提交
      # ============================================================

      - name: Commit stable V2.7
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit \
            -m "Remove preview and stabilize V2.7 UI" \
            || true

          git push \
            --force \
            origin \
            douyin-v2.7-ui-test

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-${{ inputs.version }}-douyin-v2.7-ui-windows-x64
          path: dist/*-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          {
            echo "# Fideo V2.7 Stable"
            echo
            echo "Version: \`$APP_VERSION\`"
            echo
            echo "- Preview removed"
            echo "- HLS / MPEGTS dependencies removed"
            echo "- Original recording imports protected"
            echo "- Recording quality logic retained"
            echo "- Notify-only mode retained"
            echo "- Basic layout spacing optimized"
          } >> "$GITHUB_STEP_SUMMARY"
