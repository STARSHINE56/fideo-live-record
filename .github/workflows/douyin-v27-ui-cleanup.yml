      - name: Apply global UI cleanup
        run: |
          cat > "$RUNNER_TEMP/ui-cleanup.cjs" <<'NODE'
          const fs = require('fs')

          function read(path) {
            return fs.readFileSync(
              path,
              'utf8'
            )
          }

          function write(
            path,
            text
          ) {
            fs.writeFileSync(
              path,
              text,
              'utf8'
            )
          }

          // --------------------------------------------------------
          // App layout
          // --------------------------------------------------------

          {
            const path =
              'src/renderer/src/App.tsx'

            let text =
              read(path)

            const oldLayout =
          `      <TitleBar />
                <NavBar />

                <StreamConfigList />

                <Toaster />`

            const newLayout =
          `      <div className="flex h-screen flex-col overflow-hidden bg-muted/20">
                <div className="shrink-0 bg-background">
                  <TitleBar />
                </div>

                <div className="shrink-0 border-b bg-background/95">
                  <NavBar />
                </div>

                <div className="min-h-0 flex-1">
                  <StreamConfigList />
                </div>
              </div>

              <Toaster />`

            if (
              !text.includes(
                oldLayout
              )
            ) {
              throw new Error(
                'App layout target not found'
              )
            }

            text =
              text.replace(
                oldLayout,
                newLayout
              )

            write(
              path,
              text
            )
          }

          // --------------------------------------------------------
          // Stream config sheet spacing
          // --------------------------------------------------------

          {
            const path =
              'src/renderer/src/components/StreamConfigSheet.tsx'

            let text =
              read(path)

            text =
              text.replace(
                'SheetContent className="flex flex-col"',
                'SheetContent className="flex w-[440px] flex-col sm:max-w-[440px]"'
              )

            text =
              text.replace(
                'form className="space-y-8"',
                'form className="space-y-5"'
              )

            text =
              text.replace(
                'className="show-scrollbar overflow-y-auto mr-[-14px]"',
                'className="show-scrollbar min-h-0 flex-1 overflow-y-auto pr-1"'
              )

            text =
              text.replace(
                'className=" pl-1 pr-4 pb-2"',
                'className="px-1 pb-3 pr-3"'
              )

            write(
              path,
              text
            )
          }

          // --------------------------------------------------------
          // Default settings spacing
          // --------------------------------------------------------

          {
            const path =
              'src/renderer/src/components/NavBar/components/DefaultSettingSheet.tsx'

            let text =
              read(path)

            text =
              text.replace(
                'SheetContent className="flex flex-col"',
                'SheetContent className="flex w-[440px] flex-col sm:max-w-[440px]"'
              )

            text =
              text.replace(
                'form className="space-y-8"',
                'form className="space-y-5"'
              )

            text =
              text.replace(
                'className="show-scrollbar overflow-y-auto mr-[-14px]"',
                'className="show-scrollbar min-h-0 flex-1 overflow-y-auto pr-1"'
              )

            text =
              text.replace(
                'className=" pl-1 pr-4 pb-2"',
                'className="px-1 pb-3 pr-3"'
              )

            write(
              path,
              text
            )
          }

          // --------------------------------------------------------
          // locales
          // --------------------------------------------------------

          {
            const path =
              'src/renderer/src/locales/locales.js'

            let text =
              read(path)

            text =
              text.replace(
                `all: 'All',`,
                `all: 'All',
                    no_tasks: 'No recording or monitoring tasks',
                    notify_only: 'Notify only',`
              )

            text =
              text.replace(
                `all: '全部',`,
                `all: '全部',
                    no_tasks: '当前没有符合条件的监控或录制任务',
                    notify_only: '仅通知',`
              )

            text = text
              .replace(
                /^\s*preview:\s*'.*?',\s*$/gm,
                ''
              )
              .replace(
                /^\s*preview_failed:\s*'.*?',\s*$/gm,
                ''
              )
              .replace(
                /^\s*preview_hls_unavailable:\s*'.*?',\s*$/gm,
                ''
              )
              .replace(
                /^\s*preview_stream_unavailable:\s*'.*?',\s*$/gm,
                ''
              )

            write(
              path,
              text
            )
          }

          // --------------------------------------------------------
          // Renderer CSP: preview removed, restore tighter policy
          // --------------------------------------------------------

          {
            const path =
              'src/renderer/index.html'

            let text =
              read(path)

            text =
              text.replace(
                /content="default-src[^"]+"/,
                `content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.xunhupay.com; connect-src 'self' https://xizhi.qqoq.net https:;"`

              )

            write(
              path,
              text
            )
          }

          console.log(
            'UI cleanup completed.'
          )
          NODE

