name: Douyin V2.6 FFmpeg Preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: "测试版本号，例如 1.1.5"
        required: true
        default: "1.1.5"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: FFmpeg HLS Preview
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout V2.5 tested source
        uses: actions/checkout@v4
        with:
          ref: douyin-v2.5-test
          fetch-depth: 0

      - name: Create V2.6 test branch
        run: |
          git switch -C douyin-v2.6-test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      # ==========================================================
      # 新建 FFmpeg 预览服务
      # ==========================================================

      - name: Create FFmpeg preview service
        run: |
          cat > src/main/preview-transcoder.ts <<'TS'
          import fs from 'node:fs'
          import path from 'node:path'
          import http, {
            type Server,
            type ServerResponse
          } from 'node:http'
          import os from 'node:os'

          import execa, {
            type ExecaChildProcess
          } from 'execa'

          import ffmpeg from './ffmpeg'

          interface PreviewOptions {
            streamUrl: string
            roomUrl: string
            cookie?: string
            proxy?: string
          }

          let server:
            | Server
            | null = null

          let serverPort = 0

          let process:
            | ExecaChildProcess
            | null = null

          let previewDir = ''

          function ensurePreviewDir() {
            if (
              previewDir &&
              fs.existsSync(
                previewDir
              )
            ) {
              return
            }

            previewDir =
              fs.mkdtempSync(
                path.join(
                  os.tmpdir(),
                  'fideo-preview-'
                )
              )
          }

          function removePreviewDir() {
            if (!previewDir) {
              return
            }

            try {
              fs.rmSync(
                previewDir,
                {
                  recursive: true,
                  force: true
                }
              )
            } catch {
              // Ignore cleanup errors.
            }

            previewDir = ''
          }

          function sendFile(
            filePath: string,
            res: ServerResponse
          ) {
            if (
              !fs.existsSync(
                filePath
              )
            ) {
              res.statusCode =
                404

              res.end(
                'Not Found'
              )

              return
            }

            const ext =
              path.extname(
                filePath
              ).toLowerCase()

            if (
              ext === '.m3u8'
            ) {
              res.setHeader(
                'Content-Type',
                'application/vnd.apple.mpegurl'
              )
            } else if (
              ext === '.ts'
            ) {
              res.setHeader(
                'Content-Type',
                'video/mp2t'
              )
            } else {
              res.setHeader(
                'Content-Type',
                'application/octet-stream'
              )
            }

            res.setHeader(
              'Access-Control-Allow-Origin',
              '*'
            )

            res.setHeader(
              'Cache-Control',
              'no-store'
            )

            fs.createReadStream(
              filePath
            ).pipe(res)
          }

          async function ensureServer() {
            if (
              server &&
              serverPort > 0
            ) {
              return
            }

            server =
              http.createServer(
                (
                  req,
                  res
                ) => {
                  res.setHeader(
                    'Access-Control-Allow-Origin',
                    '*'
                  )

                  res.setHeader(
                    'Access-Control-Allow-Headers',
                    '*'
                  )

                  if (
                    req.method ===
                    'OPTIONS'
                  ) {
                    res.statusCode =
                      204

                    res.end()

                    return
                  }

                  const reqUrl =
                    new URL(
                      req.url ||
                        '/',

                      'http://127.0.0.1'
                    )

                  if (
                    reqUrl.pathname ===
                    '/health'
                  ) {
                    res.statusCode =
                      200

                    res.end(
                      'ok'
                    )

                    return
                  }

                  if (
                    reqUrl.pathname ===
                    '/preview.m3u8'
                  ) {
                    sendFile(
                      path.join(
                        previewDir,
                        'preview.m3u8'
                      ),
                      res
                    )

                    return
                  }

                  if (
                    reqUrl.pathname.startsWith(
                      '/segment-'
                    ) &&
                    reqUrl.pathname.endsWith(
                      '.ts'
                    )
                  ) {
                    const safeName =
                      path.basename(
                        reqUrl.pathname
                      )

                    sendFile(
                      path.join(
                        previewDir,
                        safeName
                      ),
                      res
                    )

                    return
                  }

                  res.statusCode =
                    404

                  res.end(
                    'Not Found'
                  )
                }
              )

            await new Promise<void>(
              (
                resolve,
                reject
              ) => {
                const current =
                  server!

                const onError =
                  (error: Error) => {
                    reject(error)
                  }

                current.once(
                  'error',
                  onError
                )

                current.listen(
                  0,
                  '127.0.0.1',
                  () => {
                    current.removeListener(
                      'error',
                      onError
                    )

                    const address =
                      current.address()

                    if (
                      !address ||
                      typeof address ===
                        'string'
                    ) {
                      reject(
                        new Error(
                          'Unable to bind preview server'
                        )
                      )

                      return
                    }

                    serverPort =
                      address.port

                    resolve()
                  }
                )
              }
            )
          }

          async function waitForPlaylist(
            timeoutMs = 15000
          ) {
            const start =
              Date.now()

            const playlist =
              path.join(
                previewDir,
                'preview.m3u8'
              )

            while (
              Date.now() -
                start <
              timeoutMs
            ) {
              if (
                fs.existsSync(
                  playlist
                )
              ) {
                const stat =
                  fs.statSync(
                    playlist
                  )

                if (
                  stat.size >
                  20
                ) {
                  return true
                }
              }

              await new Promise(
                (resolve) =>
                  setTimeout(
                    resolve,
                    250
                  )
              )
            }

            return false
          }

          export async function stopPreviewTranscoder() {
            if (process) {
              try {
                process.kill(
                  'SIGKILL'
                )
              } catch {
                // Ignore.
              }

              process = null
            }

            if (server) {
              const current =
                server

              server = null
              serverPort = 0

              try {
                const extended =
                  current as Server & {
                    closeAllConnections?: () => void
                  }

                extended
                  .closeAllConnections
                  ?.()
              } catch {
                // Ignore.
              }

              await new Promise<void>(
                (resolve) => {
                  try {
                    current.close(
                      () => resolve()
                    )
                  } catch {
                    resolve()
                  }
                }
              )
            }

            removePreviewDir()
          }

          export async function startPreviewTranscoder(
            options: PreviewOptions
          ) {
            await stopPreviewTranscoder()

            ensurePreviewDir()

            await ensureServer()

            const output =
              path.join(
                previewDir,
                'preview.m3u8'
              )

            const segment =
              path.join(
                previewDir,
                'segment-%05d.ts'
              )

            const args: string[] = [
              '-hide_banner',
              '-loglevel',
              'warning',
              '-rw_timeout',
              '20000000',
              '-reconnect',
              '1',
              '-reconnect_streamed',
              '1',
              '-reconnect_delay_max',
              '5',

              '-headers',
              'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/123.0.0.0 Safari/537.36\r\n',

              '-headers',
              `Referer: ${options.roomUrl}\r\n`
            ]

            if (
              options.cookie
            ) {
              args.push(
                '-headers',
                `Cookie: ${options.cookie}\r\n`
              )
            }

            if (
              options.proxy
            ) {
              args.push(
                '-http_proxy',
                options.proxy
              )
            }

            args.push(
              '-i',
              options.streamUrl,

              '-map',
              '0:v:0',

              '-map',
              '0:a:0?',

              '-c:v',
              'libx264',

              '-preset',
              'veryfast',

              '-tune',
              'zerolatency',

              '-profile:v',
              'main',

              '-level',
              '4.1',

              '-pix_fmt',
              'yuv420p',

              '-r',
              '30',

              '-g',
              '60',

              '-keyint_min',
              '60',

              '-sc_threshold',
              '0',

              '-b:v',
              '1800k',

              '-maxrate',
              '2200k',

              '-bufsize',
              '3600k',

              '-c:a',
              'aac',

              '-b:a',
              '128k',

              '-ar',
              '48000',

              '-ac',
              '2',

              '-f',
              'hls',

              '-hls_time',
              '1',

              '-hls_list_size',
              '5',

              '-hls_delete_threshold',
              '2',

              '-hls_flags',
              'delete_segments+append_list+omit_endlist+independent_segments',

              '-hls_segment_filename',
              segment,

              output
            )

            process =
              execa(
                ffmpeg.ffmpegPath,
                args
              )

            process.on(
              'error',
              () => {
                process = null
              }
            )

            process
              .stderr
              ?.on(
                'data',
                () => {
                  // Do not log stream URLs or cookies.
                }
              )

            const ready =
              await waitForPlaylist()

            if (!ready) {
              await stopPreviewTranscoder()

              throw new Error(
                'Preview stream failed to start'
              )
            }

            return {
              url:
                `http://127.0.0.1:${serverPort}/preview.m3u8`
            }
          }
          TS

      # ==========================================================
      # V2.6 补丁
      # ==========================================================

      - name: Create V2.6 source patch
        run: |
          cat > "$RUNNER_TEMP/patch-v26.cjs" <<'NODE'
          const fs =
            require('fs')

          function read(path) {
            return fs.readFileSync(
              path,
              'utf8'
            )
          }

          function write(
            path,
            content
          ) {
            fs.writeFileSync(
              path,
              content,
              'utf8'
            )
          }

          function mustReplace(
            source,
            pattern,
            replacement,
            label
          ) {
            if (
              !pattern.test(
                source
              )
            ) {
              throw new Error(
                `Patch target not found: ${label}`
              )
            }

            return source.replace(
              pattern,
              replacement
            )
          }


          // ====================================================
          // Main index
          // ====================================================

          const mainPath =
            'src/main/index.ts'

          let main =
            read(mainPath)

          main =
            main.replace(
              /import\s*\{\s*startPreviewProxy,\s*stopPreviewProxy\s*\}\s*from\s*'\.\/preview-proxy'/m,

              `import {
                startPreviewTranscoder,
                stopPreviewTranscoder
              } from './preview-transcoder'`
            )

          if (
            !main.includes(
              'startPreviewTranscoder'
            )
          ) {
            throw new Error(
              'Preview transcoder import missing'
            )
          }

          main =
            main.replace(
              /await\s+stopPreviewProxy\(\)/g,

              `await stopPreviewTranscoder()`
            )

          main =
            main.replace(
              /void\s+stopPreviewProxy\(\)/g,

              `void stopPreviewTranscoder()`
            )

          const previewHandlerPattern =
            /ipcMain\.handle\(\s*START_STREAM_PREVIEW,[\s\S]*?\n\s*\)\s*\n\s*\n\s*ipcMain\.handle\(\s*STOP_STREAM_PREVIEW,[\s\S]*?\n\s*\)/m

          const previewHandlers =
            `ipcMain.handle(
              START_STREAM_PREVIEW,
              async (
                _,
                info: {
                  streamUrl: string
                  roomUrl: string
                  proxy?: string
                  cookie?: string
                }
              ) => {
                const effectiveCookie =
                  await getEffectiveCookie(
                    info.roomUrl,
                    info.cookie
                  )

                return startPreviewTranscoder({
                  streamUrl:
                    info.streamUrl,

                  roomUrl:
                    info.roomUrl,

                  proxy:
                    info.proxy,

                  cookie:
                    effectiveCookie
                })
              }
            )

            ipcMain.handle(
              STOP_STREAM_PREVIEW,
              async () => {
                await stopPreviewTranscoder()
              }
            )`

          main =
            mustReplace(
              main,
              previewHandlerPattern,
              previewHandlers,
              'preview handlers'
            )

          write(
            mainPath,
            main
          )


          // ====================================================
          // Preview dialog: HLS only
          // ====================================================

          const previewPath =
            'src/renderer/src/components/StreamPreviewDialog.tsx'

          const previewSource =
          `import { useEffect, useRef, useState } from 'react'
          import Hls from 'hls.js'

          import {
            Dialog,
            DialogContent,
            DialogHeader,
            DialogTitle
          } from '@/shadcn/ui/dialog'

          interface StreamPreviewDialogProps {
            open: boolean
            onOpenChange: (
              open: boolean
            ) => void
            title: string
            url: string
            type: 'hls' | 'flv'
            errorText: string
          }

          export default function StreamPreviewDialog(
            props: StreamPreviewDialogProps
          ) {
            const {
              open,
              onOpenChange,
              title,
              url,
              errorText
            } = props

            const videoRef =
              useRef<HTMLVideoElement | null>(
                null
              )

            const [error, setError] =
              useState(false)

            useEffect(() => {
              const video =
                videoRef.current

              if (
                !open ||
                !url ||
                !video
              ) {
                return
              }

              setError(false)

              let hls:
                | Hls
                | null = null

              const cleanup = () => {
                if (hls) {
                  try {
                    hls.destroy()
                  } catch {
                    // Ignore.
                  }

                  hls = null
                }

                try {
                  video.pause()

                  video.removeAttribute(
                    'src'
                  )

                  video.load()
                } catch {
                  // Ignore.
                }
              }

              if (
                video.canPlayType(
                  'application/vnd.apple.mpegurl'
                )
              ) {
                video.src =
                  url

                const result =
                  video.play()

                result.catch(
                  () => {}
                )

                return cleanup
              }

              if (
                !Hls.isSupported()
              ) {
                setError(true)

                return cleanup
              }

              hls =
                new Hls({
                  lowLatencyMode:
                    true,

                  maxBufferLength:
                    6,

                  maxMaxBufferLength:
                    12,

                  backBufferLength:
                    5,

                  liveSyncDurationCount:
                    2,

                  liveMaxLatencyDurationCount:
                    5,

                  enableWorker:
                    true
                })

              hls.loadSource(
                url
              )

              hls.attachMedia(
                video
              )

              hls.on(
                Hls.Events.MANIFEST_PARSED,
                () => {
                  const result =
                    video.play()

                  result.catch(
                    () => {}
                  )
                }
              )

              hls.on(
                Hls.Events.ERROR,
                (
                  _,
                  data
                ) => {
                  if (
                    !data.fatal
                  ) {
                    return
                  }

                  if (
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                  ) {
                    try {
                      hls?.startLoad()
                      return
                    } catch {
                      setError(true)
                      return
                    }
                  }

                  if (
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                  ) {
                    try {
                      hls?.recoverMediaError()
                      return
                    } catch {
                      setError(true)
                      return
                    }
                  }

                  setError(true)
                }
              )

              return cleanup
            }, [
              open,
              url
            ])

            return (
              <Dialog
                open={open}
                onOpenChange={
                  onOpenChange
                }
              >
                <DialogContent className="max-w-[900px]">
                  <DialogHeader>
                    <DialogTitle>
                      {title}
                    </DialogTitle>
                  </DialogHeader>

                  {error ? (
                    <div className="py-12 text-center text-sm text-destructive">
                      {errorText}
                    </div>
                  ) : (
                    <video
                      ref={videoRef}
                      controls
                      autoPlay
                      playsInline
                      className="w-full max-h-[70vh] bg-black rounded-md"
                    />
                  )}
                </DialogContent>
              </Dialog>
            )
          }
          `

          write(
            previewPath,
            previewSource
          )


          // ====================================================
          // OperationBar:
          // 所有可用直播流都交给 FFmpeg 预览
          // ====================================================

          const opPath =
            'src/renderer/src/components/StreamConfigList/components/OperationBar.tsx'

          let op =
            read(opPath)

          const previewStart =
            op.indexOf(
              '  const openPreviewStream = async ('
            )

          const previewEnd =
            op.indexOf(
              '  useEffect(() => {',
              previewStart
            )

          if (
            previewStart < 0 ||
            previewEnd < 0 ||
            previewEnd <=
              previewStart
          ) {
            throw new Error(
              'Preview block not found'
            )
          }

          const newPreview =
          `  const handlePreviewOpenChange = (
              open: boolean
            ) => {
              setPreviewOpen(
                open
              )

              if (!open) {
                setPreviewUrl('')

                void window.api
                  .stopStreamPreview()
              }
            }

            const handlePreviewClick = async () => {
              setIsLoadingPreview(
                true
              )

              try {
                const {
                  code,
                  liveUrls
                } =
                  await window.api.getLiveUrls({
                    roomUrl:
                      streamConfig.roomUrl,

                    cookie:
                      streamConfig.cookie,

                    proxy:
                      streamConfig.proxy,

                    title:
                      streamConfig.title
                  })

                if (
                  code !==
                  SUCCESS_CODE
                ) {
                  toast({
                    title:
                      streamConfig.title,

                    description:
                      t(
                        errorCodeToI18nMessage(
                          code,
                          'error.get_line.'
                        )
                      ),

                    variant:
                      'destructive'
                  })

                  return
                }

                if (
                  !Array.isArray(
                    liveUrls
                  ) ||
                  liveUrls.length ===
                    0
                ) {
                  toast({
                    title:
                      streamConfig.title,

                    description:
                      t(
                        'stream_config.preview_stream_unavailable'
                      ),

                    variant:
                      'destructive'
                  })

                  return
                }

                const selectedUrl =
                  liveUrls[0]

                const proxyResult =
                  await window.api.startStreamPreview({
                    streamUrl:
                      selectedUrl,

                    roomUrl:
                      streamConfig.roomUrl,

                    cookie:
                      streamConfig.cookie,

                    proxy:
                      streamConfig.proxy
                  })

                setPreviewType(
                  'hls'
                )

                setPreviewUrl(
                  proxyResult.url
                )

                setPreviewOpen(
                  true
                )
              } catch {
                toast({
                  title:
                    streamConfig.title,

                  description:
                    t(
                      'stream_config.preview_failed'
                    ),

                  variant:
                    'destructive'
                })
              } finally {
                setIsLoadingPreview(
                  false
                )
              }
            }


          `

          op =
            op.slice(
              0,
              previewStart
            ) +
            newPreview +
            op.slice(
              previewEnd
            )

          write(
            opPath,
            op
          )


          // ====================================================
          // Locales
          // ====================================================

          const localePath =
            'src/renderer/src/locales/locales.js'

          let locale =
            read(localePath)

          locale =
            locale.replace(
              `preview_failed: 'Unable to play this live stream. Please try again.'`,

              `preview_failed: 'Unable to generate preview. Please try again.'`
            )

          locale =
            locale.replace(
              `preview_failed: '当前直播流无法播放，请稍后重试'`,

              `preview_failed: '无法生成直播预览，请稍后重试'`
            )

          write(
            localePath,
            locale
          )


          // ====================================================
          // Remove old proxy file reference not needed
          // ====================================================

          if (
            fs.existsSync(
              'src/main/preview-proxy.ts'
            )
          ) {
            fs.rmSync(
              'src/main/preview-proxy.ts'
            )
          }


          // ====================================================
          // Validation
          // ====================================================

          const finalMain =
            read(mainPath)

          const finalPreview =
            read(previewPath)

          const finalOp =
            read(opPath)

          if (
            !finalMain.includes(
              'startPreviewTranscoder'
            )
          ) {
            throw new Error(
              'FFmpeg preview integration missing'
            )
          }

          if (
            !finalPreview.includes(
              'Hls.isSupported'
            )
          ) {
            throw new Error(
              'HLS preview player missing'
            )
          }

          if (
            finalPreview.includes(
              'mpegts'
            )
          ) {
            throw new Error(
              'Old mpegts preview still exists'
            )
          }

          if (
            !finalOp.includes(
              'liveUrls[0]'
            )
          ) {
            throw new Error(
              'Preview source selection missing'
            )
          }

          console.log(
            'V2.6 patch completed successfully.'
          )
          NODE

      - name: Validate V2.6 patch syntax
        run: |
          node --check \
            "$RUNNER_TEMP/patch-v26.cjs"

      - name: Apply V2.6 patch
        run: |
          node \
            "$RUNNER_TEMP/patch-v26.cjs"

      # ==========================================================
      # Version
      # ==========================================================

      - name: Update version
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          npm version \
            "$APP_VERSION" \
            --no-git-tag-version

      # ==========================================================
      # Source verification
      # ==========================================================

      - name: Verify V2.6 changes
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          echo "Checking FFmpeg preview transcoder..."

          grep -q \
            "libx264" \
            src/main/preview-transcoder.ts

          grep -q \
            "aac" \
            src/main/preview-transcoder.ts

          grep -q \
            "preview.m3u8" \
            src/main/preview-transcoder.ts

          grep -q \
            "127.0.0.1" \
            src/main/preview-transcoder.ts

          grep -q \
            "startPreviewTranscoder" \
            src/main/index.ts

          grep -q \
            "stopPreviewTranscoder" \
            src/main/index.ts

          echo "Checking renderer preview..."

          grep -q \
            "Hls.isSupported" \
            src/renderer/src/components/StreamPreviewDialog.tsx

          if grep -q \
            "mpegts" \
            src/renderer/src/components/StreamPreviewDialog.tsx
          then
            echo \
              "ERROR: old mpegts preview remains"

            exit 1
          fi

          echo "Checking monitor-only feature remains..."

          grep -q \
            "autoRecord: boolean" \
            type.d.ts

          grep -q \
            'name="autoRecord"' \
            src/renderer/src/components/StreamConfigSheet.tsx

          grep -q \
            "handleMonitorOnly" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          grep -q \
            "showNotification" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          echo "Checking recording quality remains untouched..."

          grep -q \
            "getQualityRank" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "candidate_resolution" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "videoCodec('copy')" \
            src/main/ffmpeg/record.ts

          grep -q \
            "audioCodec('copy')" \
            src/main/ffmpeg/record.ts

          if grep -Fq \
            "inputOptions(['-re'])" \
            src/main/ffmpeg/record.ts
          then
            echo \
              "ERROR: -re returned to recording path"

            exit 1
          fi

          node -e "
          const p =
            require('./package.json');

          if (
            p.version !==
            process.env.APP_VERSION
          ) {
            console.error(
              'Version mismatch:',
              p.version
            );

            process.exit(1);
          }

          console.log(
            'Version:',
            p.version
          );
          "

          echo \
            "All V2.6 source checks passed."

      # ==========================================================
      # TypeScript / Build
      # ==========================================================

      - name: TypeScript check
        run: |
          npm run typecheck

      - name: Build Electron app
        run: |
          npm run build

      # ==========================================================
      # Windows x64
      # ==========================================================

      - name: Package Windows x64
        run: |
          npx electron-builder \
            --win \
            nsis \
            --x64 \
            --publish never

      - name: Verify Windows installer
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $package =
            Get-Content package.json |
            ConvertFrom-Json

          if (
            $package.version -ne
            $env:EXPECTED_VERSION
          ) {
            throw `
              "Version mismatch. Expected $env:EXPECTED_VERSION, got $($package.version)"
          }

          $installers =
            Get-ChildItem `
              -Path dist `
              -Filter "*-x64.exe"

          if (
            $installers.Count -eq 0
          ) {
            throw `
              "Windows x64 installer not generated."
          }

          Write-Host \
            "Generated installer:"

          $installers |
            Select-Object \
              Name,
              Length,
              FullName

      # ==========================================================
      # Save test branch
      # ==========================================================

      - name: Commit V2.6 tested source
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            package.json \
            package-lock.json \
            src/main/index.ts \
            src/main/preview-transcoder.ts \
            src/renderer/src/components/StreamPreviewDialog.tsx \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx \
            src/renderer/src/locales/locales.js

          git rm \
            --ignore-unmatch \
            src/main/preview-proxy.ts

          if git diff --cached --quiet
          then
            echo \
              "No source changes to commit."
          else
            git commit \
              -m "Replace Douyin preview with FFmpeg HLS transcoder"
          fi

          git push \
            --force \
            origin \
            douyin-v2.6-test

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-${{ inputs.version }}-douyin-v2.6-windows-x64
          path: dist/*-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          {
            echo "# Fideo Douyin V2.6"
            echo
            echo "Version: \`$APP_VERSION\`"
            echo
            echo "Branch: \`douyin-v2.6-test\`"
            echo
            echo "Changes:"
            echo
            echo "- Replaced direct FLV preview with FFmpeg transcoding"
            echo "- Preview input can be FLV / HLS / HEVC / H264"
            echo "- Preview video converted to H264"
            echo "- Preview audio converted to AAC"
            echo "- Preview served as localhost HLS"
            echo "- Preview FFmpeg stops when preview dialog closes"
            echo "- Formal recording remains stream-copy"
            echo "- Highest-quality Douyin recording retained"
            echo "- Auto-record switch retained"
            echo "- Monitor-only notification mode retained"
            echo "- Windows x64 test installer"
          } >> "$GITHUB_STEP_SUMMARY"
