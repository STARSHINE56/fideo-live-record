name: Prepare V2.9.1 Monitor Status

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Detailed Monitor Status
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout current release source
        uses: actions/checkout@v4
        with:
          ref: douyin-v2.8-anchor-monitor-test
          fetch-depth: 0

      - name: Create safety backup
        shell: bash
        run: |
          git push \
            origin \
            HEAD:refs/heads/backup-before-monitor-status \
            --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          npm ci

      - name: Patch detailed monitor status
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $script = @'
          const fs = require('fs')

          const utilsPath =
            'src/renderer/src/lib/utils.ts'

          const operationPath =
            'src/renderer/src/components/StreamConfigList/components/OperationBar.tsx'

          const cardPath =
            'src/renderer/src/components/StreamConfigList/components/StreamConfigCard.tsx'

          const listPath =
            'src/renderer/src/components/StreamConfigList/StreamConfigList.tsx'

          const localePath =
            'src/renderer/src/locales/locales.js'

          function read(path) {
            return fs
              .readFileSync(
                path,
                'utf8'
              )
              .replace(
                /\r\n/g,
                '\n'
              )
          }

          function write(path, text) {
            fs.writeFileSync(
              path,
              text,
              'utf8'
            )
          }

          function replaceRequired(
            text,
            regex,
            replacement,
            name
          ) {
            if (
              !regex.test(text)
            ) {
              throw new Error(
                name + ' not found'
              )
            }

            regex.lastIndex = 0

            return text.replace(
              regex,
              replacement
            )
          }

          // ========================================================
          // 1. StreamStatus
          // ========================================================

          let utils =
            read(
              utilsPath
            )

          if (
            !utils.includes(
              'MONITORING_OFFLINE'
            )
          ) {
            utils =
              replaceRequired(
                utils,

                /export enum StreamStatus\s*\{\s*NOT_STARTED\s*=\s*0,\s*PREPARING_TO_RECORD\s*=\s*1,\s*MONITORING\s*=\s*2,\s*RECORDING\s*=\s*3,\s*VIDEO_FORMAT_CONVERSION\s*=\s*4\s*\}/,

                [
                  'export enum StreamStatus {',
                  '  NOT_STARTED = 0,',
                  '  PREPARING_TO_RECORD = 1,',
                  '  MONITORING = 2,',
                  '  RECORDING = 3,',
                  '  VIDEO_FORMAT_CONVERSION = 4,',
                  '  MONITORING_OFFLINE = 5,',
                  '  MONITORING_LIVE = 6,',
                  '  MONITORING_ERROR = 7',
                  '}'
                ].join('\n'),

                'StreamStatus enum'
              )
          }

          write(
            utilsPath,
            utils
          )

          // ========================================================
          // 2. OperationBar
          // ========================================================

          let operation =
            read(
              operationPath
            )

          // --------------------------------------------------------
          // 仅监控模式：检测到已开播
          // --------------------------------------------------------

          if (
            !operation.includes(
              'StreamStatus.MONITORING_LIVE'
            )
          ) {
            operation =
              replaceRequired(
                operation,

                /(if\s*\(\s*result\.code\s*===\s*SUCCESS_CODE\s*&&\s*Array\.isArray\(\s*result\.liveUrls\s*\)\s*&&\s*result\.liveUrls\.length\s*>\s*0\s*\)\s*\{)/,

                [
                  '$1',
                  '        await updateStreamConfig(',
                  '          {',
                  '            ...latest,',
                  '',
                  '            status:',
                  '              StreamStatus.MONITORING_LIVE',
                  '          },',
                  '',
                  '          streamConfig.id',
                  '        )',
                  ''
                ].join('\n'),

                'Monitor live result'
              )
          }

          // --------------------------------------------------------
          // 仅监控模式：未开播
          // --------------------------------------------------------

          if (
            !operation.includes(
              'status:\n              StreamStatus.MONITORING_OFFLINE'
            )
          ) {
            operation =
              replaceRequired(
                operation,

                /(if\s*\(\s*result\.code\s*===\s*CRAWLER_ERROR_CODE\.NOT_URLS\s*\)\s*\{\s*liveNotifiedRef\.current\s*=\s*false)/,

                [
                  '$1',
                  '',
                  '        await updateStreamConfig(',
                  '          {',
                  '            ...latest,',
                  '',
                  '            status:',
                  '              StreamStatus.MONITORING_OFFLINE',
                  '          },',
                  '',
                  '          streamConfig.id',
                  '        )'
                ].join('\n'),

                'Monitor offline result'
              )
          }

          // --------------------------------------------------------
          // 仅监控模式：网络/解析临时异常
          // --------------------------------------------------------

          if (
            !operation.includes(
              'status:\n              StreamStatus.MONITORING_ERROR'
            )
          ) {
            operation =
              replaceRequired(
                operation,

                /(if\s*\(\s*result\.code\s*===\s*UNKNOWN_CODE\s*\)\s*\{)/,

                [
                  '$1',
                  '        await updateStreamConfig(',
                  '          {',
                  '            ...latest,',
                  '',
                  '            status:',
                  '              StreamStatus.MONITORING_ERROR',
                  '          },',
                  '',
                  '          streamConfig.id',
                  '        )',
                  ''
                ].join('\n'),

                'Monitor unknown error'
              )
          }

          // --------------------------------------------------------
          // 仅监控模式：其它错误
          // --------------------------------------------------------

          if (
            !operation.includes(
              'const monitoringOtherErrorStatus'
            )
          ) {
            operation =
              replaceRequired(
                operation,

                /(\s+if\s*\(isFirst\)\s*\{\s*const errMessage\s*=\s*crawlerErrorCodeToI18nMessage\()/,

                [
                  '',
                  '      const monitoringOtherErrorStatus =',
                  '        StreamStatus.MONITORING_ERROR',
                  '',
                  '      await updateStreamConfig(',
                  '        {',
                  '          ...latest,',
                  '',
                  '          status:',
                  '            monitoringOtherErrorStatus',
                  '        },',
                  '',
                  '        streamConfig.id',
                  '      )',
                  '',
                  '$1'
                ].join('\n'),

                'Monitor other error'
              )
          }

          // --------------------------------------------------------
          // 自动录制模式等待主播：
          // NOT_URLS = 未开播
          // UNKNOWN = 检测异常
          // --------------------------------------------------------

          const waitingStatusRegex =
            /status:\s*StreamStatus\.MONITORING\s*\}\s*,\s*streamConfig\.id\s*\)\s*return\s*\}\s*if\s*\(\s*Object\.values/

          if (
            waitingStatusRegex.test(
              operation
            )
          ) {
            operation =
              operation.replace(
                /status:\s*StreamStatus\.MONITORING(?=\s*\}\s*,\s*streamConfig\.id\s*\)\s*return\s*\}\s*if\s*\(\s*Object\.values)/,

                [
                  'status:',
                  '              code ===',
                  '                CRAWLER_ERROR_CODE.NOT_URLS',
                  '                ? StreamStatus.MONITORING_OFFLINE',
                  '                : StreamStatus.MONITORING_ERROR'
                ].join('\n')
              )
          }

          write(
            operationPath,
            operation
          )

          // ========================================================
          // 3. 卡片状态显示
          // ========================================================

          let card =
            read(
              cardPath
            )

          if (
            !card.includes(
              'stream_config.monitoring_offline'
            )
          ) {
            card =
              replaceRequired(
                card,

                /const streamStatusToLocaleMap\s*=\s*\{\s*0:\s*'stream_config\.not_started',\s*1:\s*'stream_config\.preparing_to_record',\s*2:\s*'stream_config\.monitoring',\s*3:\s*'stream_config\.recording',\s*4:\s*'stream_config\.video_format_conversion'\s*\}/,

                [
                  'const streamStatusToLocaleMap = {',
                  "  0: 'stream_config.not_started',",
                  "  1: 'stream_config.preparing_to_record',",
                  "  2: 'stream_config.monitoring',",
                  "  3: 'stream_config.recording',",
                  "  4: 'stream_config.video_format_conversion',",
                  "  5: 'stream_config.monitoring_offline',",
                  "  6: 'stream_config.monitoring_live',",
                  "  7: 'stream_config.monitoring_error'",
                  '}'
                ].join('\n'),

                'Status locale map'
              )
          }

          write(
            cardPath,
            card
          )

          // ========================================================
          // 4. 顶部“监控中”筛选兼容 4 种监控状态
          // ========================================================

          let list =
            read(
              listPath
            )

          if (
            !list.includes(
              'StreamStatus.MONITORING_OFFLINE'
            )
          ) {
            list =
              replaceRequired(
                list,

                /\.filter\(\(streamConfig\)\s*=>\s*streamConfig\.status\s*===\s*Number\(navSelectedStatus\)\)/,

                [
                  '.filter((streamConfig) => {',
                  '        const selectedStatus =',
                  '          Number(navSelectedStatus)',
                  '',
                  '        if (',
                  '          selectedStatus ===',
                  '          StreamStatus.MONITORING',
                  '        ) {',
                  '          return [',
                  '            StreamStatus.MONITORING,',
                  '            StreamStatus.MONITORING_OFFLINE,',
                  '            StreamStatus.MONITORING_LIVE,',
                  '            StreamStatus.MONITORING_ERROR',
                  '          ].includes(',
                  '            streamConfig.status',
                  '          )',
                  '        }',
                  '',
                  '        return (',
                  '          streamConfig.status ===',
                  '          selectedStatus',
                  '        )',
                  '      })'
                ].join('\n'),

                'Status filter'
              )
          }

          // ========================================================
          // 5. 停止录制/停止监控兼容新增状态
          // ========================================================

          if (
            !list.includes(
              'streamConfig.status === StreamStatus.MONITORING_LIVE'
            )
          ) {
            list =
              replaceRequired(
                list,

                /\(streamConfig\.status\s*===\s*StreamStatus\.PREPARING_TO_RECORD\s*\|\|\s*streamConfig\.status\s*===\s*StreamStatus\.MONITORING\)/,

                [
                  '(',
                  '          streamConfig.status ===',
                  '            StreamStatus.PREPARING_TO_RECORD ||',
                  '          streamConfig.status ===',
                  '            StreamStatus.MONITORING ||',
                  '          streamConfig.status ===',
                  '            StreamStatus.MONITORING_OFFLINE ||',
                  '          streamConfig.status ===',
                  '            StreamStatus.MONITORING_LIVE ||',
                  '          streamConfig.status ===',
                  '            StreamStatus.MONITORING_ERROR',
                  '        )'
                ].join('\n'),

                'Stop monitoring status condition'
              )
          }

          write(
            listPath,
            list
          )

          // ========================================================
          // 6. 中英文状态文案
          // ========================================================

          let locales =
            read(
              localePath
            )

          if (
            !locales.includes(
              "monitoring_offline: 'Monitoring · Offline'"
            )
          ) {
            locales =
              replaceRequired(
                locales,

                /monitoring:\s*'Monitoring',/,

                [
                  "monitoring: 'Monitoring',",
                  "        monitoring_offline: 'Monitoring · Offline',",
                  "        monitoring_live: 'Monitoring · Live',",
                  "        monitoring_error: 'Monitoring · Check Failed',"
                ].join('\n'),

                'English monitoring locale'
              )
          }

          if (
            !locales.includes(
              "monitoring_offline: '监控中 · 未开播'"
            )
          ) {
            locales =
              replaceRequired(
                locales,

                /monitoring:\s*'监控中',/,

                [
                  "monitoring: '监控中',",
                  "        monitoring_offline: '监控中 · 未开播',",
                  "        monitoring_live: '监控中 · 已开播',",
                  "        monitoring_error: '监控中 · 检测异常',"
                ].join('\n'),

                'Chinese monitoring locale'
              )
          }

          write(
            localePath,
            locales
          )

          console.log(
            'Detailed monitor status patch complete.'
          )
          '@

          $patchPath =
            Join-Path `
              $env:RUNNER_TEMP `
              "patch-monitor-status.cjs"

          Set-Content `
            -Path $patchPath `
            -Value $script `
            -Encoding utf8

          node $patchPath

      - name: Verify detailed monitor status
        shell: bash
        run: |
          grep -q \
            "MONITORING_OFFLINE = 5" \
            src/renderer/src/lib/utils.ts

          grep -q \
            "MONITORING_LIVE = 6" \
            src/renderer/src/lib/utils.ts

          grep -q \
            "MONITORING_ERROR = 7" \
            src/renderer/src/lib/utils.ts

          grep -q \
            "StreamStatus.MONITORING_OFFLINE" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          grep -q \
            "StreamStatus.MONITORING_LIVE" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          grep -q \
            "StreamStatus.MONITORING_ERROR" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          grep -q \
            "StreamStatus.MONITORING_OFFLINE" \
            src/renderer/src/components/StreamConfigList/StreamConfigList.tsx

          grep -q \
            "监控中 · 未开播" \
            src/renderer/src/locales/locales.js

          grep -q \
            "监控中 · 已开播" \
            src/renderer/src/locales/locales.js

          grep -q \
            "监控中 · 检测异常" \
            src/renderer/src/locales/locales.js

          echo "Detailed monitor statuses verified."

      - name: Verify Xizhi feature retained
        shell: bash
        run: |
          grep -q \
            "testXizhiPushNotification" \
            src/renderer/src/lib/utils.ts

          grep -q \
            "handleTestXizhi" \
            src/renderer/src/components/NavBar/components/DefaultSettingSheet.tsx

          grep -q \
            "onClick={handleTestXizhi}" \
            src/renderer/src/components/NavBar/components/DefaultSettingSheet.tsx

          echo "Xizhi feature retained."

      - name: Verify Douyin core retained
        shell: bash
        run: |
          grep -q \
            "getDouyinAnchorProfile" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "resolveDouyinAnchorLiveRoom" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "handleMonitorOnly" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          grep -q \
            "autoRecord: boolean" \
            type.d.ts

          grep -q \
            "videoCodec('copy')" \
            src/main/ffmpeg/record.ts

          grep -q \
            "audioCodec('copy')" \
            src/main/ffmpeg/record.ts

          echo "Douyin core retained."

      - name: TypeScript check
        shell: bash
        run: |
          npm run typecheck

      - name: Build Electron
        shell: bash
        run: |
          npm run build

      - name: Commit V2.9.1 source
        shell: bash
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git switch \
            -C \
            douyin-v2.9.1-monitor-status

          git add \
            src/renderer/src/lib/utils.ts \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx \
            src/renderer/src/components/StreamConfigList/components/StreamConfigCard.tsx \
            src/renderer/src/components/StreamConfigList/StreamConfigList.tsx \
            src/renderer/src/locales/locales.js

          if git diff --cached --quiet
          then
            echo "No source changes."
          else
            git commit \
              -m "Add detailed monitoring statuses"
          fi

          git push \
            --force \
            origin \
            douyin-v2.9.1-monitor-status

      - name: Promote to release source branch
        shell: bash
        run: |
          CURRENT_SHA="$(
            git rev-parse HEAD
          )"

          echo "Promoting: $CURRENT_SHA"

          git push \
            --force \
            origin \
            "$CURRENT_SHA:refs/heads/douyin-v2.8-anchor-monitor-test"

      - name: Summary
        shell: bash
        run: |
          {
            echo "# V2.9.1 监控状态细分完成"
            echo
            echo "- 监控中 · 未开播"
            echo "- 监控中 · 已开播"
            echo "- 监控中 · 检测异常"
            echo
            echo "顶部“监控中”筛选兼容全部监控状态"
            echo
            echo "息知推送功能保留"
            echo "抖音主播主页监控保留"
            echo "自动录制功能保留"
            echo
            echo "备份：backup-before-monitor-status"
            echo "功能分支：douyin-v2.9.1-monitor-status"
            echo "正式源码：douyin-v2.8-anchor-monitor-test"
            echo
            echo "release.yml 未修改"
          } >> "$GITHUB_STEP_SUMMARY"
