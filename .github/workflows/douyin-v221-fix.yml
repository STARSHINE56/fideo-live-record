name: Douyin V2.2.1 All In One

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 1.1.1"
        required: true
        default: "1.1.1"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Fix Douyin Update Version And Build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Douyin V2.1 source
        uses: actions/checkout@v4
        with:
          ref: douyin-parser-v2-test
          fetch-depth: 0

      - name: Create V2.2 test branch
        shell: bash
        run: |
          git switch -C douyin-v2.2-test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply V2.2.1 source fixes
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          cat > "$RUNNER_TEMP/apply_v221.py" <<'PY'
          from pathlib import Path
          import json
          import os
          import re


          def read(path: str) -> str:
              return Path(path).read_text(
                  encoding="utf-8"
              )


          def write(path: str, content: str):
              Path(path).write_text(
                  content,
                  encoding="utf-8"
              )


          version = os.environ[
              "APP_VERSION"
          ].strip()

          if not re.fullmatch(
              r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?",
              version
          ):
              raise RuntimeError(
                  f"Invalid version: {version}"
              )


          # ========================================================
          # A. Douyin parser
          # ========================================================

          douyin_path = (
              "src/main/crawler/plugins/douyin.js"
          )

          douyin = read(
              douyin_path
          )


          # Only keep ttwid from login Cookie
          old_cookie_fn = """function getCookieWithTtwid(cookie) {
            if (
              cookie &&
              cookie.includes('ttwid=')
            ) {
              return cookie
            }

            return ''
          }"""

          new_cookie_fn = """function getCookieWithTtwid(cookie) {
            if (!cookie) {
              return ''
            }

            const match =
              String(cookie).match(
                /(?:^|;\\s*)ttwid=([^;]+)/
              )

            if (!match?.[1]) {
              return ''
            }

            return `ttwid=${match[1]}`
          }"""

          if old_cookie_fn in douyin:
              douyin = douyin.replace(
                  old_cookie_fn,
                  new_cookie_fn,
                  1
              )
          elif (
              "function getCookieWithTtwid(cookie)"
              not in douyin
          ):
              raise RuntimeError(
                  "getCookieWithTtwid not found"
              )


          # getDesktopData signed option
          old_signature = """async function getDesktopData(
            roomUrl,
            others = {}
          ) {"""

          new_signature = """async function getDesktopData(
            roomUrl,
            others = {},
            signed = false
          ) {"""

          if old_signature in douyin:
              douyin = douyin.replace(
                  old_signature,
                  new_signature,
                  1
              )
          elif new_signature not in douyin:
              raise RuntimeError(
                  "getDesktopData signature not found"
              )


          # A-Bogus only when signed = true
          old_sign_block = """  const query =
              params.toString()

            const aBogus =
              generateABogus(
                query,
                PC_USER_AGENT
              )

            params.set(
              'a_bogus',
              aBogus
            )

            const apiUrl ="""

          new_sign_block = """  if (signed) {
              const query =
                params.toString()

              const aBogus =
                generateABogus(
                  query,
                  PC_USER_AGENT
                )

              params.set(
                'a_bogus',
                aBogus
              )
            }

            const apiUrl ="""

          if old_sign_block in douyin:
              douyin = douyin.replace(
                  old_sign_block,
                  new_sign_block,
                  1
              )
          elif (
              "if (signed) {"
              not in douyin
          ):
              raise RuntimeError(
                  "A-Bogus block not found"
              )


          desktop_marker = (
              "async function "
              "baseGetDesktopDouYinLiveUrlsPlugin("
          )

          desktop_pos = douyin.find(
              desktop_marker
          )

          if desktop_pos == -1:
              raise RuntimeError(
                  "Desktop parser marker not found"
              )


          helpers = r"""
          async function resolveDouyinLiveUrl(
            roomUrl,
            others = {}
          ) {
            const {
              proxy
            } = others

            let input

            try {
              input =
                new URL(roomUrl)
            } catch {
              throw new Error(
                'DOUYIN_INVALID_URL'
              )
            }

            if (
              input.hostname ===
              'live.douyin.com'
            ) {
              const roomId =
                input.pathname
                  .split('/')
                  .filter(Boolean)
                  .pop()

              if (
                roomId &&
                /^\d+$/.test(roomId)
              ) {
                return (
                  'https://live.douyin.com/' +
                  roomId
                )
              }

              throw new Error(
                'DOUYIN_INVALID_ROOM_ID'
              )
            }

            const allowedHosts = [
              'v.douyin.com',
              'www.douyin.com',
              'douyin.com',
              'webcast.amemv.com'
            ]

            if (
              !allowedHosts.includes(
                input.hostname
              )
            ) {
              throw new Error(
                'DOUYIN_UNSUPPORTED_URL'
              )
            }

            const response =
              await request(
                roomUrl,
                {
                  headers: {
                    'User-Agent':
                      PC_USER_AGENT
                  },
                  proxy
                }
              )

            const finalUrl =
              response
                ?.request
                ?.res
                ?.responseUrl ||
              roomUrl

            try {
              const finalParsed =
                new URL(finalUrl)

              if (
                finalParsed.hostname ===
                'live.douyin.com'
              ) {
                const roomId =
                  finalParsed.pathname
                    .split('/')
                    .filter(Boolean)
                    .pop()

                if (
                  roomId &&
                  /^\d+$/.test(roomId)
                ) {
                  return (
                    'https://live.douyin.com/' +
                    roomId
                  )
                }
              }
            } catch {
              // Continue to HTML parsing.
            }

            const html =
              typeof response.data ===
                'string'
                ? response.data
                : JSON.stringify(
                    response.data || {}
                  )

            const patterns = [
              /webRid[^0-9]{0,80}(\d{5,})/,
              /web_rid[^0-9]{0,80}(\d{5,})/,
              /"web_rid"\s*:\s*"(\d{5,})"/,
              /"webRid"\s*:\s*"(\d{5,})"/
            ]

            for (
              const pattern of patterns
            ) {
              const match =
                html.match(pattern)

              if (match?.[1]) {
                return (
                  'https://live.douyin.com/' +
                  match[1]
                )
              }
            }

            throw new Error(
              'DOUYIN_RESOLVE_ROOM_FAILED'
            )
          }


          async function getDesktopRoomWithFallback(
            roomUrl,
            others = {}
          ) {
            let unsignedError = null

            try {
              const data =
                await getDesktopData(
                  roomUrl,
                  others,
                  false
                )

              const room =
                getDesktopRoom(data)

              if (
                room.status !== 2
              ) {
                return room
              }

              const urls =
                collectDesktopStreams(
                  room
                )

              if (
                urls.length > 0
              ) {
                log(
                  'Douyin unsigned parser success'
                )

                return room
              }

              unsignedError =
                new Error(
                  'DOUYIN_UNSIGNED_STREAM_EMPTY'
                )
            } catch (error) {
              unsignedError =
                error

              log(
                'Douyin unsigned parser failed:',
                error?.message
              )
            }

            try {
              const data =
                await getDesktopData(
                  roomUrl,
                  others,
                  true
                )

              const room =
                getDesktopRoom(data)

              if (
                room.status !== 2
              ) {
                return room
              }

              const urls =
                collectDesktopStreams(
                  room
                )

              if (
                urls.length === 0
              ) {
                throw new Error(
                  'DOUYIN_SIGNED_STREAM_EMPTY'
                )
              }

              log(
                'Douyin A-Bogus parser success'
              )

              return room
            } catch (signedError) {
              log(
                'Douyin A-Bogus parser failed:',
                signedError?.message
              )

              throw new Error(
                'DOUYIN_WEB_PARSE_FAILED: ' +
                'unsigned=' +
                String(
                  unsignedError
                    ?.message ||
                  unsignedError ||
                  'unknown'
                ) +
                '; signed=' +
                String(
                  signedError
                    ?.message ||
                  signedError ||
                  'unknown'
                )
              )
            }
          }


          """

          if (
              "async function resolveDouyinLiveUrl("
              not in douyin
          ):
              douyin = (
                  douyin[:desktop_pos] +
                  helpers +
                  douyin[desktop_pos:]
              )


          old_desktop_logic = """  const data =
              await getDesktopData(
                roomUrl,
                others
              )

            const room =
              getDesktopRoom(data)

            if (
              room.status !== 2
            ) {"""

          new_desktop_logic = """  const room =
              await getDesktopRoomWithFallback(
                roomUrl,
                others
              )

            if (
              room.status !== 2
            ) {"""

          if old_desktop_logic in douyin:
              douyin = douyin.replace(
                  old_desktop_logic,
                  new_desktop_logic,
                  1
              )


          # Replace main Douyin routing.
          router_start = douyin.find(
              "async function "
              "baseGetDouYinLiveUrlsPlugin("
          )

          router_end = douyin.find(
              "async function "
              "baseGetDouYinRoomInfoPlugin(",
              router_start
          )

          if (
              router_start == -1
              or router_end == -1
          ):
              raise RuntimeError(
                  "Douyin live router not found"
              )

          live_router = r"""async function baseGetDouYinLiveUrlsPlugin(
            roomUrl,
            others = {}
          ) {
            const normalizedUrl =
              await resolveDouyinLiveUrl(
                roomUrl,
                others
              )

            return await baseGetDesktopDouYinLiveUrlsPlugin(
              normalizedUrl,
              others
            )
          }


          """

          douyin = (
              douyin[:router_start] +
              live_router +
              douyin[router_end:]
          )


          info_start = douyin.find(
              "async function "
              "baseGetDouYinRoomInfoPlugin("
          )

          info_end = douyin.find(
              "export const "
              "getDouYinLiveUrlsPlugin",
              info_start
          )

          if (
              info_start == -1
              or info_end == -1
          ):
              raise RuntimeError(
                  "Douyin room info router not found"
              )

          room_info = r"""async function baseGetDouYinRoomInfoPlugin(
            roomUrl,
            others = {}
          ) {
            const normalizedUrl =
              await resolveDouyinLiveUrl(
                roomUrl,
                others
              )

            const room =
              await getDesktopRoomWithFallback(
                normalizedUrl,
                others
              )

            return {
              code: SUCCESS_CODE,
              roomInfo: {
                name:
                  room
                    ?.owner
                    ?.nickname || ''
              }
            }
          }


          """

          douyin = (
              douyin[:info_start] +
              room_info +
              douyin[info_end:]
          )

          write(
              douyin_path,
              douyin
          )

          print(
              "[OK] Douyin parser upgraded"
          )


          # ========================================================
          # B. Do not log full stream URLs
          # ========================================================

          crawler_path = (
              "src/main/crawler/index.js"
          )

          crawler = read(
              crawler_path
          )

          crawler = crawler.replace(
              "  log('res:', res)\n",
              (
                  "  log("
                  "'crawler request completed, code:', "
                  "res?.code"
                  ")\n"
              )
          )

          write(
              crawler_path,
              crawler
          )


          # ========================================================
          # C. Update addresses
          # ========================================================

          main_path = (
              "src/main/index.ts"
          )

          main = read(
              main_path
          )

          main = re.sub(
              (
                  r"https://api\.github\.com/repos/"
                  r"[^'\"\s]+/releases/latest"
              ),
              (
                  "https://api.github.com/repos/"
                  "STARSHINE56/"
                  "fideo-live-record/"
                  "releases/latest"
              ),
              main
          )

          write(
              main_path,
              main
          )


          app_path = (
              "src/renderer/src/App.tsx"
          )

          app = read(
              app_path
          )

          app = re.sub(
              (
                  r"https://github\.com/"
                  r"[^'\"\s]+/releases/latest"
              ),
              (
                  "https://github.com/"
                  "STARSHINE56/"
                  "fideo-live-record/"
                  "releases/latest"
              ),
              app
          )

          write(
              app_path,
              app
          )


          # ========================================================
          # D. package.json
          # ========================================================

          package_path = Path(
              "package.json"
          )

          package = json.loads(
              package_path.read_text(
                  encoding="utf-8"
              )
          )

          package[
              "version"
          ] = version

          package[
              "homepage"
          ] = (
              "https://github.com/"
              "STARSHINE56/"
              "fideo-live-record"
          )

          package[
              "repository"
          ] = {
              "type": "git",
              "url": (
                  "https://github.com/"
                  "STARSHINE56/"
                  "fideo-live-record.git"
              )
          }

          package_path.write_text(
              json.dumps(
                  package,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )


          # ========================================================
          # E. package-lock version
          # ========================================================

          lock_path = Path(
              "package-lock.json"
          )

          if lock_path.exists():
              lock = json.loads(
                  lock_path.read_text(
                      encoding="utf-8"
                  )
              )

              lock[
                  "version"
              ] = version

              if (
                  isinstance(
                      lock.get(
                          "packages"
                      ),
                      dict
                  )
                  and ""
                  in lock["packages"]
              ):
                  lock[
                      "packages"
                  ][
                      ""
                  ][
                      "version"
                  ] = version

              lock_path.write_text(
                  json.dumps(
                      lock,
                      ensure_ascii=False,
                      indent=2
                  ) + "\n",
                  encoding="utf-8"
              )


          # ========================================================
          # F. electron-builder publish target
          # ========================================================

          builder_path = (
              "electron-builder.yml"
          )

          builder = read(
              builder_path
          )

          builder = re.sub(
              (
                  r"(?ms)^publish:\s*\n"
                  r"\s*provider:\s*generic\s*\n"
                  r"\s*url:\s*"
                  r"https://example\.com/auto-updates\s*$"
              ),
              (
                  "publish:\n"
                  "  provider: github\n"
                  "  owner: STARSHINE56\n"
                  "  repo: fideo-live-record"
              ),
              builder
          )

          if (
              "provider: github"
              not in builder
          ):
              builder = re.sub(
                  r"(?ms)^publish:.*\Z",
                  (
                      "publish:\n"
                      "  provider: github\n"
                      "  owner: STARSHINE56\n"
                      "  repo: fideo-live-record\n"
                  ),
                  builder
              )

          write(
              builder_path,
              builder
          )


          # ========================================================
          # G. Verify
          # ========================================================

          checks = {
              douyin_path: [
                  "resolveDouyinLiveUrl",
                  "getDesktopRoomWithFallback",
                  "Douyin unsigned parser success",
                  "Douyin A-Bogus parser success",
                  "DOUYIN_WEB_PARSE_FAILED"
              ],

              main_path: [
                  (
                      "STARSHINE56/"
                      "fideo-live-record/"
                      "releases/latest"
                  )
              ],

              app_path: [
                  (
                      "STARSHINE56/"
                      "fideo-live-record/"
                      "releases/latest"
                  )
              ],

              builder_path: [
                  "provider: github",
                  "owner: STARSHINE56",
                  "repo: fideo-live-record"
              ]
          }

          for file_path, values in checks.items():
              source = read(
                  file_path
              )

              for value in values:
                  if value not in source:
                      raise RuntimeError(
                          f"{file_path}: missing {value}"
                      )


          package_check = json.loads(
              Path(
                  "package.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          if (
              package_check.get(
                  "version"
              )
              != version
          ):
              raise RuntimeError(
                  "package version mismatch"
              )


          print("")
          print(
              "V2.2.1 source patch completed"
          )

          print(
              f"Version: {version}"
          )
          PY

          python "$RUNNER_TEMP/apply_v221.py"

      - name: Verify source changes
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          grep -q \
            "resolveDouyinLiveUrl" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "getDesktopRoomWithFallback" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "Douyin unsigned parser success" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "Douyin A-Bogus parser success" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "STARSHINE56/fideo-live-record/releases/latest" \
            src/main/index.ts

          grep -q \
            "STARSHINE56/fideo-live-record/releases/latest" \
            src/renderer/src/App.tsx

          grep -q \
            "provider: github" \
            electron-builder.yml

          grep -q \
            "owner: STARSHINE56" \
            electron-builder.yml

          grep -q \
            "repo: fideo-live-record" \
            electron-builder.yml

          node -e "
          const p = require('./package.json');
          if (p.version !== process.env.APP_VERSION) {
            console.error(
              'Version mismatch:',
              p.version,
              process.env.APP_VERSION
            );
            process.exit(1);
          }
          console.log(
            'Version OK:',
            p.version
          );
          "

          echo "All source checks passed."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Show versions
        shell: pwsh
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build Electron app
        run: npm run build

      - name: Package Windows x64
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify Windows installer
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $package =
            Get-Content `
              package.json |
            ConvertFrom-Json

          Write-Host `
            "Package version: $($package.version)"

          if (
            $package.version -ne
            $env:EXPECTED_VERSION
          ) {
            throw `
              "Version mismatch. Expected $env:EXPECTED_VERSION, got $($package.version)"
          }

          $installers =
            Get-ChildItem `
              -Path dist `
              -Filter "*-x64.exe"

          if (
            $installers.Count -eq 0
          ) {
            Write-Host `
              "dist directory:"

            Get-ChildItem `
              -Path dist `
              -Recurse

            throw `
              "Windows x64 installer was not generated."
          }

          Write-Host `
            "Generated installer:"

          $installers |
            Select-Object `
              Name,
              Length,
              FullName

      - name: Commit tested source
        shell: bash
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/main/crawler/plugins/douyin.js \
            src/main/crawler/index.js \
            src/main/index.ts \
            src/renderer/src/App.tsx \
            package.json \
            package-lock.json \
            electron-builder.yml

          if git diff --cached --quiet; then
            echo \
              "No source changes to commit."
          else
            git commit \
              -m "Upgrade Douyin parser and fix update settings"
          fi

          git push \
            --force \
            origin \
            douyin-v2.2-test

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-${{ inputs.version }}-douyin-v2.2.1-windows-x64
          path: dist/*-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          {
            echo "# Fideo V2.2.1"
            echo
            echo "Version: \`$APP_VERSION\`"
            echo
            echo "Test branch: \`douyin-v2.2-test\`"
            echo
            echo "Changes:"
            echo
            echo "- Douyin short-link resolver"
            echo "- Unsigned Web API first"
            echo "- A-Bogus fallback"
            echo "- Removed incorrect mobile fallback"
            echo "- Update API changed to STARSHINE56/fideo-live-record"
            echo "- Update detail URL fixed"
            echo "- package.json homepage/repository fixed"
            echo "- Version synchronized"
            echo "- GitHub publish target configured"
            echo "- Test packaging uses --publish never"
            echo "- Full stream URLs removed from crawler debug log"
            echo "- Windows x64 test installer"
          } >> "$GITHUB_STEP_SUMMARY"
