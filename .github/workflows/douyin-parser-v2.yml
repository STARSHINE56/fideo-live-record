name: Douyin Parser V2 Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    name: Patch Douyin Parser and Build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Douyin login test branch
        uses: actions/checkout@v4
        with:
          ref: douyin-login-test
          fetch-depth: 0

      - name: Create parser test branch
        shell: bash
        run: |
          git switch -C douyin-parser-v2-test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Douyin parser V2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              Path(path).parent.mkdir(parents=True, exist_ok=True)
              Path(path).write_text(content, encoding="utf-8")

          # ============================================================
          # 1. Add A-Bogus implementation
          #    Ported from the algorithm currently used by streamget.
          # ============================================================

          write(
              "src/main/crawler/plugins/douyin-abogus.js",
              r"""function leftRotate(x, n) {
            n %= 32
            return ((x << n) | (x >>> (32 - n))) >>> 0
          }

          function getTj(j) {
            if (j >= 0 && j < 16) return 0x79cc4519
            if (j >= 16 && j < 64) return 0x7a879d8a
            throw new Error('invalid j')
          }

          function ff(j, x, y, z) {
            if (j < 16) return (x ^ y ^ z) >>> 0
            return ((x & y) | (x & z) | (y & z)) >>> 0
          }

          function gg(j, x, y, z) {
            if (j < 16) return (x ^ y ^ z) >>> 0
            return ((x & y) | (~x & z)) >>> 0
          }

          class SM3 {
            constructor() {
              this.reset()
            }

            reset() {
              this.reg = [
                1937774191,
                1226093241,
                388252375,
                3666478592,
                2842636476,
                372324522,
                3817729613,
                2969243214
              ]
              this.chunk = []
              this.size = 0
            }

            write(data) {
              const bytes =
                typeof data === 'string'
                  ? Array.from(Buffer.from(data, 'utf8'))
                  : Array.from(data)

              this.size += bytes.length
              this.chunk.push(...bytes)

              while (this.chunk.length >= 64) {
                this.compress(this.chunk.slice(0, 64))
                this.chunk = this.chunk.slice(64)
              }
            }

            fill() {
              const bitLength = this.size * 8

              this.chunk.push(0x80)

              while (this.chunk.length % 64 !== 56) {
                this.chunk.push(0)
              }

              const high = Math.floor(bitLength / 0x100000000)
              const low = bitLength >>> 0

              for (let i = 3; i >= 0; i--) {
                this.chunk.push((high >>> (i * 8)) & 0xff)
              }

              for (let i = 3; i >= 0; i--) {
                this.chunk.push((low >>> (i * 8)) & 0xff)
              }
            }

            compress(data) {
              const w = new Array(132).fill(0)

              for (let t = 0; t < 16; t++) {
                w[t] =
                  (
                    (data[4 * t] << 24) |
                    (data[4 * t + 1] << 16) |
                    (data[4 * t + 2] << 8) |
                    data[4 * t + 3]
                  ) >>> 0
              }

              for (let j = 16; j < 68; j++) {
                let a =
                  (
                    w[j - 16] ^
                    w[j - 9] ^
                    leftRotate(w[j - 3], 15)
                  ) >>> 0

                a =
                  (
                    a ^
                    leftRotate(a, 15) ^
                    leftRotate(a, 23)
                  ) >>> 0

                w[j] =
                  (
                    a ^
                    leftRotate(w[j - 13], 7) ^
                    w[j - 6]
                  ) >>> 0
              }

              for (let j = 0; j < 64; j++) {
                w[j + 68] =
                  (w[j] ^ w[j + 4]) >>> 0
              }

              let [
                a,
                b,
                c,
                d,
                e,
                f,
                g,
                h
              ] = this.reg

              for (let j = 0; j < 64; j++) {
                const ss1 = leftRotate(
                  (
                    leftRotate(a, 12) +
                    e +
                    leftRotate(getTj(j), j)
                  ) >>> 0,
                  7
                )

                const ss2 =
                  ss1 ^ leftRotate(a, 12)

                const tt1 =
                  (
                    ff(j, a, b, c) +
                    d +
                    ss2 +
                    w[j + 68]
                  ) >>> 0

                const tt2 =
                  (
                    gg(j, e, f, g) +
                    h +
                    ss1 +
                    w[j]
                  ) >>> 0

                d = c
                c = leftRotate(b, 9)
                b = a
                a = tt1

                h = g
                g = leftRotate(f, 19)
                f = e

                e =
                  (
                    tt2 ^
                    leftRotate(tt2, 9) ^
                    leftRotate(tt2, 17)
                  ) >>> 0
              }

              this.reg[0] ^= a
              this.reg[1] ^= b
              this.reg[2] ^= c
              this.reg[3] ^= d
              this.reg[4] ^= e
              this.reg[5] ^= f
              this.reg[6] ^= g
              this.reg[7] ^= h

              this.reg =
                this.reg.map((x) => x >>> 0)
            }

            sum(data) {
              this.reset()
              this.write(data)
              this.fill()

              for (
                let i = 0;
                i < this.chunk.length;
                i += 64
              ) {
                this.compress(
                  this.chunk.slice(i, i + 64)
                )
              }

              const result = []

              for (const n of this.reg) {
                result.push(
                  (n >>> 24) & 0xff,
                  (n >>> 16) & 0xff,
                  (n >>> 8) & 0xff,
                  n & 0xff
                )
              }

              this.reset()

              return result
            }
          }

          function rc4Encrypt(input, key) {
            const s =
              Array.from(
                { length: 256 },
                (_, i) => i
              )

            let j = 0

            for (let i = 0; i < 256; i++) {
              j =
                (
                  j +
                  s[i] +
                  key.charCodeAt(
                    i % key.length
                  )
                ) % 256

              ;[s[i], s[j]] =
                [s[j], s[i]]
            }

            let i = 0
            j = 0

            let out = ''

            for (let p = 0; p < input.length; p++) {
              i = (i + 1) % 256
              j = (j + s[i]) % 256

              ;[s[i], s[j]] =
                [s[j], s[i]]

              const t =
                (s[i] + s[j]) % 256

              out += String.fromCharCode(
                s[t] ^
                input.charCodeAt(p)
              )
            }

            return out
          }

          function getLongInt(round, text) {
            const offset = round * 3

            const a =
              offset < text.length
                ? text.charCodeAt(offset)
                : 0

            const b =
              offset + 1 < text.length
                ? text.charCodeAt(offset + 1)
                : 0

            const c =
              offset + 2 < text.length
                ? text.charCodeAt(offset + 2)
                : 0

            return (
              (a << 16) |
              (b << 8) |
              c
            )
          }

          function resultEncrypt(text, tableName) {
            const tables = {
              s3:
                'ckdp1h4ZKsUB80/Mfvw36XIgR25+WQAlEi7NLboqYTOPuzmFjJnryx9HVGDaStCe',
              s4:
                'Dkdpgh2ZmsQB80/MfvV36XI1R45-WUAlEixNLwoqYTOPuzKFjJnry79HbGcaStCe'
            }

            const masks = [
              16515072,
              258048,
              4032,
              63
            ]

            const shifts = [
              18,
              12,
              6,
              0
            ]

            const table =
              tables[tableName]

            let result = ''
            let round = 0
            let value =
              getLongInt(round, text)

            const total =
              Math.ceil(text.length / 3 * 4)

            for (let i = 0; i < total; i++) {
              if (
                Math.floor(i / 4) !== round
              ) {
                round += 1
                value =
                  getLongInt(round, text)
              }

              const index =
                i % 4

              const charIndex =
                (
                  value &
                  masks[index]
                ) >>> shifts[index]

              result +=
                table[charIndex]
            }

            return result
          }

          function generRandom(
            randomNum,
            option
          ) {
            const byte1 =
              randomNum & 255

            const byte2 =
              (randomNum >>> 8) & 255

            return [
              (byte1 & 170) |
                (option[0] & 85),

              (byte1 & 85) |
                (option[0] & 170),

              (byte2 & 170) |
                (option[1] & 85),

              (byte2 & 85) |
                (option[1] & 170)
            ]
          }

          function generateRandomStr() {
            const values = [
              0.123456789,
              0.987654321,
              0.555555555
            ]

            const bytes = [
              ...generRandom(
                Math.floor(values[0] * 10000),
                [3, 45]
              ),
              ...generRandom(
                Math.floor(values[1] * 10000),
                [1, 0]
              ),
              ...generRandom(
                Math.floor(values[2] * 10000),
                [1, 5]
              )
            ]

            return String.fromCharCode(
              ...bytes
            )
          }

          function splitToBytes(num) {
            return [
              Math.floor(
                num / 0x1000000
              ) & 255,

              Math.floor(
                num / 0x10000
              ) & 255,

              Math.floor(
                num / 0x100
              ) & 255,

              num & 255
            ]
          }

          function generateRc4Body(
            params,
            userAgent
          ) {
            const suffix = 'cus'

            const sm3 = new SM3()

            const startTime =
              Date.now()

            const endTime =
              startTime + 100

            const p1 =
              sm3.sum(
                sm3.sum(
                  Buffer.from(
                    params + suffix,
                    'utf8'
                  )
                )
              )

            const p2 =
              sm3.sum(
                sm3.sum(
                  Buffer.from(
                    suffix,
                    'utf8'
                  )
                )
              )

            const uaKey =
              String.fromCharCode(
                0,
                1,
                14
              )

            const uaRc4 =
              rc4Encrypt(
                userAgent,
                uaKey
              )

            const uaEncoded =
              resultEncrypt(
                uaRc4,
                's3'
              )

            const ua =
              sm3.sum(uaEncoded)

            const startBytes =
              splitToBytes(startTime)

            const endBytes =
              splitToBytes(endTime)

            const b = {}

            b[18] = 44

            b[20] = startBytes[0]
            b[21] = startBytes[1]
            b[22] = startBytes[2]
            b[23] = startBytes[3]

            b[24] =
              Math.floor(
                startTime /
                0x100000000
              ) & 255

            b[25] =
              Math.floor(
                startTime /
                0x10000000000
              ) & 255

            b[26] = 0
            b[27] = 0
            b[28] = 0
            b[29] = 0

            b[30] = 0
            b[31] = 1

            b[32] = 0
            b[33] = 1

            b[34] = 0
            b[35] = 0
            b[36] = 0
            b[37] = 14

            b[38] = p1[21]
            b[39] = p1[22]

            b[40] = p2[21]
            b[41] = p2[22]

            b[42] = ua[23]
            b[43] = ua[24]

            b[44] = endBytes[0]
            b[45] = endBytes[1]
            b[46] = endBytes[2]
            b[47] = endBytes[3]

            b[48] = 3

            b[49] =
              Math.floor(
                endTime /
                0x100000000
              ) & 255

            b[50] =
              Math.floor(
                endTime /
                0x10000000000
              ) & 255

            const pageId = 110624

            const pageBytes =
              splitToBytes(pageId)

            b[52] = pageBytes[0]
            b[53] = pageBytes[1]
            b[54] = pageBytes[2]
            b[55] = pageBytes[3]

            const aid = 6383

            b[57] = aid & 255
            b[58] =
              (aid >>> 8) & 255
            b[59] =
              (aid >>> 16) & 255
            b[60] =
              (aid >>> 24) & 255

            const env =
              '1920|1080|1920|1040|0|30|0|0|1872|92|1920|1040|1857|92|1|24|Win32'

            const envBytes =
              Array.from(env)
                .map((c) =>
                  c.charCodeAt(0)
                )

            b[65] =
              envBytes.length & 255

            b[66] =
              (
                envBytes.length >>> 8
              ) & 255

            b[70] = 0
            b[71] = 0

            b[72] =
              b[18] ^
              b[20] ^
              b[26] ^
              b[30] ^
              b[38] ^
              b[40] ^
              b[42] ^
              b[21] ^
              b[27] ^
              b[31] ^
              b[35] ^
              b[39] ^
              b[41] ^
              b[43] ^
              b[22] ^
              b[28] ^
              b[32] ^
              b[36] ^
              b[23] ^
              b[29] ^
              b[33] ^
              b[37] ^
              b[44] ^
              b[45] ^
              b[46] ^
              b[47] ^
              b[48] ^
              b[49] ^
              b[50] ^
              b[24] ^
              b[25] ^
              b[52] ^
              b[53] ^
              b[54] ^
              b[55] ^
              b[57] ^
              b[58] ^
              b[59] ^
              b[60] ^
              b[65] ^
              b[66] ^
              b[70] ^
              b[71]

            const body = [
              b[18],
              b[20],
              b[52],
              b[26],
              b[30],
              b[34],
              b[58],
              b[38],
              b[40],
              b[53],
              b[42],
              b[21],
              b[27],
              b[54],
              b[55],
              b[31],
              b[35],
              b[57],
              b[39],
              b[41],
              b[43],
              b[22],
              b[28],
              b[32],
              b[60],
              b[36],
              b[23],
              b[29],
              b[33],
              b[37],
              b[44],
              b[45],
              b[59],
              b[46],
              b[47],
              b[48],
              b[49],
              b[50],
              b[24],
              b[25],
              b[65],
              b[66],
              b[70],
              b[71],
              ...envBytes,
              b[72]
            ]

            return rc4Encrypt(
              String.fromCharCode(
                ...body
              ),
              String.fromCharCode(121)
            )
          }

          export function generateABogus(
            query,
            userAgent
          ) {
            return (
              resultEncrypt(
                generateRandomStr() +
                  generateRc4Body(
                    query,
                    userAgent
                  ),
                's4'
              ) + '='
            )
          }
          """
          )

          print(
              "[OK] created douyin-abogus.js"
          )

          # ============================================================
          # 2. Replace Douyin parser
          # ============================================================

          write(
              "src/main/crawler/plugins/douyin.js",
              r"""import debug from 'debug'

          import {
            request,
            MOBILE_USER_AGENT
          } from '../base-request.js'

          import {
            captureError
          } from '../capture-error.js'

          import {
            generateABogus
          } from './douyin-abogus.js'

          import {
            CRAWLER_ERROR_CODE,
            SUCCESS_CODE
          } from '../../../code'

          const log =
            debug('fideo-crawler-douyin')

          const PC_USER_AGENT =
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
            'AppleWebKit/537.36 (KHTML, like Gecko) ' +
            'Chrome/123.0.0.0 Safari/537.36'

          function getCookieWithTtwid(cookie) {
            if (
              cookie &&
              cookie.includes('ttwid=')
            ) {
              return cookie
            }

            return ''
          }

          function joinSetCookies(...responses) {
            return responses
              .map((res) =>
                res?.headers?.get
                  ? res.headers.get('set-cookie')
                  : res?.headers?.['set-cookie']
              )
              .filter(Boolean)
              .flat()
              .join('; ')
          }

          function getDesktopRoomId(roomUrl) {
            const url =
              new URL(roomUrl)

            return url.pathname
              .split('/')
              .filter(Boolean)
              .pop()
          }

          function buildWebParams(roomId) {
            return new URLSearchParams({
              aid: '6383',
              app_name: 'douyin_web',
              live_id: '1',
              device_platform: 'web',
              language: 'zh-CN',
              browser_language: 'zh-CN',
              browser_platform: 'Win32',
              browser_name: 'Chrome',
              browser_version: '116.0.0.0',
              web_rid: roomId,
              is_need_double_stream: 'false',
              msToken: ''
            })
          }

          async function getDesktopData(
            roomUrl,
            others = {}
          ) {
            const {
              proxy,
              cookie
            } = others

            const roomId =
              getDesktopRoomId(roomUrl)

            if (!roomId) {
              throw new Error(
                'DOUYIN_INVALID_ROOM_ID'
              )
            }

            const baseUrl =
              'https://live.douyin.com/'

            const roomPageUrl =
              `${baseUrl}${roomId}`

            const commonHeaders = {
              Referer:
                'https://live.douyin.com/',
              'User-Agent':
                PC_USER_AGENT
            }

            const [
              baseResponse,
              roomResponse
            ] = await Promise.all([
              request(
                baseUrl,
                {
                  headers: commonHeaders,
                  proxy
                }
              ),
              request(
                roomPageUrl,
                {
                  headers: commonHeaders,
                  proxy
                }
              )
            ])

            const generatedCookies =
              joinSetCookies(
                baseResponse,
                roomResponse
              )

            const loginCookie =
              getCookieWithTtwid(cookie)

            const finalCookie = [
              generatedCookies,
              loginCookie
            ]
              .filter(Boolean)
              .join('; ')

            const params =
              buildWebParams(roomId)

            const query =
              params.toString()

            const aBogus =
              generateABogus(
                query,
                PC_USER_AGENT
              )

            params.set(
              'a_bogus',
              aBogus
            )

            const apiUrl =
              `${baseUrl}webcast/room/web/enter/?${params.toString()}`

            const response =
              await request(
                apiUrl,
                {
                  headers: {
                    ...commonHeaders,
                    cookie: finalCookie
                  },
                  proxy
                }
              )

            const body =
              response.data

            if (!body?.data) {
              throw new Error(
                'DOUYIN_EMPTY_RESPONSE'
              )
            }

            if (
              body.data?.prompts &&
              !body.data?.data?.length
            ) {
              throw new Error(
                `DOUYIN_RISK_CONTROL:${body.data.prompts}`
              )
            }

            return body
          }

          async function resolveMobileLocation(
            roomUrl,
            cookie
          ) {
            const response =
              await fetch(
                roomUrl,
                {
                  redirect: 'manual',
                  headers: cookie
                    ? {
                        cookie
                      }
                    : undefined
                }
              )

            const location =
              response.headers.get(
                'location'
              )

            return location || roomUrl
          }

          async function getMobileData(
            roomUrl,
            others = {}
          ) {
            const {
              proxy,
              cookie
            } = others

            const finalUrl =
              await resolveMobileLocation(
                roomUrl,
                cookie
              )

            const url =
              new URL(finalUrl)

            const roomId =
              url.pathname
                .split('/')
                .filter(Boolean)
                .pop()

            const secUserId =
              url.searchParams.get(
                'sec_user_id'
              )

            if (!roomId) {
              throw new Error(
                'DOUYIN_INVALID_MOBILE_ROOM_ID'
              )
            }

            const params =
              new URLSearchParams({
                verifyFp:
                  'verify_lxj5zv70_7szNlAB7_pxNY_48Vh_ALKF_GA1Uf3yteoOY',
                type_id: '0',
                live_id: '1',
                version_code: '99.99.99',
                app_id: '1128',
                room_id: roomId,
                sec_user_id:
                  secUserId || '',
                is_need_double_stream:
                  'true'
              })

            const query =
              params.toString()

            const aBogus =
              generateABogus(
                query,
                MOBILE_USER_AGENT
              )

            params.set(
              'a_bogus',
              aBogus
            )

            const response =
              await request(
                `https://webcast.amemv.com/webcast/room/reflow/info/?${params.toString()}`,
                {
                  headers: {
                    'User-Agent':
                      MOBILE_USER_AGENT,
                    cookie:
                      cookie || ''
                  },
                  proxy
                }
              )

            return response.data
          }

          function pushUnique(
            list,
            value
          ) {
            if (
              value &&
              !list.includes(value)
            ) {
              list.push(value)
            }
          }

          function collectMainStreams(
            streamData
          ) {
            const urls = []

            if (!streamData) {
              return urls
            }

            try {
              const parsed =
                typeof streamData === 'string'
                  ? JSON.parse(streamData)
                  : streamData

              const data =
                parsed?.data || {}

              for (
                const quality of
                Object.values(data)
              ) {
                const main =
                  quality?.main

                if (!main) {
                  continue
                }

                pushUnique(
                  urls,
                  main.flv
                )

                pushUnique(
                  urls,
                  main.hls
                )
              }
            } catch {
              // ignore malformed stream data
            }

            return urls
          }

          function collectDesktopStreams(
            room
          ) {
            const urls = []

            const streamUrl =
              room?.stream_url

            if (!streamUrl) {
              return urls
            }

            const pullDatas =
              streamUrl.pull_datas

            if (pullDatas) {
              for (
                const item of
                Object.values(pullDatas)
              ) {
                const found =
                  collectMainStreams(
                    item?.stream_data
                  )

                for (
                  const url of found
                ) {
                  pushUnique(
                    urls,
                    url
                  )
                }
              }
            }

            const coreData =
              streamUrl
                ?.live_core_sdk_data
                ?.pull_data
                ?.stream_data

            for (
              const url of
              collectMainStreams(
                coreData
              )
            ) {
              pushUnique(
                urls,
                url
              )
            }

            const flvMap =
              streamUrl
                ?.flv_pull_url

            if (flvMap) {
              for (
                const url of
                Object.values(flvMap)
              ) {
                pushUnique(
                  urls,
                  url
                )
              }
            }

            const hlsMap =
              streamUrl
                ?.hls_pull_url_map

            if (hlsMap) {
              for (
                const url of
                Object.values(hlsMap)
              ) {
                pushUnique(
                  urls,
                  url
                )
              }
            }

            return urls
          }

          function getDesktopRoom(
            data
          ) {
            const room =
              data
                ?.data
                ?.data
                ?.[0]

            if (!room) {
              throw new Error(
                'DOUYIN_ROOM_DATA_EMPTY'
              )
            }

            return room
          }

          async function baseGetDesktopDouYinLiveUrlsPlugin(
            roomUrl,
            others = {}
          ) {
            const roomId =
              getDesktopRoomId(
                roomUrl
              )

            log(
              'roomId:',
              roomId
            )

            const data =
              await getDesktopData(
                roomUrl,
                others
              )

            const room =
              getDesktopRoom(data)

            if (
              room.status !== 2
            ) {
              return {
                code:
                  CRAWLER_ERROR_CODE.NOT_URLS
              }
            }

            const liveUrls =
              collectDesktopStreams(
                room
              )

            if (
              liveUrls.length === 0
            ) {
              throw new Error(
                'DOUYIN_STREAM_URL_EMPTY'
              )
            }

            return {
              code: SUCCESS_CODE,
              liveUrls
            }
          }

          async function baseGetMobileDouYinLiveUrlsPlugin(
            roomUrl,
            others = {}
          ) {
            log(
              'roomUrl:',
              roomUrl
            )

            const data =
              await getMobileData(
                roomUrl,
                others
              )

            const room =
              data?.data?.room

            if (!room) {
              throw new Error(
                'DOUYIN_MOBILE_ROOM_EMPTY'
              )
            }

            if (
              room.status !== 2
            ) {
              return {
                code:
                  CRAWLER_ERROR_CODE.NOT_URLS
              }
            }

            const liveUrls =
              collectDesktopStreams(
                room
              )

            if (
              liveUrls.length === 0
            ) {
              throw new Error(
                'DOUYIN_STREAM_URL_EMPTY'
              )
            }

            return {
              code: SUCCESS_CODE,
              liveUrls
            }
          }

          async function baseGetDouYinLiveUrlsPlugin(
            roomUrl,
            others = {}
          ) {
            const host =
              new URL(roomUrl).host

            if (
              host ===
              'live.douyin.com'
            ) {
              try {
                return await baseGetDesktopDouYinLiveUrlsPlugin(
                  roomUrl,
                  others
                )
              } catch (error) {
                log(
                  'desktop parser failed:',
                  error?.message
                )

                if (
                  error?.message?.includes(
                    '403'
                  ) ||
                  error?.message?.includes(
                    'DOUYIN_RISK_CONTROL'
                  )
                ) {
                  throw error
                }

                return await baseGetMobileDouYinLiveUrlsPlugin(
                  roomUrl,
                  others
                )
              }
            }

            return await baseGetMobileDouYinLiveUrlsPlugin(
              roomUrl,
              others
            )
          }

          async function baseGetDouYinRoomInfoPlugin(
            roomUrl,
            others = {}
          ) {
            const host =
              new URL(roomUrl).host

            if (
              host ===
              'live.douyin.com'
            ) {
              const data =
                await getDesktopData(
                  roomUrl,
                  others
                )

              const room =
                getDesktopRoom(
                  data
                )

              return {
                code: SUCCESS_CODE,
                roomInfo: {
                  name:
                    room
                      ?.owner
                      ?.nickname || ''
                }
              }
            }

            const data =
              await getMobileData(
                roomUrl,
                others
              )

            return {
              code: SUCCESS_CODE,
              roomInfo: {
                name:
                  data
                    ?.data
                    ?.room
                    ?.owner
                    ?.nickname || ''
              }
            }
          }

          export const getDouYinLiveUrlsPlugin =
            captureError(
              baseGetDouYinLiveUrlsPlugin
            )

          export const getDouYinRoomInfoPlugin =
            captureError(
              baseGetDouYinRoomInfoPlugin
            )
          """
          )

          print(
              "[OK] replaced douyin.js"
          )

          # ============================================================
          # 3. Improve crawler error mapping
          # ============================================================

          write(
              "src/main/crawler/capture-error.js",
              r"""import {
            CRAWLER_ERROR_CODE,
            ERROR_MESSAGE
          } from '../../code'

          import debug from 'debug'

          const log =
            debug(
              'fideo-crawler-capture-error'
            )

          export function captureError(fn) {
            return async function (...args) {
              const writeLog =
                args[
                  args.length - 1
                ]

              const realArgs =
                args.slice(
                  0,
                  args.length - 1
                )

              try {
                const res =
                  await fn.apply(
                    this,
                    realArgs
                  )

                writeLog(
                  'Fetch Success'
                )

                return res
              } catch (e) {
                const message =
                  String(
                    e?.message || e
                  )

                writeLog(
                  `Fetch Error: ${message}`
                )

                log(
                  'error:',
                  message
                )

                if (
                  message ===
                  ERROR_MESSAGE.INVALID_PROXY
                ) {
                  return {
                    code:
                      CRAWLER_ERROR_CODE.INVALID_PROXY
                  }
                }

                if (
                  message.includes(
                    'timeout'
                  ) ||
                  message.includes(
                    'ECONNABORTED'
                  )
                ) {
                  return {
                    code:
                      CRAWLER_ERROR_CODE.TIMEOUT
                  }
                }

                if (
                  message.includes(
                    '403'
                  ) ||
                  message.includes(
                    'DOUYIN_RISK_CONTROL'
                  ) ||
                  message.includes(
                    'risk control'
                  )
                ) {
                  return {
                    code:
                      CRAWLER_ERROR_CODE.FORBIDDEN
                  }
                }

                if (
                  message.includes(
                    '429'
                  )
                ) {
                  return {
                    code:
                      CRAWLER_ERROR_CODE.REQUEST_TOO_FAST
                  }
                }

                return {
                  code:
                    CRAWLER_ERROR_CODE.NOT_URLS
                }
              }
            }
          }
          """
          )

          print(
              "[OK] improved error mapping"
          )

          # ============================================================
          # 4. Improve Chinese/English error text
          # ============================================================

          locales_path =
              "src/renderer/src/locales/locales.js"

          locales =
              read(locales_path)

          locales =
              locales.replace(
                  """forbidden: 'Request was denied, try using or changing the proxy',""",
                  """forbidden: 'Douyin request was blocked or risk-controlled. Try logging in again, waiting a while, or changing network.',"""
              )

          locales =
              locales.replace(
                  """forbidden: '请求被拒绝, 尝试使用或者更换代理',""",
                  """forbidden: '抖音请求被风控或拒绝，请尝试重新登录、稍后重试或更换网络',"""
              )

          locales =
              locales.replace(
                  """forbidden: 'Request was denied, try using or changing the proxy',""",
                  """forbidden: 'Douyin request was blocked or risk-controlled. Try logging in again, waiting a while, or changing network.',"""
              )

          locales =
              locales.replace(
                  """forbidden: '请求被拒绝，尝试使用或者更换代理',""",
                  """forbidden: '抖音请求被风控或拒绝，请尝试重新登录、稍后重试或更换网络',"""
              )

          write(
              locales_path,
              locales
          )

          print(
              "[OK] updated error text"
          )

          # ============================================================
          # 5. Sanity checks
          # ============================================================

          parser =
              read(
                "src/main/crawler/plugins/douyin.js"
              )

          required = [
              'generateABogus',
              'a_bogus',
              'pull_datas',
              'is_need_double_stream',
              'ttwid=',
              'DOUYIN_RISK_CONTROL'
          ]

          for item in required:
              if item not in parser:
                  raise RuntimeError(
                      f"Missing parser feature: {item}"
                  )

          signer =
              read(
                "src/main/crawler/plugins/douyin-abogus.js"
              )

          if (
              'generateABogus'
              not in signer
          ):
              raise RuntimeError(
                  'A-Bogus signer missing'
              )

          print("")
          print(
              "Douyin parser V2 patch complete."
          )
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Package Windows x64
        run: npx electron-builder --win nsis --x64

      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem `
            -Path "dist" `
            -Filter "*-x64.exe"

          if ($files.Count -eq 0) {
            throw "Windows x64 installer was not generated."
          }

          $files |
            Select-Object Name, Length, FullName

      - name: Commit parser V2 to test branch
        shell: bash
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/main/crawler/plugins/douyin.js \
            src/main/crawler/plugins/douyin-abogus.js \
            src/main/crawler/capture-error.js \
            src/renderer/src/locales/locales.js

          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit \
              -m "Upgrade Douyin live parser with A-Bogus and fallback"
          fi

          git push \
            --force \
            origin \
            douyin-parser-v2-test

      - name: Upload Windows x64 test installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-douyin-parser-v2-windows-x64
          path: dist/*-x64.exe
          if-no-files-found: error
          retention-days: 7
