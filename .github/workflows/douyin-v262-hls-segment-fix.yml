name: Douyin V2.6.2 HLS Segment Fix

on:
  workflow_dispatch:
    inputs:
      version:
        description: "测试版本号，例如 1.1.7"
        required: true
        default: "1.1.7"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Fix HLS Segment Path
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout V2.6.1 tested source
        uses: actions/checkout@v4
        with:
          ref: douyin-v2.6.1-test
          fetch-depth: 0

      - name: Create V2.6.2 test branch
        run: |
          git switch -C douyin-v2.6.2-test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      - name: Replace preview transcoder
        run: |
          cat > src/main/preview-transcoder.ts <<'TS'
          import fs from 'node:fs'
          import path from 'node:path'
          import http, {
            type Server,
            type ServerResponse
          } from 'node:http'
          import os from 'node:os'

          import execa, {
            type ExecaChildProcess
          } from 'execa'

          import ffmpeg from './ffmpeg'

          interface PreviewOptions {
            streamUrl: string
            roomUrl: string
            cookie?: string
            proxy?: string
          }

          let server:
            | Server
            | null = null

          let serverPort = 0

          let process:
            | ExecaChildProcess
            | null = null

          let previewDir = ''

          let playlistRequests = 0
          let segmentRequests = 0
          let segment404 = 0

          function resetDiagnostics() {
            playlistRequests = 0
            segmentRequests = 0
            segment404 = 0
          }

          function ensurePreviewDir() {
            if (
              previewDir &&
              fs.existsSync(
                previewDir
              )
            ) {
              return
            }

            previewDir =
              fs.mkdtempSync(
                path.join(
                  os.tmpdir(),
                  'fideo-preview-'
                )
              )
          }

          function removePreviewDir() {
            if (!previewDir) {
              return
            }

            try {
              fs.rmSync(
                previewDir,
                {
                  recursive: true,
                  force: true
                }
              )
            } catch {
              // Ignore cleanup error.
            }

            previewDir = ''
          }

          function safeLog(
            message: string
          ) {
            console.log(
              `[preview] ${message}`
            )
          }

          function sendFile(
            filePath: string,
            res: ServerResponse
          ) {
            if (
              !fs.existsSync(
                filePath
              )
            ) {
              res.statusCode =
                404

              res.end(
                'Not Found'
              )

              return false
            }

            const ext =
              path.extname(
                filePath
              ).toLowerCase()

            if (
              ext === '.m3u8'
            ) {
              res.setHeader(
                'Content-Type',
                'application/vnd.apple.mpegurl'
              )
            } else if (
              ext === '.ts'
            ) {
              res.setHeader(
                'Content-Type',
                'video/mp2t'
              )
            } else {
              res.setHeader(
                'Content-Type',
                'application/octet-stream'
              )
            }

            res.setHeader(
              'Access-Control-Allow-Origin',
              '*'
            )

            res.setHeader(
              'Access-Control-Allow-Headers',
              '*'
            )

            res.setHeader(
              'Access-Control-Allow-Methods',
              'GET, HEAD, OPTIONS'
            )

            res.setHeader(
              'Cache-Control',
              'no-store, no-cache, must-revalidate'
            )

            res.setHeader(
              'Pragma',
              'no-cache'
            )

            fs.createReadStream(
              filePath
            ).pipe(res)

            return true
          }

          async function ensureServer() {
            if (
              server &&
              serverPort > 0
            ) {
              return
            }

            server =
              http.createServer(
                (
                  req,
                  res
                ) => {
                  res.setHeader(
                    'Access-Control-Allow-Origin',
                    '*'
                  )

                  res.setHeader(
                    'Access-Control-Allow-Headers',
                    '*'
                  )

                  res.setHeader(
                    'Access-Control-Allow-Methods',
                    'GET, HEAD, OPTIONS'
                  )

                  if (
                    req.method ===
                    'OPTIONS'
                  ) {
                    res.statusCode =
                      204

                    res.end()

                    return
                  }

                  const reqUrl =
                    new URL(
                      req.url ||
                        '/',

                      'http://127.0.0.1'
                    )

                  if (
                    reqUrl.pathname ===
                    '/health'
                  ) {
                    res.statusCode =
                      200

                    res.setHeader(
                      'Content-Type',
                      'application/json'
                    )

                    res.end(
                      JSON.stringify({
                        running:
                          process !== null,

                        playlistRequests,
                        segmentRequests,
                        segment404
                      })
                    )

                    return
                  }

                  if (
                    reqUrl.pathname ===
                    '/preview.m3u8'
                  ) {
                    playlistRequests +=
                      1

                    const ok =
                      sendFile(
                        path.join(
                          previewDir,
                          'preview.m3u8'
                        ),
                        res
                      )

                    safeLog(
                      `playlist request #${playlistRequests}: ${
                        ok
                          ? '200'
                          : '404'
                      }`
                    )

                    return
                  }

                  if (
                    /^\/segment-\d+\.ts$/i.test(
                      reqUrl.pathname
                    )
                  ) {
                    segmentRequests +=
                      1

                    const safeName =
                      path.basename(
                        reqUrl.pathname
                      )

                    const ok =
                      sendFile(
                        path.join(
                          previewDir,
                          safeName
                        ),
                        res
                      )

                    if (!ok) {
                      segment404 +=
                        1
                    }

                    safeLog(
                      `segment request #${segmentRequests}: ${
                        ok
                          ? '200'
                          : '404'
                      }`
                    )

                    return
                  }

                  res.statusCode =
                    404

                  res.end(
                    'Not Found'
                  )
                }
              )

            await new Promise<void>(
              (
                resolve,
                reject
              ) => {
                const current =
                  server!

                const onError =
                  (
                    error: Error
                  ) => {
                    reject(
                      error
                    )
                  }

                current.once(
                  'error',
                  onError
                )

                current.listen(
                  0,
                  '127.0.0.1',
                  () => {
                    current.removeListener(
                      'error',
                      onError
                    )

                    const address =
                      current.address()

                    if (
                      !address ||
                      typeof address ===
                        'string'
                    ) {
                      reject(
                        new Error(
                          'Unable to bind preview server'
                        )
                      )

                      return
                    }

                    serverPort =
                      address.port

                    safeLog(
                      'local preview server started'
                    )

                    resolve()
                  }
                )
              }
            )
          }

          function getPlaylistPath() {
            return path.join(
              previewDir,
              'preview.m3u8'
            )
          }

          function getSegmentCount() {
            if (
              !previewDir ||
              !fs.existsSync(
                previewDir
              )
            ) {
              return 0
            }

            try {
              return fs
                .readdirSync(
                  previewDir
                )
                .filter(
                  (
                    name
                  ) =>
                    /^segment-\d+\.ts$/i.test(
                      name
                    )
                )
                .length
            } catch {
              return 0
            }
          }

          function inspectPlaylist() {
            const playlist =
              getPlaylistPath()

            if (
              !fs.existsSync(
                playlist
              )
            ) {
              return {
                exists:
                  false,

                validSegments:
                  false,

                count:
                  0
              }
            }

            try {
              const text =
                fs.readFileSync(
                  playlist,
                  'utf8'
                )

              const lines =
                text
                  .split(
                    /\r?\n/
                  )
                  .map(
                    (
                      line
                    ) =>
                      line.trim()
                  )
                  .filter(
                    Boolean
                  )

              const mediaLines =
                lines.filter(
                  (
                    line
                  ) =>
                    !line.startsWith(
                      '#'
                    )
                )

              const validSegments =
                mediaLines.length >
                  0 &&
                mediaLines.every(
                  (
                    line
                  ) =>
                    /^segment-\d+\.ts$/i.test(
                      line
                    )
                )

              return {
                exists:
                  true,

                validSegments,

                count:
                  mediaLines.length
              }
            } catch {
              return {
                exists:
                  true,

                validSegments:
                  false,

                count:
                  0
              }
            }
          }

          async function waitForPreview(
            timeoutMs = 20000
          ) {
            const start =
              Date.now()

            while (
              Date.now() -
                start <
              timeoutMs
            ) {
              const playlist =
                inspectPlaylist()

              const segments =
                getSegmentCount()

              if (
                playlist.exists &&
                playlist.validSegments &&
                playlist.count >
                  0 &&
                segments >
                  0
              ) {
                safeLog(
                  `playlist ready with ${playlist.count} media entries and ${segments} segment files`
                )

                return true
              }

              await new Promise(
                (
                  resolve
                ) =>
                  setTimeout(
                    resolve,
                    250
                  )
              )
            }

            return false
          }

          export async function stopPreviewTranscoder() {
            if (process) {
              try {
                process.kill(
                  'SIGKILL'
                )
              } catch {
                // Ignore.
              }

              process = null
            }

            if (server) {
              const current =
                server

              server = null
              serverPort = 0

              try {
                const extended =
                  current as Server & {
                    closeAllConnections?: () => void
                  }

                extended
                  .closeAllConnections
                  ?.()
              } catch {
                // Ignore.
              }

              await new Promise<void>(
                (
                  resolve
                ) => {
                  try {
                    current.close(
                      () =>
                        resolve()
                    )
                  } catch {
                    resolve()
                  }
                }
              )
            }

            removePreviewDir()

            resetDiagnostics()
          }

          export async function startPreviewTranscoder(
            options: PreviewOptions
          ) {
            await stopPreviewTranscoder()

            resetDiagnostics()

            ensurePreviewDir()

            await ensureServer()

            const args: string[] = [
              '-hide_banner',
              '-loglevel',
              'warning',

              '-rw_timeout',
              '20000000',

              '-reconnect',
              '1',

              '-reconnect_streamed',
              '1',

              '-reconnect_delay_max',
              '5',

              '-headers',
              'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/123.0.0.0 Safari/537.36\r\n',

              '-headers',
              `Referer: ${options.roomUrl}\r\n`
            ]

            if (
              options.cookie
            ) {
              args.push(
                '-headers',
                `Cookie: ${options.cookie}\r\n`
              )
            }

            if (
              options.proxy
            ) {
              args.push(
                '-http_proxy',
                options.proxy
              )
            }

            args.push(
              '-i',
              options.streamUrl,

              '-map',
              '0:v:0',

              '-map',
              '0:a:0?',

              '-c:v',
              'libx264',

              '-preset',
              'veryfast',

              '-tune',
              'zerolatency',

              '-profile:v',
              'main',

              '-level',
              '4.1',

              '-pix_fmt',
              'yuv420p',

              '-r',
              '30',

              '-g',
              '30',

              '-keyint_min',
              '30',

              '-sc_threshold',
              '0',

              '-b:v',
              '1600k',

              '-maxrate',
              '2000k',

              '-bufsize',
              '3200k',

              '-c:a',
              'aac',

              '-b:a',
              '128k',

              '-ar',
              '48000',

              '-ac',
              '2',

              '-f',
              'hls',

              '-hls_time',
              '1',

              '-hls_list_size',
              '6',

              '-hls_delete_threshold',
              '3',

              '-hls_flags',
              'delete_segments+omit_endlist+independent_segments',

              '-hls_segment_filename',
              'segment-%05d.ts',

              'preview.m3u8'
            )

            safeLog(
              'starting FFmpeg preview transcoder'
            )

            process =
              execa(
                ffmpeg.ffmpegPath,
                args,
                {
                  cwd:
                    previewDir
                }
              )

            process.on(
              'error',
              () => {
                safeLog(
                  'FFmpeg process error'
                )

                process = null
              }
            )

            process.on(
              'exit',
              (
                code
              ) => {
                safeLog(
                  `FFmpeg exited with code ${String(
                    code
                  )}`
                )
              }
            )

            process
              .stderr
              ?.on(
                'data',
                (
                  chunk
                ) => {
                  const text =
                    String(
                      chunk
                    )

                  const sanitized =
                    text
                      .replace(
                        /https?:\/\/\S+/gi,
                        '[url]'
                      )
                      .replace(
                        /Cookie:\s*[^\r\n]+/gi,
                        'Cookie: [redacted]'
                      )

                  if (
                    sanitized.trim()
                  ) {
                    safeLog(
                      `ffmpeg: ${sanitized
                        .trim()
                        .slice(
                          0,
                          500
                        )}`
                    )
                  }
                }
              )

            const ready =
              await waitForPreview()

            if (!ready) {
              const playlist =
                inspectPlaylist()

              const segments =
                getSegmentCount()

              safeLog(
                `preview startup timeout: playlist=${String(
                  playlist.exists
                )}, validSegments=${String(
                  playlist.validSegments
                )}, mediaEntries=${playlist.count}, segmentFiles=${segments}`
              )

              await stopPreviewTranscoder()

              throw new Error(
                'Preview stream failed to become ready'
              )
            }

            return {
              url:
                `http://127.0.0.1:${serverPort}/preview.m3u8`
            }
          }
          TS

      - name: Replace preview player diagnostics
        run: |
          cat > src/renderer/src/components/StreamPreviewDialog.tsx <<'TS'
          import {
            useEffect,
            useRef,
            useState
          } from 'react'

          import Hls from 'hls.js'

          import {
            Dialog,
            DialogContent,
            DialogHeader,
            DialogTitle
          } from '@/shadcn/ui/dialog'

          interface StreamPreviewDialogProps {
            open: boolean

            onOpenChange: (
              open: boolean
            ) => void

            title: string
            url: string

            type:
              | 'hls'
              | 'flv'

            errorText: string
          }

          export default function StreamPreviewDialog(
            props: StreamPreviewDialogProps
          ) {
            const {
              open,
              onOpenChange,
              title,
              url,
              errorText
            } = props

            const videoRef =
              useRef<HTMLVideoElement | null>(
                null
              )

            const [
              error,
              setError
            ] =
              useState(false)

            const [
              debugText,
              setDebugText
            ] =
              useState('')

            useEffect(() => {
              const video =
                videoRef.current

              if (
                !open ||
                !url ||
                !video
              ) {
                return
              }

              setError(false)

              setDebugText(
                '正在连接本地 HLS 预览...'
              )

              let hls:
                | Hls
                | null = null

              const handleVideoError =
                () => {
                  const mediaError =
                    video.error

                  setDebugText(
                    `HTML5 video error: ${
                      mediaError?.code ??
                      'unknown'
                    }`
                  )

                  setError(
                    true
                  )
                }

              const handleLoadedMetadata =
                () => {
                  setDebugText(
                    '已读取视频元数据'
                  )
                }

              const handleCanPlay =
                () => {
                  setDebugText(
                    '视频已可播放'
                  )
                }

              const handlePlaying =
                () => {
                  setDebugText(
                    '预览播放中'
                  )
                }

              const handleWaiting =
                () => {
                  setDebugText(
                    '播放器正在缓冲'
                  )
                }

              video.addEventListener(
                'error',
                handleVideoError
              )

              video.addEventListener(
                'loadedmetadata',
                handleLoadedMetadata
              )

              video.addEventListener(
                'canplay',
                handleCanPlay
              )

              video.addEventListener(
                'playing',
                handlePlaying
              )

              video.addEventListener(
                'waiting',
                handleWaiting
              )

              const cleanup =
                () => {
                  video.removeEventListener(
                    'error',
                    handleVideoError
                  )

                  video.removeEventListener(
                    'loadedmetadata',
                    handleLoadedMetadata
                  )

                  video.removeEventListener(
                    'canplay',
                    handleCanPlay
                  )

                  video.removeEventListener(
                    'playing',
                    handlePlaying
                  )

                  video.removeEventListener(
                    'waiting',
                    handleWaiting
                  )

                  if (hls) {
                    try {
                      hls.destroy()
                    } catch {
                      // Ignore.
                    }

                    hls = null
                  }

                  try {
                    video.pause()

                    video.removeAttribute(
                      'src'
                    )

                    video.load()
                  } catch {
                    // Ignore.
                  }
                }

              if (
                !Hls.isSupported()
              ) {
                setDebugText(
                  '当前 Electron 环境不支持 HLS.js MSE'
                )

                setError(true)

                return cleanup
              }

              hls =
                new Hls({
                  enableWorker:
                    false,

                  lowLatencyMode:
                    false,

                  maxBufferLength:
                    10,

                  maxMaxBufferLength:
                    20,

                  backBufferLength:
                    10,

                  liveSyncDurationCount:
                    3,

                  liveMaxLatencyDurationCount:
                    6
                })

              hls.on(
                Hls.Events.MEDIA_ATTACHED,
                () => {
                  setDebugText(
                    '播放器已连接，正在加载 M3U8'
                  )

                  hls?.loadSource(
                    url
                  )
                }
              )

              hls.on(
                Hls.Events.MANIFEST_PARSED,
                () => {
                  setDebugText(
                    'M3U8 已解析，等待分片'
                  )

                  video
                    .play()
                    .catch(
                      () => {
                        setDebugText(
                          '自动播放被阻止，请点击播放按钮'
                        )
                      }
                    )
                }
              )

              hls.on(
                Hls.Events.FRAG_LOADED,
                () => {
                  setDebugText(
                    'HLS 分片已加载'
                  )
                }
              )

              hls.on(
                Hls.Events.BUFFER_APPENDED,
                () => {
                  setDebugText(
                    'HLS 数据已写入播放器缓冲区'
                  )
                }
              )

              hls.on(
                Hls.Events.ERROR,
                (
                  _,
                  data
                ) => {
                  const detail =
                    String(
                      data.details ||
                        data.type ||
                        'unknown'
                    )

                  setDebugText(
                    `HLS: ${detail}${
                      data.fatal
                        ? '（fatal）'
                        : ''
                    }`
                  )

                  if (
                    !data.fatal
                  ) {
                    return
                  }

                  if (
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                  ) {
                    try {
                      hls?.startLoad()
                      return
                    } catch {
                      setError(true)
                      return
                    }
                  }

                  if (
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                  ) {
                    try {
                      hls?.recoverMediaError()
                      return
                    } catch {
                      setError(true)
                      return
                    }
                  }

                  setError(true)
                }
              )

              hls.attachMedia(
                video
              )

              return cleanup
            }, [
              open,
              url
            ])

            return (
              <Dialog
                open={open}
                onOpenChange={
                  onOpenChange
                }
              >
                <DialogContent className="max-w-[900px]">
                  <DialogHeader>
                    <DialogTitle>
                      {title}
                    </DialogTitle>
                  </DialogHeader>

                  {error ? (
                    <div className="py-8 text-center text-sm text-destructive">
                      <div>
                        {errorText}
                      </div>

                      {debugText && (
                        <div className="mt-2 text-xs text-muted-foreground break-all">
                          {debugText}
                        </div>
                      )}
                    </div>
                  ) : (
                    <>
                      <video
                        ref={
                          videoRef
                        }
                        controls
                        autoPlay
                        playsInline
                        className="w-full max-h-[70vh] bg-black rounded-md"
                      />

                      {debugText && (
                        <div className="text-xs text-muted-foreground break-all">
                          {debugText}
                        </div>
                      )}
                    </>
                  )}
                </DialogContent>
              </Dialog>
            )
          }
          TS

      - name: Update version
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          npm version \
            "$APP_VERSION" \
            --no-git-tag-version

      - name: Verify V2.6.2 changes
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          echo "Checking relative HLS segment paths..."

          grep -q \
            "'segment-%05d.ts'" \
            src/main/preview-transcoder.ts

          grep -q \
            "'preview.m3u8'" \
            src/main/preview-transcoder.ts

          grep -q \
            "cwd:" \
            src/main/preview-transcoder.ts

          grep -q \
            "previewDir" \
            src/main/preview-transcoder.ts

          echo "Checking diagnostics..."

          grep -q \
            "playlist request" \
            src/main/preview-transcoder.ts

          grep -q \
            "segment request" \
            src/main/preview-transcoder.ts

          grep -q \
            "segment404" \
            src/main/preview-transcoder.ts

          grep -q \
            "M3U8 已解析" \
            src/renderer/src/components/StreamPreviewDialog.tsx

          grep -q \
            "HLS 分片已加载" \
            src/renderer/src/components/StreamPreviewDialog.tsx

          grep -q \
            "BUFFER_APPENDED" \
            src/renderer/src/components/StreamPreviewDialog.tsx

          echo "Checking CSP remains..."

          grep -q \
            "media-src 'self' blob: data: http://127.0.0.1:" \
            src/renderer/index.html

          echo "Checking monitor-only mode remains..."

          grep -q \
            "autoRecord: boolean" \
            type.d.ts

          grep -q \
            "handleMonitorOnly" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          echo "Checking recording remains stream-copy..."

          grep -q \
            "videoCodec('copy')" \
            src/main/ffmpeg/record.ts

          grep -q \
            "audioCodec('copy')" \
            src/main/ffmpeg/record.ts

          echo "Checking version..."

          node -e "
          const p =
            require('./package.json');

          if (
            p.version !==
            process.env.APP_VERSION
          ) {
            console.error(
              'Version mismatch:',
              p.version
            );

            process.exit(1);
          }

          console.log(
            'Version:',
            p.version
          );
          "

          echo \
            "V2.6.2 validation passed."

      - name: TypeScript check
        run: |
          npm run typecheck

      - name: Build Electron app
        run: |
          npm run build

      - name: Package Windows x64
        run: |
          npx electron-builder \
            --win \
            nsis \
            --x64 \
            --publish never

      - name: Verify Windows installer
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $package = Get-Content package.json | ConvertFrom-Json

          if ($package.version -ne $env:EXPECTED_VERSION) {
            throw "Version mismatch. Expected $env:EXPECTED_VERSION, got $($package.version)"
          }

          $installers = Get-ChildItem -Path dist -Filter "*-x64.exe"

          if (-not $installers -or $installers.Count -eq 0) {
            throw "Windows x64 installer not generated."
          }

          Write-Host "Generated installer:"

          $installers |
            Select-Object Name, Length, FullName |
            Format-Table -AutoSize

      - name: Commit V2.6.2 tested source
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            package.json \
            package-lock.json \
            src/main/preview-transcoder.ts \
            src/renderer/src/components/StreamPreviewDialog.tsx

          if git diff --cached --quiet
          then
            echo \
              "No source changes to commit."
          else
            git commit \
              -m "Fix local HLS segment paths and add preview diagnostics"
          fi

          git push \
            --force \
            origin \
            douyin-v2.6.2-test

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-${{ inputs.version }}-douyin-v2.6.2-windows-x64
          path: dist/*-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          {
            echo "# Fideo Douyin V2.6.2"
            echo
            echo "Version: \`$APP_VERSION\`"
            echo
            echo "Branch: \`douyin-v2.6.2-test\`"
            echo
            echo "Changes:"
            echo
            echo "- FFmpeg now runs inside the preview temp directory"
            echo "- HLS playlist uses relative segment filenames only"
            echo "- Local preview server logs playlist and segment requests"
            echo "- Preview player shows live HLS diagnostic state"
            echo "- FFmpeg H264 + AAC preview retained"
            echo "- CSP fix retained"
            echo "- Highest-quality recording retained"
            echo "- Monitor-only notification mode retained"
          } >> "$GITHUB_STEP_SUMMARY"
