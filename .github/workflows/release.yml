name: Release Fideo V2.8

on:
  workflow_dispatch:
    inputs:
      version:
        description: "正式版本号，例如 1.1.9"
        required: true
        default: "1.1.9"
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      # ============================================================
      # 1. 使用已经测试通过的 V2.8
      # ============================================================

      - name: Checkout tested V2.8
        uses: actions/checkout@v4
        with:
          ref: douyin-v2.8-anchor-monitor-test
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      # ============================================================
      # 2. 检查版本号
      # ============================================================

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          then
            echo "Invalid version: $VERSION"
            echo "Example: 1.1.9"
            exit 1
          fi

          echo "Release version: $VERSION"

      # ============================================================
      # 3. 第三方许可证说明
      # ============================================================

      - name: Add third party notices
        run: |
          cat > THIRD_PARTY_NOTICES.md <<'NOTICE'
          # Third-Party Notices

          This project contains or adapts portions of third-party open-source software.

          ## streamget

          Project:
          https://github.com/ihmily/streamget

          Copyright (c) 2025 Hmily

          Licensed under the MIT License.

          MIT License

          Copyright (c) 2025 Hmily

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in all
          copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE
          SOFTWARE.

          ## Fideo

          The main Fideo project remains distributed under the GNU Affero General
          Public License version 3 (AGPL-3.0).
          NOTICE

      - name: Add source attribution
        run: |
          node <<'NODE'
          const fs = require('fs')

          const path =
            'src/main/crawler/plugins/douyin-abogus.js'

          if (!fs.existsSync(path)) {
            throw new Error(
              'douyin-abogus.js not found'
            )
          }

          let text =
            fs.readFileSync(
              path,
              'utf8'
            )

          const marker =
            'Portions adapted from ihmily/streamget'

          if (
            !text.includes(marker)
          ) {
            const header =
          `/*
           * Portions adapted from ihmily/streamget
           * https://github.com/ihmily/streamget
           *
           * Copyright (c) 2025 Hmily
           * Licensed under the MIT License.
           *
           * See THIRD_PARTY_NOTICES.md for full license text.
           */

          `

            text =
              header +
              text

            fs.writeFileSync(
              path,
              text,
              'utf8'
            )
          }

          console.log(
            'Third-party attribution verified.'
          )
          NODE

      # ============================================================
      # 4. 设置正式版本
      #
      # 关键修复：
      # 测试分支已经是 1.1.9 时也允许继续
      # ============================================================

      - name: Set release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm version \
            "$VERSION" \
            --no-git-tag-version \
            --allow-same-version

          CURRENT_VERSION="$(
            node -p "require('./package.json').version"
          )"

          if [ "$CURRENT_VERSION" != "$VERSION" ]
          then
            echo "Expected version: $VERSION"
            echo "Actual version: $CURRENT_VERSION"
            exit 1
          fi

          echo "Version confirmed: $CURRENT_VERSION"

      # ============================================================
      # 5. 检查 V2.8 功能
      # ============================================================

      - name: Verify V2.8 anchor monitoring
        run: |
          grep -q \
            "'www.douyin.com':" \
            src/main/crawler/index.js

          grep -q \
            "'douyin.com':" \
            src/main/crawler/index.js

          grep -q \
            "getDouyinProfileSecUid" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "getDouyinAnchorProfile" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "resolveDouyinAnchorLiveRoom" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "sec_user_id" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "aweme/v1/web/user/profile/other" \
            src/main/crawler/plugins/douyin.js

          echo "V2.8 anchor monitoring verified."

      # ============================================================
      # 6. 检查录制核心
      # ============================================================

      - name: Verify recording core
        run: |
          grep -q \
            "handleMonitorOnly" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          grep -q \
            "autoRecord: boolean" \
            type.d.ts

          grep -q \
            "getQualityRank" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "candidate_resolution" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "videoCodec('copy')" \
            src/main/ffmpeg/record.ts

          grep -q \
            "audioCodec('copy')" \
            src/main/ffmpeg/record.ts

          echo "Recording core verified."

      # ============================================================
      # 7. 确保预览功能没有回来
      # ============================================================

      - name: Verify preview removed
        run: |
          LEFTOVERS="$(
            grep -R \
              -n \
              -E \
              'START_STREAM_PREVIEW|STOP_STREAM_PREVIEW|startStreamPreview|StreamPreviewDialog|preview-transcoder|preview-proxy' \
              src \
              || true
          )"

          if [ -n "$LEFTOVERS" ]
          then
            echo "$LEFTOVERS"
            exit 1
          fi

          echo "Preview remains removed."

      # ============================================================
      # 8. 许可证检查
      # ============================================================

      - name: Verify licenses
        run: |
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md

          grep -q \
            "GNU AFFERO GENERAL PUBLIC LICENSE" \
            LICENSE

          grep -q \
            "Copyright (c) 2025 Hmily" \
            THIRD_PARTY_NOTICES.md

          grep -q \
            "MIT License" \
            THIRD_PARTY_NOTICES.md

          grep -q \
            "Portions adapted from ihmily/streamget" \
            src/main/crawler/plugins/douyin-abogus.js

          echo "License notices verified."

      # ============================================================
      # 9. TypeScript
      # ============================================================

      - name: TypeScript check
        run: |
          npm run typecheck

      # ============================================================
      # 10. Electron Build
      # ============================================================

      - name: Build Electron
        run: |
          npm run build

      # ============================================================
      # 11. Windows x64 正式安装包
      # ============================================================

      - name: Build Windows x64 installer
        run: |
          npx electron-builder \
            --win \
            nsis \
            --x64 \
            --publish never

      - name: Verify release installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $package = Get-Content package.json | ConvertFrom-Json

          if ($package.version -ne $env:VERSION) {
            throw "Version mismatch. Expected $env:VERSION, got $($package.version)"
          }

          $expected = "dist/fideo-$env:VERSION-x64.exe"

          if (-not (Test-Path $expected)) {
            throw "Release installer not found: $expected"
          }

          $file = Get-Item $expected

          if ($file.Length -lt 10000000) {
            throw "Installer size is unexpectedly small."
          }

          Write-Host "Release installer verified."
          Write-Host "Name: $($file.Name)"
          Write-Host "Size: $($file.Length)"
          Write-Host "Path: $($file.FullName)"

      # ============================================================
      # 12. 检查 Tag 是否已存在
      # ============================================================

      - name: Check release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git fetch \
            origin \
            --tags

          if git rev-parse \
            "refs/tags/v$VERSION" \
            >/dev/null 2>&1
          then
            echo "Tag v$VERSION already exists."
            exit 1
          fi

          echo "Tag v$VERSION is available."

      # ============================================================
      # 13. 保存正式源码
      # ============================================================

      - name: Commit official release source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          RELEASE_BRANCH="release-v$VERSION"

          git switch \
            -C \
            "$RELEASE_BRANCH"

          git add \
            package.json \
            package-lock.json \
            THIRD_PARTY_NOTICES.md \
            src/main/crawler/plugins/douyin-abogus.js

          if git diff --cached --quiet
          then
            echo "No additional release-source changes."
          else
            git commit \
              -m "Release v$VERSION"
          fi

          git tag \
            -a \
            "v$VERSION" \
            -m "Fideo v$VERSION"

          git push \
            --force \
            origin \
            "$RELEASE_BRANCH"

          git push \
            origin \
            "v$VERSION"

      # ============================================================
      # 14. Artifact 备份
      # ============================================================

      - name: Upload official installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fideo-${{ inputs.version }}-official-windows-x64
          path: dist/fideo-${{ inputs.version }}-x64.exe
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 15. GitHub 正式 Release
      # ============================================================

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Fideo v${{ inputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            dist/fideo-${{ inputs.version }}-x64.exe
          body: |
            ## Fideo v${{ inputs.version }}

            本版本基于已完成实际测试的 Douyin V2.8。

            ### 主要更新

            - 支持抖音直播间链接监控
            - 新增抖音主播主页链接监控
            - 主播未开播时也可以提前添加监控任务
            - 主播开播后自动解析当前直播间
            - 自动获取 web_rid 并进入现有录制流程
            - 保留抖音高画质直播流选择
            - 支持自动录制
            - 支持仅监控 / 开播提醒模式
            - 优化监控状态与界面布局
            - 移除不稳定的直播预览功能
            - 保留 FFmpeg 音视频原流复制录制

            ### 主播主页监控

            可以添加：

            `https://www.douyin.com/user/...`

            即使主播当前没有开播，也可以提前加入监控列表。

            检测到主播开播后，程序会自动解析直播间并继续执行提醒或录制。

            ### 开源许可

            Fideo 按 AGPL-3.0 发布。

            部分抖音请求签名实现参考/改编自 streamget。
            对应 MIT 版权及许可声明见源码中的 THIRD_PARTY_NOTICES.md。

            ### 注意

            本软件仅用于管理和录制您有权访问、保存的直播内容。
            请遵守相关平台规则、当地法律以及内容版权要求。

            Windows 安装包当前未使用商业代码签名证书，
            Windows SmartScreen 可能显示未知发布者提示。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 16. 发布摘要
      # ============================================================

      - name: Release summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "# Fideo 正式版发布成功"
            echo
            echo "版本：\`v$VERSION\`"
            echo
            echo "安装包：\`fideo-$VERSION-x64.exe\`"
            echo
            echo "Tag：\`v$VERSION\`"
            echo
            echo "发布分支：\`release-v$VERSION\`"
            echo
            echo "测试来源：\`douyin-v2.8-anchor-monitor-test\`"
            echo
            echo "GitHub Release：已创建"
          } >> "$GITHUB_STEP_SUMMARY"
