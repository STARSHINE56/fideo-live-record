name: Douyin V2.4 Quality And Preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: "测试版本号，例如 1.1.3"
        required: true
        default: "1.1.3"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Highest Quality And FLV Preview
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout V2.3 tested source
        uses: actions/checkout@v4
        with:
          ref: douyin-v2.3-test
          fetch-depth: 0

      - name: Create V2.4 test branch
        run: |
          git switch -C douyin-v2.4-test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Install existing dependencies
        run: |
          npm ci

      - name: Install preview dependencies
        run: |
          npm install hls.js@1.7.3 mpegts.js@1.8.0 --save-exact

      - name: Create HLS and FLV preview player
        run: |
          cat > src/renderer/src/components/StreamPreviewDialog.tsx <<'TSX'
          import { useEffect, useRef, useState } from 'react'
          import Hls from 'hls.js'
          import mpegts from 'mpegts.js'

          import {
            Dialog,
            DialogContent,
            DialogHeader,
            DialogTitle
          } from '@/shadcn/ui/dialog'

          type PreviewType =
            | 'hls'
            | 'flv'

          interface StreamPreviewDialogProps {
            open: boolean
            onOpenChange: (
              open: boolean
            ) => void
            title: string
            url: string
            type: PreviewType
            errorText: string
          }

          export default function StreamPreviewDialog(
            props: StreamPreviewDialogProps
          ) {
            const {
              open,
              onOpenChange,
              title,
              url,
              type,
              errorText
            } = props

            const videoRef =
              useRef<HTMLVideoElement | null>(
                null
              )

            const [error, setError] =
              useState(false)

            useEffect(() => {
              const video =
                videoRef.current

              if (
                !open ||
                !url ||
                !video
              ) {
                return
              }

              setError(false)

              let hls:
                | Hls
                | null = null

              let flvPlayer:
                | ReturnType<
                    typeof mpegts.createPlayer
                  >
                | null = null

              const cleanup = () => {
                if (hls) {
                  try {
                    hls.destroy()
                  } catch {
                    // Ignore cleanup error.
                  }

                  hls = null
                }

                if (flvPlayer) {
                  try {
                    flvPlayer.pause()
                  } catch {
                    // Ignore.
                  }

                  try {
                    flvPlayer.unload()
                  } catch {
                    // Ignore.
                  }

                  try {
                    flvPlayer.detachMediaElement()
                  } catch {
                    // Ignore.
                  }

                  try {
                    flvPlayer.destroy()
                  } catch {
                    // Ignore.
                  }

                  flvPlayer = null
                }

                try {
                  video.pause()

                  video.removeAttribute(
                    'src'
                  )

                  video.load()
                } catch {
                  // Ignore cleanup error.
                }
              }

              // ================================================
              // HLS preview
              // ================================================

              if (
                type === 'hls'
              ) {
                if (
                  video.canPlayType(
                    'application/vnd.apple.mpegurl'
                  )
                ) {
                  video.src = url

                  const playResult =
                    video.play()

                  if (playResult) {
                    playResult.catch(
                      () => {}
                    )
                  }

                  return cleanup
                }

                if (
                  Hls.isSupported()
                ) {
                  hls =
                    new Hls({
                      lowLatencyMode:
                        true,

                      backBufferLength:
                        30,

                      maxBufferLength:
                        30,

                      maxMaxBufferLength:
                        60
                    })

                  hls.loadSource(
                    url
                  )

                  hls.attachMedia(
                    video
                  )

                  hls.on(
                    Hls.Events.MANIFEST_PARSED,
                    () => {
                      const playResult =
                        video.play()

                      if (playResult) {
                        playResult.catch(
                          () => {}
                        )
                      }
                    }
                  )

                  hls.on(
                    Hls.Events.ERROR,
                    (_, data) => {
                      if (
                        !data.fatal
                      ) {
                        return
                      }

                      if (
                        data.type ===
                        Hls.ErrorTypes.NETWORK_ERROR
                      ) {
                        try {
                          hls?.startLoad()
                          return
                        } catch {
                          setError(true)
                          return
                        }
                      }

                      if (
                        data.type ===
                        Hls.ErrorTypes.MEDIA_ERROR
                      ) {
                        try {
                          hls?.recoverMediaError()
                          return
                        } catch {
                          setError(true)
                          return
                        }
                      }

                      setError(true)
                    }
                  )

                  return cleanup
                }

                setError(true)

                return cleanup
              }

              // ================================================
              // FLV preview
              // ================================================

              if (
                type === 'flv'
              ) {
                if (
                  !mpegts.isSupported()
                ) {
                  setError(true)

                  return cleanup
                }

                try {
                  flvPlayer =
                    mpegts.createPlayer(
                      {
                        type:
                          'flv',

                        isLive:
                          true,

                        url,

                        cors:
                          true,

                        withCredentials:
                          false
                      },

                      {
                        enableWorker:
                          false,

                        enableStashBuffer:
                          true,

                        stashInitialSize:
                          384 * 1024,

                        autoCleanupSourceBuffer:
                          true,

                        autoCleanupMaxBackwardDuration:
                          30,

                        autoCleanupMinBackwardDuration:
                          10,

                        lazyLoad:
                          false,

                        liveBufferLatencyChasing:
                          true,

                        liveBufferLatencyMaxLatency:
                          3,

                        liveBufferLatencyMinRemain:
                          0.5
                      }
                    )

                  flvPlayer.attachMediaElement(
                    video
                  )

                  flvPlayer.load()

                  const playResult =
                    flvPlayer.play()

                  if (
                    playResult &&
                    typeof playResult.catch ===
                      'function'
                  ) {
                    playResult.catch(
                      () => {}
                    )
                  }

                  flvPlayer.on(
                    mpegts.Events.ERROR,
                    () => {
                      setError(true)
                    }
                  )

                  return cleanup
                } catch {
                  setError(true)

                  return cleanup
                }
              }

              setError(true)

              return cleanup
            }, [
              open,
              url,
              type
            ])

            return (
              <Dialog
                open={open}
                onOpenChange={
                  onOpenChange
                }
              >
                <DialogContent className="max-w-[900px]">
                  <DialogHeader>
                    <DialogTitle>
                      {title}
                    </DialogTitle>
                  </DialogHeader>

                  {error ? (
                    <div className="py-12 text-center text-sm text-destructive">
                      {errorText}
                    </div>
                  ) : (
                    <video
                      ref={videoRef}
                      controls
                      autoPlay
                      playsInline
                      className="w-full max-h-[70vh] bg-black rounded-md"
                    />
                  )}
                </DialogContent>
              </Dialog>
            )
          }
          TSX

      - name: Create V2.4 source patch
        run: |
          cat > "$RUNNER_TEMP/patch-v24.cjs" <<'NODE'
          const fs =
            require('fs')

          function read(path) {
            return fs.readFileSync(
              path,
              'utf8'
            )
          }

          function write(
            path,
            content
          ) {
            fs.writeFileSync(
              path,
              content,
              'utf8'
            )
          }

          function replaceRange(
            source,
            startMarker,
            endMarker,
            replacement,
            label
          ) {
            const start =
              source.indexOf(
                startMarker
              )

            const end =
              source.indexOf(
                endMarker,
                start
              )

            if (
              start < 0 ||
              end < 0 ||
              end <= start
            ) {
              throw new Error(
                `Unable to patch: ${label}`
              )
            }

            return (
              source.slice(
                0,
                start
              ) +
              replacement +
              source.slice(
                end
              )
            )
          }

          // ======================================================
          // A. Douyin highest-quality sorting
          // ======================================================

          const douyinPath =
            'src/main/crawler/plugins/douyin.js'

          let douyin =
            read(douyinPath)

          const qualityBlock = String.raw`
          function normalizeQualityName(
            value
          ) {
            return String(
              value || ''
            )
              .trim()
              .toUpperCase()
          }

          function getQualityRank(
            quality
          ) {
            const value =
              normalizeQualityName(
                quality
              )

            if (
              value.includes(
                'ORIGION'
              ) ||
              value.includes(
                'ORIGIN'
              ) ||
              value.includes(
                'ORIGINAL'
              ) ||
              value.includes(
                'SOURCE'
              )
            ) {
              return 10000
            }

            if (
              value.includes(
                'UHD'
              ) ||
              value.includes(
                '4K'
              )
            ) {
              return 9500
            }

            if (
              value.includes(
                'FULL_HD'
              ) ||
              value.includes(
                'FULLHD'
              ) ||
              value.includes(
                'FHD'
              )
            ) {
              return 9000
            }

            if (
              value.includes(
                'HD'
              )
            ) {
              return 8000
            }

            if (
              value.includes(
                'SD3'
              )
            ) {
              return 7000
            }

            if (
              value.includes(
                'SD2'
              )
            ) {
              return 6000
            }

            if (
              value.includes(
                'SD1'
              )
            ) {
              return 5000
            }

            if (
              value.includes(
                'LD'
              )
            ) {
              return 3000
            }

            return 0
          }

          function parseResolutionValue(
            value
          ) {
            if (
              value == null
            ) {
              return 0
            }

            if (
              typeof value ===
              'object'
            ) {
              const width =
                Number(
                  value.width ||
                  value.w ||
                  0
                )

              const height =
                Number(
                  value.height ||
                  value.h ||
                  0
                )

              if (
                width > 0 &&
                height > 0
              ) {
                return (
                  width *
                  height
                )
              }

              let best = 0

              for (
                const child of
                Object.values(
                  value
                )
              ) {
                best =
                  Math.max(
                    best,
                    parseResolutionValue(
                      child
                    )
                  )
              }

              return best
            }

            const text =
              String(value)

            const match =
              text.match(
                /(\d{2,5})\s*[xX*×]\s*(\d{2,5})/
              )

            if (!match) {
              return 0
            }

            const width =
              Number(match[1])

            const height =
              Number(match[2])

            if (
              width <= 0 ||
              height <= 0
            ) {
              return 0
            }

            return (
              width *
              height
            )
          }

          function parseSdkParams(
            main
          ) {
            try {
              const raw =
                main?.sdk_params

              if (!raw) {
                return {}
              }

              return (
                typeof raw ===
                  'string'
                  ? JSON.parse(raw)
                  : raw
              )
            } catch {
              return {}
            }
          }

          function getStreamBitrate(
            main
          ) {
            const params =
              parseSdkParams(
                main
              )

            const values = [
              params?.vbitrate,
              params?.bitrate,
              params?.video_bitrate,
              main?.vbitrate,
              main?.bitrate
            ]

            for (
              const item of values
            ) {
              const value =
                Number(item)

              if (
                Number.isFinite(
                  value
                ) &&
                value > 0
              ) {
                return value
              }
            }

            return 0
          }

          function getStreamResolution(
            main
          ) {
            const params =
              parseSdkParams(
                main
              )

            const candidates = [
              params?.candidate_resolution,
              params?.default_resolution,
              params?.resolution,
              params?.video_resolution,
              params?.resolution_name,
              main?.candidate_resolution,
              main?.default_resolution,
              main?.resolution
            ]

            let best = 0

            for (
              const candidate of
              candidates
            ) {
              best =
                Math.max(
                  best,
                  parseResolutionValue(
                    candidate
                  )
                )
            }

            return best
          }

          function collectMainStreamCandidates(
            streamData
          ) {
            const result = []

            if (!streamData) {
              return result
            }

            try {
              const parsed =
                typeof streamData ===
                  'string'
                  ? JSON.parse(
                      streamData
                    )
                  : streamData

              const data =
                parsed?.data || {}

              for (
                const [
                  quality,
                  streamInfo
                ] of Object.entries(
                  data
                )
              ) {
                const main =
                  streamInfo?.main

                if (!main) {
                  continue
                }

                const bitrate =
                  getStreamBitrate(
                    main
                  )

                const resolution =
                  getStreamResolution(
                    main
                  )

                const rank =
                  getQualityRank(
                    quality
                  )

                if (main.flv) {
                  result.push({
                    url:
                      main.flv,

                    type:
                      'flv',

                    quality,

                    rank,

                    resolution,

                    bitrate
                  })
                }

                if (main.hls) {
                  result.push({
                    url:
                      main.hls,

                    type:
                      'hls',

                    quality,

                    rank,

                    resolution,

                    bitrate
                  })
                }
              }
            } catch {
              // Ignore malformed stream data.
            }

            return result
          }

          function collectDesktopStreams(
            room
          ) {
            const streamUrl =
              room?.stream_url

            if (!streamUrl) {
              return []
            }

            const candidates = []
            const seen =
              new Set()

            const addCandidate =
              (candidate) => {
                const url =
                  candidate?.url

                if (
                  !url ||
                  seen.has(url)
                ) {
                  return
                }

                seen.add(url)

                const quality =
                  candidate.quality ||
                  ''

                candidates.push({
                  url,

                  type:
                    candidate.type ||
                    'unknown',

                  quality,

                  rank:
                    Number(
                      candidate.rank ??
                      getQualityRank(
                        quality
                      )
                    ),

                  resolution:
                    Number(
                      candidate.resolution ||
                      0
                    ),

                  bitrate:
                    Number(
                      candidate.bitrate ||
                      0
                    )
                })
              }

            const addList =
              (items) => {
                for (
                  const item of items
                ) {
                  addCandidate(
                    item
                  )
                }
              }

            const pullDatas =
              streamUrl.pull_datas

            if (pullDatas) {
              for (
                const item of
                Object.values(
                  pullDatas
                )
              ) {
                addList(
                  collectMainStreamCandidates(
                    item?.stream_data
                  )
                )
              }
            }

            const coreData =
              streamUrl
                ?.live_core_sdk_data
                ?.pull_data
                ?.stream_data

            addList(
              collectMainStreamCandidates(
                coreData
              )
            )

            const flvMap =
              streamUrl
                ?.flv_pull_url

            if (flvMap) {
              for (
                const [
                  quality,
                  url
                ] of Object.entries(
                  flvMap
                )
              ) {
                addCandidate({
                  url,

                  type:
                    'flv',

                  quality,

                  rank:
                    getQualityRank(
                      quality
                    ),

                  resolution:
                    0,

                  bitrate:
                    0
                })
              }
            }

            const hlsMap =
              streamUrl
                ?.hls_pull_url_map

            if (hlsMap) {
              for (
                const [
                  quality,
                  url
                ] of Object.entries(
                  hlsMap
                )
              ) {
                addCandidate({
                  url,

                  type:
                    'hls',

                  quality,

                  rank:
                    getQualityRank(
                      quality
                    ),

                  resolution:
                    0,

                  bitrate:
                    0
                })
              }
            }

            candidates.sort(
              (a, b) => {
                if (
                  b.rank !==
                  a.rank
                ) {
                  return (
                    b.rank -
                    a.rank
                  )
                }

                if (
                  b.resolution !==
                  a.resolution
                ) {
                  return (
                    b.resolution -
                    a.resolution
                  )
                }

                if (
                  b.bitrate !==
                  a.bitrate
                ) {
                  return (
                    b.bitrate -
                    a.bitrate
                  )
                }

                if (
                  a.type ===
                    'flv' &&
                  b.type !==
                    'flv'
                ) {
                  return -1
                }

                if (
                  b.type ===
                    'flv' &&
                  a.type !==
                    'flv'
                ) {
                  return 1
                }

                return 0
              }
            )

            if (
              candidates.length > 0
            ) {
              const best =
                candidates[0]

              log(
                'Douyin best stream:',
                {
                  quality:
                    best.quality,

                  type:
                    best.type,

                  rank:
                    best.rank,

                  resolution:
                    best.resolution,

                  bitrate:
                    best.bitrate
                }
              )
            }

            return candidates.map(
              (item) =>
                item.url
            )
          }


          `

          douyin =
            replaceRange(
              douyin,
              'function getStreamBitrate(',
              'function getDesktopRoom(',
              qualityBlock,
              'Douyin highest quality block'
            )

          write(
            douyinPath,
            douyin
          )

          // ======================================================
          // B. Preview selection
          // ======================================================

          const operationPath =
            'src/renderer/src/components/StreamConfigList/components/OperationBar.tsx'

          let operation =
            read(operationPath)

          const stateMarker =
            `  const [previewUrl, setPreviewUrl] = useState('')`

          if (
            operation.includes(
              stateMarker
            ) &&
            !operation.includes(
              'previewType'
            )
          ) {
            operation =
              operation.replace(
                stateMarker,

                `  const [previewUrl, setPreviewUrl] = useState('')
            const [previewType, setPreviewType] = useState<'hls' | 'flv'>('hls')`
              )
          }

          const previewStartMarker =
            '  const handlePreviewClick = async () => {'

          const previewEndMarker =
            '  useEffect(() => {'

          const previewStart =
            operation.indexOf(
              previewStartMarker
            )

          const previewEnd =
            operation.indexOf(
              previewEndMarker,
              previewStart
            )

          if (
            previewStart < 0 ||
            previewEnd < 0 ||
            previewEnd <=
              previewStart
          ) {
            throw new Error(
              'Preview function range not found'
            )
          }

          const previewFunction = String.raw`
            const handlePreviewClick = async () => {
              setIsLoadingPreview(
                true
              )

              try {
                const {
                  code,
                  liveUrls
                } =
                  await window.api.getLiveUrls({
                    roomUrl:
                      streamConfig.roomUrl,

                    cookie:
                      streamConfig.cookie,

                    proxy:
                      streamConfig.proxy,

                    title:
                      streamConfig.title
                  })

                if (
                  code !==
                  SUCCESS_CODE
                ) {
                  toast({
                    title:
                      streamConfig.title,

                    description:
                      t(
                        errorCodeToI18nMessage(
                          code,
                          'error.get_line.'
                        )
                      ),

                    variant:
                      'destructive'
                  })

                  return
                }

                if (
                  !Array.isArray(
                    liveUrls
                  ) ||
                  liveUrls.length ===
                    0
                ) {
                  toast({
                    title:
                      streamConfig.title,

                    description:
                      t(
                        'stream_config.preview_stream_unavailable'
                      ),

                    variant:
                      'destructive'
                  })

                  return
                }

                const hlsUrl =
                  liveUrls.find(
                    (url) =>
                      /\.m3u8(?:\?|$)/i.test(
                        url
                      ) ||
                      /pull-hls/i.test(
                        url
                      ) ||
                      /\/hls\//i.test(
                        url
                      )
                  )

                if (hlsUrl) {
                  setPreviewType(
                    'hls'
                  )

                  setPreviewUrl(
                    hlsUrl
                  )

                  setPreviewOpen(
                    true
                  )

                  return
                }

                const flvUrl =
                  liveUrls.find(
                    (url) =>
                      /\.flv(?:\?|$)/i.test(
                        url
                      ) ||
                      /pull-flv/i.test(
                        url
                      ) ||
                      /\/flv\//i.test(
                        url
                      )
                  )

                if (flvUrl) {
                  setPreviewType(
                    'flv'
                  )

                  setPreviewUrl(
                    flvUrl
                  )

                  setPreviewOpen(
                    true
                  )

                  return
                }

                const fallback =
                  liveUrls.find(
                    (url) =>
                      /^https?:\/\//i.test(
                        url
                      )
                  )

                if (fallback) {
                  const looksLikeFlv =
                    /flv/i.test(
                      fallback
                    )

                  setPreviewType(
                    looksLikeFlv
                      ? 'flv'
                      : 'hls'
                  )

                  setPreviewUrl(
                    fallback
                  )

                  setPreviewOpen(
                    true
                  )

                  return
                }

                toast({
                  title:
                    streamConfig.title,

                  description:
                    t(
                      'stream_config.preview_stream_unavailable'
                    ),

                  variant:
                    'destructive'
                })
              } finally {
                setIsLoadingPreview(
                  false
                )
              }
            }


          `

          operation =
            operation.slice(
              0,
              previewStart
            ) +
            previewFunction +
            operation.slice(
              previewEnd
            )

          if (
            !operation.includes(
              'type={previewType}'
            )
          ) {
            const urlMarker =
              `      url={previewUrl}`

            if (
              !operation.includes(
                urlMarker
              )
            ) {
              throw new Error(
                'Preview dialog URL marker missing'
              )
            }

            operation =
              operation.replace(
                urlMarker,

                `      url={previewUrl}
                type={previewType}`
              )
          }

          write(
            operationPath,
            operation
          )

          // ======================================================
          // C. Locale
          // ======================================================

          const localePath =
            'src/renderer/src/locales/locales.js'

          let locale =
            read(localePath)

          if (
            !locale.includes(
              'preview_stream_unavailable'
            )
          ) {
            locale =
              locale.replace(
                `        preview_hls_unavailable: 'No HLS stream is available for preview.'`,

                `        preview_hls_unavailable: 'No HLS stream is available for preview.',
                  preview_stream_unavailable: 'No supported live stream is available for preview.'`
              )

            locale =
              locale.replace(
                `        preview_hls_unavailable: '当前没有可用于预览的 HLS 直播流'`,

                `        preview_hls_unavailable: '当前没有可用于预览的 HLS 直播流',
                  preview_stream_unavailable: '当前没有可用于预览的直播流'`
              )
          }

          write(
            localePath,
            locale
          )

          // ======================================================
          // D. Final patch validation
          // ======================================================

          const finalDouyin =
            read(douyinPath)

          const finalOperation =
            read(operationPath)

          if (
            !finalDouyin.includes(
              'getQualityRank'
            )
          ) {
            throw new Error(
              'Quality ranking missing'
            )
          }

          if (
            !finalDouyin.includes(
              'candidate_resolution'
            )
          ) {
            throw new Error(
              'Resolution detection missing'
            )
          }

          if (
            !finalOperation.includes(
              'previewType'
            )
          ) {
            throw new Error(
              'Preview type missing'
            )
          }

          console.log(
            'V2.4 source patch completed.'
          )
          NODE

      - name: Validate patch script syntax
        run: |
          node --check \
            "$RUNNER_TEMP/patch-v24.cjs"

      - name: Apply V2.4 source patch
        run: |
          node \
            "$RUNNER_TEMP/patch-v24.cjs"

      - name: Update version
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          npm version \
            "$APP_VERSION" \
            --no-git-tag-version

      - name: Verify V2.4 changes
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          echo \
            "Checking highest quality logic..."

          grep -q \
            "getQualityRank" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "candidate_resolution" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "default_resolution" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "ORIGION" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "FULL_HD" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "Douyin best stream" \
            src/main/crawler/plugins/douyin.js

          echo \
            "Checking preview..."

          grep -q \
            "mpegts.createPlayer" \
            src/renderer/src/components/StreamPreviewDialog.tsx

          grep -q \
            "Hls.isSupported" \
            src/renderer/src/components/StreamPreviewDialog.tsx

          grep -q \
            "previewType" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          grep -q \
            "pull-flv" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          grep -q \
            "pull-hls" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          if grep -Fq \
            "www.fideo.site/cn?streamUrl=" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx
          then
            echo \
              "ERROR: old preview website still exists"

            exit 1
          fi

          echo \
            "Checking FFmpeg recording..."

          if grep -Fq \
            "inputOptions(['-re'])" \
            src/main/ffmpeg/record.ts
          then
            echo \
              "ERROR: FFmpeg -re returned"

            exit 1
          fi

          grep -q \
            "reconnect_streamed" \
            src/main/ffmpeg/record.ts

          echo \
            "Checking dependencies..."

          node -e "
          const p =
            require('./package.json');

          if (
            p.version !==
            process.env.APP_VERSION
          ) {
            console.error(
              'Version mismatch:',
              p.version
            );

            process.exit(1);
          }

          if (
            !p.dependencies['hls.js']
          ) {
            console.error(
              'hls.js missing'
            );

            process.exit(1);
          }

          if (
            !p.dependencies['mpegts.js']
          ) {
            console.error(
              'mpegts.js missing'
            );

            process.exit(1);
          }

          console.log(
            'Version:',
            p.version
          );
          "

          echo \
            "All V2.4 source checks passed."

      - name: TypeScript check
        run: |
          npm run typecheck

      - name: Build Electron app
        run: |
          npm run build

      - name: Package Windows x64
        run: |
          npx electron-builder \
            --win \
            nsis \
            --x64 \
            --publish never

      - name: Verify Windows installer
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $package =
            Get-Content package.json |
            ConvertFrom-Json

          if (
            $package.version -ne
            $env:EXPECTED_VERSION
          ) {
            throw `
              "Version mismatch. Expected $env:EXPECTED_VERSION, got $($package.version)"
          }

          $installers =
            Get-ChildItem `
              -Path dist `
              -Filter "*-x64.exe"

          if (
            $installers.Count -eq 0
          ) {
            throw `
              "Windows x64 installer not generated."
          }

          Write-Host `
            "Generated installer:"

          $installers |
            Select-Object `
              Name,
              Length,
              FullName

      - name: Commit V2.4 tested source
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            package.json \
            package-lock.json \
            src/main/crawler/plugins/douyin.js \
            src/renderer/src/components/StreamPreviewDialog.tsx \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx \
            src/renderer/src/locales/locales.js

          if git diff --cached --quiet
          then
            echo \
              "No source changes to commit."
          else
            git commit \
              -m "Improve Douyin original quality selection and FLV preview"
          fi

          git push \
            --force \
            origin \
            douyin-v2.4-test

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-${{ inputs.version }}-douyin-v2.4-windows-x64
          path: dist/*-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          {
            echo "# Fideo Douyin V2.4"
            echo
            echo "Version: \`$APP_VERSION\`"
            echo
            echo "Branch: \`douyin-v2.4-test\`"
            echo
            echo "Changes:"
            echo
            echo "- Prefer original/source quality"
            echo "- Quality rank before bitrate"
            echo "- Resolution-aware sorting"
            echo "- Bitrate fallback sorting"
            echo "- FLV preferred for recording"
            echo "- HLS internal preview"
            echo "- FLV internal preview fallback"
            echo "- Fixed mpegts play TypeScript error"
            echo "- FFmpeg stream copy retained"
            echo "- FFmpeg reconnect retained"
            echo "- Windows x64 test installer"
          } >> "$GITHUB_STEP_SUMMARY"
