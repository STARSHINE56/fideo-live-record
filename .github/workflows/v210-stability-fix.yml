name: V2.10 Stability Fix V5

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v210-stability-fix-v5
  cancel-in-progress: false

env:
  SOURCE_BRANCH: douyin-v2.8-anchor-monitor-test
  FIX_BRANCH: v210-stability-fix-v5

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create backup
        shell: bash
        run: |
          set -euo pipefail

          BACKUP="backup-v210-stability-v5-${GITHUB_RUN_ID}"

          git branch "$BACKUP"
          git push origin "$BACKUP"

          echo "Backup: $BACKUP"

      - name: Create fix branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$FIX_BRANCH" "$SOURCE_BRANCH"

      - name: Apply fixes
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import json

          def load(path):
              return Path(path).read_text(
                  encoding="utf-8"
              ).replace("\r\n", "\n")

          def save(path, text):
              Path(path).write_text(
                  text,
                  encoding="utf-8",
                  newline="\n"
              )

          def find_line(lines, text, start=0):
              for i in range(start, len(lines)):
                  if text in lines[i]:
                      return i

              raise RuntimeError(
                  f"找不到代码标记: {text}"
              )

          # ==================================================
          # 1. 版本号
          # ==================================================

          pkg_path = Path("package.json")

          pkg = json.loads(
              pkg_path.read_text(
                  encoding="utf-8"
              )
          )

          pkg["version"] = "1.1.11-beta.1"

          pkg_path.write_text(
              json.dumps(
                  pkg,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          lock_path = Path("package-lock.json")

          if lock_path.exists():
              lock = json.loads(
                  lock_path.read_text(
                      encoding="utf-8"
                  )
              )

              if isinstance(lock, dict):
                  lock["version"] = "1.1.11-beta.1"

                  packages = lock.get("packages")

                  if (
                      isinstance(packages, dict)
                      and ""
                      in packages
                      and isinstance(
                          packages[""],
                          dict
                      )
                  ):
                      packages[""]["version"] = (
                          "1.1.11-beta.1"
                      )

              lock_path.write_text(
                  json.dumps(
                      lock,
                      ensure_ascii=False,
                      indent=2
                  ) + "\n",
                  encoding="utf-8"
              )

          print("OK 1: version")

          # ==================================================
          # 2. 抖音完整登录 Cookie
          # ==================================================

          path = "src/main/crawler/plugins/douyin.js"
          lines = load(path).splitlines()

          start = find_line(
              lines,
              "const loginCookie ="
          )

          end = find_line(
              lines,
              "const finalCookie = [",
              start + 1
          )

          indent = (
              lines[start][
                  :len(lines[start])
                  - len(lines[start].lstrip())
              ]
          )

          new_lines = [
              f"{indent}const loginCookie =",
              f"{indent}  cookie",
              f"{indent}    ? String(cookie).trim()",
              f"{indent}    : ''",
              ""
          ]

          lines[
              start:end
          ] = new_lines

          save(
              path,
              "\n".join(lines) + "\n"
          )

          print("OK 2: full Douyin cookie")

          # ==================================================
          # 3. 登录状态判断
          # ==================================================

