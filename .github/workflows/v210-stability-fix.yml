name: V2.10 Stability Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v210-stability-fix
  cancel-in-progress: false

env:
  SOURCE_BRANCH: douyin-v2.8-anchor-monitor-test
  FIX_BRANCH: v210-stability-fix

jobs:
  fix:
    name: Fix and verify V2.10
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout V2.10 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create safety backup
        shell: bash
        run: |
          set -euo pipefail

          BACKUP_BRANCH="backup-v210-stability-${GITHUB_RUN_ID}"

          git branch "$BACKUP_BRANCH"
          git push origin "$BACKUP_BRANCH"

          echo "Backup created: $BACKUP_BRANCH"

      - name: Create fix branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$FIX_BRANCH" "$SOURCE_BRANCH"

      - name: Apply stability fixes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          def read(path):
              return Path(path).read_text(
                  encoding="utf-8"
              ).replace(
                  "\r\n",
                  "\n"
              ).replace(
                  "\r",
                  "\n"
              )

          def write(path, content):
              Path(path).write_text(
                  content,
                  encoding="utf-8",
                  newline="\n"
              )

          def replace_regex(
              content,
              pattern,
              replacement,
              name
          ):
              result, count = re.subn(
                  pattern,
                  replacement,
                  content,
                  count=1,
                  flags=re.MULTILINE | re.DOTALL
              )

              if count != 1:
                  raise RuntimeError(
                      f"{name}: expected 1 match, got {count}"
                  )

              print(
                  f"OK: {name}"
              )

              return result

          # ==================================================
          # 1. package.json 测试版本号
          # ==================================================

          package_path = Path(
              "package.json"
          )

          package = json.loads(
              package_path.read_text(
                  encoding="utf-8"
              )
          )

          package["version"] = (
              "1.1.11-beta.1"
          )

          package_path.write_text(
              json.dumps(
                  package,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print(
              "OK: package version"
          )

          # ==================================================
          # 2. 抖音直播间请求使用完整登录 Cookie
          # ==================================================

          path = (
              "src/main/crawler/plugins/douyin.js"
          )

          text = read(path)

          text = replace_regex(
              text,
              r"""const\s+loginCookie\s*=\s*
                  getCookieWithTtwid
                  \s*\(\s*cookie\s*\)
              """.replace(
                  " ",
                  r"[ \t]*"
              ),
              """const loginCookie =
            cookie
              ? String(cookie).trim()
              : ''""",
              "Douyin full login cookie"
          )

          write(
              path,
              text
          )

          # ==================================================
          # 3. 修复抖音登录状态误判
          # ==================================================

          path = (
              "src/main/douyin-session.ts"
          )

          text = read(path)

          pattern = (
              r"const\s+hasSession\s*=\s*"
              r"cookies\.some\(\s*"
              r"\(cookie\)\s*=>\s*"
              r"authCookieNames\.has\("
              r"cookie\.name"
              r"\)\s*"
              r"\)\s*"
              r"\|\|\s*"
              r"cookies\.length\s*>=\s*5"
          )

          replacement = """const hasSession =
            cookies.some((cookie) =>
              authCookieNames.has(cookie.name)
            )"""

          text = replace_regex(
              text,
              pattern,
              replacement,
              "Douyin login status"
          )

          write(
              path,
              text
          )

          # ==================================================
          # 4. 录像配置日志 Cookie 脱敏
          # ==================================================

          path = (
              "src/main/ffmpeg/record.ts"
          )

          text = read(path)

          pattern = (
              r"writeLog\(\s*"
              r"title\s*,\s*"
              r"`RecordStream Config:\s*"
              r"\$\{JSON\.stringify\(\s*"
              r"streamConfig\s*,\s*"
              r"null\s*,\s*"
              r"2\s*"
              r"\)\}`"
              r"\s*\)"
          )

          replacement = """const safeLogConfig = {
            ...streamConfig,

            cookie:
              streamConfig.cookie
                ? '[REDACTED]'
                : ''
          }

          writeLog(
            title,

            `RecordStream Config: ${JSON.stringify(
              safeLogConfig,
              null,
              2
            )}`
          )"""

          text = replace_regex(
              text,
              pattern,
              replacement,
              "Record cookie redaction"
          )

          write(
              path,
              text
          )

          # ==================================================
          # 5. 软件启动后恢复异常退出残留状态
          # ==================================================

          path = (
              "src/renderer/src/store/"
              "useStreamConfigStore.ts"
          )

          text = read(path)

          pattern = (
              r"(if\s*\(\s*"
              r"typeof\s+streamConfig\.autoRecord"
              r"\s*!==\s*"
              r"'boolean'"
              r"\s*\)\s*\{\s*"
              r"shouldUpdate\s*=\s*true\s*"
              r"streamConfig\.autoRecord"
              r"\s*=\s*true\s*"
              r"\})"
          )

          replacement = r"""\1

              if (
                streamConfig.status !== 0
              ) {
                shouldUpdate = true

                streamConfig.status = 0
              }

              if (
                streamConfig.cloudUploadStatus ===
                'uploading'
              ) {
                shouldUpdate = true

                streamConfig.cloudUploadStatus =
                  undefined
              }"""

          text = replace_regex(
              text,
              pattern,
              replacement,
              "Runtime state recovery"
          )

          write(
              path,
              text
          )

          # ==================================================
          # 6. 主进程外部链接只允许 http / https
          # ==================================================

          path = (
              "src/main/index.ts"
          )

          text = read(path)

          if (
              "function openSafeExternalUrl("
              in text
          ):
              raise RuntimeError(
                  "openSafeExternalUrl already exists"
              )

          marker = (
              "async function checkUpdate() {"
          )

          if marker not in text:
              raise RuntimeError(
                  "checkUpdate marker not found"
              )

          helper = """function openSafeExternalUrl(
            value: string
          ) {
            try {
              const url =
                new URL(value)

              if (
                url.protocol !== 'https:' &&
                url.protocol !== 'http:'
              ) {
                return false
              }

              void shell.openExternal(
                url.toString()
              )

              return true
            } catch {
              return false
            }
          }

          async function checkUpdate() {"""

          text = text.replace(
              marker,
              helper,
              1
          )

          pattern = (
              r"mainWindow\.webContents"
              r"\.setWindowOpenHandler"
              r"\(\s*"
              r"\(details\)\s*=>\s*\{\s*"
              r"shell\.openExternal"
              r"\(\s*details\.url\s*\)"
              r"\s*"
              r"return\s*\{\s*"
              r"action:\s*'deny'"
              r"\s*\}"
              r"\s*\}"
              r"\s*\)"
          )

          replacement = """mainWindow.webContents.setWindowOpenHandler((details) => {
            openSafeExternalUrl(
              details.url
            )

            return {
              action: 'deny'
            }
          })"""

          text = replace_regex(
              text,
              pattern,
              replacement,
              "Window external URL guard"
          )

          pattern = (
              r"ipcMain\.handle"
              r"\(\s*"
              r"NAV_BY_DEFAULT_BROWSER"
              r"\s*,\s*"
              r"\(_,\s*url:\s*string\)"
              r"\s*=>\s*\{\s*"
              r"shell\.openExternal"
              r"\(\s*url\s*\)"
              r"\s*\}"
              r"\s*\)"
          )

          replacement = """ipcMain.handle(
            NAV_BY_DEFAULT_BROWSER,

            (_, url: string) => {
              return openSafeExternalUrl(
                url
              )
            }
          )"""

          text = replace_regex(
              text,
              pattern,
              replacement,
              "IPC external URL guard"
          )

          # ==================================================
          # 7. WebDAV 上传主进程串行队列
          # ==================================================

          marker = (
              "export const writeLog = "
              "writeLogWrapper(app.getPath('userData'))"
          )

          if marker not in text:
              raise RuntimeError(
                  "writeLog marker not found"
              )

          queue_code = """export const writeLog = writeLogWrapper(app.getPath('userData'))

          let webdavUploadQueue:
            Promise<void> =
            Promise.resolve()

          function enqueueWebdavUpload(
            request:
              Parameters<
                typeof uploadWebdav
              >[0]
          ) {
            const task =
              webdavUploadQueue
                .then(
                  () =>
                    uploadWebdav(
                      request
                    ),

                  () =>
                    uploadWebdav(
                      request
                    )
                )

            webdavUploadQueue =
              task.then(
                () => undefined,
                () => undefined
              )

            return task
          }"""

          text = text.replace(
              marker,
              queue_code,
              1
          )

          pattern = (
              r"ipcMain\.handle"
              r"\(\s*"
              r"UPLOAD_WEBDAV"
              r"\s*,\s*"
              r"async\s*"
              r"\(_,\s*request\)"
              r"\s*=>\s*\{\s*"
              r"return\s+await\s+"
              r"uploadWebdav"
              r"\(\s*request\s*\)"
              r"\s*\}"
              r"\s*\)"
          )

          replacement = """ipcMain.handle(
            UPLOAD_WEBDAV,

            async (_, request) => {
              return await enqueueWebdavUpload(
                request
              )
            }
          )"""

          text = replace_regex(
              text,
              pattern,
              replacement,
              "WebDAV serial queue"
          )

          write(
              path,
              text
          )

          # ==================================================
          # 8. WebDAV 地址强制 HTTPS
          # ==================================================

          path = (
              "src/main/webdav.ts"
          )

          text = read(path)

          if (
              "const validateWebdavUrl"
              in text
          ):
              raise RuntimeError(
                  "validateWebdavUrl already exists"
              )

          marker = (
              "const cleanBaseUrl = ("
          )

          position = text.find(
              marker
          )

          if position < 0:
              raise RuntimeError(
                  "cleanBaseUrl marker not found"
              )

          validator = """const validateWebdavUrl = (
            value: string
          ) => {
            const trimmed =
              String(
                value || ''
              ).trim()

            let parsed:
              URL

            try {
              parsed =
                new URL(
                  trimmed
                )
            } catch {
              throw new Error(
                'WebDAV 地址格式无效'
              )
            }

            if (
              parsed.protocol !==
              'https:'
            ) {
              throw new Error(
                'WebDAV 地址必须使用 HTTPS'
              )
            }

            return trimmed
          }

          """

          text = (
              text[:position]
              + validator
              + text[position:]
          )

          pattern = (
              r"(const\s+config\s*:\s*"
              r"IWebdavConfig\s*=\s*\{\s*"
              r"url\s*:\s*)"
              r"request\.url"
          )

          replacement = (
              r"\1validateWebdavUrl("
              r"request.url"
              r")"
          )

          text = replace_regex(
              text,
              pattern,
              replacement,
              "Upload HTTPS validation"
          )

          pattern = (
              r"(export\s+async\s+function\s+"
              r"testWebdav"
              r"\(\s*"
              r"config:\s*IWebdavConfig"
              r"\s*\)\s*\{\s*"
              r"try\s*\{)"
          )

          replacement = r"""\1
              config = {
                ...config,

                url:
                  validateWebdavUrl(
                    config.url
                  )
              }"""

          text = replace_regex(
              text,
              pattern,
              replacement,
              "Test HTTPS validation"
          )

          write(
              path,
              text
          )

          print(
              "All stability patches applied."
          )
          PY

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            '"version": "1.1.11-beta.1"' \
            package.json

          grep -q \
            "String(cookie).trim()" \
            src/main/crawler/plugins/douyin.js

          if grep -q \
            "getCookieWithTtwid(cookie)" \
            src/main/crawler/plugins/douyin.js
          then
            echo "ERROR: desktop flow still truncates login cookie"
            exit 1
          fi

          if grep -q \
            "cookies.length >= 5" \
            src/main/douyin-session.ts
          then
            echo "ERROR: old login fallback still exists"
            exit 1
          fi

          grep -q \
            "\[REDACTED\]" \
            src/main/ffmpeg/record.ts

          grep -q \
            "streamConfig.status = 0" \
            src/renderer/src/store/useStreamConfigStore.ts

          grep -q \
            "cloudUploadStatus =" \
            src/renderer/src/store/useStreamConfigStore.ts

          grep -q \
            "openSafeExternalUrl" \
            src/main/index.ts

          grep -q \
            "enqueueWebdavUpload" \
            src/main/index.ts

          grep -q \
            "WebDAV 地址必须使用 HTTPS" \
            src/main/webdav.ts

          git diff --check

          echo "Static verification passed."

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "===== Changed files ====="
          git status --short

          echo ""
          echo "===== Diff summary ====="
          git diff --stat

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail

          git add \
            package.json \
            src/main/index.ts \
            src/main/webdav.ts \
            src/main/douyin-session.ts \
            src/main/ffmpeg/record.ts \
            src/main/crawler/plugins/douyin.js \
            src/renderer/src/store/useStreamConfigStore.ts

          if git diff --cached --quiet
          then
            echo "No changes to commit."
          else
            git commit \
              -m "fix: improve V2.10 stability"
          fi

      - name: Push verified fix branch
        shell: bash
        run: |
          set -euo pipefail

          git push \
            --force \
            origin \
            "$FIX_BRANCH"

      - name: Promote after all checks pass
        shell: bash
        run: |
          set -euo pipefail

          git push \
            origin \
            "HEAD:${SOURCE_BRANCH}"

      - name: Summary
        shell: bash
        run: |
          {
            echo "# V2.10 Stability Fix"
            echo ""
            echo "✅ Full Douyin login Cookie"
            echo "✅ Login status detection"
            echo "✅ Cookie log redaction"
            echo "✅ Runtime state recovery"
            echo "✅ WebDAV serial upload queue"
            echo "✅ WebDAV HTTPS validation"
            echo "✅ External URL whitelist"
            echo "✅ Version 1.1.11-beta.1"
            echo "✅ TypeScript check"
            echo "✅ Application build"
          } >> "$GITHUB_STEP_SUMMARY"
