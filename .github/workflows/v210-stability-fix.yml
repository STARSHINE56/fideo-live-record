name: V2.10 Stability Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v210-stability-fix
  cancel-in-progress: false

env:
  SOURCE_BRANCH: douyin-v2.8-anchor-monitor-test
  FIX_BRANCH: v210-stability-fix

jobs:
  fix:
    name: Fix and verify V2.10
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout V2.10 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create safety backup
        shell: bash
        run: |
          set -euo pipefail

          BACKUP_BRANCH="backup-v210-stability-${GITHUB_RUN_ID}"

          git branch "$BACKUP_BRANCH"
          git push origin "$BACKUP_BRANCH"

          echo "Backup created: $BACKUP_BRANCH"

      - name: Create fix branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$FIX_BRANCH" "$SOURCE_BRANCH"

      - name: Apply stability fixes
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs')

          function read(path) {
            return fs
              .readFileSync(path, 'utf8')
              .replace(/\r\n/g, '\n')
              .replace(/\r/g, '\n')
          }

          function write(path, content) {
            fs.writeFileSync(
              path,
              content,
              'utf8'
            )
          }

          function replaceOnce(
            content,
            oldValue,
            newValue,
            name
          ) {
            const index =
              content.indexOf(
                oldValue
              )

            if (index < 0) {
              throw new Error(
                `Marker missing: ${name}`
              )
            }

            console.log(
              `OK: ${name}`
            )

            return (
              content.slice(
                0,
                index
              ) +
              newValue +
              content.slice(
                index +
                  oldValue.length
              )
            )
          }

          function replaceBetween(
            content,
            startMarker,
            endMarker,
            replacement,
            name
          ) {
            const start =
              content.indexOf(
                startMarker
              )

            if (start < 0) {
              throw new Error(
                `Start marker missing: ${name}`
              )
            }

            const end =
              content.indexOf(
                endMarker,
                start +
                  startMarker.length
              )

            if (end < 0) {
              throw new Error(
                `End marker missing: ${name}`
              )
            }

            console.log(
              `OK: ${name}`
            )

            return (
              content.slice(
                0,
                start
              ) +
              replacement +
              content.slice(
                end
              )
            )
          }

          // ============================================
          // 1. package.json 版本号
          // ============================================

          {
            const path =
              'package.json'

            const pkg =
              JSON.parse(
                read(path)
              )

            pkg.version =
              '1.1.11-beta.1'

            write(
              path,
              JSON.stringify(
                pkg,
                null,
                2
              ) + '\n'
            )

            console.log(
              'OK: package version'
            )
          }

          // ============================================
          // 2. 抖音完整 Cookie
          // ============================================

          {
            const path =
              'src/main/crawler/plugins/douyin.js'

            let text =
              read(path)

            text =
              replaceBetween(
                text,

                '  const loginCookie =\n',

                '  const finalCookie = [\n',

                `  const loginCookie =
            cookie
              ? String(cookie).trim()
              : ''

          `,

                'Douyin full login cookie'
              )

            write(
              path,
              text
            )
          }

          // ============================================
          // 3. 抖音登录状态判断
          // ============================================

          {
            const path =
              'src/main/douyin-session.ts'

            let text =
              read(path)

            const oldValue =
          `  const hasSession =
            cookies.some((cookie) =>
              authCookieNames.has(cookie.name)
            ) ||
            cookies.length >= 5
          `

            const newValue =
          `  const hasSession =
            cookies.some((cookie) =>
              authCookieNames.has(cookie.name)
            )
          `

            text =
              replaceOnce(
                text,
                oldValue,
                newValue,
                'Douyin login status'
              )

            write(
              path,
              text
            )
          }

          // ============================================
          // 4. Cookie 日志脱敏
          // ============================================

          {
            const path =
              'src/main/ffmpeg/record.ts'

            let text =
              read(path)

            const oldValue =
              '  writeLog(title, `RecordStream Config: ${JSON.stringify(streamConfig, null, 2)}`)'

            const newValue =
          `  const safeLogConfig = {
            ...streamConfig,
            cookie:
              streamConfig.cookie
                ? '[REDACTED]'
                : ''
          }

          writeLog(
            title,
            \`RecordStream Config: \${JSON.stringify(
              safeLogConfig,
              null,
              2
            )}\`
          )`

            text =
              replaceOnce(
                text,
                oldValue,
                newValue,
                'Record cookie redaction'
              )

            write(
              path,
              text
            )
          }

          // ============================================
          // 5. 启动清理残留状态
          // ============================================

          {
            const path =
              'src/renderer/src/store/useStreamConfigStore.ts'

            let text =
              read(path)

            const anchor =
          `      if (
                typeof streamConfig.autoRecord !==
                'boolean'
              ) {
                shouldUpdate = true
                streamConfig.autoRecord = true
              }
          `

            const replacement =
              anchor +
          `
              if (
                streamConfig.status !== 0
              ) {
                shouldUpdate = true
                streamConfig.status = 0
              }

              if (
                streamConfig.cloudUploadStatus ===
                'uploading'
              ) {
                shouldUpdate = true
                streamConfig.cloudUploadStatus =
                  undefined
              }
          `

            text =
              replaceOnce(
                text,
                anchor,
                replacement,
                'Runtime state recovery'
              )

            write(
              path,
              text
            )
          }

          // ============================================
          // 6. 外部链接白名单
          // ============================================

          {
            const path =
              'src/main/index.ts'

            let text =
              read(path)

            text =
              replaceOnce(
                text,

                'async function checkUpdate() {',

          `function openSafeExternalUrl(
            value: string
          ) {
            try {
              const url =
                new URL(value)

              if (
                url.protocol !== 'https:' &&
                url.protocol !== 'http:'
              ) {
                return false
              }

              void shell.openExternal(
                url.toString()
              )

              return true
            } catch {
              return false
            }
          }

          async function checkUpdate() {`,

                'Safe external URL helper'
              )

            text =
              replaceOnce(
                text,

          `  mainWindow.webContents.setWindowOpenHandler((details) => {
              shell.openExternal(details.url)
              return { action: 'deny' }
            })`,

          `  mainWindow.webContents.setWindowOpenHandler((details) => {
              openSafeExternalUrl(
                details.url
              )

              return {
                action: 'deny'
              }
            })`,

                'Window URL guard'
              )

            text =
              replaceOnce(
                text,

          `  ipcMain.handle(NAV_BY_DEFAULT_BROWSER, (_, url: string) => {
              shell.openExternal(url)
            })`,

          `  ipcMain.handle(
              NAV_BY_DEFAULT_BROWSER,

              (_, url: string) => {
                return openSafeExternalUrl(
                  url
                )
              }
            )`,

                'IPC URL guard'
              )

            // ============================================
            // 7. WebDAV 串行上传队列
            // ============================================

            text =
              replaceOnce(
                text,

                "export const writeLog = writeLogWrapper(app.getPath('userData'))",

          `export const writeLog = writeLogWrapper(app.getPath('userData'))

          let webdavUploadQueue:
            Promise<void> =
            Promise.resolve()

          function enqueueWebdavUpload(
            request:
              Parameters<
                typeof uploadWebdav
              >[0]
          ) {
            const task =
              webdavUploadQueue
                .then(
                  () =>
                    uploadWebdav(
                      request
                    ),

                  () =>
                    uploadWebdav(
                      request
                    )
                )

            webdavUploadQueue =
              task.then(
                () => undefined,
                () => undefined
              )

            return task
          }`,

                'WebDAV queue'
              )

            text =
              replaceOnce(
                text,

          `  ipcMain.handle(
              UPLOAD_WEBDAV,
              async (_, request) => {
                return await uploadWebdav(
                  request
                )
              }
            )`,

          `  ipcMain.handle(
              UPLOAD_WEBDAV,

              async (_, request) => {
                return await enqueueWebdavUpload(
                  request
                )
              }
            )`,

                'WebDAV queue handler'
              )

            write(
              path,
              text
            )
          }

          // ============================================
          // 8. WebDAV 强制 HTTPS
          // ============================================

          {
            const path =
              'src/main/webdav.ts'

            let text =
              read(path)

            const marker =
              'const cleanBaseUrl = ('

            const position =
              text.indexOf(
                marker
              )

            if (
              position < 0
            ) {
              throw new Error(
                'Marker missing: cleanBaseUrl'
              )
            }

            const validator =
          `const validateWebdavUrl = (
            value: string
          ) => {
            const trimmed =
              String(
                value || ''
              ).trim()

            let parsed:
              URL

            try {
              parsed =
                new URL(
                  trimmed
                )
            } catch {
              throw new Error(
                'WebDAV 地址格式无效'
              )
            }

            if (
              parsed.protocol !==
              'https:'
            ) {
              throw new Error(
                'WebDAV 地址必须使用 HTTPS'
              )
            }

            return trimmed
          }

          `

            text =
              text.slice(
                0,
                position
              ) +
              validator +
              text.slice(
                position
              )

            const oldConfig =
          `  const config:
              IWebdavConfig = {
              url:
                request.url,

              username:
                request.username,

              password:
                request.password,

              remoteRoot:
                request.remoteRoot
            }
          `

            const newConfig =
          `  const config:
              IWebdavConfig = {
              url:
                validateWebdavUrl(
                  request.url
                ),

              username:
                request.username,

              password:
                request.password,

              remoteRoot:
                request.remoteRoot
            }
          `

            text =
              replaceOnce(
                text,
                oldConfig,
                newConfig,
                'WebDAV upload HTTPS'
              )

            const oldTest =
          `export async function testWebdav(
            config: IWebdavConfig
          ) {
            try {
          `

            const newTest =
          `export async function testWebdav(
            config: IWebdavConfig
          ) {
            try {
              config = {
                ...config,

                url:
                  validateWebdavUrl(
                    config.url
                  )
              }
          `

            text =
              replaceOnce(
                text,
                oldTest,
                newTest,
                'WebDAV test HTTPS'
              )

            write(
              path,
              text
            )
          }

          console.log(
            'ALL PATCHES APPLIED'
          )
          NODE

      - name: Verify patched source
        shell: bash
        run: |
          set -euo pipefail

          grep -q \
            '"version": "1.1.11-beta.1"' \
            package.json

          grep -q \
            "String(cookie).trim()" \
            src/main/crawler/plugins/douyin.js

          if grep -q \
            "getCookieWithTtwid(cookie)" \
            src/main/crawler/plugins/douyin.js
          then
            echo "ERROR: old ttwid-only cookie path still exists"
            exit 1
          fi

          if grep -q \
            "cookies.length >= 5" \
            src/main/douyin-session.ts
          then
            echo "ERROR: old login fallback still exists"
            exit 1
          fi

          grep -q \
            "\[REDACTED\]" \
            src/main/ffmpeg/record.ts

          grep -q \
            "streamConfig.status = 0" \
            src/renderer/src/store/useStreamConfigStore.ts

          grep -q \
            "cloudUploadStatus =" \
            src/renderer/src/store/useStreamConfigStore.ts

          grep -q \
            "openSafeExternalUrl" \
            src/main/index.ts

          grep -q \
            "enqueueWebdavUpload" \
            src/main/index.ts

          grep -q \
            "WebDAV 地址必须使用 HTTPS" \
            src/main/webdav.ts

          git diff --check

          echo "Source verification passed."

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Final diff check
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          git status --short
          git diff --stat

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail

          git add \
            package.json \
            src/main/index.ts \
            src/main/webdav.ts \
            src/main/douyin-session.ts \
            src/main/ffmpeg/record.ts \
            src/main/crawler/plugins/douyin.js \
            src/renderer/src/store/useStreamConfigStore.ts

          if git diff --cached --quiet
          then
            echo "No changes to commit."
          else
            git commit \
              -m "fix: harden V2.10 stability"
          fi

      - name: Push fix branch
        shell: bash
        run: |
          set -euo pipefail

          git push \
            --force \
            origin \
            "$FIX_BRANCH"

      - name: Promote verified source
        shell: bash
        run: |
          set -euo pipefail

          git push \
            origin \
            "HEAD:${SOURCE_BRANCH}"

      - name: Summary
        shell: bash
        run: |
          {
            echo "# V2.10 Stability Fix"
            echo ""
            echo "✅ Full Douyin login cookie"
            echo "✅ Login detection fix"
            echo "✅ Cookie log redaction"
            echo "✅ Runtime state recovery"
            echo "✅ WebDAV serial queue"
            echo "✅ WebDAV HTTPS validation"
            echo "✅ External URL whitelist"
            echo "✅ Version 1.1.11-beta.1"
            echo "✅ TypeScript check"
            echo "✅ Application build"
          } >> "$GITHUB_STEP_SUMMARY"
