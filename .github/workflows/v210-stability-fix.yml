name: V2.10 Stability Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v210-stability-fix
  cancel-in-progress: false

env:
  SOURCE_BRANCH: douyin-v2.8-anchor-monitor-test
  FIX_BRANCH: v210-stability-fix

jobs:
  fix:
    name: Fix and verify V2.10
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout V2.10 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create safety backup
        shell: bash
        run: |
          set -euo pipefail

          BACKUP_BRANCH="backup-v210-stability-${GITHUB_RUN_ID}"

          git branch "$BACKUP_BRANCH"
          git push origin "$BACKUP_BRANCH"

          echo "Backup created: $BACKUP_BRANCH"

      - name: Create fix branch
        shell: bash
        run: |
          set -euo pipefail

          git checkout -B "$FIX_BRANCH" "$SOURCE_BRANCH"

      - name: Apply stability fixes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          def read(path):
              return (
                  Path(path)
                  .read_text(encoding="utf-8")
                  .replace("\r\n", "\n")
                  .replace("\r", "\n")
              )

          def write(path, content):
              Path(path).write_text(
                  content,
                  encoding="utf-8",
                  newline="\n"
              )

          def regex_replace_once(
              content,
              pattern,
              replacement,
              name
          ):
              new_content, count = re.subn(
                  pattern,
                  replacement,
                  content,
                  count=1,
                  flags=re.MULTILINE
              )

              if count != 1:
                  raise RuntimeError(
                      f"Patch failed: {name}, matches={count}"
                  )

              return new_content

          # =============================================
          # 1. 测试版版本号
          # =============================================

          package_path = Path("package.json")

          package = json.loads(
              package_path.read_text(
                  encoding="utf-8"
              )
          )

          package["version"] = "1.1.11-beta.1"

          package_path.write_text(
              json.dumps(
                  package,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          # =============================================
          # 2. 抖音使用完整登录 Cookie
          # =============================================

          path = "src/main/crawler/plugins/douyin.js"
          text = read(path)

          pattern = (
              r"const\s+loginCookie\s*=\s*"
              r"getCookieWithTtwid\s*\(\s*cookie\s*\)"
          )

          replacement = """const loginCookie =
            cookie
              ? String(cookie).trim()
              : ''"""

          text = regex_replace_once(
              text,
              pattern,
              replacement,
              "Douyin full login cookie"
          )

          write(path, text)

          # =============================================
          # 3. 修正抖音登录状态误判
          # =============================================

          path = "src/main/douyin-session.ts"
          text = read(path)

          pattern = (
              r"const\s+hasSession\s*=\s*"
              r"cookies\.some\(\(cookie\)\s*=>\s*"
              r"authCookieNames\.has\(cookie\.name\)\s*\)"
              r"\s*\|\|\s*cookies\.length\s*>=\s*5"
          )

          replacement = """const hasSession =
            cookies.some((cookie) =>
              authCookieNames.has(cookie.name)
            )"""

          text = regex_replace_once(
              text,
              pattern,
              replacement,
              "Douyin login status"
          )

          write(path, text)

          # =============================================
          # 4. Cookie 日志脱敏
          # =============================================

          path = "src/main/ffmpeg/record.ts"
          text = read(path)

          pattern = (
              r"writeLog\(\s*"
              r"title\s*,\s*"
              r"`RecordStream Config: \$\{JSON\.stringify"
              r"\(streamConfig,\s*null,\s*2\)\}`\s*"
              r"\)"
          )

          replacement = """const safeLogConfig = {
            ...streamConfig,
            cookie:
              streamConfig.cookie
                ? '[REDACTED]'
                : ''
          }

          writeLog(
            title,
            `RecordStream Config: ${JSON.stringify(
              safeLogConfig,
              null,
              2
            )}`
          )"""

          text = regex_replace_once(
              text,
              pattern,
              replacement,
              "Record cookie redaction"
          )

          write(path, text)

          # =============================================
          # 5. 清理异常退出残留状态
          # =============================================

          path = "src/renderer/src/store/useStreamConfigStore.ts"
          text = read(path)

          marker = """      if (
                typeof streamConfig.autoRecord !==
                'boolean'
              ) {
                shouldUpdate = true
                streamConfig.autoRecord = true
              }
          """

          if marker not in text:
              raise RuntimeError(
                  "Patch marker missing: autoRecord migration"
              )

          replacement = marker + """
              /*
               * 这些状态只属于当前运行过程。
               * 软件重新启动后不能继续显示旧的运行状态。
               */
              if (
                streamConfig.status !== 0
              ) {
                shouldUpdate = true
                streamConfig.status = 0
              }

              if (
                streamConfig.cloudUploadStatus ===
                'uploading'
              ) {
                shouldUpdate = true
                streamConfig.cloudUploadStatus =
                  undefined
              }
          """

          text = text.replace(
              marker,
              replacement,
              1
          )

          write(path, text)

          # =============================================
          # 6. 外部链接协议白名单
          # =============================================

          path = "src/main/index.ts"
          text = read(path)

          marker = "async function checkUpdate() {"

          if marker not in text:
              raise RuntimeError(
                  "checkUpdate marker missing"
              )

          helper = """function openSafeExternalUrl(
            value: string
          ) {
            try {
              const url =
                new URL(value)

              if (
                url.protocol !== 'https:' &&
                url.protocol !== 'http:'
              ) {
                return false
              }

              void shell.openExternal(
                url.toString()
              )

              return true
            } catch {
              return false
            }
          }

          async function checkUpdate() {"""

          text = text.replace(
              marker,
              helper,
              1
          )

          pattern = (
              r"mainWindow\.webContents"
              r"\.setWindowOpenHandler\(\(details\)\s*=>\s*\{\s*"
              r"shell\.openExternal\(details\.url\)\s*"
              r"return\s*\{\s*action:\s*'deny'\s*\}\s*"
              r"\}\)"
          )

          replacement = """mainWindow.webContents.setWindowOpenHandler((details) => {
            openSafeExternalUrl(
              details.url
            )

            return {
              action: 'deny'
            }
          })"""

          text = regex_replace_once(
              text,
              pattern,
              replacement,
              "Window external URL"
          )

          pattern = (
              r"ipcMain\.handle\(\s*"
              r"NAV_BY_DEFAULT_BROWSER\s*,\s*"
              r"\(_,\s*url:\s*string\)\s*=>\s*\{\s*"
              r"shell\.openExternal\(url\)\s*"
              r"\}\s*\)"
          )

          replacement = """ipcMain.handle(
            NAV_BY_DEFAULT_BROWSER,
            (_, url: string) => {
              return openSafeExternalUrl(
                url
              )
            }
          )"""

          text = regex_replace_once(
              text,
              pattern,
              replacement,
              "IPC external URL"
          )

          # =============================================
          # 7. WebDAV 串行上传队列
          # =============================================

          marker = (
              "export const writeLog = "
              "writeLogWrapper(app.getPath('userData'))"
          )

          if marker not in text:
              raise RuntimeError(
                  "writeLog marker missing"
              )

          queue_code = """export const writeLog = writeLogWrapper(app.getPath('userData'))

          let webdavUploadQueue:
            Promise<void> =
            Promise.resolve()

          async function enqueueWebdavUpload(
            request:
              Parameters<
                typeof uploadWebdav
              >[0]
          ) {
            let resolveResult!:
              (
                value:
                  Awaited<
                    ReturnType<
                      typeof uploadWebdav
                    >
                  >
              ) => void

            let rejectResult!:
              (
                reason?: unknown
              ) => void

            const resultPromise =
              new Promise<
                Awaited<
                  ReturnType<
                    typeof uploadWebdav
                  >
                >
              >(
                (
                  resolve,
                  reject
                ) => {
                  resolveResult =
                    resolve

                  rejectResult =
                    reject
                }
              )

            webdavUploadQueue =
              webdavUploadQueue
                .catch(() => {
                  // 一个任务失败不能阻塞后面的任务
                })
                .then(
                  async () => {
                    try {
                      const result =
                        await uploadWebdav(
                          request
                        )

                      resolveResult(
                        result
                      )
                    } catch (
                      error
                    ) {
                      rejectResult(
                        error
                      )
                    }
                  }
                )

            return await resultPromise
          }"""

          text = text.replace(
              marker,
              queue_code,
              1
          )

          pattern = (
              r"ipcMain\.handle\(\s*"
              r"UPLOAD_WEBDAV\s*,\s*"
              r"async\s*\(_,\s*request\)\s*=>\s*\{\s*"
              r"return\s+await\s+uploadWebdav\(\s*request\s*\)\s*"
              r"\}\s*\)"
          )

          replacement = """ipcMain.handle(
            UPLOAD_WEBDAV,
            async (_, request) => {
              return await enqueueWebdavUpload(
                request
              )
            }
          )"""

          text = regex_replace_once(
              text,
              pattern,
              replacement,
              "WebDAV IPC queue"
          )

          write(path, text)

          # =============================================
          # 8. WebDAV 强制 HTTPS
          # =============================================

          path = "src/main/webdav.ts"
          text = read(path)

          marker = """const cleanBaseUrl = (
            value: string
          ) =>
          """

          if marker not in text:
              raise RuntimeError(
                  "cleanBaseUrl marker missing"
              )

          replacement = """const validateWebdavUrl = (
            value: string
          ) => {
            const trimmed =
              String(
                value || ''
              ).trim()

            let parsed:
              URL

            try {
              parsed =
                new URL(
                  trimmed
                )
            } catch {
              throw new Error(
                'WebDAV 地址格式无效'
              )
            }

            if (
              parsed.protocol !==
              'https:'
            ) {
              throw new Error(
                'WebDAV 地址必须使用 HTTPS'
              )
            }

            return trimmed
          }

          const cleanBaseUrl = (
            value: string
          ) =>
          """

          text = text.replace(
              marker,
              replacement,
              1
          )

          pattern = (
              r"url:\s*"
              r"request\.url,"
          )

          replacement = """url:
              validateWebdavUrl(
                request.url
              ),"""

          text = regex_replace_once(
              text,
              pattern,
              replacement,
              "Upload HTTPS validation"
          )

          pattern = (
              r"export\s+async\s+function\s+testWebdav\(\s*"
              r"config:\s*IWebdavConfig\s*"
              r"\)\s*\{\s*"
              r"try\s*\{"
          )

          replacement = """export async function testWebdav(
            config: IWebdavConfig
          ) {
            try {
              config = {
                ...config,
                url:
                  validateWebdavUrl(
                    config.url
                  )
              }"""

          text = regex_replace_once(
              text,
              pattern,
              replacement,
              "Test WebDAV HTTPS"
          )

          write(path, text)

          print(
              "V2.10 stability fixes applied."
          )
          PY

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail

          grep -q '"version": "1.1.11-beta.1"' \
            package.json

          grep -q "String(cookie).trim()" \
            src/main/crawler/plugins/douyin.js

          if grep -q "cookies.length >= 5" \
            src/main/douyin-session.ts
          then
            echo "Old Douyin login fallback still exists."
            exit 1
          fi

          grep -q "\[REDACTED\]" \
            src/main/ffmpeg/record.ts

          grep -q "cloudUploadStatus =" \
            src/renderer/src/store/useStreamConfigStore.ts

          grep -q "openSafeExternalUrl" \
            src/main/index.ts

          grep -q "enqueueWebdavUpload" \
            src/main/index.ts

          grep -q "WebDAV 地址必须使用 HTTPS" \
            src/main/webdav.ts

          git diff --check

          echo "Static verification passed."

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail

          git diff --check

          echo "===== Changed files ====="
          git status --short

          echo ""
          echo "===== Diff summary ====="
          git diff --stat

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail

          git add \
            package.json \
            src/main/index.ts \
            src/main/webdav.ts \
            src/main/douyin-session.ts \
            src/main/ffmpeg/record.ts \
            src/main/crawler/plugins/douyin.js \
            src/renderer/src/store/useStreamConfigStore.ts

          if git diff --cached --quiet
          then
            echo "No changes to commit."
          else
            git commit \
              -m "fix: improve V2.10 stability"
          fi

      - name: Push verified fix branch
        shell: bash
        run: |
          set -euo pipefail

          git push \
            --force \
            origin \
            "$FIX_BRANCH"

      - name: Promote after all checks pass
        shell: bash
        run: |
          set -euo pipefail

          git push \
            origin \
            "HEAD:${SOURCE_BRANCH}"

      - name: Summary
        shell: bash
        run: |
          {
            echo "# V2.10 Stability Fix"
            echo ""
            echo "✅ Full Douyin login cookie"
            echo "✅ Login-state detection"
            echo "✅ Cookie log redaction"
            echo "✅ Runtime-state recovery"
            echo "✅ WebDAV serial queue"
            echo "✅ WebDAV HTTPS validation"
            echo "✅ External URL whitelist"
            echo "✅ Version 1.1.11-beta.1"
            echo "✅ TypeScript check"
            echo "✅ Application build"
          } >> "$GITHUB_STEP_SUMMARY"
