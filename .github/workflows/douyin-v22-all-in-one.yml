name: Douyin V2.2 All In One Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: "测试版本号，例如 1.1.1"
        required: true
        default: "1.1.1"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Fix Douyin Update Version and Build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout current parser test branch
        uses: actions/checkout@v4
        with:
          ref: douyin-parser-v2-test
          fetch-depth: 0

      - name: Create V2.2 test branch
        shell: bash
        run: |
          git switch -C douyin-v2.2-test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply V2.2 fixes
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              Path(path).write_text(content, encoding="utf-8")

          # ============================================================
          # 1. Patch Douyin parser
          # ============================================================

          path = Path(
              "src/main/crawler/plugins/douyin.js"
          )

          text = path.read_text(
              encoding="utf-8"
          )

          # ------------------------------------------
          # getDesktopData 支持 signed 参数
          # ------------------------------------------

          old = """async function getDesktopData(
            roomUrl,
            others = {}
          ) {"""

          new = """async function getDesktopData(
            roomUrl,
            others = {},
            signed = false
          ) {"""

          if old not in text:
              raise RuntimeError(
                  "getDesktopData signature not found"
              )

          text = text.replace(
              old,
              new,
              1
          )

          # ------------------------------------------
          # A-Bogus 改成按需添加
          # ------------------------------------------

          old = """  const query =
              params.toString()

            const aBogus =
              generateABogus(
                query,
                PC_USER_AGENT
              )

            params.set(
              'a_bogus',
              aBogus
            )

            const apiUrl ="""

          new = """  if (signed) {
              const query =
                params.toString()

              const aBogus =
                generateABogus(
                  query,
                  PC_USER_AGENT
                )

              params.set(
                'a_bogus',
                aBogus
              )
            }

            const apiUrl ="""

          if old not in text:
              raise RuntimeError(
                  "A-Bogus block not found"
              )

          text = text.replace(
              old,
              new,
              1
          )

          # ============================================================
          # 2. Add URL resolver + web fallback
          # ============================================================

          marker = """async function baseGetDesktopDouYinLiveUrlsPlugin(
            roomUrl,
            others = {}
          ) {"""

          if marker not in text:
              raise RuntimeError(
                  "desktop parser marker not found"
              )

          helper = r"""
          async function resolveDouyinLiveUrl(
            roomUrl,
            others = {}
          ) {
            const {
              proxy
            } = others

            let parsed

            try {
              parsed =
                new URL(roomUrl)
            } catch {
              throw new Error(
                'DOUYIN_INVALID_URL'
              )
            }

            if (
              parsed.hostname ===
              'live.douyin.com'
            ) {
              return roomUrl
            }

            if (
              parsed.hostname !==
                'v.douyin.com' &&
              parsed.hostname !==
                'www.douyin.com' &&
              parsed.hostname !==
                'douyin.com'
            ) {
              throw new Error(
                'DOUYIN_UNSUPPORTED_URL'
              )
            }

            const response =
              await request(
                roomUrl,
                {
                  headers: {
                    'User-Agent':
                      PC_USER_AGENT
                  },
                  proxy
                }
              )

            const finalUrl =
              response
                ?.request
                ?.res
                ?.responseUrl ||
              roomUrl

            try {
              const finalParsed =
                new URL(finalUrl)

              if (
                finalParsed.hostname ===
                'live.douyin.com'
              ) {
                const id =
                  finalParsed.pathname
                    .split('/')
                    .filter(Boolean)
                    .pop()

                if (
                  id &&
                  /^\d+$/.test(id)
                ) {
                  return (
                    'https://live.douyin.com/' +
                    id
                  )
                }
              }
            } catch {
              // Continue with HTML parsing.
            }

            const html =
              typeof response.data ===
                'string'
                ? response.data
                : JSON.stringify(
                    response.data || {}
                  )

            const patterns = [
              /webRid[^0-9]{0,60}(\d{5,})/,
              /web_rid[^0-9]{0,60}(\d{5,})/
            ]

            for (
              const pattern of patterns
            ) {
              const match =
                html.match(pattern)

              if (match?.[1]) {
                return (
                  'https://live.douyin.com/' +
                  match[1]
                )
              }
            }

            throw new Error(
              'DOUYIN_RESOLVE_ROOM_FAILED'
            )
          }

          async function getDesktopRoomWithFallback(
            roomUrl,
            others = {}
          ) {
            let unsignedError = null

            try {
              const unsignedData =
                await getDesktopData(
                  roomUrl,
                  others,
                  false
                )

              const unsignedRoom =
                getDesktopRoom(
                  unsignedData
                )

              if (
                unsignedRoom.status !== 2
              ) {
                return unsignedRoom
              }

              const unsignedUrls =
                collectDesktopStreams(
                  unsignedRoom
                )

              if (
                unsignedUrls.length > 0
              ) {
                log(
                  'Douyin unsigned parser success'
                )

                return unsignedRoom
              }

              unsignedError =
                new Error(
                  'DOUYIN_UNSIGNED_STREAM_EMPTY'
                )
            } catch (error) {
              unsignedError =
                error

              log(
                'Douyin unsigned parser failed:',
                error?.message
              )
            }

            try {
              const signedData =
                await getDesktopData(
                  roomUrl,
                  others,
                  true
                )

              const signedRoom =
                getDesktopRoom(
                  signedData
                )

              if (
                signedRoom.status !== 2
              ) {
                return signedRoom
              }

              const signedUrls =
                collectDesktopStreams(
                  signedRoom
                )

              if (
                signedUrls.length === 0
              ) {
                throw new Error(
                  'DOUYIN_SIGNED_STREAM_EMPTY'
                )
              }

              log(
                'Douyin A-Bogus parser success'
              )

              return signedRoom
            } catch (signedError) {
              log(
                'Douyin A-Bogus parser failed:',
                signedError?.message
              )

              throw new Error(
                'DOUYIN_WEB_PARSE_FAILED: ' +
                'unsigned=' +
                String(
                  unsignedError?.message ||
                  unsignedError ||
                  'unknown'
                ) +
                '; signed=' +
                String(
                  signedError?.message ||
                  signedError ||
                  'unknown'
                )
              )
            }
          }

          """

          text = text.replace(
              marker,
              helper + marker,
              1
          )

          # ============================================================
          # 3. Desktop parser uses fallback
          # ============================================================

          old = """  const data =
              await getDesktopData(
                roomUrl,
                others
              )

            const room =
              getDesktopRoom(data)

            if (
              room.status !== 2
            ) {"""

          new = """  const room =
              await getDesktopRoomWithFallback(
                roomUrl,
                others
              )

            if (
              room.status !== 2
            ) {"""

          if old not in text:
              raise RuntimeError(
                  "desktop room block not found"
              )

          text = text.replace(
              old,
              new,
              1
          )

          # ============================================================
          # 4. Replace top-level live URL routing
          # ============================================================

          start = text.find(
              "async function baseGetDouYinLiveUrlsPlugin("
          )

          end = text.find(
              "async function baseGetDouYinRoomInfoPlugin(",
              start
          )

          if start == -1 or end == -1:
              raise RuntimeError(
                  "Douyin live router not found"
              )

          new_router = r"""async function baseGetDouYinLiveUrlsPlugin(
            roomUrl,
            others = {}
          ) {
            const normalizedUrl =
              await resolveDouyinLiveUrl(
                roomUrl,
                others
              )

            return await baseGetDesktopDouYinLiveUrlsPlugin(
              normalizedUrl,
              others
            )
          }

          """

          text = (
              text[:start] +
              new_router +
              text[end:]
          )

          # ============================================================
          # 5. Replace room info routing
          # ============================================================

          start = text.find(
              "async function baseGetDouYinRoomInfoPlugin("
          )

          end = text.find(
              "export const getDouYinLiveUrlsPlugin",
              start
          )

          if start == -1 or end == -1:
              raise RuntimeError(
                  "Douyin room info router not found"
              )

          new_room_info = r"""async function baseGetDouYinRoomInfoPlugin(
            roomUrl,
            others = {}
          ) {
            const normalizedUrl =
              await resolveDouyinLiveUrl(
                roomUrl,
                others
              )

            const room =
              await getDesktopRoomWithFallback(
                normalizedUrl,
                others
              )

            return {
              code: SUCCESS_CODE,
              roomInfo: {
                name:
                  room
                    ?.owner
                    ?.nickname || ''
              }
            }
          }

          """

          text = (
              text[:start] +
              new_room_info +
              text[end:]
          )

          write(
              path,
              text
          )

          print(
              "[OK] Douyin V2.2 parser patched"
          )

          # ============================================================
          # 6. Stop leaking full stream URLs through debug log
          # ============================================================

          crawler_path =
              "src/main/crawler/index.js"

          crawler =
              read(crawler_path)

          crawler = crawler.replace(
              "  log('res:', res)\n",
              "  log('crawler request completed, code:', res?.code)\n"
          )

          write(
              crawler_path,
              crawler
          )

          print(
              "[OK] crawler debug output sanitized"
          )

          # ============================================================
          # 7. Update repository/update addresses
          # ============================================================

          main_path =
              "src/main/index.ts"

          main =
              read(main_path)

          main = re.sub(
              r"https://api\.github\.com/repos/[^'\" ]+/releases/latest",
              "https://api.github.com/repos/STARSHINE56/fideo-live-record/releases/latest",
              main
          )

          write(
              main_path,
              main
          )

          app_path =
              "src/renderer/src/App.tsx"

          app =
              read(app_path)

          app = re.sub(
              r"https://github\.com/[^'\" ]+/releases/latest",
              "https://github.com/STARSHINE56/fideo-live-record/releases/latest",
              app
          )

          write(
              app_path,
              app
          )

          print(
              "[OK] update URLs fixed"
          )

          # ============================================================
          # 8. package.json repository/homepage/version
          # ============================================================

          version =
              os.environ["APP_VERSION"].strip()

          semver_pattern =
              r"^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$"

          if not re.match(
              semver_pattern,
              version
          ):
              raise RuntimeError(
                  f"Invalid version: {version}"
              )

          package_path =
              Path("package.json")

          package =
              json.loads(
                  package_path.read_text(
                      encoding="utf-8"
                  )
              )

          package["version"] =
              version

          package["homepage"] = (
              "https://github.com/"
              "STARSHINE56/"
              "fideo-live-record"
          )

          package["repository"] = {
              "type": "git",
              "url": (
                  "https://github.com/"
                  "STARSHINE56/"
                  "fideo-live-record.git"
              )
          }

          package_path.write_text(
              json.dumps(
                  package,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          lock_path =
              Path("package-lock.json")

          if lock_path.exists():
              lock =
                  json.loads(
                      lock_path.read_text(
                          encoding="utf-8"
                      )
                  )

              lock["version"] =
                  version

              if (
                  "packages" in lock and
                  "" in lock["packages"]
              ):
                  lock["packages"][""]["version"] =
                      version

              lock_path.write_text(
                  json.dumps(
                      lock,
                      ensure_ascii=False,
                      indent=2
                  ) + "\n",
                  encoding="utf-8"
              )

          print(
              f"[OK] version set to {version}"
          )

          # ============================================================
          # 9. Fix electron-builder publish address
          # ============================================================

          builder_path =
              "electron-builder.yml"

          builder =
              read(builder_path)

          builder = re.sub(
              r"""publish:
            provider: generic
            url: https://example\.com/auto-updates
          """,
              """publish:
            provider: github
            owner: STARSHINE56
            repo: fideo-live-record
          """,
              builder
          )

          write(
              builder_path,
              builder
          )

          print(
              "[OK] electron-builder publish target fixed"
          )

          # ============================================================
          # 10. Verification
          # ============================================================

          checks = {
              "src/main/crawler/plugins/douyin.js": [
                  "getDesktopRoomWithFallback",
                  "resolveDouyinLiveUrl",
                  "Douyin unsigned parser success",
                  "Douyin A-Bogus parser success"
              ],

              "src/main/index.ts": [
                  "STARSHINE56/fideo-live-record/releases/latest"
              ],

              "src/renderer/src/App.tsx": [
                  "STARSHINE56/fideo-live-record/releases/latest"
              ],

              "package.json": [
                  '"version": "' + version + '"',
                  "STARSHINE56/fideo-live-record"
              ],

              "electron-builder.yml": [
                  "provider: github",
                  "owner: STARSHINE56",
                  "repo: fideo-live-record"
              ]
          }

          for file, required in checks.items():
              data =
                  read(file)

              for item in required:
                  if item not in data:
                      raise RuntimeError(
                          f"{file}: missing {item}"
                      )

          print("")
          print(
              "All V2.2 source checks passed."
          )
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build Electron application
        run: npm run build

      - name: Package Windows x64
        run: npx electron-builder --win nsis --x64

      - name: Verify installer and version
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $package =
            Get-Content package.json |
            ConvertFrom-Json

          if (
            $package.version -ne
            $env:EXPECTED_VERSION
          ) {
            throw `
              "Version mismatch. Expected $env:EXPECTED_VERSION, got $($package.version)"
          }

          $files =
            Get-ChildItem `
              -Path "dist" `
              -Filter "*-x64.exe"

          if (
            $files.Count -eq 0
          ) {
            throw `
              "Windows x64 installer not generated."
          }

          Write-Host `
            "Version: $($package.version)"

          Write-Host `
            "Generated installers:"

          $files |
            Select-Object `
              Name,
              Length,
              FullName

      - name: Commit V2.2 test source
        shell: bash
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src/main/crawler/plugins/douyin.js \
            src/main/crawler/index.js \
            src/main/index.ts \
            src/renderer/src/App.tsx \
            package.json \
            package-lock.json \
            electron-builder.yml

          if git diff --cached --quiet; then
            echo \
              "No source changes to commit."
          else
            git commit \
              -m "Upgrade Douyin parser and fix update/version settings"
          fi

          git push \
            --force \
            origin \
            douyin-v2.2-test

      - name: Upload Windows x64 V2.2 installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-${{ inputs.version }}-douyin-v2.2-windows-x64
          path: dist/*-x64.exe
          if-no-files-found: error
          retention-days: 7
