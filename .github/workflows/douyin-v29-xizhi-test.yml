name: Douyin V2.9 Xizhi Test Push

on:
  workflow_dispatch:
    inputs:
      version:
        description: "测试版本号"
        required: true
        default: "1.1.10-beta.1"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build V2.9 Xizhi Test Push
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout tested V2.8
        uses: actions/checkout@v4
        with:
          ref: douyin-v2.8-anchor-monitor-test
          fetch-depth: 0

      - name: Create V2.9 test branch
        run: |
          git switch -C douyin-v2.9-xizhi-test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      # ============================================================
      # 1. 增加可强制执行的息知测试推送函数
      # ============================================================

      - name: Add Xizhi test push function
        run: |
          node <<'NODE'
          const fs = require('fs')

          const path =
            'src/renderer/src/lib/utils.ts'

          let text =
            fs.readFileSync(
              path,
              'utf8'
            )

          if (
            !text.includes(
              'export async function testXizhiPushNotification'
            )
          ) {
            text += `


          export async function testXizhiPushNotification(options: {
            key: string
            title: string
            content?: string
          }): Promise<boolean> {
            const key =
              options.key.trim()

            if (!key) {
              return false
            }

            const titleAndContent =
              options.content
                ? \`\${options.title} - \${options.content}\`
                : options.title

            const separator =
              key.includes('?')
                ? '&'
                : '?'

            const response =
              await fetch(
                \`\${key}\${separator}title=\${encodeURIComponent(
                  titleAndContent
                )}\`
              )

            return response.ok
          }
          `

            fs.writeFileSync(
              path,
              text,
              'utf8'
            )
          }

          console.log(
            'Xizhi test push function added.'
          )
          NODE

      # ============================================================
      # 2. 设置页面增加测试按钮
      # ============================================================

      - name: Add Xizhi test button
        run: |
          node <<'NODE'
          const fs = require('fs')

          const path =
            'src/renderer/src/components/NavBar/components/DefaultSettingSheet.tsx'

          let text =
            fs.readFileSync(
              path,
              'utf8'
            )

          if (
            !text.includes(
              'testXizhiPushNotification'
            )
          ) {
            const importMarker =
              "import { useEffect, useState } from 'react'"

            if (
              !text.includes(
                importMarker
              )
            ) {
              throw new Error(
                'React import marker not found'
              )
            }

            text =
              text.replace(
                importMarker,
                `${importMarker}
import { useToast } from '@renderer/hooks/useToast'
import { testXizhiPushNotification } from '@renderer/lib/utils'`
              )
          }

          const stateMarker =
          `  const [
            douyinLoggedIn,
            setDouyinLoggedIn
          ] = useState(false)`

          if (
            !text.includes(
              'xizhiTesting'
            )
          ) {
            if (
              !text.includes(
                stateMarker
              )
            ) {
              throw new Error(
                'State insertion marker not found'
              )
            }

            text =
              text.replace(
                stateMarker,
                `${stateMarker}

  const [
    xizhiTesting,
    setXizhiTesting
  ] = useState(false)

  const {
    toast
  } = useToast()`
              )
          }

          const handlerMarker =
          `  const handleSelectDir = async () => {`

          if (
            !text.includes(
              'handleTestXizhi'
            )
          ) {
            if (
              !text.includes(
                handlerMarker
              )
            ) {
              throw new Error(
                'Handler insertion marker not found'
              )
            }

            const handler =
          `  const handleTestXizhi =
    async () => {
      const key =
        form
          .getValues(
            'xizhiKey'
          )
          ?.trim()

      if (!key) {
        toast({
          title:
            t(
              'default_settings.xizhi_test_failed'
            ),

          description:
            t(
              'default_settings.xizhi_key_required'
            ),

          variant:
            'destructive'
        })

        return
      }

      setXizhiTesting(
        true
      )

      try {
        const success =
          await testXizhiPushNotification({
            key,

            title:
              t(
                'default_settings.xizhi_test_title'
              ),

            content:
              t(
                'default_settings.xizhi_test_content'
              )
          })

        if (!success) {
          throw new Error(
            'XIZHI_TEST_FAILED'
          )
        }

        toast({
          title:
            t(
              'default_settings.xizhi_test_success'
            ),

          description:
            t(
              'default_settings.xizhi_test_success_desc'
            )
        })
      } catch {
        toast({
          title:
            t(
              'default_settings.xizhi_test_failed'
            ),

          description:
            t(
              'default_settings.xizhi_test_failed_desc'
            ),

          variant:
            'destructive'
        })
      } finally {
        setXizhiTesting(
          false
        )
      }
    }


`

            text =
              text.replace(
                handlerMarker,
                handler +
                  handlerMarker
              )
          }

          const oldField =
          `                <FormField
                  control={form.control}
                  name="xizhiKey"
                  render={({ field }) => (
                    <FormItem>
                      <FormLabel>{t('default_settings.xizhi_key')}</FormLabel>
                      <FormControl>
                        <Input
                          placeholder={t('default_settings.xizhi_key_placeholder')}
                          {...field}
                        />
                      </FormControl>
                      <FormMessage />
                    </FormItem>
                  )}
                />`

          const newField =
          `                <FormField
                  control={form.control}
                  name="xizhiKey"
                  render={({ field }) => (
                    <FormItem>
                      <FormLabel>
                        {t(
                          'default_settings.xizhi_key'
                        )}
                      </FormLabel>

                      <FormControl>
                        <div className="flex gap-2">
                          <Input
                            placeholder={t(
                              'default_settings.xizhi_key_placeholder'
                            )}
                            {...field}
                          />

                          <Button
                            variant="outline"
                            type="button"
                            disabled={
                              xizhiTesting
                            }
                            onClick={
                              handleTestXizhi
                            }
                          >
                            {xizhiTesting
                              ? t(
                                  'default_settings.xizhi_testing'
                                )
                              : t(
                                  'default_settings.xizhi_test'
                                )}
                          </Button>
                        </div>
                      </FormControl>

                      <FormMessage />
                    </FormItem>
                  )}
                />`

          if (
            !text.includes(
              'default_settings.xizhi_test'
            ) ||
            text.includes(
              oldField
            )
          ) {
            if (
              !text.includes(
                oldField
              )
            ) {
              if (
                !text.includes(
                  'handleTestXizhi'
                )
              ) {
                throw new Error(
                  'Xizhi field not found'
                )
              }
            } else {
              text =
                text.replace(
                  oldField,
                  newField
                )
            }
          }

          fs.writeFileSync(
            path,
            text,
            'utf8'
          )

          console.log(
            'Xizhi test button added.'
          )
          NODE

      # ============================================================
      # 3. 增加中英文文案
      # ============================================================

      - name: Add Xizhi translations
        run: |
          node <<'NODE'
          const fs = require('fs')

          const path =
            'src/renderer/src/locales/locales.js'

          let text =
            fs.readFileSync(
              path,
              'utf8'
            )

          if (
            !text.includes(
              "xizhi_test: 'Test Push'"
            )
          ) {
            text =
              text.replace(
                "xizhi_key_placeholder: 'Please enter the Xizhi API Key',",
                `xizhi_key_placeholder: 'Please enter the Xizhi API Key',
        xizhi_test: 'Test Push',
        xizhi_testing: 'Sending...',
        xizhi_test_title: 'Fideo Test Push',
        xizhi_test_content: 'Xizhi push configuration is working',
        xizhi_test_success: 'Push successful',
        xizhi_test_success_desc: 'The Xizhi test message has been sent',
        xizhi_test_failed: 'Push failed',
        xizhi_test_failed_desc: 'Please check the Xizhi push URL and network',
        xizhi_key_required: 'Please enter the Xizhi push URL first',`
              )
          }

          if (
            !text.includes(
              "xizhi_test: '测试推送'"
            )
          ) {
            text =
              text.replace(
                "xizhi_key_placeholder: '请输入息知API Key',",
                `xizhi_key_placeholder: '请输入息知完整推送地址',
        xizhi_test: '测试推送',
        xizhi_testing: '发送中...',
        xizhi_test_title: 'Fideo 测试推送',
        xizhi_test_content: '息知推送配置成功',
        xizhi_test_success: '推送成功',
        xizhi_test_success_desc: '息知测试消息已发送',
        xizhi_test_failed: '推送失败',
        xizhi_test_failed_desc: '请检查息知推送地址和网络连接',
        xizhi_key_required: '请先填写息知推送地址',`
              )
          }

          text =
            text.replace(
              "xizhi_key: '息知API Key(用于微信推送)',",
              "xizhi_key: '息知推送地址(用于微信推送)',"
            )

          text =
            text.replace(
              "xizhi_key: 'Xizhi API Key (For WeChat Push)',",
              "xizhi_key: 'Xizhi Push URL (For WeChat Push)',"
            )

          fs.writeFileSync(
            path,
            text,
            'utf8'
          )

          console.log(
            'Xizhi translations added.'
          )
          NODE

      # ============================================================
      # 4. 更新测试版版本号
      # ============================================================

      - name: Update version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm version \
            "$VERSION" \
            --no-git-tag-version

      # ============================================================
      # 5. 静态检查
      # ============================================================

      - name: Verify Xizhi test feature
        run: |
          grep -q \
            "testXizhiPushNotification" \
            src/renderer/src/lib/utils.ts

          grep -q \
            "handleTestXizhi" \
            src/renderer/src/components/NavBar/components/DefaultSettingSheet.tsx

          grep -q \
            "xizhiTesting" \
            src/renderer/src/components/NavBar/components/DefaultSettingSheet.tsx

          grep -q \
            "测试推送" \
            src/renderer/src/locales/locales.js

          grep -q \
            "息知推送地址" \
            src/renderer/src/locales/locales.js

          echo \
            "Xizhi test feature verified."

      # ============================================================
      # 6. 确认 V2.8 核心没有被破坏
      # ============================================================

      - name: Verify V2.8 core
        run: |
          grep -q \
            "getDouyinAnchorProfile" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "resolveDouyinAnchorLiveRoom" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "handleMonitorOnly" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          grep -q \
            "autoRecord: boolean" \
            type.d.ts

          grep -q \
            "videoCodec('copy')" \
            src/main/ffmpeg/record.ts

          grep -q \
            "audioCodec('copy')" \
            src/main/ffmpeg/record.ts

          echo \
            "V2.8 core retained."

      # ============================================================
      # 7. TypeScript
      # ============================================================

      - name: TypeScript check
        run: |
          npm run typecheck

      # ============================================================
      # 8. Build
      # ============================================================

      - name: Build Electron
        run: |
          npm run build

      # ============================================================
      # 9. Windows x64
      # ============================================================

      - name: Package Windows x64
        run: |
          npx electron-builder \
            --win \
            nsis \
            --x64 \
            --publish never

      - name: Verify Windows installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $expected = "dist/fideo-$env:VERSION-x64.exe"

          if (-not (Test-Path $expected)) {
            throw "Installer not found: $expected"
          }

          $file = Get-Item $expected

          Write-Host "Installer:"
          Write-Host $file.Name
          Write-Host $file.Length

      # ============================================================
      # 10. 提交测试分支
      # ============================================================

      - name: Commit V2.9 test
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet
          then
            echo \
              "No changes."
          else
            git commit \
              -m "Add Xizhi test push"
          fi

          git push \
            --force \
            origin \
            douyin-v2.9-xizhi-test

      # ============================================================
      # 11. 上传测试安装包
      # ============================================================

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-${{ inputs.version }}-xizhi-test-windows-x64
          path: dist/fideo-${{ inputs.version }}-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "# Fideo V2.9 息知测试推送"
            echo
            echo "版本：\`$VERSION\`"
            echo
            echo "分支：\`douyin-v2.9-xizhi-test\`"
            echo
            echo
            echo "- 增加测试息知推送按钮"
            echo "- 测试推送不要求软件处于后台"
            echo "- 原有开播通知逻辑保持不变"
            echo "- 息知输入框文案改为完整推送地址"
          } >> "$GITHUB_STEP_SUMMARY"
