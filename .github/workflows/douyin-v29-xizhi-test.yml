name: Douyin V2.9 Xizhi Test Push

on:
  workflow_dispatch:
    inputs:
      version:
        description: "测试版本号"
        required: true
        default: "1.1.10-beta.1"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build V2.9 Xizhi Test Push
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout tested V2.8
        uses: actions/checkout@v4
        with:
          ref: douyin-v2.8-anchor-monitor-test
          fetch-depth: 0

      - name: Create V2.9 test branch
        run: |
          git switch -C douyin-v2.9-xizhi-test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      - name: Add Xizhi test push function
        run: |
          cat > "$RUNNER_TEMP/patch-utils.cjs" <<'NODE'
          const fs = require('fs')

          const path =
            'src/renderer/src/lib/utils.ts'

          let text =
            fs.readFileSync(
              path,
              'utf8'
            )

          if (
            !text.includes(
              'testXizhiPushNotification'
            )
          ) {
            text += [
              '',
              '',
              'export async function testXizhiPushNotification(options: {',
              '  key: string',
              '  title: string',
              '  content?: string',
              '}): Promise<boolean> {',
              '  const key = options.key.trim()',
              '',
              '  if (!key) {',
              '    return false',
              '  }',
              '',
              '  const titleAndContent =',
              "    options.content",
              "      ? options.title + ' - ' + options.content",
              '      : options.title',
              '',
              '  const separator =',
              "    key.includes('?')",
              "      ? '&'",
              "      : '?'",
              '',
              '  const response = await fetch(',
              '    key +',
              '      separator +',
              "      'title=' +",
              '      encodeURIComponent(titleAndContent)',
              '  )',
              '',
              '  return response.ok',
              '}',
              ''
            ].join('\n')

            fs.writeFileSync(
              path,
              text,
              'utf8'
            )
          }

          console.log(
            'Xizhi test function added.'
          )
          NODE

          node "$RUNNER_TEMP/patch-utils.cjs"

      - name: Add Xizhi test button
        run: |
          cat > "$RUNNER_TEMP/patch-settings.cjs" <<'NODE'
          const fs = require('fs')

          const path =
            'src/renderer/src/components/NavBar/components/DefaultSettingSheet.tsx'

          let text =
            fs.readFileSync(
              path,
              'utf8'
            )

          if (
            !text.includes(
              "import { useToast } from '@renderer/hooks/useToast'"
            )
          ) {
            text =
              text.replace(
                "import { useEffect, useState } from 'react'",
                [
                  "import { useEffect, useState } from 'react'",
                  "import { useToast } from '@renderer/hooks/useToast'",
                  "import { testXizhiPushNotification } from '@renderer/lib/utils'"
                ].join('\n')
              )
          }

          if (
            !text.includes(
              'xizhiTesting'
            )
          ) {
            const marker = [
              '  const [',
              '    douyinLoggedIn,',
              '    setDouyinLoggedIn',
              '  ] = useState(false)'
            ].join('\n')

            const replacement = [
              marker,
              '',
              '  const [',
              '    xizhiTesting,',
              '    setXizhiTesting',
              '  ] = useState(false)',
              '',
              '  const {',
              '    toast',
              '  } = useToast()'
            ].join('\n')

            if (
              !text.includes(marker)
            ) {
              throw new Error(
                'State marker not found'
              )
            }

            text =
              text.replace(
                marker,
                replacement
              )
          }

          if (
            !text.includes(
              'handleTestXizhi'
            )
          ) {
            const marker =
              '  const handleSelectDir = async () => {'

            const handler = [
              '  const handleTestXizhi =',
              '    async () => {',
              '      const key =',
              '        form',
              '          .getValues(',
              "            'xizhiKey'",
              '          )',
              '          ?.trim()',
              '',
              '      if (!key) {',
              '        toast({',
              '          title:',
              '            t(',
              "              'default_settings.xizhi_test_failed'",
              '            ),',
              '          description:',
              '            t(',
              "              'default_settings.xizhi_key_required'",
              '            ),',
              "          variant: 'destructive'",
              '        })',
              '',
              '        return',
              '      }',
              '',
              '      setXizhiTesting(true)',
              '',
              '      try {',
              '        const success =',
              '          await testXizhiPushNotification({',
              '            key,',
              '            title:',
              '              t(',
              "                'default_settings.xizhi_test_title'",
              '              ),',
              '            content:',
              '              t(',
              "                'default_settings.xizhi_test_content'",
              '              )',
              '          })',
              '',
              '        if (!success) {',
              "          throw new Error('XIZHI_TEST_FAILED')",
              '        }',
              '',
              '        toast({',
              '          title:',
              '            t(',
              "              'default_settings.xizhi_test_success'",
              '            ),',
              '          description:',
              '            t(',
              "              'default_settings.xizhi_test_success_desc'",
              '            )',
              '        })',
              '      } catch {',
              '        toast({',
              '          title:',
              '            t(',
              "              'default_settings.xizhi_test_failed'",
              '            ),',
              '          description:',
              '            t(',
              "              'default_settings.xizhi_test_failed_desc'",
              '            ),',
              "          variant: 'destructive'",
              '        })',
              '      } finally {',
              '        setXizhiTesting(false)',
              '      }',
              '    }',
              '',
              ''
            ].join('\n')

            if (
              !text.includes(marker)
            ) {
              throw new Error(
                'handleSelectDir marker not found'
              )
            }

            text =
              text.replace(
                marker,
                handler + marker
              )
          }

          const oldField = [
            '                <FormField',
            '                  control={form.control}',
            '                  name="xizhiKey"',
            '                  render={({ field }) => (',
            '                    <FormItem>',
            "                      <FormLabel>{t('default_settings.xizhi_key')}</FormLabel>",
            '                      <FormControl>',
            '                        <Input',
            "                          placeholder={t('default_settings.xizhi_key_placeholder')}",
            '                          {...field}',
            '                        />',
            '                      </FormControl>',
            '                      <FormMessage />',
            '                    </FormItem>',
            '                  )}',
            '                />'
          ].join('\n')

          const newField = [
            '                <FormField',
            '                  control={form.control}',
            '                  name="xizhiKey"',
            '                  render={({ field }) => (',
            '                    <FormItem>',
            '                      <FormLabel>',
            "                        {t('default_settings.xizhi_key')}",
            '                      </FormLabel>',
            '',
            '                      <FormControl>',
            '                        <div className="flex gap-2">',
            '                          <Input',
            "                            placeholder={t('default_settings.xizhi_key_placeholder')}",
            '                            {...field}',
            '                          />',
            '',
            '                          <Button',
            '                            variant="outline"',
            '                            type="button"',
            '                            disabled={xizhiTesting}',
            '                            onClick={handleTestXizhi}',
            '                          >',
            '                            {xizhiTesting',
            "                              ? t('default_settings.xizhi_testing')",
            "                              : t('default_settings.xizhi_test')}",
            '                          </Button>',
            '                        </div>',
            '                      </FormControl>',
            '',
            '                      <FormMessage />',
            '                    </FormItem>',
            '                  )}',
            '                />'
          ].join('\n')

          if (
            text.includes(oldField)
          ) {
            text =
              text.replace(
                oldField,
                newField
              )
          }

          fs.writeFileSync(
            path,
            text,
            'utf8'
          )

          console.log(
            'Xizhi test button added.'
          )
          NODE

          node "$RUNNER_TEMP/patch-settings.cjs"

      - name: Add Xizhi translations
        run: |
          cat > "$RUNNER_TEMP/patch-locales.cjs" <<'NODE'
          const fs = require('fs')

          const path =
            'src/renderer/src/locales/locales.js'

          let text =
            fs.readFileSync(
              path,
              'utf8'
            )

          if (
            !text.includes(
              "xizhi_test: 'Test Push'"
            )
          ) {
            text =
              text.replace(
                "xizhi_key_placeholder: 'Please enter the Xizhi API Key',",
                [
                  "xizhi_key_placeholder: 'Please enter the Xizhi push URL',",
                  "        xizhi_test: 'Test Push',",
                  "        xizhi_testing: 'Sending...',",
                  "        xizhi_test_title: 'Fideo Test Push',",
                  "        xizhi_test_content: 'Xizhi push configuration is working',",
                  "        xizhi_test_success: 'Push successful',",
                  "        xizhi_test_success_desc: 'The Xizhi test message has been sent',",
                  "        xizhi_test_failed: 'Push failed',",
                  "        xizhi_test_failed_desc: 'Please check the Xizhi push URL and network',",
                  "        xizhi_key_required: 'Please enter the Xizhi push URL first',"
                ].join('\n')
              )
          }

          if (
            !text.includes(
              "xizhi_test: '测试推送'"
            )
          ) {
            text =
              text.replace(
                "xizhi_key_placeholder: '请输入息知API Key',",
                [
                  "xizhi_key_placeholder: '请输入息知完整推送地址',",
                  "        xizhi_test: '测试推送',",
                  "        xizhi_testing: '发送中...',",
                  "        xizhi_test_title: 'Fideo 测试推送',",
                  "        xizhi_test_content: '息知推送配置成功',",
                  "        xizhi_test_success: '推送成功',",
                  "        xizhi_test_success_desc: '息知测试消息已发送',",
                  "        xizhi_test_failed: '推送失败',",
                  "        xizhi_test_failed_desc: '请检查息知推送地址和网络连接',",
                  "        xizhi_key_required: '请先填写息知推送地址',"
                ].join('\n')
              )
          }

          text =
            text.replace(
              "xizhi_key: '息知API Key(用于微信推送)',",
              "xizhi_key: '息知推送地址(用于微信推送)',"
            )

          text =
            text.replace(
              "xizhi_key: 'Xizhi API Key (For WeChat Push)',",
              "xizhi_key: 'Xizhi Push URL (For WeChat Push)',"
            )

          fs.writeFileSync(
            path,
            text,
            'utf8'
          )

          console.log(
            'Xizhi translations added.'
          )
          NODE

          node "$RUNNER_TEMP/patch-locales.cjs"

      - name: Update version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          npm version \
            "$VERSION" \
            --no-git-tag-version \
            --allow-same-version

      - name: Verify Xizhi feature
        run: |
          grep -q \
            "testXizhiPushNotification" \
            src/renderer/src/lib/utils.ts

          grep -q \
            "handleTestXizhi" \
            src/renderer/src/components/NavBar/components/DefaultSettingSheet.tsx

          grep -q \
            "xizhiTesting" \
            src/renderer/src/components/NavBar/components/DefaultSettingSheet.tsx

          grep -q \
            "测试推送" \
            src/renderer/src/locales/locales.js

          grep -q \
            "息知推送地址" \
            src/renderer/src/locales/locales.js

          echo "Xizhi test feature verified."

      - name: Verify V2.8 core
        run: |
          grep -q \
            "getDouyinAnchorProfile" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "resolveDouyinAnchorLiveRoom" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "handleMonitorOnly" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          grep -q \
            "autoRecord: boolean" \
            type.d.ts

          grep -q \
            "videoCodec('copy')" \
            src/main/ffmpeg/record.ts

          grep -q \
            "audioCodec('copy')" \
            src/main/ffmpeg/record.ts

          echo "V2.8 core retained."

      - name: TypeScript check
        run: |
          npm run typecheck

      - name: Build Electron
        run: |
          npm run build

      - name: Package Windows x64
        run: |
          npx electron-builder \
            --win \
            nsis \
            --x64 \
            --publish never

      - name: Verify installer
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $expected = "dist/fideo-$env:VERSION-x64.exe"

          if (-not (Test-Path $expected)) {
            throw "Installer not found: $expected"
          }

          $file = Get-Item $expected

          Write-Host "Installer:"
          Write-Host $file.Name
          Write-Host $file.Length

      - name: Commit V2.9 test
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet
          then
            echo "No changes."
          else
            git commit \
              -m "Add Xizhi test push"
          fi

          git push \
            --force \
            origin \
            douyin-v2.9-xizhi-test

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-${{ inputs.version }}-xizhi-test-windows-x64
          path: dist/fideo-${{ inputs.version }}-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "# Fideo V2.9 Xizhi Test Push"
            echo
            echo "Version: $VERSION"
            echo "Branch: douyin-v2.9-xizhi-test"
            echo
            echo "- Xizhi test push button added"
            echo "- Test push works while app is visible"
            echo "- Existing live notification logic retained"
          } >> "$GITHUB_STEP_SUMMARY"
