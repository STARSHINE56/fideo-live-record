name: Douyin V2.5 Preview And Monitor

on:
  workflow_dispatch:
    inputs:
      version:
        description: "测试版本号，例如 1.1.4"
        required: true
        default: "1.1.4"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Local Preview Proxy And Notify Only
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout V2.4 tested source
        uses: actions/checkout@v4
        with:
          ref: douyin-v2.4-test
          fetch-depth: 0

      - name: Create V2.5 test branch
        run: |
          git switch -C douyin-v2.5-test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      - name: Create local preview proxy
        run: |
          cat > src/main/preview-proxy.ts <<'TS'
          import * as http from 'node:http'
          import * as https from 'node:https'

          import type {
            IncomingMessage,
            Server,
            ServerResponse
          } from 'node:http'

          interface PreviewContext {
            roomUrl: string
            cookie?: string
          }

          let server: Server | null =
            null

          let serverPort = 0

          let context:
            | PreviewContext
            | null = null

          const USER_AGENT =
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
            'AppleWebKit/537.36 (KHTML, like Gecko) ' +
            'Chrome/123.0.0.0 Safari/537.36'

          function getLocalUrl(
            target: string
          ) {
            return (
              `http://127.0.0.1:${serverPort}` +
              `/proxy?url=${encodeURIComponent(
                target
              )}`
            )
          }

          function resolveUrl(
            value: string,
            base: string
          ) {
            try {
              return new URL(
                value,
                base
              ).toString()
            } catch {
              return value
            }
          }

          function rewritePlaylist(
            text: string,
            upstreamUrl: string
          ) {
            return text
              .split(/\r?\n/)
              .map((line) => {
                const trimmed =
                  line.trim()

                if (!trimmed) {
                  return line
                }

                if (
                  trimmed.startsWith('#')
                ) {
                  return line.replace(
                    /URI="([^"]+)"/g,
                    (
                      _,
                      value: string
                    ) => {
                      const resolved =
                        resolveUrl(
                          value,
                          upstreamUrl
                        )

                      return (
                        `URI="${getLocalUrl(
                          resolved
                        )}"`
                      )
                    }
                  )
                }

                const resolved =
                  resolveUrl(
                    trimmed,
                    upstreamUrl
                  )

                return getLocalUrl(
                  resolved
                )
              })
              .join('\n')
          }

          function requestUpstream(
            targetUrl: string,
            clientReq: IncomingMessage,
            clientRes: ServerResponse,
            redirectCount = 0
          ) {
            let target: URL

            try {
              target =
                new URL(
                  targetUrl
                )
            } catch {
              clientRes.statusCode =
                400

              clientRes.end(
                'Invalid URL'
              )

              return
            }

            if (
              target.protocol !==
                'http:' &&
              target.protocol !==
                'https:'
            ) {
              clientRes.statusCode =
                400

              clientRes.end(
                'Unsupported protocol'
              )

              return
            }

            const requester =
              target.protocol ===
                'https:'
                ? https
                : http

            const headers:
              Record<string, string> = {
                'User-Agent':
                  USER_AGENT,

                Accept:
                  '*/*',

                Referer:
                  context?.roomUrl ||
                  'https://live.douyin.com/'
              }

            if (
              context?.cookie
            ) {
              headers.Cookie =
                context.cookie
            }

            if (
              typeof clientReq
                .headers.range ===
              'string'
            ) {
              headers.Range =
                clientReq.headers.range
            }

            const upstreamReq =
              requester.request(
                target,
                {
                  method:
                    'GET',

                  headers
                },

                (upstreamRes) => {
                  const status =
                    upstreamRes
                      .statusCode ||
                    500

                  const location =
                    upstreamRes
                      .headers
                      .location

                  if (
                    status >= 300 &&
                    status < 400 &&
                    location &&
                    redirectCount < 5
                  ) {
                    const nextUrl =
                      resolveUrl(
                        location,
                        target.toString()
                      )

                    upstreamRes.resume()

                    requestUpstream(
                      nextUrl,
                      clientReq,
                      clientRes,
                      redirectCount + 1
                    )

                    return
                  }

                  const contentType =
                    String(
                      upstreamRes
                        .headers[
                        'content-type'
                      ] ||
                        ''
                    )

                  const isHls =
                    contentType
                      .toLowerCase()
                      .includes(
                        'mpegurl'
                      ) ||
                    /\.m3u8(?:\?|$)/i.test(
                      target.toString()
                    )

                  clientRes.statusCode =
                    status

                  clientRes.setHeader(
                    'Access-Control-Allow-Origin',
                    '*'
                  )

                  clientRes.setHeader(
                    'Access-Control-Allow-Headers',
                    '*'
                  )

                  clientRes.setHeader(
                    'Access-Control-Allow-Methods',
                    'GET, HEAD, OPTIONS'
                  )

                  clientRes.setHeader(
                    'Cache-Control',
                    'no-store'
                  )

                  if (contentType) {
                    clientRes.setHeader(
                      'Content-Type',
                      contentType
                    )
                  }

                  const acceptRanges =
                    upstreamRes
                      .headers[
                      'accept-ranges'
                    ]

                  if (acceptRanges) {
                    clientRes.setHeader(
                      'Accept-Ranges',
                      acceptRanges
                    )
                  }

                  const contentRange =
                    upstreamRes
                      .headers[
                      'content-range'
                    ]

                  if (contentRange) {
                    clientRes.setHeader(
                      'Content-Range',
                      contentRange
                    )
                  }

                  if (!isHls) {
                    const contentLength =
                      upstreamRes
                        .headers[
                        'content-length'
                      ]

                    if (
                      contentLength
                    ) {
                      clientRes.setHeader(
                        'Content-Length',
                        contentLength
                      )
                    }

                    upstreamRes.pipe(
                      clientRes
                    )

                    clientRes.on(
                      'close',
                      () => {
                        upstreamReq.destroy()
                        upstreamRes.destroy()
                      }
                    )

                    return
                  }

                  const chunks:
                    Buffer[] = []

                  upstreamRes.on(
                    'data',
                    (chunk) => {
                      chunks.push(
                        Buffer.isBuffer(
                          chunk
                        )
                          ? chunk
                          : Buffer.from(
                              chunk
                            )
                      )
                    }
                  )

                  upstreamRes.on(
                    'end',
                    () => {
                      if (
                        clientRes
                          .writableEnded
                      ) {
                        return
                      }

                      const text =
                        Buffer.concat(
                          chunks
                        ).toString(
                          'utf8'
                        )

                      const rewritten =
                        rewritePlaylist(
                          text,
                          target.toString()
                        )

                      clientRes.end(
                        rewritten
                      )
                    }
                  )
                }
              )

            upstreamReq.setTimeout(
              20000,
              () => {
                upstreamReq.destroy(
                  new Error(
                    'Preview upstream timeout'
                  )
                )
              }
            )

            upstreamReq.on(
              'error',
              () => {
                if (
                  !clientRes
                    .headersSent
                ) {
                  clientRes.statusCode =
                    502
                }

                if (
                  !clientRes
                    .writableEnded
                ) {
                  clientRes.end(
                    'Preview proxy error'
                  )
                }
              }
            )

            upstreamReq.end()
          }

          async function ensureServer() {
            if (
              server &&
              serverPort > 0
            ) {
              return
            }

            server =
              http.createServer(
                (
                  req,
                  res
                ) => {
                  res.setHeader(
                    'Access-Control-Allow-Origin',
                    '*'
                  )

                  res.setHeader(
                    'Access-Control-Allow-Headers',
                    '*'
                  )

                  res.setHeader(
                    'Access-Control-Allow-Methods',
                    'GET, HEAD, OPTIONS'
                  )

                  if (
                    req.method ===
                    'OPTIONS'
                  ) {
                    res.statusCode =
                      204

                    res.end()

                    return
                  }

                  const reqUrl =
                    new URL(
                      req.url ||
                        '/',

                      'http://127.0.0.1'
                    )

                  if (
                    reqUrl.pathname !==
                    '/proxy'
                  ) {
                    res.statusCode =
                      404

                    res.end(
                      'Not Found'
                    )

                    return
                  }

                  const target =
                    reqUrl
                      .searchParams
                      .get(
                        'url'
                      )

                  if (!target) {
                    res.statusCode =
                      400

                    res.end(
                      'Missing URL'
                    )

                    return
                  }

                  requestUpstream(
                    target,
                    req,
                    res
                  )
                }
              )

            await new Promise<void>(
              (
                resolve,
                reject
              ) => {
                const current =
                  server!

                const onError =
                  (error: Error) => {
                    reject(error)
                  }

                current.once(
                  'error',
                  onError
                )

                current.listen(
                  0,
                  '127.0.0.1',
                  () => {
                    current.removeListener(
                      'error',
                      onError
                    )

                    const address =
                      current.address()

                    if (
                      !address ||
                      typeof address ===
                        'string'
                    ) {
                      reject(
                        new Error(
                          'Unable to start preview proxy'
                        )
                      )

                      return
                    }

                    serverPort =
                      address.port

                    resolve()
                  }
                )
              }
            )
          }

          export async function startPreviewProxy(
            info: {
              streamUrl: string
              roomUrl: string
              cookie?: string
            }
          ) {
            context = {
              roomUrl:
                info.roomUrl,

              cookie:
                info.cookie
            }

            await ensureServer()

            return {
              url:
                getLocalUrl(
                  info.streamUrl
                )
            }
          }

          export async function stopPreviewProxy() {
            context = null

            if (!server) {
              return
            }

            const current =
              server

            server = null
            serverPort = 0

            try {
              const extended =
                current as Server & {
                  closeAllConnections?: () => void
                }

              extended
                .closeAllConnections
                ?.()
            } catch {
              // Ignore.
            }

            await new Promise<void>(
              (resolve) => {
                try {
                  current.close(
                    () => resolve()
                  )
                } catch {
                  resolve()
                }
              }
            )
          }
          TS

      - name: Create V2.5 source patch
        run: |
          cat > "$RUNNER_TEMP/patch-v25.cjs" <<'NODE'
          const fs =
            require('fs')

          function read(path) {
            return fs.readFileSync(
              path,
              'utf8'
            )
          }

          function write(
            path,
            content
          ) {
            fs.writeFileSync(
              path,
              content,
              'utf8'
            )
          }

          function mustReplace(
            source,
            pattern,
            replacement,
            label
          ) {
            if (
              !pattern.test(source)
            ) {
              throw new Error(
                `Patch target not found: ${label}`
              )
            }

            return source.replace(
              pattern,
              replacement
            )
          }


          // ====================================================
          // type.d.ts
          // ====================================================

          const typePath =
            'type.d.ts'

          let typeSource =
            read(typePath)

          if (
            !typeSource.includes(
              'autoRecord: boolean'
            )
          ) {
            typeSource =
              mustReplace(
                typeSource,

                /(\s+detectResolution:\s*boolean)/,

                `$1
            autoRecord: boolean`,

                'IStreamConfig autoRecord'
              )
          }

          write(
            typePath,
            typeSource
          )


          // ====================================================
          // const.ts
          // ====================================================

          const constPath =
            'src/const.ts'

          let constSource =
            read(constPath)

          if (
            !constSource.includes(
              'START_STREAM_PREVIEW'
            )
          ) {
            constSource =
              mustReplace(
                constSource,

                /export const GET_ROOM_INFO = 'GET_ROOM_INFO'/,

                `export const GET_ROOM_INFO = 'GET_ROOM_INFO'
            export const START_STREAM_PREVIEW = 'START_STREAM_PREVIEW'
            export const STOP_STREAM_PREVIEW = 'STOP_STREAM_PREVIEW'`,

                'preview constants'
              )
          }

          write(
            constPath,
            constSource
          )


          // ====================================================
          // Existing configs migration
          // ====================================================

          const storePath =
            'src/renderer/src/store/useStreamConfigStore.ts'

          let store =
            read(storePath)

          if (
            !store.includes(
              'typeof streamConfig.autoRecord'
            )
          ) {
            const migrationPattern =
              /if\s*\(\s*!streamConfig\.id\s*\)\s*\{\s*shouldUpdate\s*=\s*true\s*streamConfig\.id\s*=\s*nanoid\(\)\s*\}\s*return\s+streamConfig/m

            store =
              mustReplace(
                store,

                migrationPattern,

                `if (!streamConfig.id) {
                  shouldUpdate = true
                  streamConfig.id = nanoid()
                }

                if (
                  typeof streamConfig.autoRecord !==
                  'boolean'
                ) {
                  shouldUpdate = true
                  streamConfig.autoRecord = true
                }

                return streamConfig`,

                'config migration'
              )
          }

          write(
            storePath,
            store
          )


          // ====================================================
          // StreamConfigSheet
          // ====================================================

          const sheetPath =
            'src/renderer/src/components/StreamConfigSheet.tsx'

          let sheet =
            read(sheetPath)

          if (
            !sheet.includes(
              'autoRecord: z.boolean()'
            )
          ) {
            sheet =
              mustReplace(
                sheet,

                /detectResolution:\s*z\.boolean\(\)/,

                `detectResolution: z.boolean(),
              autoRecord: z.boolean()`,

                'autoRecord schema'
              )
          }

          if (
            !sheet.includes(
              'autoRecord: true'
            )
          ) {
            sheet =
              mustReplace(
                sheet,

                /detectResolution:\s*false/,

                `detectResolution: false,
              autoRecord: true`,

                'autoRecord default'
              )
          }

          if (
            !sheet.includes(
              'name="autoRecord"'
            )
          ) {
            const insertMarker =
              /(\s*<FormField\s*\n\s*control=\{form\.control\}\s*\n\s*name="convertToMP4")/m

            if (
              !insertMarker.test(
                sheet
              )
            ) {
              throw new Error(
                'Patch target not found: autoRecord UI insertion'
              )
            }

            const field = `
                <FormField
                  control={form.control}
                  name="autoRecord"
                  render={({ field }) => (
                    <FormItem>
                      <TooltipProvider delayDuration={400}>
                        <Tooltip>
                          <TooltipTrigger asChild>
                            <FormLabel className="cursor-pointer">
                              {t('stream_config.auto_record')}
                            </FormLabel>
                          </TooltipTrigger>

                          <TooltipContent>
                            <p className="max-w-[400px]">
                              {t('stream_config.auto_record_tooltip')}
                            </p>
                          </TooltipContent>
                        </Tooltip>
                      </TooltipProvider>

                      <Switch
                        checked={field.value}
                        onCheckedChange={field.onChange}
                        className="flex"
                      />
                    </FormItem>
                  )}
                />

          `

            sheet =
              sheet.replace(
                insertMarker,
                field + '$1'
              )
          }

          write(
            sheetPath,
            sheet
          )


          // ====================================================
          // Locales
          // ====================================================

          const localePath =
            'src/renderer/src/locales/locales.js'

          let locale =
            read(localePath)

          if (
            !locale.includes(
              `auto_record: 'Automatically Record When Live'`
            )
          ) {
            locale =
              mustReplace(
                locale,

                /(\s+should_convert_to_mp4:\s*'Convert to MP4 after recording ends',)/,

                `
                    auto_record: 'Automatically Record When Live',
                    auto_record_tooltip:
                      'When disabled, only monitor and notify when the streamer goes live. FFmpeg recording will not start.',
                    live_detected: 'Streamer is live',
                    live_detected_notify: '{{title}} is now live',
            $1`,

                'English autoRecord locale'
              )
          }

          if (
            !locale.includes(
              `auto_record: '开播后自动录制'`
            )
          ) {
            locale =
              mustReplace(
                locale,

                /(\s+should_convert_to_mp4:\s*'录制结束后是否转为MP4',)/,

                `
                    auto_record: '开播后自动录制',
                    auto_record_tooltip:
                      '关闭后只监控主播是否开播；检测到开播时发送通知，但不会启动 FFmpeg 录制。',
                    live_detected: '检测到主播开播',
                    live_detected_notify: '{{title}} 已经开播',
            $1`,

                'Chinese autoRecord locale'
              )
          }

          write(
            localePath,
            locale
          )


          // ====================================================
          // Preload
          // ====================================================

          const preloadPath =
            'src/preload/index.ts'

          let preload =
            read(preloadPath)

          if (
            !preload.includes(
              'START_STREAM_PREVIEW'
            )
          ) {
            preload =
              mustReplace(
                preload,

                /(\s+GET_ROOM_INFO,)/,

                `$1
              START_STREAM_PREVIEW,
              STOP_STREAM_PREVIEW,`,

                'preload imports'
              )
          }

          if (
            !preload.includes(
              'startStreamPreview:'
            )
          ) {
            const roomInfoMethod =
              /(\s+getRoomInfo:\s*\(info:\s*\{\s*roomUrl:\s*string;\s*proxy\?:\s*string;\s*cookie\?:\s*string\s*\}\)\s*=>\s*\n\s*ipcRenderer\.invoke\(GET_ROOM_INFO,\s*info\),)/m

            preload =
              mustReplace(
                preload,

                roomInfoMethod,

                `$1

              startStreamPreview: (info: {
                streamUrl: string
                roomUrl: string
                proxy?: string
                cookie?: string
              }) =>
                ipcRenderer.invoke(
                  START_STREAM_PREVIEW,
                  info
                ),

              stopStreamPreview: () =>
                ipcRenderer.invoke(
                  STOP_STREAM_PREVIEW
                ),`,

                'preload preview APIs'
              )
          }

          write(
            preloadPath,
            preload
          )


          // ====================================================
          // Preload type
          // ====================================================

          const preloadTypePath =
            'src/preload/index.d.ts'

          let preloadType =
            read(preloadTypePath)

          if (
            !preloadType.includes(
              'startStreamPreview:'
            )
          ) {
            preloadType =
              mustReplace(
                preloadType,

                /(\s+navByDefaultBrowser:\s*\(url:\s*string\)\s*=>\s*void)/,

                `$1

                  startStreamPreview: (info: {
                    streamUrl: string
                    roomUrl: string
                    proxy?: string
                    cookie?: string
                  }) => Promise<{
                    url: string
                  }>

                  stopStreamPreview: () => Promise<void>`,

                'preload preview type'
              )
          }

          write(
            preloadTypePath,
            preloadType
          )


          // ====================================================
          // Main process
          // ====================================================

          const mainPath =
            'src/main/index.ts'

          let main =
            read(mainPath)

          if (
            !main.includes(
              'START_STREAM_PREVIEW'
            )
          ) {
            main =
              mustReplace(
                main,

                /(\s+GET_ROOM_INFO,)/,

                `$1
              START_STREAM_PREVIEW,
              STOP_STREAM_PREVIEW,`,

                'main preview constants'
              )
          }

          if (
            !main.includes(
              `from './preview-proxy'`
            )
          ) {
            main =
              mustReplace(
                main,

                /import \{ startFrpcProcess, stopFrpc, frpcObj \} from '\.\/frpc'/,

                `import { startFrpcProcess, stopFrpc, frpcObj } from './frpc'
            import {
              startPreviewProxy,
              stopPreviewProxy
            } from './preview-proxy'`,

                'preview proxy import'
              )
          }

          if (
            !main.includes(
              'ipcMain.handle(\n    START_STREAM_PREVIEW'
            ) &&
            !main.includes(
              'ipcMain.handle(\r\n    START_STREAM_PREVIEW'
            )
          ) {
            const navHandler =
              /(\s*ipcMain\.handle\(NAV_BY_DEFAULT_BROWSER,\s*\(_,\s*url:\s*string\)\s*=>\s*\{\s*shell\.openExternal\(url\)\s*\}\))/m

            const handlers = `

              ipcMain.handle(
                START_STREAM_PREVIEW,
                async (
                  _,
                  info: {
                    streamUrl: string
                    roomUrl: string
                    proxy?: string
                    cookie?: string
                  }
                ) => {
                  const effectiveCookie =
                    await getEffectiveCookie(
                      info.roomUrl,
                      info.cookie
                    )

                  await stopPreviewProxy()

                  return startPreviewProxy({
                    streamUrl:
                      info.streamUrl,

                    roomUrl:
                      info.roomUrl,

                    cookie:
                      effectiveCookie
                  })
                }
              )

              ipcMain.handle(
                STOP_STREAM_PREVIEW,
                async () => {
                  await stopPreviewProxy()
                }
              )`

            main =
              mustReplace(
                main,

                navHandler,

                `$1${handlers}`,

                'preview IPC handlers'
              )
          }

          if (
            !main.includes(
              'void stopPreviewProxy()'
            )
          ) {
            main =
              mustReplace(
                main,

                /(\s+stopFrpc\(\)\s*\n\s*\n\s*win\?\.destroy\(\))/,

                `
                void stopPreviewProxy()
                stopFrpc()

                win?.destroy()`,

                'preview cleanup'
              )
          }

          write(
            mainPath,
            main
          )


          // ====================================================
          // OperationBar
          // ====================================================

          const opPath =
            'src/renderer/src/components/StreamConfigList/components/OperationBar.tsx'

          let op =
            read(opPath)

          if (
            !op.includes(
              'const liveNotifiedRef'
            )
          ) {
            op =
              mustReplace(
                op,

                /const timer = useRef<NodeJS\.Timeout>\(\)/,

                `const timer = useRef<NodeJS.Timeout>()
              const liveNotifiedRef = useRef(false)`,

                'notification ref'
              )
          }


          // ----------------------------------------------------
          // Monitor-only functions
          // ----------------------------------------------------

          if (
            !op.includes(
              'const handleMonitorOnly'
            )
          ) {
            const marker =
              '  const handleStartRecord = async (isFirst = true) => {'

            const pos =
              op.indexOf(marker)

            if (pos < 0) {
              throw new Error(
                'Patch target not found: handleStartRecord'
              )
            }

            const monitorCode = `
            const scheduleMonitorOnly = () => {
              if (timer.current) {
                clearTimeout(
                  timer.current
                )
              }

              timer.current =
                setTimeout(
                  () => {
                    void handleMonitorOnly(
                      false
                    )
                  },

                  1000 *
                    streamConfig.interval
                )
            }

            const handleMonitorOnly = async (
              isFirst = true
            ) => {
              if (isFirst) {
                liveNotifiedRef.current =
                  false

                await updateStreamConfig(
                  {
                    ...streamConfig,
                    status:
                      StreamStatus.MONITORING
                  },

                  streamConfig.id
                )
              }

              const result =
                await window.api
                  .getLiveUrls({
                    roomUrl:
                      streamConfig.roomUrl,

                    cookie:
                      streamConfig.cookie,

                    proxy:
                      streamConfig.proxy,

                    title:
                      streamConfig.title
                  })
                  .catch(() => ({
                    code:
                      UNKNOWN_CODE,

                    liveUrls:
                      [] as string[]
                  }))

              const latest =
                useStreamConfigStore
                  .getState()
                  .streamConfigList
                  .find(
                    (item) =>
                      item.id ===
                      streamConfig.id
                  )

              if (
                !latest ||
                latest.status ===
                  StreamStatus.NOT_STARTED
              ) {
                return
              }

              if (
                result.code ===
                  SUCCESS_CODE &&
                Array.isArray(
                  result.liveUrls
                ) &&
                result.liveUrls.length >
                  0
              ) {
                if (
                  !liveNotifiedRef.current
                ) {
                  liveNotifiedRef.current =
                    true

                  const message =
                    t(
                      'stream_config.live_detected_notify',
                      {
                        title:
                          streamConfig.title
                      }
                    )

                  window.api.showNotification(
                    t(
                      'stream_config.live_detected'
                    ),
                    message
                  )

                  toast({
                    title:
                      streamConfig.title,

                    description:
                      t(
                        'stream_config.live_detected'
                      )
                  })

                  if (
                    defaultSettingsConfig
                      .xizhiKey
                  ) {
                    useXizhiToPushNotification({
                      key:
                        defaultSettingsConfig
                          .xizhiKey,

                      title:
                        streamConfig.title,

                      content:
                        t(
                          'stream_config.live_detected'
                        )
                    })
                  }
                }

                scheduleMonitorOnly()

                return
              }

              if (
                result.code ===
                  CRAWLER_ERROR_CODE.NOT_URLS ||
                result.code ===
                  UNKNOWN_CODE
              ) {
                liveNotifiedRef.current =
                  false

                scheduleMonitorOnly()

                return
              }

              if (isFirst) {
                const errMessage =
                  crawlerErrorCodeToI18nMessage(
                    result.code,
                    'error.get_line.'
                  )

                toast({
                  title:
                    streamConfig.title,

                  description:
                    t(errMessage),

                  variant:
                    'destructive'
                })
              }

              scheduleMonitorOnly()
            }


          `

            op =
              op.slice(
                0,
                pos
              ) +
              monitorCode +
              op.slice(pos)
          }


          // ----------------------------------------------------
          // Play / pause behavior
          // ----------------------------------------------------

          const playPausePattern =
            /const handlePlayClick = \(\) => \{\s*handleStartRecord\(true\)\s*\}\s*\n\s*const handlePauseClick = async \(\) => \{\s*await window\.api\.stopStreamRecord\(streamConfig\.id\)\s*clearTimeout\(timer\.current\)\s*\}/m

          if (
            !op.includes(
              'streamConfig.autoRecord ==='
            )
          ) {
            op =
              mustReplace(
                op,

                playPausePattern,

                `const handlePlayClick = () => {
                if (
                  streamConfig.autoRecord ===
                  false
                ) {
                  void handleMonitorOnly(
                    true
                  )

                  return
                }

                void handleStartRecord(
                  true
                )
              }

              const handlePauseClick = async () => {
                if (timer.current) {
                  clearTimeout(
                    timer.current
                  )
                }

                liveNotifiedRef.current =
                  false

                if (
                  streamConfig.autoRecord ===
                  false
                ) {
                  await updateStreamConfig(
                    {
                      ...streamConfig,
                      status:
                        StreamStatus.NOT_STARTED
                    },

                    streamConfig.id
                  )

                  return
                }

                await window.api.stopStreamRecord(
                  streamConfig.id
                )
              }`,

                'play pause behavior'
              )
          }


          // ----------------------------------------------------
          // Local proxy preview
          // ----------------------------------------------------

          const previewStart =
            op.indexOf(
              '  const handlePreviewClick = async () => {'
            )

          const previewEnd =
            op.indexOf(
              '  useEffect(() => {',
              previewStart
            )

          if (
            previewStart < 0 ||
            previewEnd < 0 ||
            previewEnd <=
              previewStart
          ) {
            throw new Error(
              'Patch target not found: preview block'
            )
          }

          const previewCode = `
            const openPreviewStream = async (
              streamUrl: string,
              type: 'hls' | 'flv'
            ) => {
              const proxyResult =
                await window.api.startStreamPreview({
                  streamUrl,

                  roomUrl:
                    streamConfig.roomUrl,

                  cookie:
                    streamConfig.cookie,

                  proxy:
                    streamConfig.proxy
                })

              setPreviewType(
                type
              )

              setPreviewUrl(
                proxyResult.url
              )

              setPreviewOpen(
                true
              )
            }

            const handlePreviewOpenChange = (
              open: boolean
            ) => {
              setPreviewOpen(
                open
              )

              if (!open) {
                setPreviewUrl('')

                void window.api
                  .stopStreamPreview()
              }
            }

            const handlePreviewClick = async () => {
              setIsLoadingPreview(
                true
              )

              try {
                const {
                  code,
                  liveUrls
                } =
                  await window.api.getLiveUrls({
                    roomUrl:
                      streamConfig.roomUrl,

                    cookie:
                      streamConfig.cookie,

                    proxy:
                      streamConfig.proxy,

                    title:
                      streamConfig.title
                  })

                if (
                  code !==
                  SUCCESS_CODE
                ) {
                  toast({
                    title:
                      streamConfig.title,

                    description:
                      t(
                        errorCodeToI18nMessage(
                          code,
                          'error.get_line.'
                        )
                      ),

                    variant:
                      'destructive'
                  })

                  return
                }

                if (
                  !Array.isArray(
                    liveUrls
                  ) ||
                  liveUrls.length ===
                    0
                ) {
                  toast({
                    title:
                      streamConfig.title,

                    description:
                      t(
                        'stream_config.preview_stream_unavailable'
                      ),

                    variant:
                      'destructive'
                  })

                  return
                }

                const flvUrl =
                  liveUrls.find(
                    (url) =>
                      /\\.flv(?:\\?|$)/i.test(
                        url
                      ) ||
                      /pull-flv/i.test(
                        url
                      ) ||
                      /\\/flv\\//i.test(
                        url
                      )
                  )

                if (flvUrl) {
                  await openPreviewStream(
                    flvUrl,
                    'flv'
                  )

                  return
                }

                const hlsUrl =
                  liveUrls.find(
                    (url) =>
                      /\\.m3u8(?:\\?|$)/i.test(
                        url
                      ) ||
                      /pull-hls/i.test(
                        url
                      ) ||
                      /\\/hls\\//i.test(
                        url
                      )
                  )

                if (hlsUrl) {
                  await openPreviewStream(
                    hlsUrl,
                    'hls'
                  )

                  return
                }

                toast({
                  title:
                    streamConfig.title,

                  description:
                    t(
                      'stream_config.preview_stream_unavailable'
                    ),

                  variant:
                    'destructive'
                })
              } catch {
                toast({
                  title:
                    streamConfig.title,

                  description:
                    t(
                      'stream_config.preview_failed'
                    ),

                  variant:
                    'destructive'
                })
              } finally {
                setIsLoadingPreview(
                  false
                )
              }
            }


          `

          op =
            op.slice(
              0,
              previewStart
            ) +
            previewCode +
            op.slice(
              previewEnd
            )

          op =
            op.replace(
              /onOpenChange=\{\s*setPreviewOpen\s*\}/m,

              `onOpenChange={
                handlePreviewOpenChange
              }`
            )

          write(
            opPath,
            op
          )


          // ====================================================
          // Preview player settings
          // ====================================================

          const previewPath =
            'src/renderer/src/components/StreamPreviewDialog.tsx'

          let preview =
            read(previewPath)

          preview =
            preview.replace(
              /\s*liveBufferLatencyChasing:\s*true,\s*\n\s*liveBufferLatencyMaxLatency:\s*3,\s*\n\s*liveBufferLatencyMinRemain:\s*0\.5\s*/m,
              '\n'
            )

          write(
            previewPath,
            preview
          )


          // ====================================================
          // Final validation
          // ====================================================

          const finalStore =
            read(storePath)

          const finalSheet =
            read(sheetPath)

          const finalMain =
            read(mainPath)

          const finalOp =
            read(opPath)

          const finalPreload =
            read(preloadPath)

          if (
            !finalStore.includes(
              'streamConfig.autoRecord = true'
            )
          ) {
            throw new Error(
              'Existing config migration missing'
            )
          }

          if (
            !finalSheet.includes(
              'name="autoRecord"'
            )
          ) {
            throw new Error(
              'autoRecord UI missing'
            )
          }

          if (
            !finalOp.includes(
              'handleMonitorOnly'
            )
          ) {
            throw new Error(
              'monitor-only mode missing'
            )
          }

          if (
            !finalOp.includes(
              'startStreamPreview'
            )
          ) {
            throw new Error(
              'preview proxy integration missing'
            )
          }

          if (
            !finalMain.includes(
              'startPreviewProxy'
            )
          ) {
            throw new Error(
              'preview proxy main process missing'
            )
          }

          if (
            !finalPreload.includes(
              'stopStreamPreview'
            )
          ) {
            throw new Error(
              'preview preload API missing'
            )
          }

          console.log(
            'V2.5 patch completed successfully.'
          )
          NODE

      - name: Validate V2.5 patch syntax
        run: |
          node --check \
            "$RUNNER_TEMP/patch-v25.cjs"

      - name: Apply V2.5 patch
        run: |
          node \
            "$RUNNER_TEMP/patch-v25.cjs"

      - name: Update version
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          npm version \
            "$APP_VERSION" \
            --no-git-tag-version

      - name: Verify V2.5 changes
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          echo "Checking auto-record switch..."

          grep -q \
            "autoRecord: boolean" \
            type.d.ts

          grep -q \
            'name="autoRecord"' \
            src/renderer/src/components/StreamConfigSheet.tsx

          grep -q \
            "streamConfig.autoRecord = true" \
            src/renderer/src/store/useStreamConfigStore.ts

          grep -q \
            "handleMonitorOnly" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          grep -q \
            "showNotification" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          echo "Checking local preview proxy..."

          grep -q \
            "startPreviewProxy" \
            src/main/preview-proxy.ts

          grep -q \
            "127.0.0.1" \
            src/main/preview-proxy.ts

          grep -q \
            "START_STREAM_PREVIEW" \
            src/main/index.ts

          grep -q \
            "startStreamPreview" \
            src/preload/index.ts

          grep -q \
            "startStreamPreview" \
            src/preload/index.d.ts

          grep -q \
            "startStreamPreview" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          echo "Checking V2.4 quality logic remains..."

          grep -q \
            "getQualityRank" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "candidate_resolution" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "Douyin best stream" \
            src/main/crawler/plugins/douyin.js

          echo "Checking FFmpeg..."

          grep -q \
            "audioCodec('copy')" \
            src/main/ffmpeg/record.ts

          grep -q \
            "videoCodec('copy')" \
            src/main/ffmpeg/record.ts

          grep -q \
            "reconnect_streamed" \
            src/main/ffmpeg/record.ts

          if grep -Fq \
            "inputOptions(['-re'])" \
            src/main/ffmpeg/record.ts
          then
            echo "ERROR: FFmpeg -re returned"
            exit 1
          fi

          echo "Checking version..."

          node -e "
          const p =
            require('./package.json');

          if (
            p.version !==
            process.env.APP_VERSION
          ) {
            console.error(
              'Version mismatch:',
              p.version
            );

            process.exit(1);
          }

          console.log(
            'Version:',
            p.version
          );
          "

          echo \
            "All V2.5 source checks passed."

      - name: TypeScript check
        run: |
          npm run typecheck

      - name: Build Electron app
        run: |
          npm run build

      - name: Package Windows x64
        run: |
          npx electron-builder \
            --win \
            nsis \
            --x64 \
            --publish never

      - name: Verify Windows installer
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $package =
            Get-Content package.json |
            ConvertFrom-Json

          if (
            $package.version -ne
            $env:EXPECTED_VERSION
          ) {
            throw `
              "Version mismatch. Expected $env:EXPECTED_VERSION, got $($package.version)"
          }

          $installers =
            Get-ChildItem `
              -Path dist `
              -Filter "*-x64.exe"

          if (
            $installers.Count -eq 0
          ) {
            throw `
              "Windows x64 installer not generated."
          }

          Write-Host `
            "Generated installer:"

          $installers |
            Select-Object `
              Name,
              Length,
              FullName

      - name: Commit V2.5 tested source
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            package.json \
            package-lock.json \
            type.d.ts \
            src/const.ts \
            src/main/index.ts \
            src/main/preview-proxy.ts \
            src/preload/index.ts \
            src/preload/index.d.ts \
            src/renderer/src/store/useStreamConfigStore.ts \
            src/renderer/src/components/StreamConfigSheet.tsx \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx \
            src/renderer/src/components/StreamPreviewDialog.tsx \
            src/renderer/src/locales/locales.js

          if git diff --cached --quiet
          then
            echo \
              "No source changes to commit."
          else
            git commit \
              -m "Add local preview proxy and notify-only monitoring"
          fi

          git push \
            --force \
            origin \
            douyin-v2.5-test

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-${{ inputs.version }}-douyin-v2.5-windows-x64
          path: dist/*-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          {
            echo "# Fideo Douyin V2.5"
            echo
            echo "Version: \`$APP_VERSION\`"
            echo
            echo "Branch: \`douyin-v2.5-test\`"
            echo
            echo "Included:"
            echo
            echo "- Localhost live preview proxy"
            echo "- Douyin Referer and login cookie forwarded by main process"
            echo "- HLS playlist URL rewriting"
            echo "- FLV localhost streaming"
            echo "- Auto recording switch for each streamer"
            echo "- Auto record OFF = monitor and notify only"
            echo "- Windows notification on going live"
            echo "- Xizhi push retained"
            echo "- Existing stream configs default to auto record ON"
            echo "- V2.4 highest-quality selection retained"
            echo "- Audio and video stream-copy retained"
            echo "- Windows x64 test installer"
          } >> "$GITHUB_STEP_SUMMARY"
