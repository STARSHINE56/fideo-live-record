name: Douyin V2.8 Anchor Monitor

on:
  workflow_dispatch:
    inputs:
      version:
        description: "测试版本号，例如 1.1.9"
        required: true
        default: "1.1.9"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Douyin V2.8 Anchor Monitor
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout V2.7
        uses: actions/checkout@v4
        with:
          ref: douyin-v2.7-ui-test
          fetch-depth: 0

      - name: Create V2.8 test branch
        run: |
          git switch -C douyin-v2.8-anchor-monitor-test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      # ============================================================
      # 1. 让 crawler 接受抖音主播主页
      # ============================================================

      - name: Add Douyin profile hosts
        run: |
          node <<'NODE'
          const fs = require('fs')

          const path =
            'src/main/crawler/index.js'

          let text =
            fs.readFileSync(
              path,
              'utf8'
            )

          if (
            text.includes(
              "'www.douyin.com':"
            )
          ) {
            console.log(
              'Douyin profile hosts already exist.'
            )

            process.exit(0)
          }

          const lines =
            text.split(/\r?\n/)

          const start =
            lines.findIndex(
              line =>
                line.includes(
                  "'v.douyin.com':"
                )
            )

          if (
            start < 0
          ) {
            throw new Error(
              'v.douyin.com crawler block not found'
            )
          }

          let end =
            -1

          for (
            let i = start + 1;
            i < lines.length;
            i++
          ) {
            if (
              lines[i].trim() ===
              '},'
            ) {
              end = i
              break
            }
          }

          if (
            end < 0
          ) {
            throw new Error(
              'v.douyin.com crawler block end not found'
            )
          }

          const block = [
            '',
            "  'www.douyin.com': {",
            '    getLiveUrlsFn: getDouYinLiveUrlsPlugin,',
            '    getRoomInfoFn: getDouYinRoomInfoPlugin',
            '  },',
            '',
            "  'douyin.com': {",
            '    getLiveUrlsFn: getDouYinLiveUrlsPlugin,',
            '    getRoomInfoFn: getDouYinRoomInfoPlugin',
            '  },'
          ]

          lines.splice(
            end + 1,
            0,
            ...block
          )

          fs.writeFileSync(
            path,
            lines.join('\n'),
            'utf8'
          )

          console.log(
            'Douyin profile hosts added.'
          )
          NODE

      # ============================================================
      # 2. 增加主播主页解析
      # ============================================================

      - name: Add Douyin anchor monitor parser
        run: |
          node <<'NODE'
          const fs = require('fs')

          const path =
            'src/main/crawler/plugins/douyin.js'

          let text =
            fs.readFileSync(
              path,
              'utf8'
            )

          # ========================================================
          # 这里下面是 JS，不是 bash
          # ========================================================
          NODE

          cat > "$RUNNER_TEMP/patch-douyin.cjs" <<'NODE'
          const fs = require('fs')

          const path =
            'src/main/crawler/plugins/douyin.js'

          let text =
            fs.readFileSync(
              path,
              'utf8'
            )

          // ========================================================
          // helper
          // ========================================================

          if (
            !text.includes(
              'async function getDouyinAnchorProfile('
            )
          ) {
            const marker =
              'async function getDesktopRoomWithFallback('

            const index =
              text.indexOf(
                marker
              )

            if (
              index < 0
            ) {
              throw new Error(
                'getDesktopRoomWithFallback not found'
              )
            }

            const helper = `
          function getDouyinProfileSecUid(
            inputUrl
          ) {
            try {
              const url =
                new URL(
                  inputUrl
                )

              const host =
                url.hostname
                  .toLowerCase()

              if (
                host !== 'www.douyin.com' &&
                host !== 'douyin.com'
              ) {
                return ''
              }

              const parts =
                url.pathname
                  .split('/')
                  .filter(Boolean)

              if (
                parts[0] !== 'user' ||
                !parts[1]
              ) {
                return ''
              }

              return decodeURIComponent(
                parts[1]
              )
            } catch {
              return ''
            }
          }


          function parseDouyinJson(
            value
          ) {
            if (!value) {
              return null
            }

            if (
              typeof value ===
              'object'
            ) {
              return value
            }

            if (
              typeof value !==
              'string'
            ) {
              return null
            }

            try {
              return JSON.parse(
                value
              )
            } catch {
              return null
            }
          }


          function findDouyinNestedValue(
            value,
            keys,
            depth = 0
          ) {
            if (
              !value ||
              typeof value !==
                'object' ||
              depth > 8
            ) {
              return undefined
            }

            for (
              const key of keys
            ) {
              const result =
                value[key]

              if (
                result !== undefined &&
                result !== null &&
                result !== ''
              ) {
                return result
              }
            }

            for (
              const child of
              Object.values(
                value
              )
            ) {
              if (
                !child ||
                typeof child !==
                  'object'
              ) {
                continue
              }

              const found =
                findDouyinNestedValue(
                  child,
                  keys,
                  depth + 1
                )

              if (
                found !== undefined
              ) {
                return found
              }
            }

            return undefined
          }


          function buildDouyinProfileParams(
            secUid
          ) {
            return new URLSearchParams({
              device_platform:
                'webapp',

              aid:
                '6383',

              channel:
                'channel_pc_web',

              pc_client_type:
                '1',

              version_code:
                '190500',

              version_name:
                '19.5.0',

              cookie_enabled:
                'true',

              screen_width:
                '1920',

              screen_height:
                '1080',

              browser_language:
                'zh-CN',

              browser_platform:
                'Win32',

              browser_name:
                'Chrome',

              browser_version:
                '123.0.0.0',

              browser_online:
                'true',

              engine_name:
                'Blink',

              engine_version:
                '123.0.0.0',

              os_name:
                'Windows',

              os_version:
                '10',

              cpu_core_num:
                '8',

              device_memory:
                '8',

              platform:
                'PC',

              downlink:
                '10',

              effective_type:
                '4g',

              round_trip_time:
                '50',

              sec_user_id:
                secUid,

              msToken:
                ''
            })
          }


          async function getDouyinAnchorProfile(
            secUid,
            others = {}
          ) {
            const {
              proxy,
              cookie
            } =
              others

            if (!secUid) {
              throw new Error(
                'DOUYIN_SEC_UID_EMPTY'
              )
            }

            const profileUrl =
              'https://www.douyin.com/user/' +
              encodeURIComponent(
                secUid
              )

            const headers = {
              Referer:
                profileUrl,

              'User-Agent':
                PC_USER_AGENT
            }

            let generatedCookies =
              ''

            try {
              const bootstrap =
                await request(
                  'https://www.douyin.com/',
                  {
                    headers,
                    proxy
                  }
                )

              generatedCookies =
                joinSetCookies(
                  bootstrap
                )
            } catch {
              // Ignore bootstrap failure.
            }

            const finalCookie = [
              generatedCookies,
              cookie
            ]
              .filter(Boolean)
              .join('; ')

            const params =
              buildDouyinProfileParams(
                secUid
              )

            const query =
              params.toString()

            const aBogus =
              generateABogus(
                query,
                PC_USER_AGENT
              )

            params.set(
              'a_bogus',
              aBogus
            )

            const apiUrl =
              'https://www.douyin.com' +
              '/aweme/v1/web/user/profile/other/?' +
              params.toString()

            const response =
              await request(
                apiUrl,
                {
                  headers: {
                    ...headers,

                    ...(finalCookie
                      ? {
                          cookie:
                            finalCookie
                        }
                      : {})
                  },

                  proxy
                }
              )

            const body =
              response?.data

            if (!body) {
              throw new Error(
                'DOUYIN_PROFILE_RESPONSE_EMPTY'
              )
            }

            const user =
              body?.user ||
              body?.data?.user ||
              body?.user_info ||
              body?.data?.user_info ||
              body?.data ||
              {}

            const roomData =
              parseDouyinJson(
                user?.room_data
              ) ||
              parseDouyinJson(
                body?.room_data
              ) ||
              parseDouyinJson(
                body?.data?.room_data
              ) ||
              {}

            const nickname =
              user?.nickname ||
              findDouyinNestedValue(
                user,
                [
                  'nickname',
                  'nick_name'
                ]
              ) ||
              ''

            const liveStatus =
              Number(
                user?.live_status ??
                user?.liveStatus ??
                findDouyinNestedValue(
                  user,
                  [
                    'live_status',
                    'liveStatus'
                  ]
                ) ??
                0
              )

            const roomStatus =
              Number(
                roomData?.status ??
                roomData?.room?.status ??
                findDouyinNestedValue(
                  roomData,
                  [
                    'status'
                  ]
                ) ??
                0
              )

            const rawWebRid =
              findDouyinNestedValue(
                roomData,
                [
                  'web_rid',
                  'webRid'
                ]
              ) ??
              findDouyinNestedValue(
                user,
                [
                  'web_rid',
                  'webRid'
                ]
              )

            const webRid =
              rawWebRid
                ? String(
                    rawWebRid
                  )
                : ''

            const live =
              liveStatus === 1 ||
              liveStatus === 2 ||
              roomStatus === 2

            log(
              'Douyin anchor status:',
              {
                nickname,
                live,
                hasWebRid:
                  Boolean(
                    webRid
                  )
              }
            )

            return {
              nickname,
              live,
              webRid,
              secUid
            }
          }


          async function resolveDouyinTarget(
            inputUrl,
            others = {}
          ) {
            let currentUrl =
              inputUrl

            let parsed

            try {
              parsed =
                new URL(
                  currentUrl
                )
            } catch {
              throw new Error(
                'DOUYIN_INVALID_URL'
              )
            }

            if (
              parsed.hostname ===
              'v.douyin.com'
            ) {
              const response =
                await request(
                  currentUrl,
                  {
                    headers: {
                      'User-Agent':
                        PC_USER_AGENT
                    },

                    proxy:
                      others.proxy
                  }
                )

              currentUrl =
                response
                  ?.request
                  ?.res
                  ?.responseUrl ||
                currentUrl

              parsed =
                new URL(
                  currentUrl
                )
            }

            const secUid =
              getDouyinProfileSecUid(
                currentUrl
              )

            if (secUid) {
              return {
                type:
                  'anchor',

                secUid,

                sourceUrl:
                  currentUrl
              }
            }

            const liveRoomUrl =
              await resolveDouyinLiveUrl(
                currentUrl,
                others
              )

            return {
              type:
                'room',

              roomUrl:
                liveRoomUrl,

              sourceUrl:
                currentUrl
            }
          }


          async function resolveDouyinAnchorLiveRoom(
            secUid,
            others = {}
          ) {
            const profile =
              await getDouyinAnchorProfile(
                secUid,
                others
              )

            if (
              !profile.live ||
              !profile.webRid
            ) {
              return {
                code:
                  CRAWLER_ERROR_CODE.NOT_URLS,

                profile
              }
            }

            return {
              code:
                SUCCESS_CODE,

              profile,

              roomUrl:
                'https://live.douyin.com/' +
                profile.webRid
            }
          }


          `

            text =
              text.slice(
                0,
                index
              ) +
              helper +
              text.slice(
                index
              )
          }

          // ========================================================
          // 正确替换 baseGetDouYinLiveUrlsPlugin
          //
          // 实际源码顺序：
          // baseGetMobileDouYinLiveUrlsPlugin
          // baseGetDouYinLiveUrlsPlugin
          // baseGetDouYinRoomInfoPlugin
          // ========================================================

          {
            const start =
              text.indexOf(
                'async function baseGetDouYinLiveUrlsPlugin('
              )

            const end =
              text.indexOf(
                'async function baseGetDouYinRoomInfoPlugin(',
                start
              )

            if (
              start < 0 ||
              end <= start
            ) {
              throw new Error(
                'baseGetDouYinLiveUrlsPlugin boundary not found'
              )
            }

            const replacement = `
          async function baseGetDouYinLiveUrlsPlugin(
            roomUrl,
            others = {}
          ) {
            const target =
              await resolveDouyinTarget(
                roomUrl,
                others
              )

            if (
              target.type ===
              'anchor'
            ) {
              const anchor =
                await resolveDouyinAnchorLiveRoom(
                  target.secUid,
                  others
                )

              if (
                anchor.code !==
                SUCCESS_CODE
              ) {
                return {
                  code:
                    CRAWLER_ERROR_CODE.NOT_URLS
                }
              }

              return await baseGetDesktopDouYinLiveUrlsPlugin(
                anchor.roomUrl,
                others
              )
            }

            return await baseGetDesktopDouYinLiveUrlsPlugin(
              target.roomUrl,
              others
            )
          }


          `

            text =
              text.slice(
                0,
                start
              ) +
              replacement +
              text.slice(
                end
              )
          }

          // ========================================================
          // 替换 room info
          // ========================================================

          {
            const start =
              text.indexOf(
                'async function baseGetDouYinRoomInfoPlugin('
              )

            const end =
              text.indexOf(
                'export const getDouYinLiveUrlsPlugin',
                start
              )

            if (
              start < 0 ||
              end <= start
            ) {
              throw new Error(
                'baseGetDouYinRoomInfoPlugin boundary not found'
              )
            }

            const replacement = `
          async function baseGetDouYinRoomInfoPlugin(
            roomUrl,
            others = {}
          ) {
            const target =
              await resolveDouyinTarget(
                roomUrl,
                others
              )

            if (
              target.type ===
              'anchor'
            ) {
              const profile =
                await getDouyinAnchorProfile(
                  target.secUid,
                  others
                )

              return {
                code:
                  SUCCESS_CODE,

                roomInfo: {
                  name:
                    profile.nickname ||
                    ''
                }
              }
            }

            const room =
              await getDesktopRoomWithFallback(
                target.roomUrl,
                others
              )

            return {
              code:
                SUCCESS_CODE,

              roomInfo: {
                name:
                  room
                    ?.owner
                    ?.nickname ||
                  ''
              }
            }
          }


          `

            text =
              text.slice(
                0,
                start
              ) +
              replacement +
              text.slice(
                end
              )
          }

          fs.writeFileSync(
            path,
            text,
            'utf8'
          )

          console.log(
            'Douyin V2.8 anchor parser patched.'
          )
          NODE

          node "$RUNNER_TEMP/patch-douyin.cjs"

      # ============================================================
      # 3. 修改界面文案
      # ============================================================

      - name: Update UI text
        run: |
          node <<'NODE'
          const fs = require('fs')

          const path =
            'src/renderer/src/locales/locales.js'

          let text =
            fs.readFileSync(
              path,
              'utf8'
            )

          text =
            text.replace(
              "room_url: 'Stream URL',",
              "room_url: 'Live Room / Streamer Profile URL',"
            )

          text =
            text.replace(
              "room_url_placeholder: 'Please enter the stream URL',",
              "room_url_placeholder: 'Enter a live-room URL or Douyin streamer profile URL',"
            )

          text =
            text.replace(
              "room_url_can_not_be_empty: 'Stream URL cannot be empty',",
              "room_url_can_not_be_empty: 'Live room / streamer profile URL cannot be empty',"
            )

          text =
            text.replace(
              "room_url_invalid: 'Stream URL is invalid',",
              "room_url_invalid: 'Live room / streamer profile URL is invalid',"
            )

          text =
            text.replace(
              "room_url: '直播间地址',",
              "room_url: '直播间 / 主播主页地址',"
            )

          text =
            text.replace(
              "room_url_placeholder: '请输入直播间地址',",
              "room_url_placeholder: '请输入直播间地址或抖音主播主页地址',"
            )

          text =
            text.replace(
              "room_url_can_not_be_empty: '直播间地址不能为空',",
              "room_url_can_not_be_empty: '直播间或主播主页地址不能为空',"
            )

          text =
            text.replace(
              "room_url_invalid: '直播间地址不合法',",
              "room_url_invalid: '直播间或主播主页地址不合法',"
            )

          fs.writeFileSync(
            path,
            text,
            'utf8'
          )

          console.log(
            'UI text updated.'
          )
          NODE

      # ============================================================
      # 4. 版本
      # ============================================================

      - name: Update version
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          npm version \
            "$APP_VERSION" \
            --no-git-tag-version

      # ============================================================
      # 5. V2.8 检查
      # ============================================================

      - name: Verify anchor monitor source
        run: |
          grep -q \
            "'www.douyin.com':" \
            src/main/crawler/index.js

          grep -q \
            "'douyin.com':" \
            src/main/crawler/index.js

          grep -q \
            "getDouyinProfileSecUid" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "getDouyinAnchorProfile" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "resolveDouyinTarget" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "resolveDouyinAnchorLiveRoom" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "aweme/v1/web/user/profile/other" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "sec_user_id" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "主播主页地址" \
            src/renderer/src/locales/locales.js

          echo \
            "V2.8 anchor monitor source exists."

      # ============================================================
      # 6. 保留 V2.7 核心
      # ============================================================

      - name: Verify V2.7 core
        run: |
          grep -q \
            "handleMonitorOnly" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          grep -q \
            "autoRecord: boolean" \
            type.d.ts

          grep -q \
            "getQualityRank" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "candidate_resolution" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "videoCodec('copy')" \
            src/main/ffmpeg/record.ts

          grep -q \
            "audioCodec('copy')" \
            src/main/ffmpeg/record.ts

          echo \
            "V2.7 recording core retained."

      # ============================================================
      # 7. 预览必须继续不存在
      # ============================================================

      - name: Verify preview removed
        run: |
          LEFTOVERS="$(
            grep -R \
              -n \
              -E \
              'START_STREAM_PREVIEW|STOP_STREAM_PREVIEW|startStreamPreview|StreamPreviewDialog|preview-transcoder|preview-proxy' \
              src \
              || true
          )"

          if [ -n "$LEFTOVERS" ]
          then
            echo "$LEFTOVERS"
            exit 1
          fi

          echo \
            "Preview remains removed."

      # ============================================================
      # 8. TypeScript
      # ============================================================

      - name: TypeScript check
        run: |
          npm run typecheck

      # ============================================================
      # 9. Build
      # ============================================================

      - name: Build Electron
        run: |
          npm run build

      # ============================================================
      # 10. Windows x64
      # ============================================================

      - name: Package Windows x64
        run: |
          npx electron-builder \
            --win \
            nsis \
            --x64 \
            --publish never

      - name: Verify installer
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $package =
            Get-Content package.json |
            ConvertFrom-Json

          if (
            $package.version -ne
            $env:EXPECTED_VERSION
          ) {
            throw "Version mismatch"
          }

          $installers =
            Get-ChildItem \
              -Path dist \
              -Filter "*-x64.exe"

          if (
            -not $installers -or
            $installers.Count -eq 0
          ) {
            throw \
              "Windows installer not generated."
          }

          $installers |
            Select-Object \
              Name,
              Length,
              FullName |
            Format-Table \
              -AutoSize

      # ============================================================
      # 11. 成功后提交 V2.8 测试分支
      # ============================================================

      - name: Commit V2.8
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet
          then
            echo \
              "No changes."
          else
            git commit \
              -m "Add Douyin offline anchor monitoring"
          fi

          git push \
            --force \
            origin \
            douyin-v2.8-anchor-monitor-test

      # ============================================================
      # 12. Artifact
      # ============================================================

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-${{ inputs.version }}-douyin-v2.8-anchor-monitor-windows-x64
          path: dist/*-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          {
            echo "# Fideo Douyin V2.8"
            echo
            echo "Version: \`$APP_VERSION\`"
            echo
            echo "Branch: \`douyin-v2.8-anchor-monitor-test\`"
            echo
            echo "- Douyin live room supported"
            echo "- Douyin streamer profile supported"
            echo "- Offline anchor can stay in monitor list"
            echo "- sec_user_id based lookup"
            echo "- web_rid resolved when live"
            echo "- Existing recording logic retained"
            echo "- Existing notify-only mode retained"
          } >> "$GITHUB_STEP_SUMMARY"
