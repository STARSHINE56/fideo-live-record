name: Douyin Parser Quick Test V2

on:
  workflow_dispatch:
    inputs:
      room_url:
        description: "支持 live.douyin.com 房间链接或 v.douyin.com 分享短链"
        required: true
        type: string

      test_branch:
        description: "要测试的分支"
        required: true
        default: "douyin-parser-v2-test"
        type: string

permissions:
  contents: read

jobs:
  quick-test:
    name: Quick Douyin API Test V2
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.test_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"

      - name: Prepare A-Bogus signer
        shell: bash
        run: |
          test -f src/main/crawler/plugins/douyin-abogus.js

          cp \
            src/main/crawler/plugins/douyin-abogus.js \
            "$RUNNER_TEMP/douyin-abogus.mjs"

      - name: Create quick probe
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/douyin-probe.mjs" <<'EOF'
          import fs from 'node:fs'

          import {
            generateABogus
          } from './douyin-abogus.mjs'

          const inputUrl =
            process.env.ROOM_URL?.trim()

          if (!inputUrl) {
            throw new Error(
              'ROOM_URL is empty'
            )
          }

          const UA =
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
            'AppleWebKit/537.36 (KHTML, like Gecko) ' +
            'Chrome/123.0.0.0 Safari/537.36'

          async function fetchWithTimeout(
            url,
            options = {},
            timeout = 15000
          ) {
            const controller =
              new AbortController()

            const timer =
              setTimeout(
                () => controller.abort(),
                timeout
              )

            try {
              return await fetch(
                url,
                {
                  ...options,
                  signal:
                    controller.signal
                }
              )
            } finally {
              clearTimeout(timer)
            }
          }

          async function resolveDouyinUrl(
            rawUrl
          ) {
            let url

            try {
              url = new URL(rawUrl)
            } catch {
              throw new Error(
                '输入的 URL 无效'
              )
            }

            if (
              url.hostname ===
              'live.douyin.com'
            ) {
              return {
                finalUrl:
                  url.toString(),

                sourceType:
                  'live'
              }
            }

            if (
              url.hostname ===
                'v.douyin.com' ||
              url.hostname ===
                'www.douyin.com' ||
              url.hostname ===
                'douyin.com'
            ) {
              const response =
                await fetchWithTimeout(
                  rawUrl,
                  {
                    headers: {
                      'User-Agent':
                        UA
                    },

                    redirect:
                      'follow'
                  }
                )

              const finalUrl =
                response.url

              return {
                finalUrl,
                sourceType:
                  'share'
              }
            }

            throw new Error(
              `暂不支持这个域名: ${url.hostname}`
            )
          }

          function extractRoomId(
            resolvedUrl
          ) {
            const url =
              new URL(
                resolvedUrl
              )

            if (
              url.hostname ===
              'live.douyin.com'
            ) {
              const parts =
                url.pathname
                  .split('/')
                  .filter(Boolean)

              const roomId =
                parts[parts.length - 1]

              if (
                roomId &&
                /^\d+$/.test(roomId)
              ) {
                return roomId
              }
            }

            const candidates = [
              url.searchParams.get(
                'room_id'
              ),
              url.searchParams.get(
                'roomId'
              ),
              url.searchParams.get(
                'web_rid'
              ),
              url.searchParams.get(
                'webRid'
              )
            ]

            for (
              const item of candidates
            ) {
              if (
                item &&
                /^\d+$/.test(item)
              ) {
                return item
              }
            }

            return null
          }

          function getSetCookie(
            response
          ) {
            try {
              if (
                typeof response.headers
                  .getSetCookie ===
                'function'
              ) {
                return response.headers
                  .getSetCookie()
                  .join('; ')
              }
            } catch {
              // ignore
            }

            return (
              response.headers.get(
                'set-cookie'
              ) || ''
            )
          }

          async function bootstrap(
            roomUrl
          ) {
            const headers = {
              'User-Agent':
                UA,

              Referer:
                'https://live.douyin.com/'
            }

            const [
              homeResponse,
              roomResponse
            ] = await Promise.all([
              fetchWithTimeout(
                'https://live.douyin.com/',
                {
                  headers,
                  redirect:
                    'manual'
                }
              ),

              fetchWithTimeout(
                roomUrl,
                {
                  headers,
                  redirect:
                    'manual'
                }
              )
            ])

            return {
              cookie: [
                getSetCookie(
                  homeResponse
                ),
                getSetCookie(
                  roomResponse
                )
              ]
                .filter(Boolean)
                .join('; '),

              homeStatus:
                homeResponse.status,

              roomStatus:
                roomResponse.status
            }
          }

          function buildParams(
            roomId
          ) {
            return new URLSearchParams({
              aid: '6383',
              app_name:
                'douyin_web',
              live_id: '1',
              device_platform:
                'web',
              language:
                'zh-CN',
              browser_language:
                'zh-CN',
              browser_platform:
                'Win32',
              browser_name:
                'Chrome',
              browser_version:
                '116.0.0.0',
              web_rid:
                roomId,
              is_need_double_stream:
                'false',
              msToken: ''
            })
          }

          function collectStreams(
            room
          ) {
            const flv = []
            const hls = []

            const add = (
              list,
              value
            ) => {
              if (
                typeof value ===
                  'string' &&
                value &&
                !list.includes(value)
              ) {
                list.push(value)
              }
            }

            const streamUrl =
              room?.stream_url

            if (!streamUrl) {
              return {
                flv,
                hls
              }
            }

            const parseStreamData =
              (streamData) => {
                if (!streamData) {
                  return
                }

                try {
                  const parsed =
                    typeof streamData ===
                    'string'
                      ? JSON.parse(
                          streamData
                        )
                      : streamData

                  const data =
                    parsed?.data || {}

                  for (
                    const item of
                    Object.values(
                      data
                    )
                  ) {
                    const main =
                      item?.main

                    if (!main) {
                      continue
                    }

                    add(
                      flv,
                      main.flv
                    )

                    add(
                      hls,
                      main.hls
                    )
                  }
                } catch {
                  // ignore
                }
              }

            const pullDatas =
              streamUrl.pull_datas

            if (pullDatas) {
              for (
                const item of
                Object.values(
                  pullDatas
                )
              ) {
                parseStreamData(
                  item
                    ?.stream_data
                )
              }
            }

            parseStreamData(
              streamUrl
                ?.live_core_sdk_data
                ?.pull_data
                ?.stream_data
            )

            for (
              const value of
              Object.values(
                streamUrl
                  ?.flv_pull_url ||
                  {}
              )
            ) {
              add(
                flv,
                value
              )
            }

            for (
              const value of
              Object.values(
                streamUrl
                  ?.hls_pull_url_map ||
                  {}
              )
            ) {
              add(
                hls,
                value
              )
            }

            return {
              flv,
              hls
            }
          }

          async function probe(
            roomId,
            cookie,
            signed
          ) {
            const params =
              buildParams(
                roomId
              )

            let aBogusLength = 0

            if (signed) {
              const aBogus =
                generateABogus(
                  params.toString(),
                  UA
                )

              params.set(
                'a_bogus',
                aBogus
              )

              aBogusLength =
                aBogus.length
            }

            const api =
              'https://live.douyin.com/webcast/room/web/enter/?' +
              params.toString()

            const response =
              await fetchWithTimeout(
                api,
                {
                  headers: {
                    'User-Agent':
                      UA,

                    Referer:
                      `https://live.douyin.com/${roomId}`,

                    Cookie:
                      cookie || ''
                  }
                }
              )

            let json = null
            let parseError = ''

            try {
              json =
                await response.json()
            } catch (error) {
              parseError =
                error?.message ||
                String(error)
            }

            const data =
              json?.data

            const rooms =
              Array.isArray(
                data?.data
              )
                ? data.data
                : []

            const room =
              rooms[0]

            const streams =
              collectStreams(
                room
              )

            return {
              signed,

              httpStatus:
                response.status,

              parseError,

              hasJson:
                Boolean(json),

              hasData:
                Boolean(data),

              roomCount:
                rooms.length,

              status:
                room?.status,

              owner:
                room?.owner
                  ?.nickname || '',

              streamUrlExists:
                Boolean(
                  room?.stream_url
                ),

              pullDatasExists:
                Boolean(
                  room
                    ?.stream_url
                    ?.pull_datas
                ),

              flvCount:
                streams.flv.length,

              hlsCount:
                streams.hls.length,

              prompts:
                data?.prompts || '',

              aBogusLength
            }
          }

          function printResult(
            title,
            result
          ) {
            console.log('')
            console.log(
              `========== ${title} ==========`
            )

            console.log(
              'HTTP:',
              result.httpStatus
            )

            console.log(
              'JSON:',
              result.hasJson
            )

            console.log(
              'data exists:',
              result.hasData
            )

            console.log(
              'room count:',
              result.roomCount
            )

            console.log(
              'room status:',
              result.status ??
                'N/A'
            )

            console.log(
              'owner:',
              result.owner ||
                'N/A'
            )

            console.log(
              'stream_url exists:',
              result.streamUrlExists
            )

            console.log(
              'pull_datas exists:',
              result.pullDatasExists
            )

            console.log(
              'FLV count:',
              result.flvCount
            )

            console.log(
              'HLS count:',
              result.hlsCount
            )

            if (
              result.prompts
            ) {
              console.log(
                'prompts:',
                String(
                  result.prompts
                ).slice(
                  0,
                  300
                )
              )
            }

            if (
              result.parseError
            ) {
              console.log(
                'JSON parse error:',
                result.parseError
              )
            }

            if (
              result.signed
            ) {
              console.log(
                'a_bogus length:',
                result.aBogusLength
              )
            }
          }

          const resolved =
            await resolveDouyinUrl(
              inputUrl
            )

          console.log(
            'Input URL:',
            inputUrl
          )

          console.log(
            'Resolved URL:',
            resolved.finalUrl
          )

          console.log(
            'Source type:',
            resolved.sourceType
          )

          let roomId =
            extractRoomId(
              resolved.finalUrl
            )

          if (!roomId) {
            const pageResponse =
              await fetchWithTimeout(
                resolved.finalUrl,
                {
                  headers: {
                    'User-Agent':
                      UA
                  }
                }
              )

            const html =
              await pageResponse.text()

            const patterns = [
              /webRid["':\\\s]+(\d+)/,
              /web_rid["':\\\s]+(\d+)/,
              /roomId["':\\\s]+(\d+)/,
              /room_id["':\\\s]+(\d+)/
            ]

            for (
              const pattern of patterns
            ) {
              const match =
                html.match(
                  pattern
                )

              if (match?.[1]) {
                roomId =
                  match[1]

                break
              }
            }
          }

          if (!roomId) {
            throw new Error(
              '无法从这个抖音链接解析出直播间数字 ID'
            )
          }

          const roomUrl =
            `https://live.douyin.com/${roomId}`

          console.log(
            'Room ID:',
            roomId
          )

          console.log(
            'Room URL:',
            roomUrl
          )

          const boot =
            await bootstrap(
              roomUrl
            )

          console.log(
            'Homepage HTTP:',
            boot.homeStatus
          )

          console.log(
            'Room page HTTP:',
            boot.roomStatus
          )

          console.log(
            'Bootstrap cookie:',
            boot.cookie
              ? 'YES'
              : 'NO'
          )

          const unsigned =
            await probe(
              roomId,
              boot.cookie,
              false
            )

          const signed =
            await probe(
              roomId,
              boot.cookie,
              true
            )

          printResult(
            'Unsigned Web API',
            unsigned
          )

          printResult(
            'A-Bogus Web API',
            signed
          )

          const success =
            [
              unsigned,
              signed
            ].find(
              (item) =>
                item.status === 2 &&
                (
                  item.flvCount > 0 ||
                  item.hlsCount > 0
                )
            )

          const summaryPath =
            process.env
              .GITHUB_STEP_SUMMARY

          if (summaryPath) {
            let summary =
              '# Douyin Quick Test V2\n\n'

            summary +=
              `Input: \`${inputUrl}\`\n\n`

            summary +=
              `Resolved: \`${resolved.finalUrl}\`\n\n`

            summary +=
              `Room ID: \`${roomId}\`\n\n`

            summary +=
              '| Item | Unsigned | A-Bogus |\n'

            summary +=
              '|---|---:|---:|\n'

            summary +=
              `| HTTP | ${unsigned.httpStatus} | ${signed.httpStatus} |\n`

            summary +=
              `| Room count | ${unsigned.roomCount} | ${signed.roomCount} |\n`

            summary +=
              `| Status | ${unsigned.status ?? 'N/A'} | ${signed.status ?? 'N/A'} |\n`

            summary +=
              `| stream_url | ${unsigned.streamUrlExists ? '✅' : '❌'} | ${signed.streamUrlExists ? '✅' : '❌'} |\n`

            summary +=
              `| FLV | ${unsigned.flvCount} | ${signed.flvCount} |\n`

            summary +=
              `| HLS | ${unsigned.hlsCount} | ${signed.hlsCount} |\n\n`

            if (success) {
              summary +=
                '## ✅ 找到有效直播流\n'
            } else {
              summary +=
                '## ⚠️ 没找到有效直播流\n\n'

              summary +=
                '这不一定代表主播未开播，也可能是 GitHub Actions 网络出口被抖音风控。\n'
            }

            fs.appendFileSync(
              summaryPath,
              summary
            )
          }

          if (success) {
            console.log('')
            console.log(
              'RESULT: LIVE_STREAM_FOUND'
            )

            process.exit(0)
          }

          console.log('')
          console.log(
            'RESULT: NO_VALID_STREAM'
          )

          process.exit(2)
          EOF

      - name: Run Douyin quick test V2
        shell: bash
        env:
          ROOM_URL: ${{ inputs.room_url }}
        run: |
          node \
            "$RUNNER_TEMP/douyin-probe.mjs"
