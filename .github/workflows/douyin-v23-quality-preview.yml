name: Douyin V2.3 Quality Preview Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: "测试版本号，例如 1.1.2"
        required: true
        default: "1.1.2"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Fix Preview And Recording Quality
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout V2.2 tested source
        uses: actions/checkout@v4
        with:
          ref: douyin-v2.2-test
          fetch-depth: 0

      - name: Create V2.3 test branch
        run: |
          git switch -C douyin-v2.3-test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Install existing dependencies
        run: |
          npm ci

      - name: Add HLS preview dependency
        run: |
          npm install hls.js@1.7.3 --save-exact

      - name: Create internal HLS preview component
        run: |
          cat > src/renderer/src/components/StreamPreviewDialog.tsx <<'TSX'
          import { useEffect, useRef, useState } from 'react'
          import Hls from 'hls.js'

          import {
            Dialog,
            DialogContent,
            DialogHeader,
            DialogTitle
          } from '@/shadcn/ui/dialog'

          interface StreamPreviewDialogProps {
            open: boolean
            onOpenChange: (open: boolean) => void
            title: string
            url: string
            errorText: string
          }

          export default function StreamPreviewDialog(
            props: StreamPreviewDialogProps
          ) {
            const {
              open,
              onOpenChange,
              title,
              url,
              errorText
            } = props

            const videoRef =
              useRef<HTMLVideoElement | null>(null)

            const [error, setError] =
              useState(false)

            useEffect(() => {
              if (
                !open ||
                !url ||
                !videoRef.current
              ) {
                return
              }

              const video =
                videoRef.current

              setError(false)

              let hls:
                | Hls
                | null = null

              const cleanup = () => {
                if (hls) {
                  hls.destroy()
                  hls = null
                }

                video.pause()
                video.removeAttribute('src')
                video.load()
              }

              if (
                video.canPlayType(
                  'application/vnd.apple.mpegurl'
                )
              ) {
                video.src = url

                video
                  .play()
                  .catch(() => {
                    // Browser may require user interaction.
                  })

                return cleanup
              }

              if (
                Hls.isSupported()
              ) {
                hls = new Hls({
                  lowLatencyMode: true,
                  backBufferLength: 30,
                  maxBufferLength: 30
                })

                hls.loadSource(url)
                hls.attachMedia(video)

                hls.on(
                  Hls.Events.MANIFEST_PARSED,
                  () => {
                    video
                      .play()
                      .catch(() => {
                        // Browser may require user interaction.
                      })
                  }
                )

                hls.on(
                  Hls.Events.ERROR,
                  (_, data) => {
                    if (data.fatal) {
                      setError(true)
                    }
                  }
                )

                return cleanup
              }

              setError(true)

              return cleanup
            }, [open, url])

            return (
              <Dialog
                open={open}
                onOpenChange={onOpenChange}
              >
                <DialogContent className="max-w-[900px]">
                  <DialogHeader>
                    <DialogTitle>
                      {title}
                    </DialogTitle>
                  </DialogHeader>

                  {error ? (
                    <div className="py-12 text-center text-sm text-destructive">
                      {errorText}
                    </div>
                  ) : (
                    <video
                      ref={videoRef}
                      controls
                      autoPlay
                      playsInline
                      className="w-full max-h-[70vh] bg-black rounded-md"
                    />
                  )}
                </DialogContent>
              </Dialog>
            )
          }
          TSX

      - name: Create V2.3 patch script
        run: |
          cat > "$RUNNER_TEMP/patch-v23.cjs" <<'NODE'
          const fs = require('fs')

          function read(path) {
            return fs.readFileSync(
              path,
              'utf8'
            )
          }

          function write(
            path,
            content
          ) {
            fs.writeFileSync(
              path,
              content,
              'utf8'
            )
          }

          function replaceOnce(
            source,
            oldText,
            newText,
            label
          ) {
            if (
              !source.includes(oldText)
            ) {
              throw new Error(
                `Patch target not found: ${label}`
              )
            }

            return source.replace(
              oldText,
              newText
            )
          }

          // ========================================================
          // 1. Douyin streams:
          // sort by video bitrate,
          // FLV first when bitrate is equal.
          // ========================================================

          const douyinPath =
            'src/main/crawler/plugins/douyin.js'

          let douyin =
            read(douyinPath)

          const streamBlockStart =
            douyin.indexOf(
              'function collectMainStreams('
            )

          const streamBlockEnd =
            douyin.indexOf(
              'function getDesktopRoom('
            )

          if (
            streamBlockStart < 0 ||
            streamBlockEnd < 0 ||
            streamBlockEnd <=
              streamBlockStart
          ) {
            throw new Error(
              'Douyin stream collection block not found'
            )
          }

          const newStreamBlock = String.raw`
          function getStreamBitrate(
            main
          ) {
            try {
              const raw =
                main?.sdk_params

              const sdkParams =
                typeof raw === 'string'
                  ? JSON.parse(raw)
                  : raw

              const bitrate =
                Number(
                  sdkParams?.vbitrate ||
                  sdkParams?.bitrate ||
                  0
                )

              return Number.isFinite(
                bitrate
              )
                ? bitrate
                : 0
            } catch {
              return 0
            }
          }

          function collectMainStreamCandidates(
            streamData
          ) {
            const candidates = []

            if (!streamData) {
              return candidates
            }

            try {
              const parsed =
                typeof streamData ===
                'string'
                  ? JSON.parse(
                      streamData
                    )
                  : streamData

              const data =
                parsed?.data || {}

              for (
                const [
                  quality,
                  streamInfo
                ] of Object.entries(data)
              ) {
                const main =
                  streamInfo?.main

                if (!main) {
                  continue
                }

                const bitrate =
                  getStreamBitrate(main)

                if (main.flv) {
                  candidates.push({
                    url: main.flv,
                    type: 'flv',
                    quality,
                    bitrate
                  })
                }

                if (main.hls) {
                  candidates.push({
                    url: main.hls,
                    type: 'hls',
                    quality,
                    bitrate
                  })
                }
              }
            } catch {
              // Ignore malformed stream data.
            }

            return candidates
          }

          function collectDesktopStreams(
            room
          ) {
            const streamUrl =
              room?.stream_url

            if (!streamUrl) {
              return []
            }

            const candidates = []
            const seen = new Set()

            const addCandidate =
              (candidate) => {
                const url =
                  candidate?.url

                if (
                  !url ||
                  seen.has(url)
                ) {
                  return
                }

                seen.add(url)

                candidates.push({
                  url,
                  type:
                    candidate.type ||
                    'unknown',
                  quality:
                    candidate.quality ||
                    '',
                  bitrate:
                    Number(
                      candidate.bitrate ||
                      0
                    )
                })
              }

            const addCandidates =
              (items) => {
                for (
                  const item of items
                ) {
                  addCandidate(item)
                }
              }

            const pullDatas =
              streamUrl.pull_datas

            if (pullDatas) {
              for (
                const item of
                Object.values(
                  pullDatas
                )
              ) {
                addCandidates(
                  collectMainStreamCandidates(
                    item?.stream_data
                  )
                )
              }
            }

            const coreData =
              streamUrl
                ?.live_core_sdk_data
                ?.pull_data
                ?.stream_data

            addCandidates(
              collectMainStreamCandidates(
                coreData
              )
            )

            const flvMap =
              streamUrl
                ?.flv_pull_url

            if (flvMap) {
              for (
                const [
                  quality,
                  url
                ] of Object.entries(
                  flvMap
                )
              ) {
                addCandidate({
                  url,
                  type: 'flv',
                  quality,
                  bitrate: 0
                })
              }
            }

            const hlsMap =
              streamUrl
                ?.hls_pull_url_map

            if (hlsMap) {
              for (
                const [
                  quality,
                  url
                ] of Object.entries(
                  hlsMap
                )
              ) {
                addCandidate({
                  url,
                  type: 'hls',
                  quality,
                  bitrate: 0
                })
              }
            }

            candidates.sort(
              (a, b) => {
                if (
                  b.bitrate !==
                  a.bitrate
                ) {
                  return (
                    b.bitrate -
                    a.bitrate
                  )
                }

                if (
                  a.type !==
                  b.type
                ) {
                  if (
                    a.type ===
                    'flv'
                  ) {
                    return -1
                  }

                  if (
                    b.type ===
                    'flv'
                  ) {
                    return 1
                  }
                }

                return 0
              }
            )

            return candidates.map(
              (item) =>
                item.url
            )
          }


          `

          douyin =
            douyin.slice(
              0,
              streamBlockStart
            ) +
            newStreamBlock +
            douyin.slice(
              streamBlockEnd
            )

          write(
            douyinPath,
            douyin
          )

          // ========================================================
          // 2. FFmpeg:
          // remove -re and add HTTP reconnect protection.
          // ========================================================

          const recordPath =
            'src/main/ffmpeg/record.ts'

          let record =
            read(recordPath)

          const oldRecordInput =
          `  const ffmpegProcess = ffmpeg().addInput(liveUrls![Number(line)])

            ffmpegProcess.inputOptions(['-re'])
          `

          const newRecordInput =
          `  const selectedLiveUrl =
            liveUrls![Number(line)]

            const ffmpegProcess =
              ffmpeg().addInput(
                selectedLiveUrl
              )

            if (
              /^https?:\\/\\//i.test(
                selectedLiveUrl
              )
            ) {
              ffmpegProcess.inputOptions([
                '-rw_timeout 20000000',
                '-reconnect 1',
                '-reconnect_streamed 1',
                '-reconnect_delay_max 5'
              ])
            }
          `

          record = replaceOnce(
            record,
            oldRecordInput,
            newRecordInput,
            'FFmpeg input options'
          )

          write(
            recordPath,
            record
          )

          // ========================================================
          // 3. Douyin recording always selects
          // the first stream after bitrate sorting.
          // ========================================================

          const mainPath =
            'src/main/index.ts'

          let main =
            read(mainPath)

          const oldAssign =
          `    streamConfig.liveUrls = liveUrls

            const { code: recordStreamCode } = await recordStream(
          `

          const newAssign =
          `    streamConfig.liveUrls = liveUrls

            if (
              isDouyinUrl(roomUrl)
            ) {
              streamConfig.line = '0'
            }

            const { code: recordStreamCode } = await recordStream(
          `

          main = replaceOnce(
            main,
            oldAssign,
            newAssign,
            'Douyin highest-quality selection'
          )

          write(
            mainPath,
            main
          )

          // ========================================================
          // 4. Replace external fideo.site preview
          // with internal HLS preview dialog.
          // ========================================================

          const operationPath =
            'src/renderer/src/components/StreamConfigList/components/OperationBar.tsx'

          let operation =
            read(operationPath)

          operation = replaceOnce(
            operation,
            `import Dialog from '@/components/Dialog'
          `,
            `import Dialog from '@/components/Dialog'
          import StreamPreviewDialog from '@/components/StreamPreviewDialog'
          `,
            'preview component import'
          )

          operation = replaceOnce(
            operation,
            `  const [isLoadingPreview, setIsLoadingPreview] = useState(false)
          `,
            `  const [isLoadingPreview, setIsLoadingPreview] = useState(false)
            const [previewOpen, setPreviewOpen] = useState(false)
            const [previewUrl, setPreviewUrl] = useState('')
          `,
            'preview state'
          )

          const oldPreview =
          `    window.api.navByDefaultBrowser(
              \`https://www.fideo.site/cn?streamUrl=\${encodeURIComponent(liveUrls[streamConfig.line])}\`
            )
          `

          const newPreview =
          `    const hlsUrl =
              liveUrls.find(
                (url) =>
                  /\\\\.m3u8(?:\\\\?|$)/i.test(
                    url
                  )
              )

            if (!hlsUrl) {
              toast({
                title: streamConfig.title,
                description: t(
                  'stream_config.preview_hls_unavailable'
                ),
                variant: 'destructive'
              })

              return
            }

            setPreviewUrl(
              hlsUrl
            )

            setPreviewOpen(
              true
            )
          `

          operation = replaceOnce(
            operation,
            oldPreview,
            newPreview,
            'external preview URL'
          )

          operation = replaceOnce(
            operation,
            `      <StreamConfigSheet
          `,
            `      <StreamPreviewDialog
                open={previewOpen}
                onOpenChange={setPreviewOpen}
                title={streamConfig.title}
                url={previewUrl}
                errorText={t(
                  'stream_config.preview_failed'
                )}
              />

              <StreamConfigSheet
          `,
            'preview dialog render'
          )

          write(
            operationPath,
            operation
          )

          // ========================================================
          // 5. Preview locale strings.
          // ========================================================

          const localePath =
            'src/renderer/src/locales/locales.js'

          let locale =
            read(localePath)

          locale = replaceOnce(
            locale,
            `        preview: 'Preview Stream'
          `,
            `        preview: 'Preview Stream',
                  preview_failed: 'Unable to play this live stream. Try again or choose another stream.',
                  preview_hls_unavailable: 'No HLS stream is available for preview.'
          `,
            'English preview locale'
          )

          locale = replaceOnce(
            locale,
            `        preview: '预览直播流'
          `,
            `        preview: '预览直播流',
                  preview_failed: '当前直播流无法播放，请重试或更换线路',
                  preview_hls_unavailable: '当前没有可用于预览的 HLS 直播流'
          `,
            'Chinese preview locale'
          )

          write(
            localePath,
            locale
          )

          // ========================================================
          // 6. Version.
          // ========================================================

          const version =
            process.env.APP_VERSION

          if (
            !/^\\d+\\.\\d+\\.\\d+(?:-[0-9A-Za-z.-]+)?$/.test(
              version
            )
          ) {
            throw new Error(
              `Invalid version: ${version}`
            )
          }

          const packagePath =
            'package.json'

          const pkg =
            JSON.parse(
              read(packagePath)
            )

          pkg.version =
            version

          write(
            packagePath,
            JSON.stringify(
              pkg,
              null,
              2
            ) + '\\n'
          )

          const lockPath =
            'package-lock.json'

          const lock =
            JSON.parse(
              read(lockPath)
            )

          lock.version =
            version

          if (
            lock.packages &&
            lock.packages['']
          ) {
            lock.packages[
              ''
            ].version =
              version
          }

          write(
            lockPath,
            JSON.stringify(
              lock,
              null,
              2
            ) + '\\n'
          )

          console.log(
            'V2.3 patch completed.'
          )
          NODE

      - name: Validate patch script syntax
        run: |
          node --check \
            "$RUNNER_TEMP/patch-v23.cjs"

      - name: Apply V2.3 patch
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          node \
            "$RUNNER_TEMP/patch-v23.cjs"

      - name: Verify required source changes
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          grep -q \
            "getStreamBitrate" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "vbitrate" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "reconnect_streamed" \
            src/main/ffmpeg/record.ts

          if grep -q \
            "inputOptions(\['-re'\])" \
            src/main/ffmpeg/record.ts
          then
            echo \
              "ERROR: -re still exists"
            exit 1
          fi

          if grep -q \
            "www.fideo.site/cn?streamUrl" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx
          then
            echo \
              "ERROR: old fideo.site preview still exists"
            exit 1
          fi

          grep -q \
            "StreamPreviewDialog" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          grep -q \
            "Hls.isSupported" \
            src/renderer/src/components/StreamPreviewDialog.tsx

          node -e "
          const p = require('./package.json');
          if (p.version !== process.env.APP_VERSION) {
            console.error(
              'Version mismatch:',
              p.version,
              process.env.APP_VERSION
            );
            process.exit(1);
          }
          console.log(
            'Version OK:',
            p.version
          );
          "

      - name: TypeScript check
        run: |
          npm run typecheck

      - name: Build Electron app
        run: |
          npm run build

      - name: Package Windows x64
        run: |
          npx electron-builder \
            --win \
            nsis \
            --x64 \
            --publish never

      - name: Verify Windows installer
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $package =
            Get-Content package.json |
            ConvertFrom-Json

          if (
            $package.version -ne
            $env:EXPECTED_VERSION
          ) {
            throw `
              "Version mismatch: expected $env:EXPECTED_VERSION, got $($package.version)"
          }

          $installers =
            Get-ChildItem `
              -Path dist `
              -Filter "*-x64.exe"

          if (
            $installers.Count -eq 0
          ) {
            throw `
              "Windows x64 installer not generated."
          }

          $installers |
            Select-Object `
              Name,
              Length,
              FullName

      - name: Commit V2.3 tested source
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            package.json \
            package-lock.json \
            src/main/crawler/plugins/douyin.js \
            src/main/ffmpeg/record.ts \
            src/main/index.ts \
            src/renderer/src/components/StreamPreviewDialog.tsx \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx \
            src/renderer/src/locales/locales.js

          if git diff --cached --quiet
          then
            echo \
              "No source changes to commit."
          else
            git commit \
              -m "Improve Douyin recording quality and internal preview"
          fi

          git push \
            --force \
            origin \
            douyin-v2.3-test

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-${{ inputs.version }}-douyin-v2.3-windows-x64
          path: dist/*-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          {
            echo "# Fideo Douyin V2.3"
            echo
            echo "Version: \`$APP_VERSION\`"
            echo
            echo "Branch: \`douyin-v2.3-test\`"
            echo
            echo "Changes:"
            echo
            echo "- Internal HLS live preview"
            echo "- Removed dependency on www.fideo.site preview"
            echo "- Douyin streams sorted by video bitrate"
            echo "- Highest bitrate FLV preferred for recording"
            echo "- Douyin recording defaults to sorted line 1"
            echo "- Removed FFmpeg -re"
            echo "- Added HTTP reconnect options"
            echo "- Stream copy retained: no re-encoding and no quality loss"
            echo "- Windows x64 test installer"
          } >> "$GITHUB_STEP_SUMMARY"
