name: Douyin V2.3 Quality Preview Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: "测试版本号，例如 1.1.2"
        required: true
        default: "1.1.2"
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Fix Preview And Recording Quality
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout V2.2 tested source
        uses: actions/checkout@v4
        with:
          ref: douyin-v2.2-test
          fetch-depth: 0

      - name: Create V2.3 test branch
        run: |
          git switch -C douyin-v2.3-test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.15.0"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      - name: Install HLS preview dependency
        run: |
          npm install hls.js@1.7.3 --save-exact

      - name: Create internal preview component
        run: |
          cat > src/renderer/src/components/StreamPreviewDialog.tsx <<'TSX'
          import { useEffect, useRef, useState } from 'react'
          import Hls from 'hls.js'

          import {
            Dialog,
            DialogContent,
            DialogHeader,
            DialogTitle
          } from '@/shadcn/ui/dialog'

          interface StreamPreviewDialogProps {
            open: boolean
            onOpenChange: (open: boolean) => void
            title: string
            url: string
            errorText: string
          }

          export default function StreamPreviewDialog(
            props: StreamPreviewDialogProps
          ) {
            const {
              open,
              onOpenChange,
              title,
              url,
              errorText
            } = props

            const videoRef =
              useRef<HTMLVideoElement | null>(
                null
              )

            const [error, setError] =
              useState(false)

            useEffect(() => {
              const video =
                videoRef.current

              if (
                !open ||
                !url ||
                !video
              ) {
                return
              }

              setError(false)

              let hls: Hls | null =
                null

              const cleanup = () => {
                if (hls) {
                  hls.destroy()
                  hls = null
                }

                video.pause()
                video.removeAttribute(
                  'src'
                )
                video.load()
              }

              if (
                video.canPlayType(
                  'application/vnd.apple.mpegurl'
                )
              ) {
                video.src = url

                video
                  .play()
                  .catch(() => {})

                return cleanup
              }

              if (
                Hls.isSupported()
              ) {
                hls = new Hls({
                  lowLatencyMode: true,
                  backBufferLength: 30,
                  maxBufferLength: 30,
                  maxMaxBufferLength: 60
                })

                hls.loadSource(url)
                hls.attachMedia(video)

                hls.on(
                  Hls.Events.MANIFEST_PARSED,
                  () => {
                    video
                      .play()
                      .catch(() => {})
                  }
                )

                hls.on(
                  Hls.Events.ERROR,
                  (_, data) => {
                    if (
                      !data.fatal
                    ) {
                      return
                    }

                    if (
                      data.type ===
                      Hls.ErrorTypes.NETWORK_ERROR
                    ) {
                      try {
                        hls?.startLoad()
                        return
                      } catch {
                        setError(true)
                        return
                      }
                    }

                    if (
                      data.type ===
                      Hls.ErrorTypes.MEDIA_ERROR
                    ) {
                      try {
                        hls?.recoverMediaError()
                        return
                      } catch {
                        setError(true)
                        return
                      }
                    }

                    setError(true)
                  }
                )

                return cleanup
              }

              setError(true)

              return cleanup
            }, [open, url])

            return (
              <Dialog
                open={open}
                onOpenChange={
                  onOpenChange
                }
              >
                <DialogContent className="max-w-[900px]">
                  <DialogHeader>
                    <DialogTitle>
                      {title}
                    </DialogTitle>
                  </DialogHeader>

                  {error ? (
                    <div className="py-12 text-center text-sm text-destructive">
                      {errorText}
                    </div>
                  ) : (
                    <video
                      ref={videoRef}
                      controls
                      autoPlay
                      playsInline
                      className="w-full max-h-[70vh] bg-black rounded-md"
                    />
                  )}
                </DialogContent>
              </Dialog>
            )
          }
          TSX

      - name: Create V2.3 source patch
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          cat > "$RUNNER_TEMP/patch-v23.cjs" <<'NODE'
          const fs = require('fs')

          const version =
            process.env.APP_VERSION

          if (
            !/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(
              version
            )
          ) {
            throw new Error(
              `Invalid version: ${version}`
            )
          }

          function read(path) {
            return fs.readFileSync(
              path,
              'utf8'
            )
          }

          function write(
            path,
            content
          ) {
            fs.writeFileSync(
              path,
              content,
              'utf8'
            )
          }

          function assertContains(
            source,
            text,
            label
          ) {
            if (
              !source.includes(text)
            ) {
              throw new Error(
                `Missing source marker: ${label}`
              )
            }
          }

          function replaceRange(
            source,
            startMarker,
            endMarker,
            replacement,
            label
          ) {
            const start =
              source.indexOf(
                startMarker
              )

            const end =
              source.indexOf(
                endMarker,
                start
              )

            if (
              start < 0 ||
              end < 0 ||
              end <= start
            ) {
              throw new Error(
                `Unable to patch: ${label}`
              )
            }

            return (
              source.slice(
                0,
                start
              ) +
              replacement +
              source.slice(
                end
              )
            )
          }


          // ======================================================
          // 1. Douyin quality sorting
          // ======================================================

          const douyinPath =
            'src/main/crawler/plugins/douyin.js'

          let douyin =
            read(douyinPath)

          assertContains(
            douyin,
            'function collectMainStreams(',
            'collectMainStreams'
          )

          assertContains(
            douyin,
            'function getDesktopRoom(',
            'getDesktopRoom'
          )

          const qualityCode = String.raw`
          function getStreamBitrate(
            main
          ) {
            try {
              const raw =
                main?.sdk_params

              const params =
                typeof raw === 'string'
                  ? JSON.parse(raw)
                  : raw

              const value =
                Number(
                  params?.vbitrate ||
                  params?.bitrate ||
                  0
                )

              return (
                Number.isFinite(
                  value
                )
                  ? value
                  : 0
              )
            } catch {
              return 0
            }
          }

          function collectMainStreamCandidates(
            streamData
          ) {
            const result = []

            if (!streamData) {
              return result
            }

            try {
              const parsed =
                typeof streamData ===
                'string'
                  ? JSON.parse(
                      streamData
                    )
                  : streamData

              const data =
                parsed?.data || {}

              for (
                const [
                  quality,
                  streamInfo
                ] of Object.entries(
                  data
                )
              ) {
                const main =
                  streamInfo?.main

                if (!main) {
                  continue
                }

                const bitrate =
                  getStreamBitrate(
                    main
                  )

                if (main.flv) {
                  result.push({
                    url:
                      main.flv,
                    type:
                      'flv',
                    quality,
                    bitrate
                  })
                }

                if (main.hls) {
                  result.push({
                    url:
                      main.hls,
                    type:
                      'hls',
                    quality,
                    bitrate
                  })
                }
              }
            } catch {
              // Ignore malformed stream info.
            }

            return result
          }

          function collectDesktopStreams(
            room
          ) {
            const streamUrl =
              room?.stream_url

            if (!streamUrl) {
              return []
            }

            const candidates = []
            const seen =
              new Set()

            const addCandidate =
              (candidate) => {
                const url =
                  candidate?.url

                if (
                  !url ||
                  seen.has(url)
                ) {
                  return
                }

                seen.add(url)

                candidates.push({
                  url,
                  type:
                    candidate.type ||
                    'unknown',
                  quality:
                    candidate.quality ||
                    '',
                  bitrate:
                    Number(
                      candidate.bitrate ||
                      0
                    )
                })
              }

            const addList =
              (items) => {
                for (
                  const item of items
                ) {
                  addCandidate(
                    item
                  )
                }
              }

            const pullDatas =
              streamUrl.pull_datas

            if (pullDatas) {
              for (
                const item of
                Object.values(
                  pullDatas
                )
              ) {
                addList(
                  collectMainStreamCandidates(
                    item?.stream_data
                  )
                )
              }
            }

            const coreData =
              streamUrl
                ?.live_core_sdk_data
                ?.pull_data
                ?.stream_data

            addList(
              collectMainStreamCandidates(
                coreData
              )
            )

            const flvMap =
              streamUrl
                ?.flv_pull_url

            if (flvMap) {
              for (
                const [
                  quality,
                  url
                ] of Object.entries(
                  flvMap
                )
              ) {
                addCandidate({
                  url,
                  type: 'flv',
                  quality,
                  bitrate: 0
                })
              }
            }

            const hlsMap =
              streamUrl
                ?.hls_pull_url_map

            if (hlsMap) {
              for (
                const [
                  quality,
                  url
                ] of Object.entries(
                  hlsMap
                )
              ) {
                addCandidate({
                  url,
                  type: 'hls',
                  quality,
                  bitrate: 0
                })
              }
            }

            candidates.sort(
              (a, b) => {
                if (
                  b.bitrate !==
                  a.bitrate
                ) {
                  return (
                    b.bitrate -
                    a.bitrate
                  )
                }

                if (
                  a.type ===
                    'flv' &&
                  b.type !==
                    'flv'
                ) {
                  return -1
                }

                if (
                  b.type ===
                    'flv' &&
                  a.type !==
                    'flv'
                ) {
                  return 1
                }

                return 0
              }
            )

            return candidates.map(
              (item) =>
                item.url
            )
          }


          `

          douyin =
            replaceRange(
              douyin,
              'function collectMainStreams(',
              'function getDesktopRoom(',
              qualityCode,
              'Douyin stream quality sorting'
            )

          write(
            douyinPath,
            douyin
          )


          // ======================================================
          // 2. FFmpeg recording:
          // remove -re, add reconnect.
          // ======================================================

          const recordPath =
            'src/main/ffmpeg/record.ts'

          let record =
            read(recordPath)

          const ffmpegPattern =
            /const\s+ffmpegProcess\s*=\s*ffmpeg\(\)\.addInput\(\s*liveUrls!\[Number\(line\)\]\s*\)\s*ffmpegProcess\.inputOptions\(\s*\[\s*['"]-re['"]\s*\]\s*\)/m

          if (
            !ffmpegPattern.test(
              record
            )
          ) {
            throw new Error(
              'FFmpeg source block not found'
            )
          }

          record =
            record.replace(
              ffmpegPattern,
              `const selectedLiveUrl =
              liveUrls![Number(line)]

            const ffmpegProcess =
              ffmpeg().addInput(
                selectedLiveUrl
              )

            if (
              /^https?:\\/\\//i.test(
                selectedLiveUrl
              )
            ) {
              ffmpegProcess.inputOptions([
                '-rw_timeout 20000000',
                '-reconnect 1',
                '-reconnect_streamed 1',
                '-reconnect_delay_max 5'
              ])
            }`
            )

          write(
            recordPath,
            record
          )


          // ======================================================
          // 3. Douyin recording always uses
          // first entry after quality sorting.
          // ======================================================

          const mainPath =
            'src/main/index.ts'

          let main =
            read(mainPath)

          const mainPattern =
            /streamConfig\.liveUrls\s*=\s*liveUrls\s*\r?\n\s*\r?\n\s*const\s+\{\s*code:\s*recordStreamCode\s*\}\s*=\s*await\s+recordStream\(/m

          if (
            !mainPattern.test(
              main
            )
          ) {
            throw new Error(
              'Main recording selection block not found'
            )
          }

          main =
            main.replace(
              mainPattern,
              `streamConfig.liveUrls = liveUrls

            if (
              isDouyinUrl(
                roomUrl
              )
            ) {
              streamConfig.line = '0'
            }

            const { code: recordStreamCode } = await recordStream(`
            )

          write(
            mainPath,
            main
          )


          // ======================================================
          // 4. Internal preview
          // ======================================================

          const operationPath =
            'src/renderer/src/components/StreamConfigList/components/OperationBar.tsx'

          let operation =
            read(operationPath)

          operation =
            operation.replace(
              `import Dialog from '@/components/Dialog'`,
              `import Dialog from '@/components/Dialog'
          import StreamPreviewDialog from '@/components/StreamPreviewDialog'`
            )

          if (
            !operation.includes(
              'StreamPreviewDialog'
            )
          ) {
            throw new Error(
              'Preview import patch failed'
            )
          }

          const statePattern =
            /const\s+\[isLoadingPreview,\s*setIsLoadingPreview\]\s*=\s*useState\(false\)/

          if (
            !statePattern.test(
              operation
            )
          ) {
            throw new Error(
              'Preview state marker not found'
            )
          }

          operation =
            operation.replace(
              statePattern,
              `const [isLoadingPreview, setIsLoadingPreview] = useState(false)
            const [previewOpen, setPreviewOpen] = useState(false)
            const [previewUrl, setPreviewUrl] = useState('')`
            )

          const externalPreviewPattern =
            /window\.api\.navByDefaultBrowser\(\s*`https:\/\/www\.fideo\.site\/cn\?streamUrl=\$\{encodeURIComponent\(liveUrls\[streamConfig\.line\]\)\}`\s*\)/m

          if (
            !externalPreviewPattern.test(
              operation
            )
          ) {
            throw new Error(
              'Old fideo.site preview block not found'
            )
          }

          operation =
            operation.replace(
              externalPreviewPattern,
              `const hlsUrl =
              liveUrls.find(
                (url) =>
                  /\\\\.m3u8(?:\\\\?|$)/i.test(
                    url
                  )
              )

            if (!hlsUrl) {
              toast({
                title:
                  streamConfig.title,
                description:
                  t(
                    'stream_config.preview_hls_unavailable'
                  ),
                variant:
                  'destructive'
              })

              return
            }

            setPreviewUrl(
              hlsUrl
            )

            setPreviewOpen(
              true
            )`
            )

          const sheetMarker =
            `      <StreamConfigSheet`

          if (
            !operation.includes(
              sheetMarker
            )
          ) {
            throw new Error(
              'StreamConfigSheet JSX marker not found'
            )
          }

          operation =
            operation.replace(
              sheetMarker,
              `      <StreamPreviewDialog
                open={previewOpen}
                onOpenChange={
                  setPreviewOpen
                }
                title={
                  streamConfig.title
                }
                url={previewUrl}
                errorText={
                  t(
                    'stream_config.preview_failed'
                  )
                }
              />

              <StreamConfigSheet`
            )

          write(
            operationPath,
            operation
          )


          // ======================================================
          // 5. Locale
          // ======================================================

          const localePath =
            'src/renderer/src/locales/locales.js'

          let locale =
            read(localePath)

          const enMarker =
            `        preview: 'Preview Stream'`

          const cnMarker =
            `        preview: '预览直播流'`

          if (
            !locale.includes(
              enMarker
            )
          ) {
            throw new Error(
              'English preview locale not found'
            )
          }

          if (
            !locale.includes(
              cnMarker
            )
          ) {
            throw new Error(
              'Chinese preview locale not found'
            )
          }

          locale =
            locale.replace(
              enMarker,
              `        preview: 'Preview Stream',
                  preview_failed: 'Unable to play this live stream. Please try again.',
                  preview_hls_unavailable: 'No HLS stream is available for preview.'`
            )

          locale =
            locale.replace(
              cnMarker,
              `        preview: '预览直播流',
                  preview_failed: '当前直播流无法播放，请稍后重试',
                  preview_hls_unavailable: '当前没有可用于预览的 HLS 直播流'`
            )

          write(
            localePath,
            locale
          )


          // ======================================================
          // 6. Version
          // ======================================================

          const packagePath =
            'package.json'

          const pkg =
            JSON.parse(
              read(packagePath)
            )

          pkg.version =
            version

          write(
            packagePath,
            JSON.stringify(
              pkg,
              null,
              2
            ) + '\n'
          )

          const lockPath =
            'package-lock.json'

          const lock =
            JSON.parse(
              read(lockPath)
            )

          lock.version =
            version

          if (
            lock.packages &&
            lock.packages['']
          ) {
            lock.packages[
              ''
            ].version =
              version
          }

          write(
            lockPath,
            JSON.stringify(
              lock,
              null,
              2
            ) + '\n'
          )


          // ======================================================
          // 7. Final patch validation
          // ======================================================

          const finalDouyin =
            read(douyinPath)

          const finalRecord =
            read(recordPath)

          const finalMain =
            read(mainPath)

          const finalOperation =
            read(operationPath)

          if (
            !finalDouyin.includes(
              'getStreamBitrate'
            )
          ) {
            throw new Error(
              'Quality sorting was not installed'
            )
          }

          if (
            finalRecord.includes(
              "inputOptions(['-re'])"
            )
          ) {
            throw new Error(
              '-re still exists'
            )
          }

          if (
            !finalRecord.includes(
              '-reconnect_streamed 1'
            )
          ) {
            throw new Error(
              'Reconnect options missing'
            )
          }

          if (
            !finalMain.includes(
              "streamConfig.line = '0'"
            )
          ) {
            throw new Error(
              'Highest-quality default missing'
            )
          }

          if (
            finalOperation.includes(
              'www.fideo.site/cn?streamUrl='
            )
          ) {
            throw new Error(
              'Old preview URL still exists'
            )
          }

          if (
            !finalOperation.includes(
              '<StreamPreviewDialog'
            )
          ) {
            throw new Error(
              'Internal preview dialog missing'
            )
          }

          console.log(
            'V2.3 source patch completed successfully.'
          )
          NODE

      - name: Validate patch script syntax
        run: |
          node --check \
            "$RUNNER_TEMP/patch-v23.cjs"

      - name: Apply V2.3 patch
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          node \
            "$RUNNER_TEMP/patch-v23.cjs"

      - name: Verify source files
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          echo "Checking Douyin quality sorting..."

          grep -q \
            "getStreamBitrate" \
            src/main/crawler/plugins/douyin.js

          grep -q \
            "vbitrate" \
            src/main/crawler/plugins/douyin.js

          echo "Checking FFmpeg..."

          grep -q \
            "reconnect_streamed" \
            src/main/ffmpeg/record.ts

          grep -q \
            "reconnect_delay_max" \
            src/main/ffmpeg/record.ts

          if grep -Fq \
            "inputOptions(['-re'])" \
            src/main/ffmpeg/record.ts
          then
            echo \
              "ERROR: -re still exists"
            exit 1
          fi

          echo "Checking preview..."

          grep -q \
            "StreamPreviewDialog" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx

          grep -q \
            "Hls.isSupported" \
            src/renderer/src/components/StreamPreviewDialog.tsx

          if grep -Fq \
            "www.fideo.site/cn?streamUrl=" \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx
          then
            echo \
              "ERROR: old fideo.site preview remains"
            exit 1
          fi

          echo "Checking version..."

          node -e "
          const p = require('./package.json');
          if (p.version !== process.env.APP_VERSION) {
            console.error(
              'Expected',
              process.env.APP_VERSION,
              'but got',
              p.version
            );
            process.exit(1);
          }
          console.log(
            'Version:',
            p.version
          );
          "

          echo \
            "All V2.3 source checks passed."

      - name: TypeScript check
        run: |
          npm run typecheck

      - name: Build Electron app
        run: |
          npm run build

      - name: Package Windows x64
        run: |
          npx electron-builder \
            --win \
            nsis \
            --x64 \
            --publish never

      - name: Verify Windows installer
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $package =
            Get-Content package.json |
            ConvertFrom-Json

          if (
            $package.version -ne
            $env:EXPECTED_VERSION
          ) {
            throw `
              "Version mismatch. Expected $env:EXPECTED_VERSION, got $($package.version)"
          }

          $installers =
            Get-ChildItem `
              -Path dist `
              -Filter "*-x64.exe"

          if (
            $installers.Count -eq 0
          ) {
            throw `
              "Windows x64 installer not generated."
          }

          Write-Host `
            "Generated installer:"

          $installers |
            Select-Object `
              Name,
              Length,
              FullName

      - name: Commit V2.3 tested source
        run: |
          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            package.json \
            package-lock.json \
            src/main/crawler/plugins/douyin.js \
            src/main/ffmpeg/record.ts \
            src/main/index.ts \
            src/renderer/src/components/StreamPreviewDialog.tsx \
            src/renderer/src/components/StreamConfigList/components/OperationBar.tsx \
            src/renderer/src/locales/locales.js

          if git diff --cached --quiet
          then
            echo \
              "No source changes to commit."
          else
            git commit \
              -m "Improve Douyin recording quality and internal preview"
          fi

          git push \
            --force \
            origin \
            douyin-v2.3-test

      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: fideo-${{ inputs.version }}-douyin-v2.3-windows-x64
          path: dist/*-x64.exe
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          {
            echo "# Fideo Douyin V2.3"
            echo
            echo "Version: \`$APP_VERSION\`"
            echo
            echo "Branch: \`douyin-v2.3-test\`"
            echo
            echo "Changes:"
            echo
            echo "- Internal HLS preview"
            echo "- Removed www.fideo.site preview dependency"
            echo "- Douyin streams sorted by bitrate"
            echo "- Highest bitrate FLV preferred for recording"
            echo "- Douyin recording automatically uses line 1 after sorting"
            echo "- Removed FFmpeg -re"
            echo "- Added network reconnect options"
            echo "- Kept video/audio codec copy without re-encoding"
            echo "- Windows x64 test installer"
          } >> "$GITHUB_STEP_SUMMARY"
